[package]
name = "uniflow-os-package-db"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
uniflow-sca-core = { path = "../sca_core" }
anyhow.workspace = true
serde.workspace = true
# rpm ≥ 4.16's default database backend (RHEL 9, Fedora, openEuler 22.03+).
# Bundled so an air-gapped build/run needs no system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27"
