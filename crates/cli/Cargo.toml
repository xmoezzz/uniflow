[package]
name = "uniflow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "uniflow"

[[bin]]
name = "uniflow"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
uniflow-cache = { path = "../cache" }
uniflow-frontend = { path = "../frontend" }
uniflow-hir = { path = "../hir" }
uniflow-ir = { path = "../ir" }
tempfile = "3.27"
uniflow-archive-extract = { path = "../archive_extract" }
uniflow-jni-bridge = { path = "../jni_bridge" }
uniflow-system-graph = { path = "../system_graph" }
uniflow-lang-java = { path = "../lang_java" }
uniflow-lang-java-bytecode = { path = "../lang_java_bytecode" }
uniflow-lang-dotnet-bytecode = { path = "../lang_dotnet_bytecode" }
uniflow-lang-python-bytecode = { path = "../lang_python_bytecode" }
uniflow-lang-wasm-bytecode = { path = "../lang_wasm_bytecode" }
uniflow-lowering = { path = "../lowering" }
uniflow-models = { path = "../models" }
uniflow-rules = { path = "../rules" }
uniflow-report = { path = "../report" }
uniflow-taint = { path = "../taint" }
uniflow-value-flow = { path = "../value_flow" }
uniflow-platform = { path = "../platform" }
serde_yaml.workspace = true
uniflow-baseline = { path = "../baseline" }
uniflow-checker-api = { path = "../checker_api" }
uniflow-checker-host = { path = "../checker_host" }
uniflow-reasoning-oracle = { path = "../reasoning_oracle" }
uniflow-core = { path = "../uniflow_core" }

[dev-dependencies]
regex-syntax.workspace = true
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
