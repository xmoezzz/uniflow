name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit(f'tag {tag} does not match Cargo version v{version}')

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Run POSIX release gate
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/verify.sh

      - name: Run Windows release gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/uniflow-validation/**
            target/checker-sdk-validation/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "UniFlow $GITHUB_REF_NAME" --notes-file RELEASE_NOTES_1.0.0.md
