  cwe: [CWE-89]
  standards: [semgrep/javascript/aws-lambda/security/mysql-sqli.yaml]
  translations:
    zh-CN: { title: AWS Lambda 事件流入 MySQL 查询, message: AWS Lambda 处理器事件流入 mysql/mysql2 查询 API，可能造成 SQL 注入。 }
