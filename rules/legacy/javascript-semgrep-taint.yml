- id: LEGACY-JS-SEMGREP-TAINT-aws-sequelize-sqli
  title: AWS Lambda event reaches a Sequelize raw query
  message: An AWS Lambda handler event reaches a Sequelize raw query API and may cause SQL injection.
  severity: warning
  cwe: [CWE-89]
  standards: [semgrep/javascript/aws-lambda/security/sequelize-sqli.yaml]
  translations:
    zh-CN: { title: AWS Lambda 事件流入 Sequelize 原始查询, message: AWS Lambda 处理器事件流入 Sequelize 原始查询 API，可能造成 SQL 注入。 }
