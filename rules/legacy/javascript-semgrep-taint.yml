metadata:
- id: LEGACY-JS-SEMGREP-TAINT-detect-non-literal-require
  title: Function parameter reaches dynamic require
  message: A function argument reaches require(), allowing attacker-controlled module or file loading.
  severity: warning
  cwe: [CWE-95]
  standards: [semgrep/javascript/lang/security/audit/detect-non-literal-require.yaml]
  translations:
    zh-CN: { title: 函数参数流入动态 require, message: 函数参数流入 require()，可能允许攻击者控制模块或文件加载。 }
    en: { title: Function parameter reaches dynamic require, message: A function argument reaches require(), allowing attacker-controlled module or file loading. }
    zh-TW: { title: 函式參數流入動態 require, message: 函式參數流入 require()，可能允許攻擊者控制模組或檔案載入。 }
- id: LEGACY-JS-SEMGREP-TAINT-detect-non-literal-regexp
  title: Function parameter reaches RegExp
  message: A function argument reaches RegExp(), which can enable regular-expression denial of service.
  severity: warning
  cwe: [CWE-185]
  standards: [semgrep/javascript/lang/security/audit/detect-non-literal-regexp.yaml]
  translations:
    zh-CN: { title: 函数参数流入 RegExp, message: 函数参数流入 RegExp()，可能导致正则表达式拒绝服务。 }
    en: { title: Function parameter reaches RegExp, message: A function argument reaches RegExp(), which can enable regular-expression denial of service. }
    zh-TW: { title: 函式參數流入 RegExp, message: 函式參數流入 RegExp()，可能導致正規表示式阻斷服務。 }
- id: LEGACY-JS-SEMGREP-TAINT-md5-used-as-password
  title: MD5 digest reaches password operation
  message: An MD5 digest reaches a password-related function. Use a password hashing algorithm such as Argon2, scrypt, or bcrypt.
  severity: warning
  cwe: [CWE-327]
  standards: [semgrep/javascript/lang/security/audit/md5-used-as-password.yaml]
  translations:
    zh-CN: { title: MD5 摘要流入密码操作, message: MD5 摘要流入了密码相关函数。请改用 Argon2、scrypt 或 bcrypt 等密码哈希算法。 }
    en: { title: MD5 digest reaches password operation, message: "An MD5 digest reaches a password-related function. Use a password hashing algorithm such as Argon2, scrypt, or bcrypt." }
    zh-TW: { title: MD5 摘要流入密碼操作, message: MD5 摘要流入了密碼相關函式。請改用 Argon2、scrypt 或 bcrypt 等密碼雜湊演算法。 }
- id: LEGACY-JS-SEMGREP-TAINT-insecure-object-assign
  title: Parsed untrusted JSON reaches Object.assign
  message: JSON parsed from a non-constant value reaches Object.assign(), which can permit mass assignment or unintended property changes.
  severity: warning
  cwe: [CWE-915]
  standards: [semgrep/javascript/lang/security/insecure-object-assign.yaml]
  translations:
    zh-CN: { title: 不可信 JSON 流入 Object.assign, message: 从非常量值解析的 JSON 流入 Object.assign()，可能造成批量赋值或非预期属性修改。 }
    en: { title: Parsed untrusted JSON reaches Object.assign, message: "JSON parsed from a non-constant value reaches Object.assign(), which can permit mass assignment or unintended property changes." }
    zh-TW: { title: 不可信 JSON 流入 Object.assign, message: 從非常量值解析的 JSON 流入 Object.assign()，可能造成批次指派或非預期屬性修改。 }
- id: LEGACY-JS-SEMGREP-TAINT-detect-child-process
  title: Function parameter reaches Node.js child_process
  message: A function argument reaches a command-execution API from the Node.js child_process module.
  severity: error
  cwe: [CWE-78]
  standards: [semgrep/javascript/lang/security/detect-child-process.yaml]
  translations:
    zh-CN: { title: 函数参数流入 Node.js child_process, message: 函数参数流入 Node.js child_process 模块的命令执行 API，可能造成命令注入。 }
    en: { title: Function parameter reaches Node.js child_process, message: A function argument reaches a command-execution API from the Node.js child_process module. }
    zh-TW: { title: 函式參數流入 Node.js child_process, message: 函式參數流入 Node.js child_process 模組的命令執行 API，可能造成命令注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-tofastproperties-code-execution
  title: Function parameter reaches Bluebird toFastProperties
  message: A function argument reaches Bluebird's toFastProperties helper and may enable code execution in affected environments.
  severity: warning
  cwe: [CWE-94]
  standards: [semgrep/javascript/bluebird/security/audit/tofastproperties-code-execution.yaml]
  translations:
    zh-CN: { title: 函数参数流入 Bluebird toFastProperties, message: 函数参数流入 Bluebird 的 toFastProperties 辅助函数，在受影响的环境中可能导致代码执行。 }
    en: { title: Function parameter reaches Bluebird toFastProperties, message: "A function argument reaches Bluebird's toFastProperties helper and may enable code execution in affected environments." }
    zh-TW: { title: 函式參數流入 Bluebird toFastProperties, message: 函式參數流入 Bluebird 的 toFastProperties 輔助函式，在受影響的環境中可能導致程式碼執行。 }
- id: LEGACY-JS-SEMGREP-TAINT-node-mysql-sqli
  title: Function parameter reaches a MySQL query
  message: A nonnumeric function argument reaches a mysql/mysql2 query or execute call and may cause SQL injection.
  severity: warning
  cwe: [CWE-89]
  standards: [semgrep/javascript/lang/security/audit/sqli/node-mysql-sqli.yaml]
  translations:
    zh-CN: { title: 函数参数流入 MySQL 查询, message: 非数值函数参数流入 mysql/mysql2 的 query 或 execute 调用，可能造成 SQL 注入。 }
    en: { title: Function parameter reaches a MySQL query, message: A nonnumeric function argument reaches a mysql/mysql2 query or execute call and may cause SQL injection. }
    zh-TW: { title: 函式參數流入 MySQL 查詢, message: 非數值函式參數流入 mysql/mysql2 的 query 或 execute 呼叫，可能造成 SQL 注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-node-mssql-sqli
  title: Function parameter reaches an mssql query
  message: A function argument reaches an mssql request query and may cause SQL injection.
  severity: warning
  cwe: [CWE-89]
  standards: [semgrep/javascript/lang/security/audit/sqli/node-mssql-sqli.yaml]
  translations:
    zh-CN: { title: 函数参数流入 mssql 查询, message: 函数参数流入 mssql 请求的 query 调用，可能造成 SQL 注入。 }
    en: { title: Function parameter reaches an mssql query, message: A function argument reaches an mssql request query and may cause SQL injection. }
    zh-TW: { title: 函式參數流入 mssql 查詢, message: 函式參數流入 mssql 請求的 query 呼叫，可能造成 SQL 注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-node-postgres-sqli
  title: Function parameter reaches a node-postgres query
  message: A function argument reaches a node-postgres client query and may cause SQL injection.
  severity: warning
  cwe: [CWE-915]
  standards: [semgrep/javascript/lang/security/audit/sqli/node-postgres-sqli.yaml]
  translations:
    zh-CN: { title: 函数参数流入 node-postgres 查询, message: 函数参数流入 node-postgres 客户端的 query 调用，可能造成 SQL 注入。 }
    en: { title: Function parameter reaches a node-postgres query, message: A function argument reaches a node-postgres client query and may cause SQL injection. }
    zh-TW: { title: 函式參數流入 node-postgres 查詢, message: 函式參數流入 node-postgres 用戶端的 query 呼叫，可能造成 SQL 注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-aws-detect-child-process
  title: AWS Lambda event reaches child_process
  message: An AWS Lambda handler event reaches a Node.js child_process command API and may cause command injection.
  severity: error
  cwe: [CWE-78]
  standards: [semgrep/javascript/aws-lambda/security/detect-child-process.yaml]
  translations:
    zh-CN: { title: AWS Lambda 事件流入 child_process, message: AWS Lambda 处理器事件流入 Node.js child_process 命令 API，可能造成命令注入。 }
    en: { title: AWS Lambda event reaches child_process, message: An AWS Lambda handler event reaches a Node.js child_process command API and may cause command injection. }
    zh-TW: { title: AWS Lambda 事件流入 child_process, message: AWS Lambda 處理器事件流入 Node.js child_process 命令 API，可能造成命令注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-aws-tainted-eval
  title: AWS Lambda event reaches dynamic evaluation
  message: An AWS Lambda handler event reaches eval or Function and may cause arbitrary code execution.
  severity: warning
  cwe: [CWE-95]
  standards: [semgrep/javascript/aws-lambda/security/tainted-eval.yaml]
  translations:
    zh-CN: { title: AWS Lambda 事件流入动态执行, message: AWS Lambda 处理器事件流入 eval 或 Function，可能造成任意代码执行。 }
    en: { title: AWS Lambda event reaches dynamic evaluation, message: An AWS Lambda handler event reaches eval or Function and may cause arbitrary code execution. }
    zh-TW: { title: AWS Lambda 事件流入動態執行, message: AWS Lambda 處理器事件流入 eval 或 Function，可能造成任意程式碼執行。 }
- id: LEGACY-JS-SEMGREP-TAINT-aws-dynamodb-request-object
  title: AWS Lambda event reaches a DynamoDB request
  message: An AWS Lambda handler event reaches a DynamoDB request object and may cause NoSQL injection.
  severity: error
  cwe: [CWE-943]
  standards: [semgrep/javascript/aws-lambda/security/dynamodb-request-object.yaml]
  translations:
    zh-CN: { title: AWS Lambda 事件流入 DynamoDB 请求, message: AWS Lambda 处理器事件流入 DynamoDB 请求对象，可能造成 NoSQL 注入。 }
    en: { title: AWS Lambda event reaches a DynamoDB request, message: An AWS Lambda handler event reaches a DynamoDB request object and may cause NoSQL injection. }
    zh-TW: { title: AWS Lambda 事件流入 DynamoDB 請求, message: AWS Lambda 處理器事件流入 DynamoDB 請求物件，可能造成 NoSQL 注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-aws-knex-sqli
