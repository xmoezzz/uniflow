  cwe: [CWE-89]
  standards: [semgrep/javascript/aws-lambda/security/knex-sqli.yaml]
  translations:
    zh-CN: { title: AWS Lambda 事件流入 Knex 原始查询, message: AWS Lambda 处理器事件流入 Knex 原始 SQL API，可能造成 SQL 注入。 }
