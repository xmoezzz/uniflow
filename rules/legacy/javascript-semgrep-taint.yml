    zh-TW: { title: AWS Lambda 事件流入手工串接的 SQL, message: AWS Lambda 處理器事件流入手工串接的 SQL 字串，可能造成 SQL 注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-js-open-redirect-from-function
  title: Function parameter reaches a browser redirect
  message: A function parameter controls a browser location redirect and may allow an open redirect or script URL.
  severity: note
  cwe: [CWE-601]
  standards: [semgrep/javascript/browser/security/open-redirect-from-function.yaml]
  translations:
    zh-CN: { title: 函数参数流入浏览器重定向, message: 函数参数控制浏览器位置重定向，可能造成开放重定向或脚本 URL 注入。 }
    en: { title: Function parameter reaches a browser redirect, message: A function parameter controls a browser location redirect and may allow an open redirect or script URL. }
    zh-TW: { title: 函式參數流入瀏覽器重新導向, message: 函式參數控制瀏覽器位置重新導向，可能造成開放重新導向或指令碼 URL 注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-js-open-redirect
  title: Browser location input reaches a redirect
  message: Browser-controlled URL data reaches a location redirect and may allow an open redirect or script URL.
  severity: warning
  cwe: [CWE-601]
  standards: [semgrep/javascript/browser/security/open-redirect.yaml]
  translations:
    zh-CN: { title: 浏览器位置输入流入重定向, message: 浏览器可控 URL 数据流入位置重定向，可能造成开放重定向或脚本 URL 注入。 }
    en: { title: Browser location input reaches a redirect, message: Browser-controlled URL data reaches a location redirect and may allow an open redirect or script URL. }
    zh-TW: { title: 瀏覽器位置輸入流入重新導向, message: 瀏覽器可控 URL 資料流入位置重新導向，可能造成開放重新導向或指令碼 URL 注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-detect-eval-with-expression
  title: Browser location input reaches dynamic JavaScript execution
  message: Browser-controlled URL data reaches eval, Function, setTimeout, or setInterval and may cause script injection.
  severity: warning
  cwe: [CWE-95]
  standards: [semgrep/javascript/lang/security/detect-eval-with-expression.yaml]
  translations:
    zh-CN: { title: 浏览器位置输入流入动态 JavaScript 执行, message: 浏览器可控 URL 数据流入 eval、Function、setTimeout 或 setInterval，可能造成脚本注入。 }
    en: { title: Browser location input reaches dynamic JavaScript execution, message: "Browser-controlled URL data reaches eval, Function, setTimeout, or setInterval and may cause script injection." }
    zh-TW: { title: 瀏覽器位置輸入流入動態 JavaScript 執行, message: 瀏覽器可控 URL 資料流入 eval、Function、setTimeout 或 setInterval，可能造成指令碼注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-raw-html-concat
  title: Browser location input reaches raw HTML composition
  message: Browser-controlled URL data is concatenated into an HTML string and may cause cross-site scripting.
  severity: warning
  cwe: [CWE-79]
  standards: [semgrep/javascript/browser/security/raw-html-concat.yaml]
  translations:
    zh-CN: { title: 浏览器位置输入流入原始 HTML 拼接, message: 浏览器可控 URL 数据被拼接到 HTML 字符串中，可能造成跨站脚本攻击。 }
    en: { title: Browser location input reaches raw HTML composition, message: Browser-controlled URL data is concatenated into an HTML string and may cause cross-site scripting. }
    zh-TW: { title: 瀏覽器位置輸入流入原始 HTML 串接, message: 瀏覽器可控 URL 資料被串接到 HTML 字串中，可能造成跨網站指令碼攻擊。 }
- id: LEGACY-JS-SEMGREP-TAINT-detect-angular-element-methods
