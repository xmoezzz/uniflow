- id: LEGACY-JS-SEMGREP-TAINT-aws-vm-runincontext-injection
  title: AWS Lambda event reaches the Node.js vm module
  message: An AWS Lambda handler event reaches a Node.js vm compilation or execution API and may cause code injection.
  severity: error
  cwe: [CWE-94]
  standards: [semgrep/javascript/aws-lambda/security/vm-runincontext-injection.yaml]
  translations:
    zh-CN: { title: AWS Lambda 事件流入 Node.js vm 模块, message: AWS Lambda 处理器事件流入 Node.js vm 编译或执行 API，可能造成代码注入。 }
    en: { title: AWS Lambda event reaches the Node.js vm module, message: An AWS Lambda handler event reaches a Node.js vm compilation or execution API and may cause code injection. }
    zh-TW: { title: AWS Lambda 事件流入 Node.js vm 模組, message: AWS Lambda 處理器事件流入 Node.js vm 編譯或執行 API，可能造成程式碼注入。 }
- id: LEGACY-JS-SEMGREP-TAINT-aws-tainted-html-response
  title: AWS Lambda event reaches an HTML response body
  message: An AWS Lambda handler event reaches the body of an HTML response and may cause cross-site scripting.
  severity: warning
  cwe: [CWE-79]
  standards: [semgrep/javascript/aws-lambda/security/tainted-html-response.yaml]
  translations:
    zh-CN: { title: AWS Lambda 事件流入 HTML 响应正文, message: AWS Lambda 处理器事件流入 HTML 响应正文，可能造成跨站脚本攻击。 }
    en: { title: AWS Lambda event reaches an HTML response body, message: An AWS Lambda handler event reaches the body of an HTML response and may cause cross-site scripting. }
    zh-TW: { title: AWS Lambda 事件流入 HTML 回應本文, message: AWS Lambda 處理器事件流入 HTML 回應本文，可能造成跨網站指令碼攻擊。 }
- id: LEGACY-JS-SEMGREP-TAINT-aws-tainted-html-string
  title: AWS Lambda event reaches a manually composed HTML string
  message: An AWS Lambda handler event reaches a manually composed HTML string and may cause cross-site scripting.
  severity: warning
  cwe: [CWE-79]
  standards: [semgrep/javascript/aws-lambda/security/tainted-html-string.yaml]
  translations:
    zh-CN: { title: AWS Lambda 事件流入手工拼接的 HTML, message: AWS Lambda 处理器事件流入手工拼接的 HTML 字符串，可能造成跨站脚本攻击。 }
    en: { title: AWS Lambda event reaches a manually composed HTML string, message: An AWS Lambda handler event reaches a manually composed HTML string and may cause cross-site scripting. }
    zh-TW: { title: AWS Lambda 事件流入手工串接的 HTML, message: AWS Lambda 處理器事件流入手工串接的 HTML 字串，可能造成跨網站指令碼攻擊。 }
