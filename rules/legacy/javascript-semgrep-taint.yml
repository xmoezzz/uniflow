- id: LEGACY-JS-SEMGREP-TAINT-detect-angular-trust-as-method
  title: AngularJS scope data reaches a trustAs method
  message: Unsanitized AngularJS scope data reaches $sce.trustAs or trustAsHtml and may bypass contextual escaping.
  severity: warning
  cwe: [CWE-79]
  standards: [semgrep/javascript/angular/security/detect-angular-trust-as-method.yaml]
  translations:
    zh-CN: { title: AngularJS scope 数据流入 trustAs, message: 未净化的 AngularJS scope 数据流入 $sce.trustAs 或 trustAsHtml，可能绕过上下文转义。 }
    en: { title: AngularJS scope data reaches a trustAs method, message: Unsanitized AngularJS scope data reaches $sce.trustAs or trustAsHtml and may bypass contextual escaping. }
    zh-TW: { title: AngularJS scope 資料流入 trustAs, message: 未淨化的 AngularJS scope 資料流入 $sce.trustAs 或 trustAsHtml，可能繞過上下文跳脫。 }
- id: LEGACY-JS-SEMGREP-TAINT-hardcoded-jwt-secret
  title: Hard-coded jsonwebtoken secret
  message: A hard-coded secret reaches jsonwebtoken sign or verify. Load credentials from a secret manager or protected environment configuration.
  severity: warning
  cwe: [CWE-798]
  standards: [semgrep/javascript/jsonwebtoken/security/jwt-hardcode.yaml]
  translations:
