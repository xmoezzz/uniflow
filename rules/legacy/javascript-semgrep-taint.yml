  cwe: [CWE-89]
  standards: [semgrep/javascript/aws-lambda/security/pg-sqli.yaml]
  translations:
    zh-CN: { title: AWS Lambda 事件流入 PostgreSQL 查询, message: AWS Lambda 处理器事件流入 node-postgres 查询 API，可能造成 SQL 注入。 }
