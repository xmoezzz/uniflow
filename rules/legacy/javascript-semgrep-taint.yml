  title: AWS Lambda event reaches a manually composed SQL string
  message: An AWS Lambda handler event reaches a manually composed SQL string and may cause SQL injection.
  severity: error
  cwe: [CWE-89]
  standards: [semgrep/javascript/aws-lambda/security/tainted-sql-string.yaml]
