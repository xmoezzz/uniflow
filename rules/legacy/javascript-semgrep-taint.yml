- id: LEGACY-JS-SEMGREP-TAINT-detect-angular-element-taint
  title: Browser input reaches angular.element HTML mutation
  message: Browser-controlled URL data reaches an angular.element HTML mutation method and may cause cross-site scripting.
  severity: warning
  cwe: [CWE-79]
  standards: [semgrep/javascript/angular/security/detect-angular-element-taint.yaml]
