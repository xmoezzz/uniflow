      th:remove="tag"></p>

      <p th:unless="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的第+''`''+${line}+''`''+行会发生+${categoryName}+的风险。"
      th:remove="tag"></p>'
    Description: '|-

      拒绝服务攻击即是攻击者想办法让目标机器停止提供服务，是黑客常用的攻击手段之一。

      通过发送大量请求产生的拒绝服务，一般在网络层进行拦截。更严重的是利用系统漏洞，只需少量请求就能导致拒绝服务的攻击方式。

      **例如**：以下代码允许用户指定要使用的 file system 大小。通过指定一个较大的数字，攻击者可以耗尽 file system 资源。


      ```javascript

      var insecureInput = document.URL.indexOf(''size='');

      var fs = requestFileSystem(0, insecureInput);

      ```'
    Advice: "|-\n拒绝服务攻击是一种滥用资源性的攻击。从程序源代码角度讲，对涉及到系统资源的外部数据应该进行严格校验，防止无限制的输入。\n**例如**：通过下面的代码，用户可以指定\
      \ file system 的大小，但是该值必须取自合理的范围。\n```javascript\nif (insecureInput >= SIZE_MIN\
      \ &&\n    insecureInput <= SIZE_MAX) {\n    var fs = requestFileSystem(0, insecureInput);\n\
      } else {\n    throw \"Invalid file system size\";\n}\n```"
    Exploit: '|-

      漏洞代码：

      ```js

      var insecureInput = document.URL.indexOf(''code='');

      var fs = requestFileSystem(0, insecureInput);

      ```

      以上代码从配置文件中读取响应信息，并根据配置信息设置HTTP响应代码，正常情况下这不会造成问题。

      但当攻击者通过某些方式，篡改了配置文件，将其修改为以下内容：

      {"code": 500}

      这样，无论用户发送什么请求，都会收到服务器错误的响应，造成拒绝服务攻击。'
