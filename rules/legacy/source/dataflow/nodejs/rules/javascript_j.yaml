    Description: '|-

      程序从一个不可信赖的数据源获取数据，未进行验证就置于HTTP头中发给用户，可能会导致HTTP响应截断攻击。

      **例如**：下列代码片段中，程序从HTTP请求中获取author的值，并将其设置到HTTP请求头的cookie中。


      ```javascript

      insecureInfo = document.URL;

      ...

      document.cookie = "author=" + insecureInfo + ";expires="+ cookieExpiration;

      ```


      author是来自用户输入，未经任何处理就存入了cookie中，使应用有可能受到cookie篡改的攻击。如果服务端解析了cookie，则可以造成其他攻击。'
    Advice: "|-\n创建一份安全字符白名单，只接受完全由这些受认可的字符组成的输入出现在HTTP头中。\n**例如**：以下代码片段中，验证了author的值是否由标准的字母数字字符组成。\n\
      \n```javascript\ninsecureInfo = document.URL;\nvar exp = /[0-9A-Za-z]/;\nvar\
      \ objExp = new RegExp(exp);\nif (objExp.test(insecureInfo)==true) {\n  document.cookie\
      \ = \"author=\" + insecureInfo + \";expires=\"+ cookieExpiration;\n}\n```"
