    Description: "|-\n对于 Self-XSS，恶意内容通常采用 JavaScript 代码片段的形式，或者其他任意一种可以被浏览器执行的代码的形式。由于\
      \ Self-XSS 主要是对自身进行攻击，因此往往被认为不重要，但在以下情况下，应将其与标准 XSS 缺陷同等对待：\n在您的网站上识别到 Cross-Site\
      \ Request Forgery 漏洞。社会工程攻击可能诱使用户攻击他们自己的帐户，从而破坏其会话。\n**例如**：考虑使用 HTML 表单。\n\
      ```<div id=\"myDiv\">\n  Employee ID: <input type=\"text\" id=\"eid\"><br>\n\
      \  ...\n  <button>Show results</button>\n</div>\n<div id=\"resultsDiv\">\n \
      \ ...\n</div>\n;\n```\n该段脚本解析URL，读取msg参数的值，并将其写入页面。如果攻击者设计一个恶意的URL，并以JavaScript代码作为msg参数，那么Web浏览器就会像显示HTTP响应那样执行该代码，应用程序将受到基于DOM的XSS攻击。"
    Advice: 基于DOM的XSS是将用户可控的JavaScript数据输出到HTML页面中而产生的漏洞，为了避免基于DOM的XSS攻击，避免将用户控制的数据直接输出到DOM或脚本中执行。如果不能避免，则应进行严格的过滤。
    Exploit: "|-\n漏洞代码：\n```js\n$(document).ready(function(){\n  $(\"#myDiv\").on(\"\
      click\", \"button\", function(){\n    var eid = $(\"#eid\").val();\n    $(\"\
      resultsDiv\").append(eid);\n    ...\n  });\n});\n```\n如果文本输入中 ID 为 eid 的雇员 ID\
      \ 仅包含标准字母数字文本，则这些代码示例可正确运行。\n如果 eid 中的某个值包含元字符或源代码，则在用户点击该按钮之后，代码将被添加到 DOM 以供浏览器执行。\n\
      如果攻击者可以诱使用户将恶意内容输入到文本输入，就成了基于 DOM 的 XSS。"
