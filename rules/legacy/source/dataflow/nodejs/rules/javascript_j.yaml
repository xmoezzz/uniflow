    Description: "|-\nXPath查询表达式由用户的输入控制，攻击者可以任意控制修改XML中的节点。根据XML文档的用途，可能会产生各种影响，例如搜索隐私信息（密码），修改敏感数据，读取任意文件，甚至绕过验证和提升权限。\n\
      **例如**：以下示例查询条件使用用户的输入数据来查询商品的id。\n```javascript\nfunction readItemPrice() {\n\
      \tvar req = new XMLHttpRequest();\n\treq.open(\"GET\", PRICELIST_XML_URL, false);\n\
      \treq.send(null);\n\n\tvar xmlPriceListDoc = req.responseXML;\n\tvar nsResolver\
      \ = xmlPriceListDoc.createNSResolver(xmlPriceListDoc.documentElement);\n\n\t\
      var params = new URLSearchParams(document.location.search);\n\tvar itemId =\
      \ params.get(\"ItemID\");\n\n\tvar expr = \"//priceList/item[itemID='\" + itemId\
      \ + \"']/price/text()\";\n\n\tvar price = xmlPriceListDoc.evaluate(expr, xmlPriceListDoc,\
      \ nsResolver, XPathResult.ANY_TYPE, null);\n\n\treturn price;\n}\n```"
    Advice: "|-\n需要验证所有的用户输入数据，提供白名单，或者对数据进行过滤。\n**例如**：以下示例查询条件使用用户的输入数据来查询商品的id，对参数进行了过滤。\n\
      ```javascript\nfunction readItemPrice() {\n\tvar req = new XMLHttpRequest();\n\
      \treq.open(\"GET\", PRICELIST_XML_URL, false);\n\treq.send(null);\n\n\tvar xmlPriceListDoc\
      \ = req.responseXML;\n\tvar nsResolver = xmlPriceListDoc.createNSResolver(xmlPriceListDoc.documentElement);\n\
      \n\tvar params = new URLSearchParams(document.location.search);\n\n\tvar itemIdAsInt\
      \ = parseInt(params.get(\"ItemID\"));\n\tvar expr = \"//priceList/item[itemID='\"\
      \ + itemIdAsInt.toString() + \"']/price/text()\";\n\n\tvar price = xmlPriceListDoc.evaluate(expr,\
      \ xmlPriceListDoc, nsResolver, XPathResult.ANY_TYPE, null);\n\n\treturn price;\n\
      }\n```"
