        value: HTML5：易猜到的数据库名称
    BugServerity: 1
    DynamicDescription: '|-

      <p th:if="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的+''`''+${funcName}+''`''+方法中数据库名易泄漏。"
      th:remove="tag"></p>

      <p th:unless="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的第+''`''+${line}+''`''+行数据库名易泄漏。"
      th:remove="tag"></p>'
    Description: "|-\nHTML5的一项功能是在客户端SQL数据库存储数据。数据库名称是开始写入数据库或从数据库读取所需的重要信息。因此，数据库名称必须是每位用户特有的唯一字符串。如果数据库名称很容易被猜出，未经授权的人（例如其他用户）可能会窃取敏感数据或损坏数据库条目。\n\
      **例1**：以下代码使用了容易被猜出的数据库名称。\n\n\n```javascript\n...\nvar db = openDatabase('mydb',\
      \ '1.0', 'Test DB', 2 * 1024 * 1024);\n```\n\n**例2**：下面是Node.js示例。\n\n```javascript\n\
      var mq = require(\"mysql\");\nvar mc = mq.createConnection({\n    user: \"root\"\
      ,\n    password: \"xxxxxx\",\n    database:\"mydb\"\n});\n...\n```"
    Advice: 不要使用容易被猜出的数据库名称。理想情况下，应该使用随机字符串生成器来创建数据库名称并将其存储在服务器上。只有经过授权的用户登录时，才能检索该名称并将其添加到客户端脚本上。然而，这种方法可能不适用于脱机访问。这时，用户可选择脱机密码并将其与用户名一起作为数据库名称使用。
    References:
