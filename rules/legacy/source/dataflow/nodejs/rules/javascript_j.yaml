      th:remove="tag"></p>'
    Description: '|-

      HTTP X-XSS-Protection响应标头是Internet Explorer，Chrome和Safari的一项功能，可在检测到反映的跨站点脚本（XSS）攻击时阻止页面加载

      但是在旧版本浏览器中使用会产生缺陷。所以如果不禁用此功能应该避免使用旧版本IE。

      **例如**：以下示例在 Express 应用程序中错误地配置 Helmet 中间件，从而为所有 Internet Explorer 版本启用此标头。


      ```javascript

      var express = require(''express'');

      var app = express();

      var helmet = require(''helmet'');

      ...

      app.use(helmet.xssFilter({ setOnOldIE: true}));

      ```'
    Advice: 不要把Internet Explorer 版本的 X-XSS-Protection 设置为 1,使用默认的0就可以。
