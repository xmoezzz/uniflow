    Description: "|-\n程序中采用硬编码方式处理身份证号码，一方面会降低系统安全性，另一方面不易于程序维护。\n\n**例如**：下面代码采用了硬编码方式处理身份证号码。\n\
      ```javascript\nvar emps = [\n    {\n        \"id\": \"330781198509075478\",\n\
      \        \"name\": \"张强\",\n        \"age\": 32,\n        \"tel\": \"18701608086\"\
      ,\n        \"bankId\": \"6228482410842133810\"\n    },\n    {\n        \"id\"\
      : \"330781198509075419\",\n        \"name\": \"王刚\",\n        \"age\": 40,\n\
      \        \"tel\": \"18610524666\",\n        \"bankId\": \"6221386102180111738\"\
      \n    },\n    {\n        \"id\": \"33078119850907853X\",\n        \"name\":\
      \ \"李芳\",\n        \"age\": 28,\n        \"tel\": \"13701155577\",\n       \
      \ \"bankId\": \"6222801842821035763\"\n    }\n]\n```\n在上面的源码片段中，程序直接将员工的身份证号码等敏感信息以硬编码的方式进行存储，这样做会让数据与程序直接绑定，提高了系统的耦合性，使得系统和数据的维护变得困难。同时，如果对程序的执行文件做反编译操作，很容易就能够得到雇员的真实信息，导致敏感数据泄露，大大降低了系统的安全性。"
    Advice: "|-\n程序中不应对身份证号码进行硬编码，可以使用配置文件或数据库存储的方式来存储系统所需的数据；并且录入数据时，还可以做加密处理之后再进行数据的录入，从而防止敏感数据泄露。\n\
      \n**例如**：下面代码采用了从后端接口查询身份证号码并解密。\n```javascript\nvar emps = [\n    {\n     \
      \   \"id\": decrypt(getIdByUserId(1001)),\n        \"name\": \"张强\",\n     \
      \   \"age\": 32,\n        \"tel\":  decrypt(getPhoneByUserId(1001)),\n     \
      \   \"bankId\":  decrypt(getBankIdByUserId(1001)),\n    },\n    {\n       \"\
      id\": decrypt(getIdByUserId(1002)),\n        \"name\": \"王刚\",\n        \"age\"\
      : 40,\n        \"tel\":  decrypt(getPhoneByUserId(1002)),\n        \"bankId\"\
      :  decrypt(getBankIdByUserId(1003)),\n    },\n    {\n        \"id\": decrypt(getIdByUserId(1003)),\n\
      \        \"name\": \"李芳\",\n        \"age\": 28,\n        \"tel\":  decrypt(getPhoneByUserId(1003)),\n\
      \        \"bankId\":  decrypt(getBankIdByUserId(1003)),\n    }\n]\n```"
