    Description: "|-\nCommand Injection 漏洞主要表现为以下两种形式：\n－ 攻击者可以修改程序执行的命令\n－ 攻击者可以修改命令的执行环境从而间接的控制执行命令。\n\
      在这种情况下，我们主要说明第一种情形，即攻击者有可能通过篡改程序的执行命令。\n**例如**：\n\n```javascript\nvar childProcess\
      \ = require('child_process');\nvar command  = parent.dialogArguments;\nchildProcess.exec(command,function(error,stdout,stderr){\n\
      \    //···········\n});\n```\n\n在上面例子中command参数是从外部获取而且在程序中没有经过任何的限制，如果攻击者可以控制command的内容就会造成不可预料的问题。"
    Advice: "|-\n对于从外部获取的命令一定要进行权限的控制，例如下面通过判断当前用户权限来保证数据来源是否正确。\n\n```javascript\n\
      var childProcess = require('child_process');\nvar command = parent.dialogArguments;\n\
      var user = getCurrentUser();\nif(user.isNotAuth()){\n    return;\n}\nchildProcess.exec(command,function(error,stdout,stderr){\n\
      \    //···········\n});\n```"
    Exploit: "|-\n漏洞代码：\n```js\nvar command = \"ping \" + parent.dialogArguments;\n\
      var user = getCurrentUser();\nif(user.isNotAuth()){\n    return;\n}\nchildProcess.exec(command,function(error,stdout,stderr){\n\
      \    //···········\n});\n```\n以上代码用于网络连通性测试，其正常的使用方式是：\nhttp://www.example.com/ping.php?ip=8.8.8.8\n\
      \n当攻击者访问如下网址：\nhttp://www.example.com/ping.php?ip=-c1+8.8.8.8+%26%26+rm+-rf+%2F\n\
      \n服务器执行的命令变成：ping -c1 8.8.8.8 && rm -rf /\n服务器的所有文件将被删除。"
