    Description: "|-\n当定义了*getSnapshotBeforeUpdate*()生命周期方法，而没有使用其返回值，则此方法就没有任何意义，可能由于疏忽导致未定义*compontDidUpdate*()。\n\
      *getSnapshotBeforeUpdate*()的返回值将作为*compontDidUpdate*()的第三个参数传递。\n\n**例如**：以下示例定义了getSnapshotBeforeUpdate()但未使用其返回值。\n\
      \n```react\nimport React from 'react';\n\nclass Test extends React.Component\
      \ {\n    constructor(props) {\n        super(props);\n        this.state = {\
      \ msg: 'hi' };\n        this.handleClick = this.handleClick.bind(this);\n  \
      \  }\n    getSnapshotBeforeUpdate(prevProps, prevState) {\n        //...\n \
      \       return null;\n    }\n    handleClick() {\n        //...\n    }\n   \
      \ render() {\n        //...\n    }\n}\n```"
    Advice: "|-\n定义*getSnapshotBeforeUpdate*()方法时，也需要定义*compontDidUpdate*()方法。\n**例如**：\n\
      \n\n```react\nimport React from 'react';\n\nclass Test extends React.Component\
      \ {\n    constructor(props) {\n        super(props);\n        this.state = {\
      \ msg: 'hi' };\n        this.handleClick = this.handleClick.bind(this);\n  \
      \  }\n    getSnapshotBeforeUpdate(prevProps, prevState) {\n        //...\n \
      \       return null;\n    }\n    componentDidUpdate(prevProps, prevState, snapshot)\
      \ {\n        //...\n    }\n    handleClick() {\n        //...\n    }\n    render()\
      \ {\n        //...\n    }\n}\n```"
