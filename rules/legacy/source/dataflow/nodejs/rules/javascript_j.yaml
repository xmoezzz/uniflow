    Description: "|-\n应用程序对用户可控制的输入未经合理校验，就传送给一个文件API。攻击者可能会使用一些特殊的字符（如“..”和“/”）绕过访问控制机制，访问一些受保护的文件或目录。\n\
      **例如**：下面代码片段使用来自于HTTP请求的输入来删除一个文件。\n```javascript\n...\nvar url = document.URL;\n\
      \    var rName = url.substring(url.indexOf(\"reportName=\")+11, url.length);\n\
      \    window.requestFileSystem(window.TEMPORARY, 1024*1024, function(fs) {\n\
      \        fs.root.getFile('/usr/local/apfr/reports/' + rName, {create:false},\
      \ function(fileEntry) {\n            fileEntry.remove(function() {\n       \
      \         console.log('File removed.');\n            }, errorHandler);\n   \
      \     }, errorHandler);\n    }, errorHandler);\n...\n```\n攻击者可能提供类似下面的输入：\n\n\
      ```\n /safe_dir/../important.dat\n```\n程序假定路径是有效的，因为它是以“/safe_dir/”开头的，但是“../”将导致程序删除父目录下的“important.dat”文件。"
    Advice: 避免使用不可信数据源的数据来操纵路径，如果不可避免，则应创建一份合法资源名的列表，并且规定用户只能选择其中的文件名。
    Exploit: "|-\n漏洞代码：\n```js\n...\nvar url = document.URL;\n    var username = url.substring(url.indexOf(\"\
      username=\")+11, url.length);\n    window.requestFileSystem(window.TEMPORARY,\
      \ 1024*1024, function(fs) {\n        fs.root.getFile('/tmp/log/' + username,\
      \ {create:false}, function(fileEntry) {\n            fileEntry.remove(function()\
      \ {\n                console.log('File removed.');\n            }, errorHandler);\n\
      \        }, errorHandler);\n    }, errorHandler);\n...\n```\n以上代码用于在清理用户的日志，例如清理Alice用户的日志，则访问如下链接：\n\
      http://www.example.com/clear.php?username=Alice\n\n假如攻击者访问如下链接：\nhttp://www.example.com/clear.php?username=..%2Fsensitive\n\
      “../”绕过了路径的限制，删除的文件实际为/tmp/log/../sensitive，这样可能导致一些敏感文件被删除。"
