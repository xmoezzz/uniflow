    Description: "|-\nSSRF 形成的原因大都是由于服务端提供了从其他服务器应用获取数据的功能且没有对目标地址做过滤与限制。比如从指定URL地址获取网页文本内容，加载指定地址的图片，下载等等。\n\
      **例如**：在下例中攻击者将能够控制服务器连接的URL。\n```javascript\nvar http = require('http');\n\
      var url = require('url');\nfunction listener(request, response){\n    var request_url\
      \ = document.URL;\n    http.request(request_url)\n        ...\n}\nhttp.createServer(listener).listen(8080);\n\
      ```\n这种使用用户输入影响的资源可能存在风险。"
    Advice: 程序应当避免用户输入影响服务器端请求资源。如果请求资源需要用户选择，可以采用白名单方式，避免直接由用户进行输入。
    Exploit: "|-\n漏洞代码：\n```js\nvar http = require('http');\nvar url = require('url');\n\
      function listener(request, response){\n    var request_url = document.URL;\n\
      \    http.request(request_url)\n        ...\n}\nhttp.createServer(listener).listen(8080);\n\
      ```\n以上代码从第三方服务器获取数据，如果用户输入的服务器为如下的可信地址，不会造成危害：\nhttp://www.example.com/getdata.php?host=trusted.example.com\n\
      \n但如果攻击者提供的如下恶意网址：\nhttp://www.example.com/getdata.php?host=hack.com\n\n服务器将从恶意的网站上获取不可信任的数据，使用这些数据可能会带来危害。"
