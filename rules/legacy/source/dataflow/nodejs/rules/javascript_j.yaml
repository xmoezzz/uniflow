    BugServerity: 3
    DynamicDescription: '|-

      <p th:if="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的+''`''+${funcName}+''`''+方法中会发生+${categoryName}+的风险。"
      th:remove="tag"></p>

      <p th:unless="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的第+''`''+${line}+''`''+行会发生+${categoryName}+的风险。"
      th:remove="tag"></p>'
    Description: "|-\n当系统数据或调试信息通过套接字或网络连接使程序流向远程机器时，就会发生外部信息泄露。外部信息泄露会暴露有关操作系统、完整路径名、现有用户名或配置文件位置的特定数据，从而使攻击者有机可乘，它比内部信息（攻击者更难访问）泄露更严重。\n\
      示例 1：以下代码会在网页内文本区域中泄露异常信息：\n...\ndirReader.readEntries(function(results){\n\
      \  ...\n}, function(error){\n  $(\"#myTextArea\").val('There was a problem:\
      \ ' + error);\n});\n...\n该信息可能会显示给远程用户。在某些情况下，该错误消息会告诉攻击者该系统易遭受的确切攻击类型。\n例如，数据库错误消息可以揭示应用程序容易受到\
      \ SQL Injection 攻击。其他错误消息可以揭示有关该系统的更多间接线索。\n在示例1 中，泄露的信息可能会暗示有关操作系统类型、系统上安装了哪些应用程序以及管理员在配置程序时采取了哪些保护措施的信息。"
    Advice: '|-

      编写错误消息时，始终要牢记安全性。在编码的过程中，尽量避免使用繁复的消息，提倡使用简短的错误消息。限制生成与存储繁复的输出数据可帮助管理员和程序员诊断问题。调试踪迹有时可能出现在不明显的位置（例如，嵌入在错误页
      HTML 的注释中）。

      即便是并未揭示栈踪迹或数据库转储的简短错误消息，也有可能帮助攻击者发起攻击。例如，“Access Denied”（拒绝访问）消息可以揭示系统中存在一个文件或用户。因此，切勿将信息直接发送到程序外部的资源。

      1. 不要依赖于封装器脚本、组织内部的 IT 策略或是思维敏捷的系统管理员来避免 System Information Leak 漏洞。编写安全的软件才是关键。

      2. 这类漏洞并不适用于所有类型的程序。例如，如果您在一个客户机上执行应用程序，而攻击者已经获取了该客户机的系统信息，或者如果您仅将系统信息输出到一个可信任的日志文件中，就可以使用
      Audit Guide 从扫描结果中将此类别过滤掉。'
