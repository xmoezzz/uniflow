    Description: "|-\n跨站请求伪造(CSRF)是伪造客户端请求的一种攻击。应用程序允许用户提交不包含任何nonce（与用户Session关联的加密随机值）的请求，将可能导致CSRF攻击。\n\
      **例如**：以下代码片段用于银行转账功能，对于该重要敏感的操作没有进行相应防护，将易于导致跨站请求伪造攻击。\n\n```javascript\nvar\
      \ req = new XMLHttpRequest();\nreq.open(\"POST\", \"/transferFunds\", true);\n\
      body = \"to_account=Bill&amount=10000\";\nreq.send(body);\n```\n\n**例2**：下面是通过表单发送请求。\n\
      \n```htm\n<form method=\"GET\" action=\"/transferFunds \">\n    cash: <input\
      \ type=\"text\" name=\"cash\">\n    to: <input type=\" text \" name=“to\">\n\
      \    <input type=\"submit\" name=\"action\" value=\"TransferFunds\">\n</form>\n\
      ```"
    Advice: '|-

      防止跨站请求伪造攻击的方法如下：

      防御策略

      1、验证HTTP Refer字段

      2、在请求地址中添加token验证

      3、在http头中自定义属性并验证

      4、Chrome浏览器端启用 SameSite cookie


      防御手段

      1、尽量使用POST, 限制GET

      2、调整浏览器Cookie策略

      3、加验证码，强制用户必须与应用进行交互，才能完成最终请求。在通常情况下，验证码能很好遏制CSRF攻击。但是出于用户体验考虑，网站不能给所有的操作都加上验证码。因此验证码只能作为一种辅助手段，不能作为主要解决方案

      4、Referer Check在Web最常见的应用就是“防止图片盗链”。

      同理，Referer Check也可以被用于检查请求是否来自合法的“源”（Referer值是否是指定页面，或者网站的域），如果都不是，那么就可能是CSRF攻击

      5、Anti CSRF token 业界推荐


      Anti CSRF token

      1、用户访问某个表单页面。

      2、服务端生成一个Token，放在用户的Session中，或者浏览器的Cookie中。

      3、在页面表单附带上Token参数。

      4、用户提交请求后， 服务端验证表单中的Token是否与用户Session（或Cookies）中的Token一致，一致为合法请求，不是则非法请求。


      这个Token的值必须是随机的，不可预测的。由于Token的存在，攻击者无法再构造一个带有合法Token的请求实施CSRF攻击。

      另外使用Token时应注意Token的保密性，尽量把敏感操作由GET改为POST，以form或AJAX形式提交，避免Token泄露。


      **例如**：下面代码片段中，在表单中增加了一个Token。


      ```javascript

      req.open("POST", "/transferFunds", true);

      body = "to_account=Bill&amount=10000&token=" + token;

      //token为与会话相关的一次性随机数。

      req.send(body);

      ```

      这样，服务器端程序响应用户请求前先验证Token，判断请求的合法性。对于Token，越难被猜出攻击者攻击成功的概率就越低。'
