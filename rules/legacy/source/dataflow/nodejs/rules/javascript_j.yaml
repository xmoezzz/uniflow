      th:remove="tag"></p>'
    Description: "|-\n截至2011年12月，仍然没有标准的CSS渐变实现，这意味着在跨浏览器中使用CSS渐变需要使用许多不同的厂商前缀版本。\n\
      目前有五种不同的厂商前缀的CSS渐变版本:\n-ms-linear-gradient and -ms-radial-gradient for Internet\
      \ Explorer 10+\n-moz-linear-gradient and -moz-radial-gradient for Firefox 3.6+\n\
      -o-linear-gradient and -o-radial-gradient for Opera 11.10+\n-webkit-linear-gradient\
      \ and -webkit-radial-gradient for Safari 5+ and Chrome\n-webkit-gradient for\
      \ Safari 4+ and Chrome (aka \"Old WebKit\")\n**例如**：\n```css\n/* 不符合的: Missing\
      \ -moz, -ms, and -o */\n.mybox {\n  background: -webkit-gradient(linear, left\
      \ top, left bottom, color-stop(0%,#1e5799), color-stop(100%,#7db9e8));\n  background:\
      \ -webkit-linear-gradient(top,  #1e5799 0%,#7db9e8 100%);\n}\n\n/* 不符合的: Missing\
      \ old and new -webkit */\n.mybox {\n  background: -moz-linear-gradient(top,\
      \ #1e5799 0%, #7db9e8 100%);\n  background: -o-linear-gradient(top, #1e5799\
      \ 0%,#7db9e8 100%);\n  background: -ms-linear-gradient(top, #1e5799 0%,#7db9e8\
      \ 100%);\n}\n```\n当使用一个带有厂商前缀的渐变而不使用其他所有渐变时，该规则会引发问题。"
    Advice: "|-\n**例如**：\n```css\n.mybox {\n  background: -moz-linear-gradient(top,\
      \ #1e5799 0%, #7db9e8 100%);\n  background: -webkit-gradient(linear, left top,\
      \ left bottom, color-stop(0%,#1e5799), color-stop(100%,#7db9e8));\n  background:\
      \ -webkit-linear-gradient(top, #1e5799 0%,#7db9e8 100%);\n  background: -o-linear-gradient(top,\
      \ #1e5799 0%,#7db9e8 100%);\n  background: -ms-linear-gradient(top, #1e5799\
      \ 0%,#7db9e8 100%);\n}\n```"
