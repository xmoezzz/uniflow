      <p th:if="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的+''`''+${funcName}+''`''+方法中存在+${categoryName}+的风险。"
      th:remove="tag"></p>

      <p th:unless="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的第+''`''+${line}+''`''+行存在+${categoryName}+的风险。"
      th:remove="tag"></p>'
    Description: "|-\n在某些使用 SSL 连接的库中，默认情况下不验证服务器证书。这相当于信任所有证书。\n**例如**：此服务器错误地尝试验证客户端连接。\n\
      ```javascript\nvar https = require('https');\n...\nvar options = {\n    key\
      \ : readFile('server-key.pem'),\n    cert : readFile('server-cert.pem'),\n \
      \   requestCert: true,\n    ...\n}\nhttps.createServer(options);\n```\n\n在上面示例中没有设置*rejectUnauthorized*，而其默认设置为*false*。这就意味着即使不对证书进行授权仍然会与无法识别的服务器建立连接，这样程序就会时刻处于危险状态，黑客可以很容易获取用户的敏感信息。"
    Advice: 在使用SSL连接的时候要设置 *rejectUnauthorized:true*。
    References:
