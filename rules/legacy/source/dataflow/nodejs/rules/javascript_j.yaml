      \      当使用供应商前缀的属性时-ms-hyphens，您还应该包括标准属性以供将来兼容。标准属性应该紧跟在供应商前缀的属性之后，以确保浏览器使用标准属性。将标准属性放在供应商前缀属性之后是确保您的\
      \ CSS 代码在标准属性被完全采用后继续工作的最佳方式（然后您可以花时间返回并删除供应商前缀属性）。\n**例如**：\n```css\n.mybox\
