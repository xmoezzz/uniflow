      th:remove="tag"></p>'
    Description: "|-\n传输层安全 (TLS) 协议和安全套接字层 (SSL) 协议提供了一种保护机制，可以确保在客户端与 web 服务器之间传输的数据的真实性、保密性和完整性。TLS\
      \ 和 SSL 都进行了多次修正，因此需要进行定期版本更新。\n每次新的修订都是用于解决在以往版本中发现的安全弱点。使用不安全版本的 TLS/SSL 将削弱数据保护力度，并可能允许攻击者危害、窃取或修改敏感信息。\n\
      \n```javascript\nvar tls = require('tls');\n...\ntls.connect({\n    host: 'https://www.hackersite.com',\n\
      \    port: '443',\n    rejectUnauthorized: true,\n    secureProtocol:\"SSLv2_method\"\
      ,\n});\n...\n```"
    Advice: SSLv2、SSLv3等协议已经被确定很不可靠很容易受到威胁，建议不要用这些协议。
