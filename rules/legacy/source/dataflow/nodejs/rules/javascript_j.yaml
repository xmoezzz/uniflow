    Description: "|-\n尽管您可以在CSS规则中定义任意一组属性，但由于元素的显示，其中一些属性会被忽略。这会给CSS带来额外的麻烦，并且会对规则的工作方式产生误解。\n\
      对于显示:内联，宽度、高度、margin-top、margin-bottom和float属性没有作用，因为内联元素没有一个正式的框来应用样式。左边距和右边距属性仍然可以可靠地用于缩进，但其他边距设置则不行。\n\
      float属性有时被用来修复IE6的双边界错误。其他基于显示的一般规则如下:\n\ndisplay: inline-block should not use\
      \ float.\ndisplay: block should not use vertical-align.\ndisplay: table-* should\
      \ not use margin (and all variants) or float.\n**例如**：\n```css\n.mybox {\n \
      \ display: inline;\n  height: 25px;\n}\n\n/* 不符合的: 'display: inline-block' defined\
      \ along with 'float' */\n.mybox {\n  display: inline-block;\n  float: left;\n\
      }\n\n/* 不符合的: 'display: table-cell' defined along with 'margin' */\n.mybox {\n\
      \  display: table-cell;\n  margin: 10px;\n}\n```"
    Advice: "|-\n删除被忽略或有问题的属性会减少文件大小，从而提高性能。\n```css\n.mybox {\n  display: inline;\n\
      \  margin-left: 10px;\n}\n\n.mybox {\n  display: table;\n  margin-bottom: 10px;\n\
      }\n```"
