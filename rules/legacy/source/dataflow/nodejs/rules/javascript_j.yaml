    Description: "|-\n应用程序允许未验证的用户输入控制重定向中的URL,可能会导致攻击者发动钓鱼攻击。\n**例1**：以下JavaScript代码从用户输入表单的dest参数中读取目的URL，然后在新窗口中打开。\n\
      \n```javascript\ndsturl = myForm.dsturl.value;\nwindow.open(dsturl,\"newwin\"\
      );\n```\n假如攻击者可以控制这个表单，那么用户就有可能打开一个恶意站点。\n\n**例2**：以下是Node.js可能出现的。\n\n```javascript\n\
      var express = require('express');\nvar app = express();\napp.get('/', function\
      \ (req, res) {\n    res.redirect(req.url);\n});\n```\n与例1一样假如攻击者控制了这个url，那么就会导致用户可能打开恶意站点。"
    Advice: "|-\njs和Node.js都要避免采用不可信数据源的数据来构造重定向的URL，如果业务逻辑需要涉及到用户输入，那么就创建一份合法URL列表，用户只能从中进行选择，进行重定向操作。\n\
      **例如**：以下代码中，用户只能输入数字来选择URL。\n\n```javascript\ndst = myForm.dst.value;\nif(dst\
      \ == \"1\"){\n    dsturl = \"http://www.1.com\"\n}else if(dst == \"2\"){\n \
      \   dsturl = \"http://www.2.com\"\n}else{\n    dsturl = \"http://www.3.com\"\
      \n}\nwindow.open(dsturl,\"newwin\");\n```"
    Exploit: '|-

      漏洞代码：

      ```js

      var url = myForm.dsturl.value;

      window.open(url,"newwin");

      ```

      以上代码用于在某操作后页面跳转，正常情况是返回到之前的页面，如下所示：

      http://trusted.example.com/action.php?url=http%3A%2F%2Fwww.example.com%2Flist.php


      假如攻击者构造如下网址发送给受害者：

      http://trusted.example.com/action.php?url=http%3A%2F%2Fwww.hack.com


      受害者因为信任trusted.example.com而点击了链接，那么页面将会跳转到恶意站点，从而导致受害者访问恶意内容。'
