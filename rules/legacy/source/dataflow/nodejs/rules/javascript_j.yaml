      th:remove="tag"></p>'
    Description: "|-\nJavaScript的`Math.random()`实现PRNG（伪随机数序列发生器），该PRNG是可移植和可重复的，因此如果两个\n\
      \n`Math.random()`使用相同的种子，会生成相同的数值序列。\n**例如**：下面的代码使用\n\n```javascript\nMath.random()\n\
      ```\n\n创建的Token很容易被猜到。\n```javascript\nfunction getToken (){\n    var token\
      \ =\n        Math.random();\n    return token;\n}\n```"
    Advice: "|-\nJavaScript在安全性要求较高的环境中生成随机数，常规的建议是使用 Mozilla API 中的`window.crypto.getRandomValues()`函数，但这种方法受限于浏览器的兼容性，只在较新的版本（Chrome>=11.0,\
      \ Firefox>=21, Edge, IE>=11, Safari>=3.1）可以使用。如果考虑到旧版本浏览器，则应在javascript之外处理PRNG功能。\n\
      **例如**：缺陷描述中的例子可以改写为。\n\n```javascript\nfunction getToken (){\n    var array\
      \ = new Uint32Array(1);\n    window.crypto.getRandomValues(array);\n    var\
      \ token = array[0];\n    return token;\n}\n```"
    References:
      Reference:
      - type: CWE
        value: 330:Use of Insufficiently Random Values
      - type: OWASP ASVS
        value: v4.0.3-2.3.1
      - type: OWASP ASVS
        value: v4.0.3-2.6.2
      - type: OWASP ASVS
        value: v4.0.3-2.9.2
