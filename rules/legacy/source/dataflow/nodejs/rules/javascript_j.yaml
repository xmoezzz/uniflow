    Description: "|-\n如果程序不进行恰当的访问控制就会导致不可信数据源控制了SQL语句的主键，如果执行了这条SQL语句就可能会导致攻击者访问未经授权的数据。\n\
      **例1**：下面代码片段中的SQL语句用于查询与指定标识符相匹配的清单。\n```javascript\n...\nvar id = document.form.invoiceID.value;\n\
      var query = \"select * from table where id = ?\";\ndb.transaction(function (tx)\
      \ {\n    tx.executeSql(query,[id]);\n})\n...\n```\n\n**例2**：下面是Node.js示例 。\n\
      \n```javascript\nvar mq = require(\"mysql\");\nvar mc = mq.createConnection({\n\
      \    user: \"root\",\n    password: \"xxxxxx\"\n});\nmc.connect();\nvar username\
      \ = request.params\nvar sql = \"select * from table where id = ?\";\nmc.query(sql,\
      \ username,function(err, rs, fields){\n    //处理数据\n});\n```\n在上面代码中，攻击者可以通过为invoiceID设置不同的值，获取所需的任何清单信息。"
    Advice: "|-\n任何情况下都不允许用户在没有取得相应权限的情况下获取或修改数据库中的记录。可以通过把当前被授权的用户名作为查询语句的一部分来实现。\n\
      **例如**：下面代码片段中，通过把当前被授权的用户名作为查询语句的一部分来限制用户对清单的访问。\n\n```javascript\n...\nvar\
      \ id = document.form.invoiceID.value;\nvar user = current_user;\nvar query =\
      \ \"SELECT * FROM invoices WHERE id = ? AND user = ?\";\ndb.transaction(function\
      \ (tx) {\n    tx.executeSql(query,[id,user]);\n})\n...\n```"
