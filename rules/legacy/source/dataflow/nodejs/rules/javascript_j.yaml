      <p th:unless="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的第+''`''+${line}+''`''+行会发生+${categoryName}+的风险。"
      th:remove="tag"></p>'
    Description: "|-\n1. 数据通过一个不可信赖的数据源进入 Web 应用程序。对于 Persistent（也称为 Stored）XSS，不可信赖的源通常为数据库或其他后端数据存储，而对于\
      \ Reflected XSS，该源通常为 Web 请求。\n2. 未检验包含在动态内容中的数据，便将其传送给了 Web 用户。\n传送到 Web 浏览器的恶意内容通常采用\
      \ JavaScript 代码片段的形式，但也可能会包含一些 HTML、Flash 或者其他任意一种可以被浏览器执行的代码。基于 XSS 的攻击手段花样百出，几乎是无穷无尽的，但通常它们都会包含传输给攻击者的私人数据（如\
      \ Cookie 或者其他会话信息）。\n\n在攻击者的控制下，指引受害者进入恶意的网络内容；或者利用易受攻击的站点，对用户的机器进行其他恶意操作。\n\
      **例 1：**以下 Node.js 代码片段会在 HTTP 请求中读取雇员 ID eid，并将其显示给用户。\n```javascript\nvar\
      \ http = require('http');\nvar url = require('url');\n...\nfunction listener(request,\
      \ response){\n    var eid = url.parse(request.url, true)['query']['eid'];\n\
      \    if (eid !== undefined){\n        response.writeHead('<p>Welcome, ' + eid\
      \ + '!</p>');\n    }\n    ...\n}\n...\nhttp.createServer(listener).listen(8080);\n\
      ```\n示例 1 所述，系统从 HTTP 请求中直接读取数据，并在 HTTP 响应中返回数据。当攻击者诱使用户为易受攻击的 Web 应用程序提供危险内容，\n\
      而这些危险内容随后会反馈给用户并在 Web 浏览器中执行，就会发生反射式 XSS 盗取。发送恶意内容最常用的方法是，把恶意内容作为一个参数包含在公开发表的\
      \ URL 中，\n或者通过电子邮件直接发送给受害者。以这种手段构造的 URL 构成了多种“网络钓鱼”(phishing) 阴谋的核心，攻击者借此诱骗受害者访问指向易受攻击站点的\
      \ URL。站点将攻击者的内容反馈给受害者以后，便会执行这些内容，接下来会把用户计算机中的各种私密信息（比如包含会话信息的 cookie）传送给攻击者，或者执行其他恶意活动。"
    Advice: '|-

      为了避免XSS攻击，建议采用以下方式进行防御：

      1. 对用户的输入进行合理验证（如年龄只能是数字）。

      2. 根据数据将要置于HTML上下文中的不同位置（HTML标签、HTML属性、JavaScript脚本、CSS、URL），对所有不可信数据进行恰当的输出编码。

      3. 设置HttpOnly属性，避免攻击者利用跨站脚本漏洞进行Cookie劫持攻击。'
    Exploit: "|-\n漏洞代码：\n```js\nvar http = require('http');\nvar url = require('url');\n\
      ...\nfunction listener(request, response){\n    var eid = url.parse(request.url,\
      \ true)['query']['eid'];\n    if (eid !== undefined){\n        response.writeHead('<p>Welcome,\
      \ ' + eid + '!</p>');\n    }\n    ...\n}\n...\nhttp.createServer(listener).listen(8080);\n\
      ```\n以上代码用于欢迎页面，展示用户名等信息，其正常的使用方式是：\nhttp://www.example.com/welcome.php?eid=1\n\
      \n当受害者访问攻击者提供的如下网址：\nhttp://www.example.com/welcome.php?eid=%3Cscript%3Esend_cookie%28%29%3B%3C%2Fscript%3E\n\
      \n页面中将显示以下代码，其中send_cookie()代表发送cookie的具体代码：\nHello <script>send_cookie();</script>\n\
      浏览器将执行插入的Javascript代码，导致用户的cookie被泄漏。"
