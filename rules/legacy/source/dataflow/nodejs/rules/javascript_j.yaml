      <p th:if="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的+''`''+${funcName}+''`''+方法中将cookie的域范围设置过大。"
      th:remove="tag"></p>

      <p th:unless="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的第+''`''+${line}+''`''+行将cookie的域范围设置过大。"
      th:remove="tag"></p>'
    Description: '|-

      开发人员通常将 cookie 设置为在类似“.webpage.com”的基本域中并且处于活动状态。这会使 cookie 暴露在基本域和任何子域中的所有
      Web 应用程序下。

      由于cookie通常包含敏感信息，因此在程序之间共享cookie可能在一个应用程序中导致漏洞，从而危害程序安全。

      **例如**：假设您有一个安全应用程序并将其部署在 http://secure.com/ 上，当用户登录时，该应用程序将使用域“.com”设置会话 ID
      cookie。


      ```javascript

      cookie_options = {};

      cookie_options.domain = ''.com'';

      cookie_options.secure = true;

      cookie_options.httpOnly = true;

      cookie_options.path = "/user";

      ...

      res.cookie(''cookieName'', info, cookie_options);

      ```

      假设您在`http://insecure.com/`上有另一个不太安全的应用程序，它包含`cross-site scripting`漏洞。任何浏览到`http://insecure.com`的`http://secure.com`认证用户面临着暴露来自`http://secure.com`的会话`cookie`的风险。'
    Advice: '|-

      在发送cookie的时候应该避免域范围设置的很大。

      **例如**：


      ```javascript

      cookie_options = {};

      cookie_options.domain = ''secure.webpage.com'';

      cookie_options.secure = true;

      cookie_options.httpOnly = true;

      cookie_options.path = "/user";

      res.cookie(''cookieName'', info, cookie_options);

      ```'
