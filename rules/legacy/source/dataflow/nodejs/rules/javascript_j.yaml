      th:remove="tag"></p>'
    Description: '|-

      HTML5的一项新功能提供了方法

      ```javascript

      postMessage()

      ```

      来实现跨域消息传递。该功能可使脚本将消息发送到其他窗口，用户可以在第二个参数上指定目标窗口的源。如果目标源过于宽松，恶意脚本就能趁机采用不当方式与受攻击的窗口进行通信，从而导致发生欺骗、数据被盗、转发及其他攻击。


      **例如**：在以下代码中， 使用了通配符指定要发送信息的目标源。


      ```javascript

      postMessage(message, ''*'');

      ```

      使用 * 作为目标源，脚本都会将信息发送到任意窗口。'
    Advice: '|-

      采用

      ```javascript

      postMessage()

      ```

      方法传递消息时，应提供一个特定的目标窗口的源。


      **例如**：以下代码提供了目标源的特定值。


      ```javascript

      postMessage(message, ''www.example.com'');

      ```'
