    Description: "|-\nAngularJS的DomSanitizer会预防发生XSS的安全问题，通过清理用户输入的不安全的DOM内容。但是调用任何`bypassSecurityTrust...`的API都会禁用Angular的内置清理功能。\n\
      **例如**：以下示例调用了`bypassSecurityTrustHtml`，Angular会认为是它安全的URL，从而导致XSS。\n```javascript\n\
      import {DomSanitizer} from \"@angular/platform-browser\";\n\nexport class TestPage\
      \ {\npublic htmling=\"javascript:alert(\"Hi there)\";\n  constructor(public\
      \ navCtrl: NavController, public navParams: NavParams,public sanitizer:DomSanitizer\
      \ ) {\n  }\n\n  ionViewDidLoad() {\n    // html\n    this.sanitizer.bypassSecurityTrustHtml(this.htmling)\n\
      \  }\n}\n```"
    Advice: 在使用AngularJS框架时不要使用`DomSanitizer`,`bypassSecurityTrust...`相关的API，否则可能导致XSS。
