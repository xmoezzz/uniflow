    Description: "|-\nVue使用v-on指令时不可以同时使用passive和prevent修饰符。passive的含义是不会执行*preventDefault*()，prevent的含义是执行*preventDefault*()，这两个修饰符相互矛盾，所以不能同时使用。\n\
      **例如**：以下示例同时使用了passive和prevent。\n```html\n<template>\n    <div>\n        <a\
      \ href=\"#\" @click.passive.prevent=\"handleClick\">click me</a>\n    </div>\n\
      </template>\n```"
    Advice: passive和prevent两个修饰符不要同时使用，以免造成程序的错误。
