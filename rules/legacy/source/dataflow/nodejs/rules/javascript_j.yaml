    Description: '|-

      资源注入攻击包括更改应用程序使用的资源标识符，以执行恶意任务。

      应用程序根据用户输入定义的资源类型或位置，比如文件名或端口号，可以对这些数据进行操作，以执行或访问不同的资源。

      资源注入攻击与路径操作不同，因为资源注入的重点是访问本地文件系统之外的资源，而路径操作则侧重于访问本地文件系统。

      **例如**：以下代码使用document.URL中数据来建立socket连接。


      ```javascript

      var socket = new WebSocket(document.URL.indexOf("url=")+10);

      ...

      ```


      这种使用不可信数据源来控制资源的访问，容易受到攻击。'
    Advice: 为了避免资源注入漏洞攻击，可以采用黑名单或白名单策略。黑名单会有选择地拒绝或避免潜在的危险字符。但是，任何这样一份黑名单都不可能是完整的，而且将随着时间的推移而过时。比较好的方法是创建白名单，允许其中的字符出现在资源名称中，且只接受完全由这些被认可的字符所组成的输入。
