      th:remove="tag"></p>'
    Description: '|-

      应用程序的客户端代码从

      ```javascript

      document.location、request.url、document.URL、document.referrer

      ```

      或其他任何攻击者可以修改的浏览器对象获取数据，如果未验证数据是否存在恶意代码的情况下，就将其动态更新到页面的DOM节点,应用程序将易于受到基于DOM的XSS攻击。

      **例如**：下面的JavaScript代码片段可从URL中读取msg信息，并将其显示给用户。


      ```javascript

      var url=document.URL;

      document.write(url.substring(url.indexOf("msg=")+4,url.length);

      ```


      该段脚本解析URL，读取msg参数的值，并将其写入页面。如果攻击者设计一个恶意的URL，并以JavaScript代码作为msg参数，那么Web浏览器就会像显示HTTP响应那样执行该代码，应用程序将受到基于DOM的XSS攻击。'
    Advice: 基于DOM的XSS是将用户可控的JavaScript数据输出到HTML页面中而产生的漏洞，为了避免基于DOM的XSS攻击，避免将用户控制的数据直接输出到DOM或脚本中执行。如果不能避免，则应进行严格的过滤。
    Exploit: '|-

      漏洞代码：

      ```js

      var url=document.URL;

      document.write(url.substring(url.indexOf("username=")+9,url.length);

      ```

      以上代码在浏览器中展示用户提交的用户名信息，以便用户更改用户名。其正常的使用方式是：

      http://www.example.com/welcome.php?username=alice


      当受害者访问攻击者提供的如下网址：

      http://www.example.com/welcome.php?username=%27+onclick%3D%27javascript%3Asend_cookie%28%29


      页面中将显示以下代码（其中send_cookie()代表发送cookie的具体代码）：

      Username: <input value= onclick=''javascript:send_cookie()''/>


      当用户点击输入框时，浏览器将执行插入的Javascript代码，导致用户的cookie被泄漏。'
