    Description: "|-\n跨框架脚本（XFS）是一种结合了恶意的`JavaScript`和`iframe`的攻击，用于窃取用户的数据。攻击者引导用户到攻击者控制的网页，然后攻击者的页面会加载恶意的JavaScripr和指向合法站点的HTML\
      \ iframe。\n通常是未正确使用`X-Frame-Options`HTTP响应头，可能会导致跨站请求伪造或者钓鱼攻击。正确使用`X-Frame-Options`将使浏览器禁止在框架内嵌入网页。\n\
      以下情况可能出现`XFS`漏洞：\n1. 允许自身包含在`iframe`内。\n2. 未设置`X-FARAME-OPTIONS`。\n3. 使用不力的保护。如基于JavaScript的`frame\
      \ busting`逻辑，有多种方式可以绕过该防护。\n**例如**：以下示例使用了`helmet`中间件，但是禁用了`X-FARAME-OPTIONS`。\n\
      ```javascript\napp.use(helmet({\n  frameguard: false\n}));\n```\n该示例借助了 [frameguar](https://helmetjs.github.io/docs/frameguard/)\
      \ 来设置HTTP头的helmet。"
    Advice: '|-

      根据业务需求使用`X-Frame-Options`，它有如下三个值：

      1. deny，表示该页面不允许在 frame 中展示，即便是在相同域名的页面中嵌套也不允许。

      2. sameorign，表示该页面可以在相同域名页面的 frame 中展示。

      3. allow-from uri， 表示该页面可以在指定来源的 frame 中展示。'
