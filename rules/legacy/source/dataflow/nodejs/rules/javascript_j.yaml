    Description: '@font-face可能会出现浏览器兼容性问题'
    Advice: "|-\n执行一些有关浏览器兼容性的检查。浏览器支持级别可以设置为：\n\n最深的浏览器支持（最深）\n以下定义支持大多数仍在使用的浏览器：\n\
      @font-face {\n  font-family: 'MyWebFont';\n  src: url('myfont.eot'); /* IE9\
      \ 兼容模式 */\n  src: url('myfont.eot?#iefix') format('embedded-opentype'), /* IE6-IE8\
      \ */\n       url('myfont.woff2') format('woff2') , /* 超级现代浏览器 */\n       url('myfont.woff')\
      \ format('woff'), /* 漂亮的现代浏览器 */\n       url('myfont.ttf') format('truetype'),\
      \ /* Safari, Android , iOS */\n       url('myfont.svg#svgFontName') 格式('svg');\
      \ /* 旧版 iOS */\n}\n该规则检查以下内容：\n\n至少两个src属性。\n倒数第二个src属性只定义了一个.eot没有格式的文件。\n\
      最后一个src属性.eot首先使用 IE6-IE8 ?#iefixhack 定义文件。然后按以下顺序定义所有其他格式：woff2, woff2, ttf,\
      \ svg.\n稍微深入的浏览器支持（深）\n以下定义兼容：\n\n铬合金\t苹果浏览器\t火狐\t      歌剧\t  IE\t 安卓      \
      \ iOS\n3.5+\t3+\t        3.5+\t  10.1+\t  9+\t2.2+\t  4.3+\n@font-face {\n \
      \ font-family: 'MyWebFont';\n  src: url('myfont.woff2') format('woff2'),\n \
      \      url('myfont.woff') format('woff'),\n       url('myfont.ttf') format('truetype');\n\
      }\n该规则检查最后一个src属性，如下所示：\n\n按此顺序定义至少woff2,woff和truetype格式。\n可以定义其他格式，但只能在truetype格式之后。但一个例外，\
      \ .eot可以在woff2格式之前定义文件。基本上，如果找到了 Deepest Browser Support 语法，它不应该引发任何问题。\n浏览器支持的实用级别（基本）\n\
      以下定义兼容：\n\n铬合金\t苹果浏览器\t火狐\t      歌剧\t  IE\t 安卓       iOS\n5+\t    5.1+\t   \
      \ 3.6+\t11.50+\t  9+\t  4.4+\t   5.1+\n@font-face {\n  font-family: 'MyWebFont';\n\
      \  src: url('myfont.woff2') format('woff2'),\n       url('myfont.woff') format('woff');\n\
      }\n该规则检查最后一个src属性，如下所示：\n\n至少定义woff2并woff按此顺序格式化。\n可以定义其他格式，但只能在woff格式之后。但是一个例外，\
      \ .eot可以在格式之前定义文件。woff2基本上，如果找到更深或最深的浏览器支持语法，它不应该引发任何问题。"
