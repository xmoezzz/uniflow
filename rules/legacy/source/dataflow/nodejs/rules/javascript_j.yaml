    Description: "|-\n模板引擎可以简化代码的编写并且功能丰富，它也有一个很好的功能是可以动态呈现内容，可以让用户控制然后模板进行解析已达到期望的目的，\n\
      例如生成网页、邮件等，但是这样功能如果使用不当很可能被攻击者控制执行一些危害程序的命令。\n**例如**：下面的示例显示如何从 HTTP 请求中检索模板并进行呈现。\n\
      \n```javascript\napp.get('/', function(req, res){\n    var template = _.template(req.params['template']);\n\
      \    res.write(\"<html><body>\" + template() + \"</body></html>\");\n});\n```\n\
      \n\n如果模板是\n\n```javascript\nrequire('child_process').exec(command)\n```\n\n\
      那么攻击者就可以执行任意的命令，这样会造成不可预计的危害。"
    Advice: 程序中应避免用户输入模板，可以采用白名单方式，避免直接由用户进行输入。
    Exploit: "|-\n漏洞代码：\n```js\napp.get('/', function(req, res){\n    var template\
      \ = _.template(req.params['template']);\n    res.write(\"<html><body>\" + template()\
      \ + \"</body></html>\");\n});\n```\n以上代码从参数获取数据，如果用户输入的参数为如下，不会造成危害：\nhttp://www.example.com/getdata.php?template=trustedTemplate\n\
      \n但如果攻击者提供的如下恶意参数：\nhttp://www.example.com/getdata.php?template=require('child_process').exec(command)\n\
      \n服务器将从恶意的网站上获取不可信任的数据，使用这些数据可能会带来危害。"
