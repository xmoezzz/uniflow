      null 加密密钥。如果受 Null 加密密钥保护的帐户遭受入侵，系统所有者将被迫在安全性和可用性之间做出选择。

      任何可以访问此代码的人不仅可以确定它使用 null 加密密钥，而且任何使用最基本破解技术的人都更有可能成功解密所有加密数据。一旦应用程序发布，除非对程序进行修补，否则将无法更改
      Null 加密密钥。雇员可以利用手中掌握的信息访问权限入侵系统。即使攻击者只能访问应用程序的可执行文件，他们也可以提取使用了 null 加密密钥的证据。

      **例如**：下面代码把密钥设置为Null。

      ```javascript

      var crypto = require(''crypto'');

      var encryptionKey = null;

      var algorithm = ''aes-256-ctr'';

