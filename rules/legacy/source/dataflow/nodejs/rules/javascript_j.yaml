      th:remove="tag"></p>'
    Description: "|-\n为了确保属性不会在规则中意外复制，它们应该按字母顺序排列。请注意，以供应商为前缀的属性预计在订购时不会考虑其前缀。\n\
      **例如**：该规则适用于所有语句块(规则集、@-rules、[begin-less] mixins、[end-less][begin-scss] mixins、嵌套属性、[end-scss]等)。\n\
      ```css\n/* 不符合的: 'color' should be defined after 'border-color' */\n.mybox {\n\
      \  background-color: blue;\n  color: red;\n  border-color: green;\n}\n\n/* 不符合的:\
      \ '*color' should be defined after 'border-color' */\n.mybox {\n  background-color:\
      \ blue;\n  *color: red;\n  border-color: green;\n}\n\n/* 不符合的: '_color' should\
      \ be defined after 'border-color' */\n.mybox {\n  background-color: blue;\n\
      \  _color: red;\n  border-color: green;\n}\n\n/* 不符合的: '-xxx-background-color'\
      \ properties should be defined before 'background-color' */\n.mybox {\n  all:\
      \ unset;\n  background-color: blue;\n  color: red;\n  -moz-background-color:\
      \ 10px;\n  -ms-background-color: 10px;\n}\n```"
    Advice: "|-\n**例如**：\n```css\n.mybox {\n  background-color: blue;\n  color: red;\n\
      \  color: green;\n}\n\n.mybox {\n  background-color: blue;\n  *color: red;\n\
      \  width: 10px;\n}\n\n.mybox {\n  background-color: blue;\n  _color: red;\n\
      \  width: 10px;\n}\n\n.mybox {\n  all: unset;\n  -moz-background-color: 10px;\n\
      \  -ms-background-color: 10px;\n  background-color: blue;\n  color: red;\n}\n\
      ```"
