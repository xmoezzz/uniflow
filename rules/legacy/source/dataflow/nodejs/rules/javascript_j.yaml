      th:remove="tag"></p>'
    Description: '|-

      \<Object\>由IE3.0以上或者任何支持使用Flash ActiveX控件的浏览器使用。\<embed\>由反之火狐，谷歌，Safari或者支持使用与Netscape兼容的Flash
      Player插件版本的浏览器使用。

      所以当启用ActiveX的浏览器加载HTML页面时，它会读取\<object\>而忽略\<embed\>标记.当使用Flash插件的浏览器加载HTML页面时，它们会读取\<embed\>
      标记上设置的值并忽略\<object\>标记。

      **例如**：


      ```html

      <object classid="clsid:d27cdb6e-ae6d-11cf-96b8-444553540000" width="100" height="100">     <param
      name="movie" value="movie_name.swf" />

      </object>

      ```



      上面例子中object标签在ie浏览器中没有什么问题，但是如果在火狐、谷歌等浏览器会显示不出flash控件。'
    Advice: 建议在使用\<object\>或者\<embed\>而且项目本身需要兼容多种浏览器的时候一定要注意两者的使用关系，可以选择根据浏览器动态加载标签也可以选择\<object\>嵌入\<embed\>使用。
