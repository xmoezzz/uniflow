    Description: "|-\n在以下情况下会发生 Log Forging 的漏洞：\n1. 数据从一个不可信赖的数据源进入应用程序。\n2. 数据写入到应用程序或系统日志文件中。\n\
      \n为了便于以后的审阅、统计数据收集或调试，应用程序通常使用日志文件来储存事件或事务的历史记录。根据应用程序自身的特性，审阅日志文件可在必要时手动执行，也可以自动执行，即利用工具自动挑选日志中的重要事件或带有某种倾向性的信息。\n\
      如果攻击者可以向随后会被逐字记录到日志文件的应用程序提供数据，则可能会妨碍或误导日志文件的解读。最理想的情况是，攻击者可能通过向应用程序提供包括适当字符的输入，在日志文件中插入错误的条目。如果日志文件是自动处理的，那么攻击者就可以通过破坏文件格式或注入意外的字符，从而使文件无法使用。更阴险的攻击可能会导致日志文件中的统计信息发生偏差。通过伪造或其他方式，受到破坏的日志文件可用于掩护攻击者的跟踪轨迹，甚至还可以牵连第三方来执行恶意行为\
      \ [1]。最糟糕的情况是，攻击者可能向日志文件注入代码或者其他命令，利用日志处理实用程序中的漏洞 [2]。\n\n**例1**： 下列 Web 应用程序代码会尝试从一个请求对象中读取整数值。如果数值未被解析为整数，输入就会被记录到日志中，附带一条提示相关情况的错误消息。\n\
      ```javascript\nvar val = request.url.indexOf(\"value=\");\nif (!isNaN(val))){\n\
      \    console.log(\"ERROR: illegal values val = \" + val);\n}\n...\n}\n```\n\n\
      如果用户输入的是一个非数字那么日志会输出正常\n如果用户输出\"value \\n ERROR：network error\"，这样的话就会对排查问题造成很大的困扰而且，攻击者可以使用同样的机制插入任意日志条目。"
    Advice: 对于外部不可信的数据一定要验证之后再使用。
    Exploit: "|-\n漏洞代码：\n```js\nvar name = request.url.indexOf(\"name=\");\nif (name\
      \ != \"Alice\")){\n    console.log(\"Incorrect name: \" + val);\n}\n...\n```\n\
      以上代码用于校验用户名后的日志记录，当尝试使用Bob进行访问时：\nhttp://www.example.com/visit.php??name=Bob\n\
      日志中会正常记录如下日志：\nIncorrect name: Bob.\n\n但如果攻击者访问如下链接：\nhttp://www.example.com/visit.php??name=Bob.%0ASuccess%3A+Alice\n\
      \n攻击者利用换行符产生了一条登录成功的日志，日志中将出现以下内容：\nIncorrect name: Bob.\nSuccess: Alice.\n\n\
      从而造成日志伪造攻击。"
