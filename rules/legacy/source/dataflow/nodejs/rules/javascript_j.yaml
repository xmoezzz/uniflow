      th:remove="tag"></p>'
    Description: "|-\n传统的Ajax请求只能获取在同一个域名下面的资源，但是HTML5打破了这个限制，允许Ajax发起跨域的请求在HTML5中可以通过定义Access-Control-Allow-Origin的HTTP头来支持跨域访问，如果设置为*就以为这任何站点都可以向你的站点发送xhr请求并获得服务器的响应，这样很容易被恶意攻击。\n\
      \n**例1**：下面的例子把Access-Control-Allow-Origin设置成了*。\n```javascript\napp.all('/demo',\
      \ function(req, res, next) {\n    res.header(\"Access-Control-Allow-Origin\"\
      , \"*\");\n    ....\n});\n```\n\n**例2**：如果资源是HTML页面也可以如下设置。\n\n```html\n<meta\
      \ http-equiv=\"Access-Control-Allow-Origin\" content=\"*\">\n```"
    Advice: 不要将'*'作为Access-Control-Allow-Origin的值，而应该提供受信任的域名列表。
