    Description: "|-\n依靠HTML、XML或其他类型编码验证用户输入，可能会导致浏览器执行恶意代码。 使用特定的编码函数能避免一部分XSS攻击，但不能完全避免。根据数据出现的上下文，除HTML编码的基本字符\
      \ \\<、\\>、& 和 \" 以及XML编码的字符 \\<、\\>、&、\" 和 ' 之外，其他字符也可能具有特殊意义。依靠此类编码函数等同于用一个安全性较差的黑名单来防止XSS攻击，并且可能允许攻击者注入恶意代码，并在浏览器中加以执行。\n\
      \ **例如**：下面的JavaScript代码片段可从URL中读取msg信息，并将其显示给用户。\n\n```javascript\nvar url=document.URL;\n\
      document.write(escape(url.substring(url.indexOf(\"msg=\")+4,url.length));\n\
      ```\n\n该段脚本解析URL，读取msg参数的值，并将其写入页面。如果攻击者设计一个恶意的URL，并以JavaScript代码作为msg参数，虽然escape函数能过滤HTML编码的基本字符，但是如果msg参数是以UTF-7格式写入，特殊字符\
      \ \"&lt;\" 可能会显示为 \"+ADw-\"，并可能会绕过过滤，Web浏览器就会像显示HTTP响应那样执行该代码。"
    Advice: '|-

      为了避免XSS攻击，建议采用以下方式进行防御：

      1. 对用户的输入进行合理验证（如年龄只能是数字）。

      2. 根据数据将要置于HTML上下文中的不同位置（HTML标签、HTML属性、JavaScript脚本、CSS、URL），对所有不可信数据进行恰当的输出编码。

      3. 设置HttpOnly属性，避免攻击者利用跨站脚本漏洞进行Cookie劫持攻击。'
    Exploit: '|-

      漏洞代码：

      ```js

      var url=document.URL;

      document.write(escape(url.substring(url.indexOf("username=")+9,url.length));

      ```

      以上代码在浏览器中展示用户提交的用户名信息，以便用户更改用户名。其正常的使用方式是：

      http://www.example.com/welcome.php?username=alice


      当受害者访问攻击者提供的如下网址：

      http://www.example.com/welcome.php?username=%27+onclick%3D%27javascript%3Asend_cookie%28%29


      页面中将显示以下代码（其中send_cookie()代表发送cookie的具体代码）：

      Username: <input value= onclick=''javascript:send_cookie()''/>


      当用户点击输入框时，浏览器将执行插入的Javascript代码，导致用户的cookie被泄漏。'
