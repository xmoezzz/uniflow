    BugServerity: 5
    DynamicDescription: '|-

      <p th:if="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的+''`''+${funcName}+''`''+方法中会发生+${categoryName}+的风险。"
      th:remove="tag"></p>

      <p th:unless="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的第+''`''+${line}+''`''+行会发生+${categoryName}+的风险。"
      th:remove="tag"></p>'
    Description: "|-\nSQL注入是一种数据库攻击手段。攻击者通过向应用程序提交恶意代码来改变原SQL语句的含义，进而执行任意SQL命令，达到入侵数据库乃至操作系统的目的。\n\
      \n**例1**：下面代码片段中，动态构造并执行了一个SQL查询来认证用户。\n\n```javascript\nvar db = openDatabase('mydb',\
      \ '1.0', 'Test DB', 2 * 1024 * 1024);\nvar username = document.forms[0].username.value;\n\
      var pwd = document.forms[0].password.value;\nvar query = \"SELECT * FROM items\
      \ WHERE owner = \" + username + \" AND password = \" + pwd + \";\";\ndb.transaction(function\
      \ (tx) {\n  tx.executeSql(query);\n});\n```\n\n**例2**：下面是Node.js示例。\n\n```javascript\n\
      var mq = require(\"mysql\");\nvar mc = mq.createConnection({\n  user: \"root\"\
      ,\n  password: \"xxxxxx\"\n});\nmc.connect();\nvar username = request.params;\n\
      var pwd = request.url.indexOf(\"pwd=\");\nmc.query(\"SELECT * FROM items WHERE\
      \ owner = \" + username + \" AND password = \" + pwd + \";\", function(err,\
      \ rs, fields){\n  //处理数据\n});\n```\n如果攻击者能够替代username或pwd中的任意字符串，它们可以使用下面的关于username的字符串进行SQL注入。\n\
      \n```sq\nvaliduser' OR '1'='1\n```\n\n\n当其注入到命令时，命令就会变成：\n\n```sql\n SELECT\
      \ * FROM db_user WHERE username=’validuser' OR '1'='1' AND password=’’\n```\n\
      \n\n同样，攻击者可以为pwd提供如下字符串。\n\n```sql\n' OR '1'='1\n```\n\n当其注入到命令时，命令就会变成：\n\n\
      ```sql\nSELECT * FROM db_user WHERE username= AND password= OR '1'='1'\n```"
    Advice: "|-\n造成SQL注入攻击的根本原因在于攻击者可以改变SQL查询的上下文，使程序员原本要作为数据解析的数值，被篡改为命令了。防止SQL注入的方法如下：\n\
      1. 正确使用参数化API进行SQL查询。\n2. 如果构造SQL指令时需要动态加入约束条件，可以通过创建一份合法字符串列表，使其对应于可能要加入到SQL指令中的不同元素，来避免SQL注入攻击。\n\
      \n**例如**：在HTML5中，前面的例子可以改成使用参数化SQL指令（而不是拼接用户提供的字符串），如下所示：\n\n\n```javascript\n\
      ...\nvar db = openDatabase('mydb', '1.0', 'Test DB', 2 * 1024 * 1024);\nvar\
      \ username = document.forms[0].username.value;\nvar pwd = document.forms[0].password.value;\n\
      var query = \"SELECT * FROM items WHERE owner = ? AND pwd = ? ;\";\ndb.transaction(function\
      \ (tx) {\n    tx.executeSql(query,[username,pwd]);\n})\n...\n```"
    Exploit: "|-\n漏洞代码：\n```js\nvar db = openDatabase('mydb', '1.0', 'Test DB', 2\
      \ * 1024 * 1024);\nvar username = document.forms[0].username.value;\nvar password\
      \ = document.forms[0].password.value;\nvar query = \"SELECT * FROM users WHERE\
      \ username = \" + username + \" AND password = \" + password + \";\";\ndb.transaction(function\
      \ (tx) {\n  tx.executeSql(query);\n});\n```\n以上代码用于校验用户输入的用户名密码是否正确，其正常的使用方式是：\n\
      http://www.example.com/login.php?username=alice&password=123456\n\n当攻击者访问如下网址：\n\
      http://www.example.com/login.php?username=admin&password=%27+or+%27%27%3D%27\n\
      \n传入的参数将服务器执行的SQL指令被修改为：\nSELECT * FROM users WHERE username = 'admin' AND password\
      \ =  or  = \n\n这样，攻击者绕过了验证机制，不需要知道用户名密码就能登录系统。"
