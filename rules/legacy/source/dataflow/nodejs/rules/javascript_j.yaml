      \          /*  Value应该与property和冒号在同一行 */\n    red;\n}\n\n.mybox {\n  --abc:\
      \          /*  值应该与变量和冒号在同一行 */\n    red;\n}\n\n.mybox {\n  color : red;   \
      \ /* 属性和冒号之间不应该有任何空格 */\n}\n\n.mybox {\n  --abc : red;    /*  在变量和冒号之间不应该有任何空格\
      \ */\n}\n\n.mybox {\n  color:    red;  /*  冒号和值之间应该有一个空格 */\n}\n\n.mybox {\n\
      \  color:red;      /*  冒号和值之间应该有一个空格 */\n}\n[begin-scss]\n.mybox {\n  $abc:\
      \          /*  值应该与变量和冒号在同一行 */\n    red;\n}\n\n.mybox {\n  $abc : red;    /*\
      \  在变量和冒号之间不应该有任何空格 */\n}[end-scss]\n[begin-less]\n.mybox {\n  @abc:       \
      \   /*  值应该与变量和冒号在同一行 */\n    red;\n}\n\n.mybox {\n  @abc : red;    /* 在变量和冒号之间不应该有任何空格\
      \ */\n}[end-less]\n```\n**例如**：important\n```css\n.mybox {\n  color: red ! important;\
      \ /* 不应该有任何空白!和important。 */\n}\n```\n**例如**：Comma/Semicolon-separated list\n\
      ```css\n.mybox {\n  background: linear-gradient(red , yellow, blue); /*  “红色”后面的空白应该被删除\
      \ */\n}\n\n.mybox {\n  background: linear-gradient(red\n                   \
      \           ,              /*  逗号应该移到前面一行 */\n                             \
      \ yellow,\n                              blue);\n}\n\n.foo,.bar { /* 逗号后面应该加一个空格\
      \ */\n  ...\n}\n```"
    Advice: "|-\n1、左大括号应该放在块声明的同一行，右大括号应该放在它自己的一行\n**例如**：\n```css\n.mybox {\n  color:\
      \ red;\n}\n.mybox {\n  color: blue;\n}\n```\n包含单个声明的规则集可以内联。下面这段代码是有效的:\n```css\n\
      .mybox { color: red; }\n```\n\n2、属性、冒号和值应该放在同一行，冒号和属性之间不能有空格，冒号和值之间只有一个空格.\n\
      ```css\n.mybox {\n  color: red;\n}\n\n.mybox {\n  --abc: red;\n}\n```\n3、Comma/Semicolon-separated\
      \ 列表\n分隔符和它的上一个元素应该放在同一行。分隔符和它的上一个元素之间不应该有空格。如果分隔符和它的下一个元素在同一行，它们之间应该有一个空格\n\
      ```css\n.mybox {\n  background: linear-gradient(red, yellow, blue);\n}\n\n.mybox\
      \ {\n  background: linear-gradient(red,\n                              yellow,\n\
      \                              blue);\n}\n\n.foo, .bar {\n  ...\n}\n```"
