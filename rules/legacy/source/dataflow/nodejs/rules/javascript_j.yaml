    Description: "|-\n模板引擎用于使用动态数据呈现内容。此上下文数据通常由用户控制并通过模板设置格式，以生成 Web 页面、电子邮件等。模板引擎可通过条件、循环等代码构造处理上下文数据，从而允许在模板中使用功能强大的语言表达式来呈现动态内容。如果攻击者能够控制要呈现的模板，他们将能够通过注入表达式来公开上下文数据并在浏览器中运行恶意代码。\n\
      \n**例如**：以下示例显示了如何通过 URL 检索模板并使用模板在 AngularJS 中呈现信息。\n```javascript\nfunction\
      \ MyController(function($stateParams, $interpolate){\n    var ctx = { foo :\
      \ 'bar' };\n    var interpolated = $interpolate($stateParams.expression);\n\
      \    this.rendered = interpolated(ctx);\n}\n```\n\n在这种情况下，$stateParams.expression将采用可能受用户控制的数据，并将其作为用于指定上下文的模板进行计算。\n\
      这又可能会允许恶意用户在浏览器中运行他们想要的代码、检索关于代码运行的上下文的信息、查找有关如何创建应用程序的额外信息，或将此代码转换为 full blown\
      \ XSS 攻击。"
    Advice: '|-

      尽可能不要让用户提供模板。如果需要由用户提供模板，请谨慎执行输入验证，以防止在模板中注入恶意代码。

      不要依赖在 AngularJS 1 中实施的沙盒来阻止漏洞。已经证明沙盒无法完全有效地在所有版本的 AngularJS 中防止 XSS 和应用程序控制，因为这并不是预期的安全功能，而且已从版本
      1.6.[1] 中移除。'
