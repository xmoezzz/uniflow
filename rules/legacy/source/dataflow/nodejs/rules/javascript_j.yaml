    Description: "|-\nHTML5中新增简单的表单输入验证功能，它会根据输入标签的属性进行简单的验证。\n但是，当在表单标签上添加novalidate属性和提交输入标签上的formnovalidate属性时，这个验证就会被禁用。\n\
      **例如**：\n\n```html\n<form name=\"form01\" action=\"\" method=\"post\" enctype=\"\
      \" novalidate = \"novalidate\">\n    E-mail01: <input type=\"email\" name=\"\
      email\">\n    <input type=\"submit\" name=\"\" value=\"提交\">\n</form>\n```"
    Advice: "|-\n虽然大多数的验证都是在服务端进行，但是能在客户端验证也是给系统增加一层保护，所以，建议避免使用novalidate和formnovalidate属性。\n\
      **例如**：\n\n```html\n<form name=\"form01\" action=\"\" method=\"post\" enctype=\"\
      \">\n    E-mail01: <input type=\"email\" name=\"email\">\n    <input type=\"\
      submit\" name=\"\" value=\"提交\">\n</form>\n```"
