      th:remove="tag"></p>

      <p th:unless="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的第+''`''+${line}+''`''+行将cookie的路径范围设置过大。"
      th:remove="tag"></p>'
    Description: '|-

      开发人员通常将 cookie 设置为可从根上下文路径（"/"）访问它。这样做会使 cookie 暴露在域中的所有 Web 应用程序下。由于 cookie
      通常包含敏感信息（如会话标识符），因此，在应用程序之间共享 cookie 可能在一个应用程序中导致漏洞，从而危及其他应用程序安全。

      **例如**：假设您有一个论坛应用程序并将其部署在 http://webpage.com/user 上，当用户登录该论坛时，该应用程序将使用路径“/”设置会话
      ID cookie。


      ```javascript

      var  options = {domain: ''secure.com'', path: ''/'',secure:true,HttpOnly : true};

      res.cookie(''cookie'', info, options);

      ```


      假设攻击者在`http://webpage.com/user`上创建了另一个应用程序，并在论坛上发布了该站点的链接。当论坛用户点击该链接时，他的浏览器会将`/MyForum`设置的`cookie`发送到在`/user`上运行的应用程序。攻击者就这样窃取了会话`ID`，就能够危及浏用户的帐户安全。'
    Advice: 在发送cookie的时候应该避免路径范围设置的很大,尽量设置具体一些。
