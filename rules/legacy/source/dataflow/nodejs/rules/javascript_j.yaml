    Description: '|-

      不可信赖数据被传递至应用程序并作为正则表达式使用。可能导致线程过度使用 CPU 资源，从而导致拒绝服务攻击。

      **例如**：


      ```

      (e+)+

      ([a-zA-Z]+)*

      ```

      已知的正则表达式实现方法均无法避免这种漏洞。所有平台和语言都容易受到这种攻击。'
    Advice: 请不要将不可信赖数据作为正则表达式使用。
