    Description: "|-\n使用HTTP GET的方式提交敏感信息如密码，可能造成密码被显示，记录等。\n**例如**：以下示例使用HTTP GET的方式提交表单中的密码。\n\
      \n```html\n<form method=\"get\">\n    密码: <input type=\"password\" >\n    <input\
      \ type=\"submit\" name=\"\" value=\"提交\" >\n</form>\n```"
    Advice: "|-\n避免使用HTTP GET的方式提交敏感数据，应使用HTTP POST传输敏感数据。\n\n**例1**：以下示例通过HTTP POST的方式提交用户的密码。\n\
      \n```html\n<form method=\"post\">\n    密码: <input type=\"password\" >\n    <input\
      \ type=\"submit\" name=\"\" value=\"提交\" >\n</form>\n```\nHTML5新增了一项功能，可以将formmethod属性作为\
      \ submit 和 image 输入标签一部分的功能，并且该属性值会覆盖相应form标签中 method 属性值。\n\n**例2**：以下示例用户使用HTTP\
      \ POST的方式提交密码，是由submit输入标签 formmethod 的属性值所指定。\n\n```html\n<form method=\"get\"\
      >\n    密码: <input type=\"password\" >\n    <input type=\"submit\" name=\"\"\
      \ value=\"提交\"  formmethod=\"post\">\n</form>\n```\n注意，如果将formmethod的值设为get，form的method的无论为什么，都会通过HTTP\
      \ GET的方式提交表单。"
