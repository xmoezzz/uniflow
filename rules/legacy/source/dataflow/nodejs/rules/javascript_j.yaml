    BugServerity: 5
    DynamicDescription: '|-

      <p th:if="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的+''`''+${funcName}+''`''+方法中会发生+${categoryName}+的风险。"
      th:remove="tag"></p>

      <p th:unless="${funcNameisEmpty}" th:text="在+''`''+${fileName}+''`''+的第+''`''+${line}+''`''+行会发生+${categoryName}+的风险。"
      th:remove="tag"></p>'
    Description: '|-

      程序运行时动态解析源代码指令将易于受到攻击。


      **例如**：下面代码片段的作用是计算用户输入的表达式的值。


      ```javascript

      ...

      expression = form.expInput.value;

      result = eval(expression);

      ...

      ```


      如果expression参数是合法的，程序将会正常运行。


      **例如**：当该值为"1 + 1 * 2" 时，result变量被赋予的值将为 3。

      如果攻击者提供一个恶意的输入，程序在没有进行合理校验的情况，将可以执行任意代码。'
    Advice: "|-\n在任何时候，都应尽可能地避免动态的解析源代码。如果程序的功能要求对代码进行动态解析，应用程序不应该直接执行和解析未验证的用户输入。建议创建一份合法操作和数据对象列表，用户可以指定其中的内容，并且只能从中进行选择。\n\
      **例如**：计算表达式的程序可以改为。\n\n```javascript\n...\nexpression = form.expInput.value;\n\
      if(/^[\\d\\-\\+]*$/.test(expression)){\n    result = eval(expression);\n}\n\
      ...\n```"
    Exploit: '|-

      漏洞代码：

      ```js

      var expression = form.expInput.value;

      var result = eval(expression);

      ```

      以上代码模拟一个简易计算器，其正常的使用方式是：

      http://www.example.com/calc.php?expr=1%2B2


      当攻击者访问如下网址，服务器会执行攻击者输入的phpinfo函数，导致服务器信息被泄漏：

      http://www.example.com/calc.php?expr=phpinfo%28%29'
