      th:remove="tag"></p>'
    Description: '|-

      如今的Web浏览器是支持每个cookie的secure标记的。如果设置了改标记那么只能通过HTTPS协议发送cookie.

      如果通过没有安全标记的cookie发送消息会受到网络截取攻击从而获取cookie发送的消息内容，如果cookie中存在含有个人隐私的数据就更应该注意。

      **例1**：

      ```javascript

      var data = {domain: ''secure.com'', path: ''/userInfo'', httpOnly: true};

      res.cookie(''cookie'', info, data);

      ```

      上面例子就是不带有安全标记发送的cookie。


      **例2**：以下是使用AngularJS的ngCookies组件未经过SSL加密的示例。

      ```javascript

      $cookiesProvider.defaults = { secure: false }

      ```'
    Advice: 在发送cookie的时候应该用HTTPS协议并且设置secure标记为true。
