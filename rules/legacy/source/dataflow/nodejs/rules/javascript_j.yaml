      反射型文件下载（RFD）是一种攻击技术，通过从受信任的域（例如Google.com和Bing.com）虚拟下载文件，攻击者可以使攻击者获得对受害者计算机的完全访问权限。

      **例如**：以下示例直接获取网络上的资源。

      ```javascript

      jQuery.getJSON("http://example.com", function(a) {

      });

      ```'
    Advice: '|-

      可以使用以下方式防止反射型文件的下载。

      1. 使用`Content-Disposition`强行限制文件名；

      2. 使用 CSRF 令牌；

      3. 为所有API实现安全的请求头信息。'
