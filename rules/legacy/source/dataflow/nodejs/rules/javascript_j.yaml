    Description: "|-\n所有利用 HTTP或FTP 的通信均是不安全的，因为他们都是不进行身份验证的。\n特别是在频繁连接外部无线网络的时候很容易被黑客攻击。\n\
      **例1**：以下示例通过 HTTP 协议（而不是 HTTPS）读取数据。\n\n```javascript\nvar http = require('http');\n\
      ...\nhttp.request(options, function(res){\n    ...\n});\n...\n```\n\n**例2**：以下示例是在html中通过HTTP协议读取数据。\n\
      ```html\n<form action='http://hostname.com/j_security_check' method='post'>\n\
      \  密码：<input type='password' name='password'>\n</from>\n```"
    Advice: 程序应尽可能基于HTTPS等安全协议与服务器进行通信，尤其是进行敏感信息的传递。
