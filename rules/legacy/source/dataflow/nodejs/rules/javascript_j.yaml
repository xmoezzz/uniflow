    Description: "|-\nProcess control 是攻击者通过在库中执行代码，应用程序授予攻击者在一般情况下无法获得的权限或能力。\n**例如**：以下代码使用\
      \ Express 当前未记录的\"功能\"动态加载库文件。然后，Node.js 将继续在其正则库加载路径中搜索包含此库的文件或目录。\n```javascript\n\
      var express = require('express');\nvar app = express();\napp.get('/', function(req,\
      \ res, next) {\n    res.render('page/' + req.params[0]);\n});\n```\n在上面例子中,因为程序不会验证从\
      \ URL 参数接收的信息，所以攻击者可能会欺骗应用程序，去执行恶意代码并取得对系统的控制。"
