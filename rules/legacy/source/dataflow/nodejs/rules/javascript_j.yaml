      th:remove="tag"></p>'
    Description: '|-

      代码中设置了Content-Length头，这违反了XHR的API说明。在XHR的API描述中，已标注Content-Length不能由开发者指定，XHR将自动添加这个头以防止伪造它。[参考](https://fetch.spec.whatwg.org/#forbidden-header-name)


      **例如**：以下代码将Content-Length的值设置为负数。


      ```javascript

      var req = new XMLHttpRequest();

      req.setRequestHeader("Content-Length", "-1000");

      ```'
    Advice: 不设置Content-Length头。此外还有Date、Referer、User-Agent也不允许开发者自己指定，[参考](https://fetch.spec.whatwg.org/#forbidden-header-name)。
