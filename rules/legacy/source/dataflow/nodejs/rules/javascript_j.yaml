    Description: "|-\n程序在没有任何访问控制的情况下使用 Azure Queue/Blob，会很容易发生攻击值在没有权限的情况下控制queue/Blob进行增、删、改、查等操作。\n\
      **例如**：以下代码可删除给定 Queue 及其消息。\n```javascript\n...\nvar azure_storage = require('azure-storage');\n\
      var insecureQueueName = document.URL.indexOf('queueName=');\nvar service = azure_storage.createQueueService();\n\
      ...\nservice.deleteQueue(insecureQueueName, option, function(error, response){\n\
      \    if(!error){\n        //攻击者可以控制queue的删除\n    }\n});\n```\n\n\n上例中的代码可删除属于当前用户/程序的给定\
      \ Queue/Blob 容器及其消息/内容，即使 Queue/Blob 并不属于当前用户/程序。"
    Advice: "|-\n任何情况下都不允许用户在没有取得相应权限的情况下获取或修改Queue/Blob 及其消息/内容。在进行操作的时候应该进行权限的检查。\n\
      **例如**：\n\n```javascript\n...\nvar azure_storage = require('azure-storage');\n\
      var insecureQueueName = document.URL.indexOf('queueName=');\nvar service = azure_storage.createQueueService();\n\
      ...\nvar user = getCurrentUser();\nif(user.isNotAuth()){\n    return;\n}\nservice.deleteQueue(insecureQueueName,\
      \ option, function(error, response){\n    if(!error){\n        ....\n    }\n\
      });\n...\n```"
