      th:remove="tag"></p>'
    Description: "|-\n目的是消除不需要的盒子模型尺寸问题\n“box模型”指的是在视觉上构成一个元素的一系列盒子。这从内容开始，也就是最里面的盒子。内容由填充包围，填充又由边框包围。然而，这些测量的相互作用的方式有点令人困惑。考虑以下:\n\
      .mybox {\n  border: 1px solid black;\n  padding: 5px;\n  width: 100px;\n}\n\
      新开发人员可能会假设mybox类元素的宽度为100像素。事实上，宽度是112像素，因为宽度指的是内容框，填充和边框是在内容框上添加的。当开发人员包含这种属性组合时，通常会出错，因为他们期望的是不同的行为。\n\
      通过使用box-sizing属性并将其设置为border-box，你可以强制大多数浏览器将宽度和高度作为元素的完整大小，如下所示:\n.mybox {\n\
      \  box-sizing: border-box;\n  border: 1px solid black;\n  padding: 5px;\n  width:\
      \ 100px;\n}\n现在，带有mybox类的元素的实际宽度将为100像素，填充和边框将存在于该区域内，为内容留下88像素，而不是100像素。该规则旨在消除不必要的框模型大小问题。\n\
      因此，当该规则发现:width被用于border、border-left、border-right、border-width、border-left-width、border-right-width、padding-left或padding-right\
