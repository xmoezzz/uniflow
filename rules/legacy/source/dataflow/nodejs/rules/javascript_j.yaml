    Description: "|-\n即使shorthand属性使用起来很方便，在使用它们时也要记住一些边缘情况:\n未指定的值被设置为其初始值。这听起来像轶事，但它实际上意味着它覆盖了以前设置的值。因此:\n\
      \  background-color: red;\n  background: url(images/bg.gif) no-repeat top right;\n\
      不会将背景的颜色设置为红色，而是设置为background-color的默认透明，因为第二个规则优先。\n速记属性尽量不强制它们所替换的属性的值按照特定的顺序排列。当这些属性使用不同类型的值时，这种方法工作得很好，因为顺序不重要。但是当几个属性可以有相同的值时，这就不那么容易工作了，它可能会令人困惑或难以理解，例如:\
      \  margin: 10px 5px 8px 5px;\n因此，速记属性应该谨慎使用。每当声明一个简写属性并且它的值包含多个元素时，该规则就会引发一个问题。\n\
      **例如**：\n```css\n.mybox {\n  margin: 10px 5px 15px; /* 不符合的 */\n  border-color:\
      \ green; /* 符合的: value is a single element */\n}\n```"
    Advice: "|-\n**例如**：\n```css\n.mybox {\n  margin-top: 10px;\n  margin-right: 5px;\n\
      \  margin-bottom: 15px;\n  margin-left: 5px;\n  border-color: green;\n}\n```"
