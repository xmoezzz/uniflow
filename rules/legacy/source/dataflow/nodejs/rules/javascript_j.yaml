    Description: "|-\n**例如**：自定义控件：\n```javascript\nsap.ui.define([\n  'sap/ui/core/Control'\n\
      ], function (Control) {\n  return Control.extend('CustomControl', {\n      metadata:\
      \ {\n          properties: {\n              foo: { type: 'string', defaultValue:\
      \  }\n          }\n      },\n      renderer: {\n          render: function (oRm,\
      \ oControl) {\n              oRm.write('&lt;div&gt;' + oControl.getId() + ':'\
      \ + oControl.getFoo() + '&lt;/div&gt;')\n          }\n      },\n      init:\
      \ function () { }\n  })\n})\n```\n可以将用户控制的数据从应用程序的另一部分传递给foo属性，这些数据将直接呈现给 DOM。\n\
      如果传递给属性foo的信息仅包含标准的字母数字文本，则此示例中的代码将正确运行。如果foo中的某个值包含元字符或源代码，当呈现此控件时，代码将被添加到\
      \ DOM 以供浏览器执行。"
    Advice: "|-\n针对 XSS 的解决方法是，确保在适当位置进行验证，并检验其属性是否正确。\n对于自定义的 SAPUI5 控件，必须将属性中的所有信息视为不受信任，并使用writeEscaped或通过单独验证进行转义。\n\
      \n**例如**：该自定义控件将创建与“示例 1”<b></b>相同的输出，但对潜在的恶意内容进行了转义：\n```javascript\nsap.ui.define([\n\
      \  'sap/ui/core/Control'\n], function (Control) {\n  return Control.extend('SafeCustomControl',\
      \ {\n      metadata: {\n          properties: {\n              foo: { type:\
      \ 'string', defaultValue:  }\n          }\n      },\n      renderer: {\n   \
      \       render: function (oRm, oControl) {\n              oRm.write('&lt;div&gt;')\n\
      \              oRm.writeEscaped(oControl.getId())\n              oRm.write(':')\n\
      \              oRm.writeEscaped(oControl.getFoo())\n              oRm.write('&lt;/div&gt;')\n\
      \          }\n      },\n      init: function () { }\n  })\n})\n```"
