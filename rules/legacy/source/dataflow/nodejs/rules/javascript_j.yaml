    Description: "|-\n在web开发的早期，将相同的CSS属性包含两次肯定是错误的，特别是如果有两个不同的值。例如:\n.mybox {\n \
      \ width: 100px;\n  width: 120px;\n}\n任何查看此代码的人都会认为这显然是一个错误。然而，最近，包含重复属性被用作处理浏览器对CSS属性支持的不同级别的一种方法。例如，一些浏览器支持RGBA颜色，而另一些则不支持，所以很常见的模式如下:\n\
      .mybox {\n  background: #fff;\n  background: rgba(255, 255, 255, 0.5);\n}\n\
      这显然是故意的。开发人员希望在可用的时候使用RGBA，但在不可用的时候希望回到常规颜色。当以下情况出现时，该规则会引发一个问题:\n属性包含两次并包含相同的值。\n\
      属性包含两次，并且至少由一个其他属性分隔。\n**例如**：\n```css\n.mybox {\n  border: 1px solid black;\n\
      \  border: 1px solid black;\n}\n\n/* 不符合的: duplicated 'border' properties separated\
      \ by another property */\n.mybox {\n  border: 1px solid black;\n  color: green;\n\
      \  border: 1px solid red;\n}\n```"
