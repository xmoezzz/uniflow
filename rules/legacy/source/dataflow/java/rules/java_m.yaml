    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "程序中使用==或!=比较两个字符串是否相等，其实比较的是两个对象在内存中的地址值，而不是字符串的值。  \n  \n**例如**：下列代码中将`request`中获取的参数值与`\"admin\"`用`==`做比较，`dosomething()`方法将永远不会被执行。\n```java\n...  \nString username = (String)request.getAttribute(\"usernamae\");  \nif(username == \"admin\"){  \n    dosomething();  \n}  \n...\n```"
    Description_En: ''
    Advice: "程序对字符串进行比较，应采用`equals()`方法，而不是`==`或`!=`方法。  \n  \n**例如**：下列代码中使用`equals()`方法进行字符串的对比。  \n```java\n...  \nString username = (String)request.getAttribute(\"usernamae\");  \nif(username.equals(\"admin\")){  \n    dosomething();  \n}  \n...\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 597:Use of Wrong Operator in String Comparison
      - type: SJ/T 11683-2017
        value: 6.6.11 使用"=="运算符比较字符串
