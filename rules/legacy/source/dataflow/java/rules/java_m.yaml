        value: 【强制】在JavaEE程序中不要在Session中存储非序列化对象
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "把一个不可序列化的对象作为HttpSession属性来储存会破坏应用程序的可靠性。一个JAVA EE应用程序可以利用多个JVM，以提高应用程序的可靠性和性能。为了显示给最终用户一个单个的应用程序，JAVA EE容器可能在多个JVM之间复制HttpSession对象，所以当一个JVM不可用时，另一个JVM可以在不中断应用程序流程的情况下接替步骤的执行。为了使Session复制能够正常运行，作为应用程序属性存储在Session中的数值必须实现Serializable接口。   \n  \n**例如**：下面代码片段中，将一个DataGlob对象添加到HttpSession中，但由于它不是可序列化的，因此该Session就再也不能被复制了。  \n```java\npublic class DataGlob {  \n    String globName;  \n    String globValue;  \n    public void addToSession(HttpSession session) {  \n        session.setAttribute(\"glob\", this);  \n    }  \n}\n```"
    Description_En: ''
    Advice: "很多情况下，修复这一问题的最简单方法是让这个违反规则的对象实现Serializable接口。但对于复杂的对象来说，存储在Session中的对象，其传递闭包必须是可序列化的。如果对象A引用对象B，且对象A存储在Session中，那么A和B都必须实现Serializable接口。  \n  \n**例如**：下面代码片段中，DataGlob实现了Serializable接口。  \n```java\npublic class DataGlob implements Serializable{  \n    private static final long serialVersionUID = 4689763391876440157L;  \n    String globName;  \n    String globValue;  \n    public void addToSession(HttpSession session) {  \n        session.setAttribute(\"glob\", this);  \n    }  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: '579:J2EE Bad Practices: Non-serializable Object Stored in Session'
      - type: CERT
        value: MSC08-J:Do not store nonserializable objects as attributes in an HTTP session
      - type: OWASP TOP 10
        value: 2010:A3 Broken Authentication and Session Management
      - type: OWASP TOP 10
        value: 2007:A7 Broken Authentication and Session Management
      - type: OWASP TOP 10
        value: 2004:A3 Broken Authentication and Session Management
    Obsolete: not
    Default: yes
    WhiteList: not
    Security: yes
    ENClassChin: ''
    ENSubClassChin: J2EE Bad Practices
