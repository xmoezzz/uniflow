    Description: "不应为`Random.setSeed`设置特定值作为参数。如果Random对象使用特定值作为种子，则`Random.nextInt()`以及类似方法返回的值是可以预测的。  \n  \n**例如**：下面代码可以通过Random对象`a`来预测Random对象`b`生成的值。  \n```java\nRandom a = new Random();  \na.setSeed(111111);  \nint i = a.nextInt();  \ndouble x = a.nextDouble()  \nRandom b = new Random();  \nb.setSeed(111111);  \nint j = b.nextInt();  \ndouble y = b.nextDouble()\n```  \n在此例中，Random对象`a`和`b`设置了相同的种子，`i`和`j`以及`x`和`y`的值都是相等的。"
    Description_En: ''
    Advice: "不应为`Random.setSeed`设置特定值作为参数。  \n  \n**例如**：下面代码不为`Random.setSeed`设置特定值。  \n```java\nRandom a = new Random();  \nint i = a.nextInt();  \ndouble x = a.nextDouble();  \n...\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 336:Same Seed in Pseudo-Random Number Generator (PRNG)
      - type: CWE
        value: 330:Use of Insufficiently Random Values
