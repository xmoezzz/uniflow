    Description: "当使用`“.”`或者`“|”`作为正则表达式进行匹配时，会得到不符合预期的结果。  \n  \n**例如**：下列代码中，使用`“.”`或者`“|”`作为正则表达式进行匹配。  \n```java\npublic static void main(String[] args) {  \n\tString string = \"hello. hi\";  \n\tString[] split = string.split(\".\");  //返回结果为空数组  \n\tString replaceAll = string.replaceAll(\".\", \"a\");   //返回为aaaaaaaaa  \n\tString abcd = \"ab|cd\".replaceAll(\"|\", \"/\");   //返回为/a/b/|/c/d/  \n\tString[] abcds= \"ab|cd\".split(\"|\");  //返回为[, a, b, |, c, d]  \n}\n```"
    Description_En: ''
    Advice: "明确程序逻辑，判断是否使用`“.”`或者`“|”`作为正则表达式。  \n  \n**例如**：下列代码中,使用转义符对`“.”`或者`“|”`进行转义。  \n```java\npublic static void main(String[] args) {  \n\tString string = \"hello. hi\";  \n\tString[] split = string.split(\"\\\\.\");  //返回结果为[hello,  hi]  \n\tString replaceAll = string.replaceAll(\"\\\\.\", \"a\");   //返回为helloa hi  \n\tString abcd = \"ab|cd\".replaceAll(\"\\\\|\", \"/\");   //返回为ab/cd  \n\tString[] abcds= \"ab|cd\".split(\"\\\\|\");  //返回为[ab, cd]  \n}\n```"
    Advice_En: ''
