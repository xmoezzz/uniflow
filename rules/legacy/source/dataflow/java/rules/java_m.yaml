        value: 【强制】不要使用==或!=比较基本数据类型的包装类
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "不能直接使用`==`或`!=`操作符来比较的两个基本数据类型的包装类型的值，因为这些操作符比较的是对象的引用而不是对象的值。  \n不过由于Java的缓存机制，所以如果基本类型的包装类是一个整数且在-128和127之间，或是布尔类型true或false，或者是'\\u0000'和'\\u007f'之间的字符文本，可以使用`==`或`!=`进行比较。也就是说，如果使用了基本类型的包装类型（除去Boolean或Byte），则会缓存或记住一个值区间。对于值区间内的值，使用`==`或`!=`会返回正确的值，而对于值区间外的值，将返回对象地址的比较结果。  \n**例如**：在这个不符合规范的代码示例中，使用`==`操作符来比较两个Integer对象的值。然而，这个`==`操作比较的是对象的引用，而不是对象的值。  \n```java\npublic class Wrapper {  \n    public static void main(String[] args){  \n        Integer i1 = 100;  \n        Integer i2 = 100;  \n        Integer i3 = 1000;  \n        Integer i4 = 1000;  \n        System.out.println(i1 == i2);  \n        System.out.println(i1 != i2);  \n        System.out.println(i3 == i4);  \n        System.out.println(i3 != i4);  \n    }  \n}\n```   \nInteger类只能保证缓存介入-128~127的整型数值，当使用相等操作符的时候，这会导致在这个范围之外的等价数值的比较是不相等的。比如，在那些不缓存任何值的JVM虚拟机中，运行程序会产生以下结果：  \ntrue  \nfalse  \nfalse  \ntrue"
    Description_En: ''
    Advice: "不能直接使用==或!=操作符来比较的两个基本数据类型的包装类的值，因为这些操作符比较的是对象的引用而不是对象的值。  \n符合规范的方案使用`equals()`而不是`==`操作符来比较两个对象的值。这个程序在所有的平台运行时都会打印true、false、true、false的结果，这符合预期。  \n**例如**：以下代码使用`equals()`方法比较两个Integer对象的值。  \n```java\npublic class Wrapper {  \n    public static void main(String[] args) {  \n        Integer i1 = 100;  \n        Integer i2 = 100;  \n        Integer i3 = 1000;  \n        Integer i4 = 1000;  \n        System.out.println(i1.equals(i2));  \n        System.out.println(!i1.equals(i2));  \n        System.out.println(i3.equals(i4));  \n        System.out.println(!i3.equals(i4));  \n    }  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 754:Improper Check for Unusual or Exceptional Conditions
      - type: CWE
        value: 398:Indicator of Poor Code Quality
      - type: CERT
        value: EXP03-J:Do not use the equality operators when comparing values of boxed primitives
