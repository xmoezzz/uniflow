        value: 【推荐】不要在循环中拼接字符串
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "字符串对象是不可改变的，字符串对象的拼接和修改，最后都会创建一个新的字符串对象。而在循环中拼接字符串将会产生很多的对象，浪费系统运行时间和空间。  \n  \n**例如**：在下面代码片段中，在循环中拼接字符串。  \n```java\nString string = \"\"  \nfor (int i < 0;i < 10;i++) {  \n    string = string + i;  \n}  \n...\n```  \n循环中将产生10个StringBuilder对象，每次都会调用两次`append`方法分别将`string`和`i`的值追加至StringBuilder对象中，最后调用`toStirng`方法将StringBuilder对象内容转化为字符串并赋值给`string`变量。"
    Description_En: ''
    Advice: "在循环语句结构中，需要保证线程安全可以使用StringBuffer代替String进行拼接，不需要时可以使用StringBuilder代替String进行拼接。  \n  \n**例如**：在下面代码片段中，在循环中使用StringBuilder拼接字符串。  \n```java\nStringBuilder stringBuilder = new StringBuilder();  \nfor (int i < 0;i < 10;i++) {  \n    stringBuilder.append(i);  \n}  \nString string = stringBuilder.toString();  \n...\n```"
    Advice_En: ''
    References:
      Reference:
      - type: SJ/T 11683-2017
        value: 6.6.16 在循环体中使用"+"或"+="运算符拼接字符串
