    Description: "程序员可以假设某些事件或条件永远不会发生或者不需要担心，比如内存条件低，由于限制性权限而无法访问资源，某个函数调用永远不会失败，或者行为不当的客户端或组件。但是，攻击者可能会故意触发这些异常情况，从而违反了程序员的假设，可能会引入不稳定，不正确的行为或漏洞。或者程序调用函数来删除权限但不检查返回代码以确保成功删除权限，则程序将继续以更高权限运行。  \n  \n**例1**：在下面的代码片段中，程序在替换完字符串之后没有保存返回值  \n```java\n...  \nString name = request.getParameter(\"name\");  \nname.replaceAll(\"-\",\"\");  \n...\n```  \n**例2**：在下面的代码片段中，程序没有对`read()`返回值做判断  \n```java\n...  \nint bytesToRead = 1024;  \nbyte[] byteArray = new byte[bytesToRead];  \nstreamFileInput = new FileInputStream(\"C:\\\\file.txt\");  \nstreamFileInput.read(byteArray);  \n...\n```"
    Description_En: ''
    Advice: "程序应检查方法的返回值，确保方法返回的是期望的数据，再进行下一步操作。  \n  \n**例1**：在下面的代码片段中，程序没有对`read()`返回值做判断  \n```java\n...  \nString name = request.getParameter(\"name\");  \nname = name.replaceAll(\"-\",\"\");  \n...\n```  \n**例2**：在下面的代码片段中，程序没有对`read()`返回值做判断  \n```java\n...  \nint bytesToRead = 1024;  \nbyte[] byteArray = new byte[bytesToRead];  \nstreamFileInput = new FileInputStream(\"C:\\\\file.txt\");  \nint i = -1;  \nwhile((i = streamFileInput.read(byteArray)) !=-1){  \n\t...  \n}  \n...\n```"
    Advice_En: ''
    References:
