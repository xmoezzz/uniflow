        value: 【强制】不要使用非静态内部类实现序列化接口
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "非静态内部类（包括普通内部类、Local内部类和匿名内部类）的实例持有一个外部类实例的隐式引用。非静态内部类实现序列化接口，当其被序列化时会出现运行时异常或泄露外部类中的信息。  \n下面代码示例中，内部类间接实现序列化接口  \n```java\npublic class SuperSer implements Serializable{  \n    //...  \n}  \npublic class OuterSer{  \n    private int rank;  \n    class InnerSer extends SuperSer{  \n        protected String name;  \n    }  \n}\n```     \n**例1**：下面代码示例中，内部类实现或间接实现序列化接口，外部类没有实现序列化，当内部类被序列化时，程序会报出NotSerializableException  \n```java\npublic class OuterSer{  \n    private int rank;  \n    class InnerSer implements Serializable{  \n        protected String name;  \n    }  \n}\n```   \n**例2**：下面代码示例中，内部类和外部类实现或间接实现序列化接口，当内部类被序列化时，外部类的字段也会被序列化。  \n```java\npublic class OuterSer implements Serializable {  \n    private int rank;  \n    class InnerSer implements Serializable{  \n        protected String name;  \n    }  \n}\n```"
    Description_En: ''
    Advice: "内部类不要实现或间接实现Serializable接口，或将内部类声明为静态的。  \n  \n**例1**：下面代码示例中，内部类没有实现序列化接口。  \n```java\npublic class OuterSer implements Serializable {  \n    private int rank;  \n    class InnerSer{  \n        protected String name;  \n    }  \n}\n```  \n**例2**：下面代码示例中，将内部类声明为静态内部类。  \n```java\npublic class OuterSer implements Serializable {  \n    private int rank;  \n    static class InnerSer implements Serializable{  \n        protected String name;  \n    }  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 398:Indicator of Poor Code Quality
      - type: CERT
        value: SER05-J:Do not serialize instances of inner classes
