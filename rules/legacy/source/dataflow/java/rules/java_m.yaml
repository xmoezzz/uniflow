  - id: '02000010150301'
    language: Java
    Type: std
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 并发规范
      - type: DetailClassChin
        value: 【推荐】避免日期格式化缺陷
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "日期格式对象是非线程安全的，`java.text.Format`中的`parse()`和`format()`方法包含一个可导致用户看到其他用户数据的race condition。  \n  \n**例如**：下面代码片段中，定义了一个成员变量（静态的日期格式对象）。  \n```java\npublic class DateFormat extends Thread{  \n    private static SimpleDateFormat sdf = new SimpleDateFormat(\"yyyy-MM-dd\");  \n    private String name;  \n    private String dateStr;  \n    public DateFormat(String name, String dateStr) {  \n        this.name = name;  \n        this.dateStr = dateStr;  \n    }  \n    @Override  \n    public void run() {  \n        try {  \n            Date date = sdf.parse(dateStr);  \n            System.out.println(\"线程\"+name+\"运行\"+\":date:\"+date);  \n        } catch (ParseException e) {  \n            e.printStackTrace();  \n        }  \n    }  \n    public static void main(String[] args) {  \n        ExecutorService executorService = Executors.newFixedThreadPool(3);  \n        executorService.execute(new DateFormat(\"A\", \"2017-06-10\"));  \n        executorService.execute(new DateFormat(\"B\", \"2016-06-06\"));  \n        executorService.shutdown();  \n    }  \n}\n```  \n如上代码中输出会有两种情况，一种情况是报错，还有一种情况是两个线程输出一致。出现这种情况的原因是因为SimpleDateFormat类内部有一个Calendar对象引用,它用来储存和这个SimpleDateFormat相关的日期信息。这样就会导致一个问题,如果SimpleDateFormat是static的, 那么多个thread之间就会共享SimpleDateFormat, 同时也是共享Calendar引用。在高并发的情况下，容易出现幻读成员变量的现象。"
    Description_En: ''
    Advice: "有如下四种解决方法：  \n 1.将SimpleDateFormat定义成局部变量，但是每调用一次方法意味创建一个SimpleDateFormat对象，浪费内存。  \n 2.方法加同步锁synchronized，在同一时刻，只有一个线程可以执行类中的某个方法。这样性能较差，每次都要等待锁释放后其他线程才能进入。  \n 3.使用第三方库joda-time，由第三方考虑线程不安全的问题。  \n 4.使用ThreadLocal：每个线程拥有自己的SimpleDateFormat对象。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 488:Exposure of Data Element to Wrong Session
      - type: CWE
        value: 362:Concurrent Execution using Shared Resource with Improper Synchronization ('Race Condition')
      - type: OWASP TOP 10
        value: 2007:A6 Information Leakage and Improper Error Handling
