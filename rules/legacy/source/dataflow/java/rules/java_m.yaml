    Description: "根据Java语言规范第三版的3.8节标识符的定义（部分）:  \n>1. 标识符是Java字母和Java数字的不限长序列，必须以Java字母开头。  \n>2. Java字母包括大写和小写的ASCII拉丁字母`A〜Z (\\u0041〜\\u005a)`和`a〜z (\\u0061〜\\u007a)`，并且出于历史的原因，还包括ASCII下划线（_或\\u005f)和美元符号($或\\0024)。应当仅在机器生成的源代码中使用$字符，或者仅用它来很少地访问遗留系统上预先存在的名称。"
