    Description: "采用SSL进行连接时，使用`AllowAllHostnameVerifier()`和`SSLSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER`将会关闭主机名验证功能。这相当于信任所有证书。HostnameVerifier是用于主机名验证的接口,若重写`verify`方法只返回true，意味着信任所有主机名。  \n  \n**例1**：下列代码SSLSocketFactory调用`setHostnameVerifier`方法，将`SSLSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER`作为参数，将会关闭主机名验证功能。  \n```java\n...  \nKeyStore store = KeyStore.getInstance(KeyStore.getDefaultType());    \nstore.load(null, null);    \nSSLSocketFactory sf = new SSLSocketFactory(store);    \nsf.setHostnameVerifier(`SSLSocketFactory.`ALLOW_ALL_HOSTNAME_VERIFIER);    \nHttpParams params = new BasicHttpParams();    \nHttpProtocolParams.setVersion(params, HttpVersion.HTTP_1_1);    \nHttpProtocolParams.setContentCharset(params, HTTP.UTF_8);    \nSchemeRegistry registry = new SchemeRegistry();    \nregistry.register(new Scheme(\"http\", PlainSocketFactory.getSocketFactory(), 80));    \nregistry.register(new Scheme(\"https\", sf, 443));    \nClientConnectionManager ccm = new ThreadSafeClientConnManager(params, registry);    \n... \n```\n**例2**：下列代码重写HostnameVerifier接口的`verify`方法，方法内只有个一个返回值为true的return语句，意味着主机名验证毫无意义。  \n```java\n...  \nHostnameVerifier hostnameVerifier = new HostnameVerifier() {  \n    @Override  \n    public boolean verify(String requestedHost, SSLSession remoteServerSession) {  \n        return true;   \n    }  \n};  \n...\n```"
    Description_En: ''
    Advice: "采用SSL连接时，不应放弃主机名验证。可考虑采用StrictHostnameVerifer建立服务器身份和安全SSL连接以及正确的重写`verify`方法。  \n  \n**例1**：下列代码SSLSocketFactory调用`setHostnameVerifier`方法，将`SSLSocketFactory.STRICT_HOSTNAME_VERIFIER` 作为参数，将会开启严格匹配模式。  \n```java\n...  \nKeyStore store = KeyStore.getInstance(KeyStore.getDefaultType());    \nstore.load(null, null);    \nSSLSocketFactory sf = new SSLSocketFactory(store);    \nsf.setHostnameVerifier(SSLSocketFactory.STRICT_HOSTNAME_VERIFIER);    \nHttpParams params = new BasicHttpParams();    \nHttpProtocolParams.setVersion(params, HttpVersion.HTTP_1_1);    \nHttpProtocolParams.setContentCharset(params, HTTP.UTF_8);    \nSchemeRegistry registry = new SchemeRegistry();    \nregistry.register(new Scheme(\"http\", PlainSocketFactory.getSocketFactory(), 80));    \nregistry.register(new Scheme(\"https\", sf, 443));    \nClientConnectionManager ccm = new ThreadSafeClientConnManager(params, registry);    \n...\n``` \n**例2**：下列代码正确的重写HostnameVerifier接口的`verify`方法，没有忽略主机名验证。  \n```java\n...  \nHostnameVerifier hostnameVerifier = new HostnameVerifier() {  \n    @Override  \n    public boolean verify(String requestedHost, SSLSession remoteServerSession) {  \n        return requestedHost.equalsIgnoreCase(remoteServerSession.getPeerHost());   \n    }  \n};  \n...\n```"
    Advice_En: ''
