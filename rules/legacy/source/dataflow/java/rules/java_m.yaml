    Description: "Optional在某种意义上是Java8提供的为了解决null安全问题的一个API，而将Optional与null进行比较，或者返回的Optional可能为null都是不准确的做法。  \n  \n**例如**：下列代码中使用`getOptional`返回值可能为null，而且与null进行了对比。 \n```java\npublic void doSomething () {  \n    Optional<String> optional = getOptional();  \n    if (optional != null) {    \n        ...  \n    }  \n}  \npublic Optional<String> getOptional() {  \n    ...  \n    return null;   \n}\n```"
    Description_En: ''
    Advice: "准确的使用Optional可以提高代码简洁性，并且可以避免空指针异常的出现。  \n  \n**例如**：下列代码中使用getOptional返回值为`Optional.empty()`，通过`ifPresent`方法来判断值是否为空。 \n```java\npublic void doSomething () {  \n    Optional<String> optional = getOptional();  \n    optional.ifPresent(...);  \n}  \npublic Optional<String> getOptional() {  \n    ...  \n    return Optional.empty();   \n}\n```"
