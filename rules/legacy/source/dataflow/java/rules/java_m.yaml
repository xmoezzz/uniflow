  - id: '02000010150102'
    language: Java
    Type: std
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: API误用
      - type: DetailClassChin
        value: 【推荐】类需要实现equals()
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "在没有重写`equals()`方法的类（或接口）上调用`equals()`方法，会导致调用继承自`java.lang.Object`的`equals()`方法，尽管可以合法的使用`Object.equals()`，但是`Object.equals()`将比较两个对象的内存地址，而不是比较对象的成员变量。  \n  \n**例如**：下列代码中PersonTeam类未实现`equals()`方法，当使用`equals()`方法时是通过两个对象的内存地址比较。  \n```java\npublic class PersonTeam{  \n    private int tid;  \n    public int getTeamID(){  \n        return tid;  \n    }  \n    public void setTeamID(int newTid){  \n        tid = newTid;  \n    }  \n }  \n...  \npublic class CompareTeam{  \n    public boolean compareTeams(PersonTeam t1, PersonTeam t2){  \n        return t1.equals(t2);   \n    }  \n}\n```"
    Description_En: ''
    Advice: "使用`equals()`方法比较对象的成员信息，需要重写Object的`equals()`方法，或者直接使用`==`来比较是否是同一个对象。  \n  \n**例1**：下列代码中PersonTeam类实现`equals()`方法，当使用`equals()`方法时是通过两个对象的`tid`比较。  \n```java\npublic class PersonTeam{  \n    private int tid;  \n    public int getTeamID(){  \n        return tid;  \n    }  \n    public void setTeamID(int newTid){  \n        tid = newTid;  \n    }  \n    @Override  \n    public boolean equals(Object obj) {  \n        if (this == obj)  \n            return true;  \n        if (obj == null)  \n            return false;  \n        if (getClass() != obj.getClass())  \n            return false;  \n        PersonTeam other = (PersonTeam) obj;  \n        if (tid != other.tid)  \n            return false;  \n        return true;  \n    }  \n}  \n...  \npublic class CompareTeam{  \n    public boolean compareTeams(PersonTeam t1, PersonTeam t2){  \n        return t1.equals(t2);   \n    }  \n}\n```  \n  \n**例2**：下列代码中PersonTeam类未实现`equals()`方法，直接使用`==`比较，判断是否是同一个对象。  \n```java\npublic boolean compareTeams(PersonTeam t1, PersonTeam t2){  \n    return t1 == t2;   \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 398:Indicator of Poor Code Quality
      - type: SJ/T 11683-2017
        value: 6.3.4 equals方法的错误使用
    Obsolete: not
    Default: yes
    WhiteList: not
    Security: not
    ENClassChin: ''
