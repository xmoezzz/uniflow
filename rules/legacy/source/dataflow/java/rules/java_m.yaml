        value: 【强制】不要在Condition对象上调用wait()
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: '`java.util.concurrent.locks.Condition`是在java 1.5中才出现的，它用来替代传统的Object的`wait()、notify()`实现线程间的协作，相比使用Object的`wait()、notify()`，使用Condition1的`await()、signal()`这种方式实现线程间协作更加安全和高效。在Condition的对象上调用了`wait`方法实际上调用的是Object的`wait`方法。'
    Description_En: ''
    Advice: 应该在`java.util.concurrent.locks.Condition`对象上调用`await`方法替代`wait`方法。
    Advice_En: ''
