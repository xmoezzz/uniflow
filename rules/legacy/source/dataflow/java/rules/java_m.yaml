  - id: '02000010150110'
    language: Java
    Type: std
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: API误用
      - type: DetailClassChin
        value: 【强制】不要调用notify()
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "程序调用`notify()`方法无法指定将唤醒哪个线程。  \n  \n**例如**：下面代码片段中，线程执行步骤由`time`字段决定，一个线程执行完操作后，将`time`的值加一，然后通知负责下一个步骤的线程。  \n```java\npublic final class ProcessStep implements Runnable {  \n    private static final Object lock = new Object();  \n    private static int time = 0;  \n    private final int step; // Perform operations when field time  \n    // reaches this value  \n    public ProcessStep(int step) {  \n        this.step = step;  \n    }  \n    @Override public void run() {  \n        try {  \n            synchronized (lock) {  \n                while (time != step) {  \n                    lock.wait();  \n                }  \n                // Perform operations  \n                time++;  \n                lock.notify();  \n            }  \n        } catch (InterruptedException ie) {  \n            Thread.currentThread().interrupt(); // Reset interrupted status  \n        }  \n    }  \n    public static void main(String[] args) {  \n        for (int i = 4; i >= 0; i--) {  \n            new Thread(new ProcessStep(i)).start();  \n        }  \n    }  \n}\n```  \n由于每个线程有不同的wait条件，假如存在满足条件的线程，但是因为`notify()`方法只能唤醒一个线程，若被唤醒的线程不满足条件，则必须继续等待，程序有可能因此将会发生死锁。"
    Description_En: ''
    Advice: "使用`notifyAll()`方法代替`notify()`方法。  \n  \n**例如**：下列代码片段中，调用`notifyAll()`方法代替了`notify()`方法，将会唤醒所有线程，满足条件的线程将会执行它的任务，不满足条件的线程将会继续等待。  \n```java\npublic final class ProcessStep implements Runnable {  \n    private static final Object lock = new Object();  \n    private static int time = 0;  \n    private final int step; // Perform operations when field time  \n                            // reaches this value  \n    public ProcessStep(int step) {  \n        this.step = step;  \n    }  \n    @Override public void run() {  \n        try {  \n            synchronized (lock) {  \n                while (time != step) {  \n                    lock.wait();  \n                }  \n                // Perform operations  \n                time++;  \n                lock.notifyAll(); // Use notifyAll() instead of notify()  \n            }  \n        } catch (InterruptedException ie) {  \n            Thread.currentThread().interrupt(); // Reset interrupted status  \n        }  \n    }  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: '373:DEPRECATED: State Synchronization Error'
      - type: CERT
        value: THI02-J:Notify all waiting threads rather than a single thread
    Obsolete: not
    Default: yes
    WhiteList: not
    Security: not
    ENClassChin: ''
    ENSubClassChin: Code Correctness
