    Description: "当类实现了Externalizable接口，但是没有定义无参构造方法时，当此类对象被反序列化时，首先需要通过调用无参构造函数来构造。当这个类没有时，会抛出InvalidClassException并失败。  \n  \n**例如**：下面代码示例中，类实现了Externalizable接口，没有定义无参构造方法。  \n```java\npublic class User implements Externalizable {  \n    private String name;  \n    private int age;  \n    ...  \n    User (String name,int age) {  \n        this.name = name;  \n        this.age = age;  \n        ...  \n    }  \n    @Override  \n    public void writeExternal(ObjectOutput out) throws IOException {  \n        ...  \n    }  \n  \n    @Override  \n    public void readExternal(ObjectInput in) throws IOException, ClassNotFoundException {  \n        ...  \n    }  \n}\n```"
    Description_En: ''
    Advice: "当类实现了Externalizable接口，添加无参构造方法时。  \n  \n**例如**：下面代码示例中，类实现了Externalizable接口，定义了无参构造方法。  \n```java\npublic class User implements Externalizable {  \n    private String name;  \n    private int age;  \n    ...  \n    User (){}  \n    User (String name,int age) {  \n        this.name = name;  \n        this.age = age;  \n        ...  \n    }  \n    @Override  \n    public void writeExternal(ObjectOutput out) throws IOException {  \n        ...  \n    }  \n  \n    @Override  \n    public void readExternal(ObjectInput in) throws IOException, ClassNotFoundException {  \n        ...  \n    }  \n}\n```"
