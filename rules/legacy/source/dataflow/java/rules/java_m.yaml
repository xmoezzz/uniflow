    Description: "所以它与任何值都不相等，包括它自己，故如果拿变量与NaN进行比较，得出的计算结果将始终为false（`!=`运算符是个例外，会得出true结果）  \n  \n**例如**：以下代码输出结果为false。\n```java  \nSystem.out.println(Double.NaN == Double.NaN);\n```"
