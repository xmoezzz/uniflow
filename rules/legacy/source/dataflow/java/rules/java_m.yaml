    Description: "序列化未实现Serializable接口的类时将导致抛出NotSerializableException异常，任何内容都不会写入文件，只有实现Serializable接口的类才能序列化和反序列化。  \n  \n**例如**：下面代码示例中User没有实现Serializable接口，但是仍将其序列化。  \n```java\npublic class User{    \n    ...  \n}  \npublic class Test{  \n    public void doSerialize() throws IOException {  \n        User user;  \n        ...  \n        FileOutputStream fout = new FileOutputStream(user.getName());  \n        ObjectOutputStream oos = new ObjectOutputStream(fout);  \n        oos.writeObject(veg);  \n    }  \n}\n```"
    Description_En: ''
    Advice: "要序列化某一个对象，这个对象的类必须实现Serializable接口。  \n  \n**例如**：下面代码示例中User实现了Serializable接口，可以对User进行序列化。  \n```java\npublic class User implement Serializable{    \n    ...  \n}  \npublic class Test{  \n    public void doSerialize() throws IOException {  \n        User user;  \n        ...  \n        FileOutputStream fout = new FileOutputStream(user.getName());  \n        ObjectOutputStream oos = new ObjectOutputStream(fout);  \n        oos.writeObject(veg);  \n    }  \n}\n```"
