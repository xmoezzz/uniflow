        value: 【强制】不要用Object.equals()比较两个数组
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "数组不会重写父类Object的`equals()`方法，Object中`equals()`方法比较的是数组引用也就是数据的内存地址而不是数组中的内容，当需要比较两数组中的内容是否一致时不要使用`Object.equals()`方法。  \n  \n**例如**：下面代码片段中，不正确的使用`Object.equals()`方法比较两个数组。  \n```java\npublic void arrayEqualBad(){  \n    int[] arra1 = new int[20];  \n    int[] arra2 = new int[20];  \n    boolean isEqual = arra1.equals(arra2);  \n }\n```"
    Description_En: ''
    Advice: "应使用`java.util.Arrays.equals()`方法比较两个数组的内容。   \n  \n**例如**：下面代码片段中，使用`java.util.Arrays.equals()`方法比较两个数组。  \n```java\npublic void arrayEqualsGood(){  \n    int[] arra1 = new int[20];  \n    int[] arra2 = new int[20];  \n    boolean isEqual = Arrays.equals(arra1, arra2);  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 754:Improper Check for Unusual or Exceptional Conditions
      - type: CWE
        value: 398:Indicator of Poor Code Quality
      - type: CERT
        value: EXP02-J:Do not use the Object.equals() method to compare two arrays
      - type: CWE/SANS TOP 25
        value: 2011:Risky Resource Management - CWE ID 754
      - type: SJ/T 11683-2017
        value: 6.3.4 equals方法的错误使用
    Obsolete: not
