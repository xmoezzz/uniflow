      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "在finally代码块中抛出异常时会消除从try或catch程序段抛出的任何异常，并影响后续代码的执行  \n  \n**例如**：下面代码中在finally代码块中抛出了异常  \n```java\npublic static void doOperation throws IOException{  \n    FileInputStream fis = null;  \n    try{  \n        fis = new FileInputStream(\"Reader.txt\");  \n        //...  \n    }finally {  \n        fis.close();  \n        //...  \n    }  \n}\n```  \n当`Reader.txt`不存在，且程序并未对异常进行捕获时，程序只会抛出finally代码块中产生的NullPointerException，try代码块中产生的FileNotFoundException将不会显示，后续代码将不会执行。"
    Description_En: ''
    Advice: "不应在finally代码块中抛出异常，应直接处理掉可能发生的异常  \n  \n**例如**：下面代码中在finally代码块中处理了异常,其后续代码的执行不会被影响  \n```java\npublic static void doOperation throws IOException{  \n    FileInputStream fis = null;  \n    try{  \n        fis = new FileInputStream(\"Reader.txt\");  \n        //...  \n    }finally {  \n        if(fis !=null) {  \n            try {  \n                fis.close();  \n            } catch (IOException e) {  \n                //...  \n            }  \n            //...  \n        }  \n        //...  \n    }  \n}\n```"
    Advice_En: ''
