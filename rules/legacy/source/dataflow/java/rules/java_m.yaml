    Description: "PreparedStatement为参数设值的方法和ResultSet中获取指定列的值的方法中的索引都是从1开始编号的，当使用0或者大于占位符数目或列数目时都会抛出SQLException异常。  \n  \n**例如**：下列代码中使用了无效的参数索引和列索引。  \n```java\nPreparedStatement ps = connection.prepareStatement(\"select *  from users where name = ? and age < ?\");  \nps.setString(0, name);  //索引都是从1开始编号的  \nps.setInt(3, age);  //索引大小超过占位符总数  \n  \nResultSet rs = ps.executeQuery();  \nwhile (rs.next()) {  \n    long id = rs.getLong(0);  //索引都是从1开始编号的  \n    // ...  \n}  \n...\n```"
    Description_En: ''
    Advice: "使用有效的正确来设置参数值和获取列值。  \n  \n**例如**：下列代码中使用了正确的参数索引和列索引。  \n```java\nPreparedStatement ps = connection.prepareStatement(\"select *  from users where name = ? and age < ?\");  \nps.setString(1, name);  \nps.setInt(2, age);  \n  \nResultSet rs = ps.executeQuery();  \nwhile (rs.next()) {  \n    long id = rs.getLong(1);  \n    // ...  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 398:Indicator of Poor Code Quality
