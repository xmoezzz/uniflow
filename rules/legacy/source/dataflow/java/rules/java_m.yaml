    Description: 调用`System.exit()`会终止Java虚拟机，从而终止所有运行中的程序和线程。Web应用程序关闭自身的容器，有可能导致拒绝服务攻击，**例如**：一个嵌入在JSP中的`System.exit()`的调用会停止网络服务器，阻碍了对用户的服务。
