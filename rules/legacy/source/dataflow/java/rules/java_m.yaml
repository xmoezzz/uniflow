    Description: "块密码又称为分组加密，一次加密明文中的一个块。将明文按一定的位长分组，明文组经过加密运算得到密文组，密文组经过解密运算（加密运算的逆运算），还原成明文组。这种加密算法共有四种操作模式用于描述如何重复地应用密码的单块操作来安全的转换大于块的数据量，分别是电子代码(ECB)、密码块链(CBC)、密码反馈(CFB)以及输出反馈（OFB）。其中ECB模式下相同的明文块总是会得到相同的密文，故不能抵挡回放攻击，而CBC模式则没有这个缺陷。  \n  \n**例如**：以下代码将AES密码用于ECB模式。  \n```java\n...  \nCipher cipher = Cipher.getInstance(\"AES/ECB/PKCS7Padding\", \"BC\");  \ncipher.init(Cipher.ENCRYPT_MODE, createSecretKey(seed));  \n...\n```"
    Description_En: ''
    Advice: "加密大于块的数据时，应该避免使用ECB模式。由于CBC模式不会对相同的明文块生成相同的密文块，所以CBC模式更好。然而，CBC模式效率较低，并且在和SSL一起使用时会造成严重风险。可以改用`CCM(Counter with CBC-MAC)`模式，如果更注重性能，在可用的情况下则使用`GCM(Galois/Counter)`模式。  \n  \n**例如**：以下代码将AES密码用于CBC模式。  \n```java\n...  \nCipher cipher = Cipher.getInstance(\"AES/CBC/PKCS7Padding\", \"BC\");  \ncipher.init(Cipher.ENCRYPT_MODE, createSecretKey(seed));  \n...\n```"
    Advice_En: ''
