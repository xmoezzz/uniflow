        value: 【强制】不要调用Thread.run()
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "程序调用了线程的`run()`方法，而不是`start()`方法。   \n  \n**例如**：下面代码片段中，程序错误地调用了线程的`run()`方法，而不是`start()`方法。  \n```java\npublic final class Foo implements Runnable {  \n    @Override public void run() {  \n        // ...  \n    }  \n    public static void main(String[] args) {  \n        Foo foo = new Foo();  \n        new Thread(foo).run();  \n    }  \n}\n```"
    Description_En: ''
    Advice: "调用线程的`start()`方法替代`run()`方法。  \n  \n**例如**：下面代码片段中使用`start()`方法来通知Java运行库开始执行新线程。  \n```java\npublic final class Foo implements Runnable {  \n    @Override public void run() {  \n        // ...  \n    }  \n    public static void main(String[] args) {  \n        Foo foo = new Foo();  \n        new Thread(foo).start();  \n    }  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 572:Call to Thread run() instead of start()
      - type: CERT
        value: THI00-J:Do not invoke Thread.run()
      - type: OWASP TOP 10
        value: 2004:A9 Application Denial of Service
      - type: SJ/T 11683-2017
        value: 6.8.3 显式调用Thread.run方法
    Obsolete: not
    Default: yes
    WhiteList: not
