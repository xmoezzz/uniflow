      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "在`HttpSecurity.authorizeRequests()`方法上配置的URL模式将会按照声明的顺序进行匹配，过多的配置容易犯错，导致作用域大的在作用域小的前面。  \n  \n**例如**：下面代码示例中`/admin/**`配置在`/admin/login`前面。  \n```java\nhttp.authorizeRequests()  \n    .antMatchers(\"/resources/**\", \"/signup\", \"/about\").permitAll()  \n    .antMatchers(\"/admin/**\").hasRole(\"ADMIN\")  \n    .antMatchers(\"/admin/login\").permitAll()  \n    .antMatchers(\"/**\").permitAll()  \n    .antMatchers(\"/db/**\").access(\"hasRole('ADMIN') and hasRole('DBA')\").and().formLogin()  \n    .loginPage(\"/login\").permitAll().and().logout().permitAll();\n```"
    Description_En: ''
    Advice: "检查代码逻辑，判断`HttpSecurity.authorizeRequests()`方法上配置的URL模式执行顺序。  \n  \n**例如**：下面代码示例中`/admin/login`配置在`/admin/**`前面。  \n```java\nhttp.authorizeRequests()  \n    .antMatchers(\"/resources/**\", \"/signup\", \"/about\").permitAll()  \n    .antMatchers(\"/admin/login\").permitAll()  \n    .antMatchers(\"/admin/**\").hasRole(\"ADMIN\")      \n    .antMatchers(\"/db/**\").access(\"hasRole('ADMIN') and hasRole('DBA')\")  \n    .antMatchers(\"/**\").permitAll().and().formLogin()  \n    .loginPage(\"/login\").permitAll().and().logout().permitAll();\n```"
