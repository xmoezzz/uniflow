    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "空的无限循环会消耗大量的CPU资源而不做任何事情。  \n  \n**例1**：下面代码片段中，执行了一个循环，循环条件值为true，循环中不执行任何指令。  \n```java\npublic int nop(){  \n    while(true){}  \n}\n```  \n**例2**：下面代码片段中，执行了一个循环，循环条件变量值为true，循环中不执行任何指令。  \n```java\nboolean condition = true;  \npublic int nop(){  \n    while(condition){}  \n}\n```"
    Description_En: ''
    Advice: "检查程序逻辑，去除没有代码的无限循环，或者在循环体中加入有语义的操作。  \n  \n**例如**：下面代码片段中，在while循环中调用`Thread.sleep()`方法来避免毫无意义的无限循环。  \n```java\npublic final int DURATION = 10000;  \npublic void nop() throws InterruptedException{  \n    while(true){  \n        Thread.sleep(DURATION);  \n    }  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 835:Loop with Unreachable Exit Condition ('Infinite Loop')
      - type: CERT
        value: MSC01-J:Do not use an empty infinite loop
    Obsolete: not
    Default: yes
    WhiteList: not
    Security: not
