        value: 【推荐】重写next方法应该抛出NoSuchElementException
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "当类实现Iterator接口时，需重写`next`方法，而`next`方法未抛出NoSuchElementException可能导致程序运行异常。  \n  \n**例如**：下面代码示例中，类Iter实现了Iterator接口，而`next`方法未抛出NoSuchElementException,当程序为判断是否`hasNext`时，有可能抛出数组越界异常。  \n```java\npublic class Users implements Iterable<User> {  \n    private User[] users = new User[10];  \n    ...  \n   @Override  \n    public Iterator<User> iterator() {  \n       return new Itr();  \n   }  \n   class Itr implements Iterator<User> {  \n       private int cursor;  \n       @Override  \n       public boolean hasNext() {  \n           return cursor != users.length;  \n       }  \n       @Override  \n       public User next() {  \n           return users[cursor++];  \n       }  \n       ...  \n   }  \n}\n```"
    Description_En: ''
    Advice: "正确重写Iterator接口的next方法，当元素获取不到时，抛出NoSuchElementException。  \n  \n**例如**：下面代码示例中，正确重写Iterator接口的`next`方法。\n```java\npublic class Users implements Iterable<User> {\n    private User[] users = new User[10];...\n\n    @Override\n    public Iterator<User> iterator() {\n        return new Itr();\n    }\n\n    class Itr implements Iterator<User> {\n        private int cursor;\n\n        @Override\n        public boolean hasNext() {\n            return cursor != users.length;\n        }\n\n        @Override\n        public User next() {\n            if (cursor >= users.length)\n                throw new NoSuchElementException();\n            return users[cursor++];\n        }\n        ...\n    }\n}\n```"
    Advice_En: ''
    References:
      Reference:
