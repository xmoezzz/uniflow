    Description: "在不重写run方法的情况下扩展线程类是没有意义的，意味着线程即使运行也只是执行父类的`run`方法。  \n  \n**例如**：下面代码示例中，没有重写Thread 类中的`run`方法。  \n```java\npublic class MyRunner extends Thread {  \n    public void doSometing() {...}  \n}\n```"
