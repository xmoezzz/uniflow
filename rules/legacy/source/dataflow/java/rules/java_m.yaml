    Description: "程序创建或分配文件句柄后，不进行合理释放，将会降低系统性能，攻击者还可能会通过耗尽资源池的方式发起拒绝服务攻击。  \n  \n**例如**：下面代码片段中，创建了一个临时文件句柄`tempFile`，程序使用`deleteOnExit()`方法删除临时文件，程序会等到JVM正常运行结束后才会删除。而在JavaEE中程序将会持续运行很长时间，将会持续生成临时文件并得不到有效删除。  \n```java\n...  \nFile tempFile = File.createTempFile(\"temp\", \".txt\");  \n...  \ntempFile.deleteOnExit();  \n...\n```"
    Description_En: ''
    Advice: "在JavaEE程序中不应该使用`deleteOnExit()`回收文件句柄资源，应在finally代码块中调用`delete()`方法释放文件句柄资源。  \n  \n**例如**：下面代码片段中，使用完之前创建的文件句柄`tempFile`后，在finally代码块中进行了释放。  \n```java\nFile tempFile = null;  \ntry {  \n    ...  \n    tempFile = File.createTempFile(\"temp\", \".txt\");  \n    ...  \n} catch (IOException e) {  \n    ...  \n}finally{  \n    if(tempFile!=null&&tempFile.exists()){  \n\t\tboolean hasDelete = tempFile.delete();  \n        if(!hasDelete) {  \n              ...      \n        }  \n    }  \n}\n```"
    Advice_En: ''
    References:
