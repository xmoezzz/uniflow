    Description: "程序使用equals()方法将一个对象与null作比较（`obj.equals(null)`），如果obj对象为null，程序将抛出NullPointerException异常；如果obj对象不是null，那么该表达式将始终返回false。  \n  \n**例如**：如下代码片段中将一个string对象和null作比较  \n```java\npublic class Demo {  \n    public static boolean equalsNull(String a){  \n        String b = null;  \n        return a.equals(b);  //equals参数为null  \n    }  \n}\n```"
    Description_En: ''
    Advice: 如果程序员想要判断对象是否为null，可以采用`obj==null`或者`obj!=null`来代替`obj.equals(null)`。
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 754:Improper Check for Unusual or Exceptional Conditions
      - type: CWE
        value: 398:Indicator of Poor Code Quality
      - type: CWE/SANS TOP 25
        value: 2010:Risky Resource Management - CWE ID 754
      - type: SJ/T 11683-2017
