        value: 【推荐】可序列化类的不可序列化的父类应拥有无参构造方法
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "当可序列化类序列化时，对象反序列化会从父类中第一个非可序列化的类开始，并沿着链继续下去，添加每个后续子类的属性，直到最后一个对象被实例化为止。为了创建非序列化的父类，将会调用了它的无参构造方法。若没有无参构造方法将会报出InvalidClassException异常。  \n  \n**例如**：下面代码示例中User的父类Human未实现Serializable接口，并没有无参构造方法。  \n```java\npublic class Human{  \n    private int age;  \n    public Human(int age) {...}  \n    ...  \n}  \npublic class User extends Human implements Serializable{  \n    private String name;  \n    public User (String name,int age) {...}  \n    ...  \n}\n```"
    Description_En: ''
    Advice: "可以将父类实现Serializable接口或者添加无参构造方法。  \n  \n**例1**：下面代码示例中User的父类Human实现Serializable接口。  \n```java\npublic class Human implements Serializable{  \n    private int age;  \n    public Human(int age) {...}  \n    ...  \n}  \npublic class User extends Human implements Serializable{  \n    private String name;  \n    public User (String name,int age) {...}  \n    ...  \n}\n```  \n**例2**：下面代码示例中User的父类Human添加了无参构造方法。  \n```java\npublic class Human{  \n    private int age;  \n    public Human() {...}  \n    public Human(int age) {...}  \n    ...  \n}  \npublic class User extends Human implements Serializable{  \n    private String name;  \n    public User (String name,int age) {...}  \n    ...  \n}\n```"
    Advice_En: ''
    References:
