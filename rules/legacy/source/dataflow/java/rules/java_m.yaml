    Description: "程序中采用`new Boolean(boolean expression)`或`new Boolean(String expression)`创建对象，该方法产生的额外对象将占用更多空间、降低性能。  \n  \n**例如**：下面代码示例中，使用了`new Boolean(boolean expression)`来创建对象。\n```java\nBoolean isEqual = new Boolean(false);\n```"
    Description_En: ''
    Advice: "使用`Boolean.valueOf(boolean expression)`或者`Boolean.valueOf(String expression)`或者`Boolean.TRUE`、`Boolean.FALSE`代替`new Boolean`。  \n  \n**例1**：下面代码示例中，使用了`Boolean.valueOf(boolean expression)`来创建对象, \n```java\nBoolean isEqual = Boolean.valueOf(false);//与Boolean isEqual = false;相同  \n``` \n**例2**：下面代码示例中，使用了`Boolean.FALSE`直接赋值。\n```java\nBoolean isEqual = Boolean.FALSE;\n```"
    Advice_En: ''
    References:
      Reference:
