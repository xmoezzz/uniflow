      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "采用硬编码处理`salt`不仅使所有项目开发人员都可以查看该`salt`，而且一旦将该代码投入到生产中，将无法轻易更改该`salt`。攻击者可以根据该`salt`的值计算出该应用程序的\"彩虹表\"，并能轻松地确定Hash值。  \n  \n**例如**：以下代码使用了硬编码`salt`。\n```java  \n...  \nbyte[] salt = new byte[]{50, 33, 64, 36, 40, 53, 35, 64, 53, 51, 50, 64, 37, 35, 36, 50, 53, 51, 108, 53, 35, 64, 36};  \nPBEParameterSpec defParams = new PBEParameterSpec(salt, iterationCount);  \n...\n```  \n该代码可以正常运行，但是任何有该代码权限的人都能得到这个`salt`。一旦程序发布，将无法更改`salt`，攻击者如果得到`salt`值，将很容易入侵系统。"
    Description_En: ''
    Advice: "`salt`值始终不能为硬编码。通常情况下，应该对密码加以模糊化，并在外部资源中进行管理。在系统中采用明文的形式存储`salt`，会造成任何有充分权限的人读取和误用`salt`。  \n  \n**例如**：以下代码使用由系统管理员配置的`salt`变量。  \n```java\n...  \nbyte[] salt = getConfigSalt();  \nPBEParameterSpec defParams = new PBEParameterSpec(salt, iterationCount);  \n...\n```"
    Advice_En: ''
