        value: 【强制】不要在数组上调用toString()
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "Java中所有的类都继承至Object，Object类中有一个`toString`的方法，那么所有类也都有这个方法。由于Java输出用的函数`print()`不接受对象输出，所以一般都会先用该对象的`toString`方法将其转换为字符串后再输出。  \n在Object中`toString`方法的源码如下。  \n```java\npublic String toString() {  \n    return getClass().getName() + \"@\" + Integer.toHexString(hashCode());  \n}\n```  \n而数组类中并没有对此方法进行重写，仅仅是重载为类的静态方法。所以数组直接调用`toString`方法的结果并不是数组中元素的值，而是[数组的类型@内存地址哈希码]。"
    Description_En: ''
    Advice: "检查程序逻辑，如果需要获取数组中元素的值，应采用循环的方式获取其中的值形成字符串。或者直接使用Java工具类Arrays中的`toString`方法转化数组为字符串。  \n  \n**例1**：采用循环的方式获取其中的值形成字符串。  \n```java\nString[ ] params = getParams();  \nString string = null;  \nif (params == null)  \n    string = \"null\";  \nint iMax = params.length - 1;  \nif (iMax == -1)  \n    string = \"[]\";  \nStringBuilder stringBuilder = new StringBuilder();  \nstringBuilder.append('[');  \nfor (int i = 0;; i++) {  \n    stringBuilder.append(String.valueOf(params[i]));  \n    if (i == iMax) {  \n        stringBuilder.append(']');  \n        break;  \n    }  \n    stringBuilder.append(\", \");  \n}  \nstring = stringBuilder.toString();\n```  \n  **例2**：直接使用Java工具类Arrays中的`toString`方法转化数组为字符串。  \n```java\nString[] params = getParams();  \nString string = Arrays.toString(args);\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 398:Indicator of Poor Code Quality
      - type: SJ/T 11683-2017
        value: 6.5.3 调用数组的toString方法
    Obsolete: not
    Default: yes
    WhiteList: not
    Security: not
    ENClassChin: ''
    ENSubClassChin: Code Correctness
    ENDetailClassChin:
    - toString on Array
    J2ee: not
    Grades: 低
    GradesComment: ''
