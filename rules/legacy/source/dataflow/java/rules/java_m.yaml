    Description: "初始化向量(IV)应该使用加密随机数生成器进行创建。如果不使用随机IV，则结果密码可预测性会高得多，容易受到字典式攻击。  \n  \n**例如**：下面代码片段使用硬编码字节创建非随机IV。 \n```java \nbyte[] iv = {14, 80, 94, 47, 3, 66, 96, 110, 86, 30, 3, 0, 106, 107, 57, 117}  \nIvParameterSpec ivParameterSpec = new IvParameterSpec(iv);  \n...\n```"
