    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "finally语句块中的返回指令会导致try块中抛出的异常丢失。  \n  \n**例如**：下面代码中在finally代码块中存在return语句。  \n```java\npublic static String doOperation throws IOException{  \n    String string = null;  \n    FileInputStream fis = null;  \n    try{  \n        fis = new FileInputStream(\"Reader.txt\");  \n        //...  \n        return string;  \n    }finally {  \n        if(fis !=null) {  \n            try {  \n                fis.close();  \n            } catch (IOException e) {  \n            //...  \n            }  \n            //...  \n        }  \n        //...  \n  \n    return string;  \n    }  \n}\n```  \n当`Reader.txt`不存在，finally块中存在return语句且程序并未对异常进行捕获时，try代码块中产生的FileNotFoundException将不会显示。"
    Description_En: ''
    Advice: "检查程序逻辑，删除finally语句块中的返回语句。  \n  \n**例如**：下面代码中在finally代码块中没有return语句。  \n```java\npublic static String doOperation throws IOException{  \n    String string = null;  \n    FileInputStream fis = null;  \n    try{  \n        fis = new FileInputStream(\"Reader.txt\");  \n        //...  \n        return string;  \n    }finally {  \n        if(fis != null) {  \n            try {  \n                fis.close();  \n            } catch (IOException e) {  \n                //...  \n            }  \n                //...  \n        }  \n        //...  \n    }  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 584:Return Inside Finally Block
      - type: CERT
        value: ERR04-J:Do not exit abruptly from a finally block
      - type: OWASP TOP 10
        value: 2007:A6 Information Leakage and Improper Error Handling
      - type: OWASP TOP 10
        value: 2004:A7 Improper Error Handling
      - type: SJ/T 11683-2017
        value: 6.4.2 finally语句块中包含return语句
    Obsolete: not
    Default: yes
    WhiteList: not
    Security: not
