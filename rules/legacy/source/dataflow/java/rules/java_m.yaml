        value: 2010:Insecure Interaction - CWE ID 362
      - type: CWE/SANS TOP 25
        value: 2009:Insecure Interaction - CWE ID 362
      - type: ISO/IEC TR 24772
        value: 2013:New Vulnerabilities Concurrent Data Access [CGX]
