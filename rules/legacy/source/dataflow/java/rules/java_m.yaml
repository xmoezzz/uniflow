    Advice: "重写run方法或者不再继承于Thread。  \n  \n**例如**：下面代码示例中，重写了`run`方法。  \n```java\npublic class MyRunner extends Thread {  \n    @Override  \n    public void run() {  \n        doSometing();  \n        ...  \n    }  \n    public void doSometing() {...}  \n}\n```"
