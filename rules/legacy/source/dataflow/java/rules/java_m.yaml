    Description: "基于可能被重用的对象（如基础数据类型包装类和String）进行同步，会导致死锁和不确定的行为。  \n  \n**例如**：下面代码片段中锁定了一个final的字符串对象。  \n```java\nprivate static final String lock = \"LOCK\";  \npublic void doSomething() {  \n    synchronized (lock) {  \n        // ...  \n    }  \n}\n```  \n当程序中创建一个新的字符串对象为`\"LOCK\"`时，虚拟机会判断字符串常量池中是否存在该值的字符串，如果存在将返回这个字符串的地址给新的字符串对象，这将导致新的字符串对象控制了字符串锁对象。"
    Description_En: ''
    Advice: "程序中应使用private、final的Object对象作为锁对象。  \n  \n**例如**：以下代码使用了private、final的Object对象作为锁对象。  \n```java\nprivate final Object lock = new Object();  \npublic void doSomething() {  \n    synchronized (lock) {  \n        // ...  \n    }  \n}\n```"
    Advice_En: ''
    References:
