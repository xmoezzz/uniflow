        value: 【强制】不要调用finalize()
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "`finalize()`方法是回收分配给对象的内存之前调用垃圾收集器线程的基本语句，该方法用于释放对象占用的存储空间，应由JVM进行调用。  \n不要调用`finalize()`方法，因为：  \n1. `finalize()`方法并不能保证执行。  \n2. 任何有`finalize()`方法抛出的异常都会被GC线程忽略而且不会被进一步传播，事实上也不会在日志文件上记录下来。  \n3. `finalize()`方法在性能上将会增加负担。"
    Description_En: ''
    Advice: 方法`finalize()`只能在对象回收时由JVM进行调用。
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 586:Explicit Call to Finalize()
      - type: CERT
        value: MET12-J:Do not use ﬁnalizers
      - type: SJ/T 11683-2017
        value: 6.6.18 调用finalize方法
    Obsolete: not
    Default: yes
    WhiteList: not
    Security: not
    ENClassChin: ''
