    Description: "在Java程序中，经常使用getter和setter方法来提供对类中私有字段的获取和修改。而当字段太多时，程序员可能会通过复制粘贴构建get和set方法，有可能会生成错误的get或set方法，当程序运行时会产生不可预料的效果。  \n  \n**例如**：下列代码中`setUsername`方法没有修改相应的字段，而`getUsername`方法没有获取相应的字段。  \n```java\nclass User {  \n    private String username;  \n    private String password;  \n    ...  \n      \n    public void setUsername(String username) {  \n        this.password = username;  \n    }  \n  \n    public String getUsername() {  \n        return this.password;  \n    }  \n      \n    ...  \n}\n```"
    Description_En: ''
    Advice: "使用集成开发环境一键生成get和set方法是一个很好的选择，或者在写完get或set方法对其进行检查。  \n  \n**例如**：下列代码中正确的提供了get和set方法。  \n```java\nclass User {  \n    private String username;  \n    private String password;  \n    ...  \n      \n    public void setUsername(String username) {  \n        this.username = username;  \n    }  \n  \n    public String getUsername() {  \n        return this.username;  \n    }  \n      \n    ...  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 398:Indicator of Poor Code Quality
