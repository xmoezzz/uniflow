      - type: DetailClassChin
        value: 【强制】需要防止XML外部实体注入
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "XML外部实体的URI设置不当有可能造成拒绝服务攻击或者程序崩溃。  \n  \n**例1**：下面代码片段使用Java原生的SAX对evil.xml文件进行解析  \n```java\nprivate static void receiveXMLStream(InputStream inStream){  \n    SAXParserFactory factory = SAXParserFactory.newInstance();  \n    SAXParser saxParser;  \n    try {  \n        saxParser = factory.newSAXParser();  \n        saxParser.parse(inStream,new DefaultHandler());  \n        ...  \n    } catch (ParserConfigurationException e) {  \n        ...  \n    } catch (SAXException e) {  \n        ...  \n    } catch (IOException e) {  \n        ...  \n    }  \n}\n```  \n  \n**例2**：下面代码片段使用Java原生的DOM对evil.xml文件进行解析  \n```java\nprivate static void receiveXMLStream(InputStream stream){  \n    DocumentBuilderFactory documentBuilderFactory = DocumentBuilderFactory.newInstance();  \n    DocumentBuilder documentBuilder;  \n    try {  \n        documentBuilder = documentBuilderFactory.newDocumentBuilder();  \n        documentBuilder.parse(stream);  \n        ...  \n    } catch (ParserConfigurationException e) {  \n        ...  \n    } catch (SAXException e) {  \n        ...  \n    } catch (IOException e) {  \n        ...  \n    }     \n}\n```  \n  如果evil.xml文件中包含以下文本\n```xml\n<?xml version=\"1.0\"?>  \n<!DOCTYPE foo SYSTEM \"file:/dev/tty\">  \n<foo>bar</foo>  \n...  \n```  \n  SAX或者DOM解析器会尝试访问在SYSTEM属性中标识的URL，这意味着它将读取本地`/dev/tty`文件的内容。在POSIX系统中，读取这个文件会导致程序阻塞，直到可以通过计算机控制台得到输入数据为止。这样，攻击者可以使用这个恶意的XML文件来导致系统挂起，程序会受到XML外部实体注入攻击。"
    Description_En: ''
    Advice: "对于使用Java原生DOM和SAX有以下两种修复方法:   \n1. 不允许DTD（doctypes），这样可以阻止几乎所有的XML实体攻击  \n    **例1**：下面代码片段SAXParserFactory将禁用DTD  \n    ```java\n    private static void receiveXMLStream(InputStream inStream){  \n        SAXParserFactory factory = SAXParserFactory.newInstance();  \n        SAXParser saxParser;  \n        try {  \n            factory.setFeature(\"http://apache.org/xml/features/disallow-doctype-decl\",true);  \n            saxParser = factory.newSAXParser();  \n            saxParser.parse(inStream,new DefaultHandler());  \n            ...  \n        } catch (ParserConfigurationException e) {  \n            ...  \n        } catch (SAXException e) {  \n            ...  \n        } catch (IOException e) {  \n            ...  \n        }  \n    }\n    ```  \n    **例2**：下面代码片段DocumentBuilderFactory将禁用DTD\n    ```java  \n    private static void receiveXMLStream(InputStream stream){  \n        DocumentBuilderFactory documentBuilderFactory = DocumentBuilderFactory.newInstance();  \n        DocumentBuilder documentBuilder;  \n        try {  \n            documentBuilderFactory.setFeature(\"http://apache.org/xml/features/disallow-doctype-decl\", true);  \n            documentBuilder = documentBuilderFactory.newDocumentBuilder();  \n            documentBuilder.parse(stream);  \n            ...  \n        } catch (ParserConfigurationException e) {  \n            ...  \n        } catch (SAXException e) {  \n            ...  \n        } catch (IOException e) {  \n            ...  \n        }     \n    }\n    ```  \n2. 如果无法完全禁用DTD，可以采用禁用外部通用实体和参数实体并且禁用外部DTD和禁止实体扩展引用。   \n    **例1**：下面代码片段SAXParserFactory将禁用DTD\n    ```java  \n    private static void receiveXMLStream(InputStream inStream){  \n        SAXParserFactory factory = SAXParserFactory.newInstance();  \n        SAXParser saxParser;  \n        try {  \n            factory.setFeature(\"http://xml.org/sax/features/external-general-entities\",false);  \n            factory.setFeature(\"http://xml.org/sax/features/external-parameter-entities\", false);  \n            factory.setFeature(\"http://apache.org/xml/features/nonvalidating/load-external-dtd\",false);  \n            factory.setXIncludeAware(false);  \n            saxParser = factory.newSAXParser();  \n            saxParser.parse(inStream,new DefaultHandler());  \n            ...  \n        } catch (ParserConfigurationException e) {  \n            ...  \n        } catch (SAXException e) {  \n            ...  \n        } catch (IOException e) {  \n            ...  \n        }  \n    }\n    ```  \n      \n    **例2**：下面代码片段DocumentBuilderFactory将禁用DTD  \n    ```java\n    private static void receiveXMLStream(InputStream stream){  \n        DocumentBuilderFactory documentBuilderFactory = DocumentBuilderFactory.newInstance();  \n        DocumentBuilder documentBuilder;  \n        try {  \n            documentBuilderFactory.setFeature(\"http://xml.org/sax/features/external-general-entities\",false);  \n            documentBuilderFactory.setFeature(\"http://apache.org/xml/features/nonvalidating/load-external-dtd\",false);  \n            documentBuilderFactory.setXIncludeAware(false);  \n            documentBuilderFactory.setExpandEntityReferences(false);   \n            documentBuilder = documentBuilderFactory.newDocumentBuilder();  \n            documentBuilder.parse(stream);  \n            ...  \n        } catch (ParserConfigurationException e) {  \n            ...  \n        } catch (SAXException e) {  \n            ...  \n        } catch (IOException e) {  \n            ...  \n        }     \n    }\n    ```  \n    上述设置功能的方法setFeature也可以换成setAttribute，setAttribute方法用于用户在底层设置特定属性，使用方法和效果是一样的。  \n    上述防御需要Java 7 Update 67，Java 8 Update 20或更高版本，因为DocumentBuilderFactory和SAXParserFactory的上述对策在早期Java版本中被破坏。  \n    也可以从其他类上着手防范xxe漏洞：  \n    如XMLInputFactory、TransformerFactory、Validator、SchemaFactory、SAXTransformerFactory。但这些类都是调用了XMLConstants中的属性，故需要支持JAXP1.5.使用StAX解析xml文件时，以XMLInputFactory为例，可使用下面方法进行防范：  \n    ```java\n    //禁用DTD   \n    xmlInputFactory.setProperty(XMLInputFactory.SUPPORT_DTD,false);\n    ```   \n    ```java\n    //禁用外部实体 \n    xmlInputFactory.setProperty(\"javax.xml.stream.isSupportingExternalEntities\",false);\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE/SANS TOP 25
        value: 2020:CWE ID 611
      - type: CWE/SANS TOP 25
