      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "当`getter`/`setter`对的一个方法同步时，相对应的方法也应该同步。当调用者访问不一致的方法状态时，在运行时未能同步可能导致不一致的行为。  \n  \n**例如**：下面代码示例中，`getter`方法和`setter`方法没有成对同步。  \n```java\npublic class User {  \n    String name;  \n    int age;  \n  \n    public synchronized void setName(String name) {  \n        this.name = name;  \n    }  \n  \n    public String getName() { //对应的setName方法使用了synchronized修饰进行同步\n        return this.name;  \n    }  \n  \n    public void setAge(int age) { //对应的getAge方法使用了synchronized块进行同步\n        this.age = age;  \n    }  \n  \n    public int getAge() {  \n        synchronized (this) {  \n            return this.age;  \n        }  \n    }  \n}\n```"
    Description_En: ''
    Advice: "成对的`getter`方法和`setter`方法当有一个方法进行同步时，都需要进行同步。  \n  \n**例如**：下面代码示例中，`getter`方法和`setter`方法成对同步。  \n```java\npublic class User {  \n    String name;  \n    int age;  \n  \n    public synchronized void setName(String name) {  \n        this.name = name;  \n    }  \n  \n    public synchronized String getName() {  \n        return this.name;  \n    }  \n  \n    public void setAge(int age) {  \n        synchronized (this) {  \n            this.age = age;  \n        }  \n    }  \n  \n    public int getAge() {  \n        synchronized (this) {  \n            return this.age;  \n        }  \n    }  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 398:Indicator of Poor Code Quality
