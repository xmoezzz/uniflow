        value: 【强制】不要使用浮点变量作为循环计数器
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "不要使用浮点变量作为循环计数器。  \n  \n**例如**：在下面的代码中，0.1f会被处理成可以用float类型表达的最接近的数值，所以在每次循环中，增加至x的数值是一个略大于0.1的值。从而，循环只会执行9次，最终不能产生预期的结果。  \n```java\nfor (float x = 0.1f; x <= 1.0f; x +=0.1f) {  \n    System.out.println(x);  \n}\n```"
    Description_En: ''
    Advice: "使用整数作为循环计数器。  \n  \n**例如**：在下面的代码中，使用整数作为循环计数器，可以得到预期的结果。  \n```java\nfor(int count = 1; count <= 10; count += 1) {  \n    float x = count/10.0f;  \n    System.out.println(x);  \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CERT
        value: NUM09-J:Do not use floating-point variables as loop counters
    Obsolete: not
    Default: yes
    WhiteList: not
    Security: not
    ENClassChin: ''
