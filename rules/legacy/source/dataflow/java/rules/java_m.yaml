      - type: DetailClassChin
        value: 【推荐】不要使用单例对象下的成员变量
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "`javax.servlet.http.HttpServlet`和`org.apache.struts.action.Action`的对象以及Spring框架下单例类（比如使用`@Controller`、`@Service`和`@Repository`注解的类默认都是单例类）都不是线程安全的。Web容器默认采用单实例多线程的方式来处理Http请求，单例对象将在一个多线程的环境中并发执行，这将导致单例对象成员变量访问的线程安全问题。  \n  \n**例1**：下面是一段JAVA EE的Servlet代码片断，变量`username`为成员变量，当LoginServlet的对象处理多个请求时，变量`username`将被多个请求共享，这将导致线程间数据泄露。  \n```java\n...  \nimport javax.servlet.http.HttpServlet;  \npublic class LoginServlet extends HttpServlet {  \n    String username;  \n    protected void doPost(HttpServletRequest req,HttpServletResponse res) {  \n        username = req.getParameter(\"username\");  \n        ...  \n        out.println( \" 欢迎您，\"+username+\" !\");  \n    }  \n}  \n...\n```  \n**例2**：下面是一段使用Spring框架搭建的WEB服务中的Controller代码片断，变量`username`为成员变量，当User的对象处理多个请求时，变量`username`将被多个请求共享，这将导致线程间数据泄露。  \n```java\n@Controller  \npublic class User{  \n\tString username;  \n\t@RequestMapping(\"/login\", method = GET)  \n\tpublic String greet(String username) {  \n\t\tthis.username= username;  \n\t\t...\n        return \" 欢迎您，\"+username+\" !\";      \n\t}  \n}\n```"
    Description_En: ''
    Advice: "使用Java EE的Servlet,struts1的Action或Spring框架写的一些单例类时，必须保证其是线程安全的。修复方式举例如下：  \n  \n**例1**：下面代码示例，使用局部变量，因为局部变量在每个线程中都有各自的实例，从而保证线程安全。  \n```java\n...  \nimport javax.servlet.http.HttpServlet;  \npublic class LoginServlet extends HttpServlet {  \n    protected void doPost(HttpServletRequest req,HttpServletResponse res) {  \n        String username = req.getParameter(\"username\");  \n        ...  \n        out.println(\" 欢迎您，\"+username+\" !\");  \n    }  \n}  \n...\n```  \n**例2**：下面代码示例，可以将User控制器设为多例，每一次请求将会新建一个User对象,从而保证线程安全。  \n```java\n@Controller  \n@Scope(\"prototype\")  \npublic class User{  \nString username;  \n    @RequestMapping(\"/login\", method = GET)  \n    public String greet(String username) {  \n        this.username= username;  \n        ... \n        return \" 欢迎您，\"+username+\" !\";      \n    }  \n}\n```  \n同样，也可以使用局部变量解决此问题。"
    Advice_En: ''
