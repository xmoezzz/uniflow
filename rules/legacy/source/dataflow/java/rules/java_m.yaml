    Description: "在JAVA EE程序中，设置了一个永远都不会过期的会话不仅会给恶意攻击者提供更多的机会，并且这样做意味着`session`对象会永远存在web服务器的内存空间中，当会话量足够大时可能会导致拒绝服务攻击。  \n  \n**例如**： 下面代码为设置了会话永远不会过期。  \n```java\nHttpSession sesssion = request.getSession(true);  \nsesssion.setMaxInactiveInterval(-1);\n```"
    Description_En: ''
    Advice: "将Session的失效时间设置为30分钟或更少，既能使用户在一段时间内与应用程序互动，又提供了一个限制窗口攻击的合理范围。  \n  \n**例如**：下面代码片段中，将Session失效时间设置为30分钟。  \n```java\nHttpSession sesssion = request.getSession(true);  \nsesssion.setMaxInactiveInterval(30*60);\n```"
