    Description: "非final对象意味着此对象可修改，基于可能被修改的对象进行同步，可能会导致死锁和不确定的行为。  \n  \n**例如**：下面代码片段中锁定了一个非final的对象。  \n```java\npublic Object lock = new Object();  \npublic void doSomething() {  \n    synchronized (lock) {  \n        // ...  \n    }  \n}\n```  \n当程序中创建Object对象，并将此对象赋给`lock`，这将导致这个新的Object对象控制锁对象。"
    Description_En: ''
    Advice: "程序中应使用private、final的Object对象作为锁对象。  \n  \n**例如**：以下代码使用了private、final的Object对象作为锁对象。  \n```java\nprivate final Object lock = new Object();  \npublic void doSomething() {  \n    synchronized (lock) {  \n        // ...  \n    }  \n}\n```"
