    Description: "邮件服务器使用的是未加密的连接，使用未加密网络发送敏感信息可能会被恶意攻击者通过拦截网络通信读取并修改信息。  \n  \n**例如**：下面代码示例中，AuthenticatingSMTPClient未使用TLS进行数据的发送。  \n```java\nAuthenticatingSMTPClient client = new AuthenticatingSMTPClient();   \nclient.connect(url);  \n...  \nWriter writer = client.sendMessageData();  \n...\n```"
    Description_En: ''
    Advice: "可使用SSL/TLS对通过网络发送的所有数据进行加密，或者将现有的未加密连接升级到SSL/TLS。  \n  \n**例如**：下面代码示例中，AuthenticatingSMTPClient未使用TLS进行数据的发送。  \n```java\nAuthenticatingSMTPClient client = new AuthenticatingSMTPClient();   \nclient.connect(url);  \n...  \nclient.execTLS();  \nWriter writer = client.sendMessageData();  \n...\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE/SANS TOP 25
        value: 2020:CWE ID 200
