    Description: 用`Thread.stop`来终止线程将释放它已经锁定的所有监视器（作为沿堆栈向上传播的未检查ThreadDeath异常的一个自然后果）。如果以前受这些监视器保护的任何对象都处于一种不一致的状态，则损坏的对象将对其他线程可见，这有可能导致任意的行为。
    Description_En: ''
    Advice: '`Thread.stop`的许多使用都应由只修改某些变量以指示目标线程应该停止运行的代码来取代。目标线程应定期检查该变量，并且如果该变量指示它要停止运行，则从其运行方法依次返回。如果目标线程等待很长时间（例如基于一个条件变量），则应使用`interrupt`方法来中断该等待。'
    Advice_En: ''
    References:
