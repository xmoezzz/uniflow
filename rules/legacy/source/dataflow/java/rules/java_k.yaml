  - id: '02000010141300'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 12. 与线程安全相关的其他规则 (TSM)
      - type: DetailClassChin
        value: TSM00-J：不要使用非线程安全方法来覆写线程安全方法
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 12. Thread-Safety Miscellaneous (TSM)
      - type: DetailClassChin
        value: TSM00-J:Do not override thread-safe methods with methods that are not thread-safe
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "当一个依赖于基类提供线程安全的客户无意中对子类的实例进行操作时，如果使用对并发不安全的方法来覆写线程安全的方法，会导致不恰当的同步。比如，如果子类提供了对并发操作不安全的实现，那么可能会违反一个被覆写的同步方法的合约。这样的覆写很容易造成难以诊断的错误。因此，程序禁止使用非并发安全的方法来覆写线程安全方法。  \n**不规范的代码样例1（同步方法）**：  \n这个不规范的代码示例在Derived类中使用了一个非同步的方法覆写了Base类中的同步方法doSomething。\n```java\nclass Base {\n  public synchronized void doSomething() {\n    // ...\n  }\n}\n\nclass Derived extends Base {\n  @Override public void doSomething() {\n    // ...\n  }\n}\n```\nBase类中的`doSomething()`方法可以安全的被多个线程使用，但这并不适用于Derived子类的实例。  \n因为接受Base实例的线程同时也接受它的子类的实例，所以可能很难诊断这个程序的错误。因此，客户可能不会意识到他们是在对继承了线程安全的类的非线程安全的子类实例进行操作。  \n**不规范的代码样例2（私有锁）**：  \n根据规则LCK00-J，这个不符合规范的代码示例在Base类中定义的`doSomething()`方法使用了一个私有的final锁对象。  \n```java\nclass Base {\n  private final Object lock = new Object();\n\n  public void doSomething() {\n    synchronized (lock) {\n      // ...\n    }\n  }\n}\n\nclass Derived extends Base {\n  Logger logger = // Initialize\n\n  @Override public void doSomething() {\n    try {\n      super.doSomething();\n    } finally {\n      logger.log(Level.FINE, \"Did something\");\n    }\n  }\n}\n```\n多个线程有可能造成记入日志的条目有着和任务执行不一样的顺序。因此，Derived类的doSomething方法是非线程安全的，不能安全的被多个线程调用。"
    Description_En: |-
      Overriding thread-safe methods with methods that are unsafe for concurrent use can result in improper synchronization when a client that depends on the thread-safety promised by the parent inadvertently operates on an instance of the subclass. For example, an overridden synchronized method's contract can be violated when a subclass provides an implementation that is unsafe for concurrent use. Such overriding can easily result in errors that are difficult to diagnose. Consequently, programs must not override thread-safe methods with methods that are unsafe for concurrent use.

      The locking strategy of classes designed for inheritance should always be documented. This information can subsequently be used to determine an appropriate locking strategy for subclasses (see LCK00-J. Use private final lock objects to synchronize classes that may interact with untrusted code and LCK11-J. Avoid client-side locking when using classes that do not commit to their locking strategy).

      **Noncompliant Code Example (Synchronized Method)**

      This noncompliant code example overrides the synchronized `doSomething()` method in the `Base` class with an unsynchronized method in the `Derived` class:

      ```java
      class Base {
        public synchronized void doSomething() {
          // ...
        }
      }

      class Derived extends Base {
        @Override public void doSomething() {
          // ...
        }
      }
      ```

      The `doSomething()` method of the `Base` class can be safely used by multiple threads, but instances of the `Derived` subclass cannot.

      This programming error can be difficult to diagnose because threads that accept instances of `Base` can also accept instances of its subclasses. Consequently, clients could be unaware that they are operating on a thread-unsafe instance of a subclass of athread-safe class.

      **Noncompliant Code Example (Private Lock)**

      This noncompliant code example defines a `doSomething()` method in the `Base` class that uses a private final lock in accordance with LCK00-J. Use private final lock objects to synchronize classes that may interact with untrusted code.

      ```java
      class Base {
        private final Object lock = new Object();

        public void doSomething() {
          synchronized (lock) {
            // ...
          }
        }
      }

      class Derived extends Base {
        Logger logger = // Initialize

        @Override public void doSomething() {
          try {
            super.doSomething();
          } finally {
            logger.log(Level.FINE, "Did something");
          }
        }
      }
      ```

      It is possible for multiple threads to cause the entries to be logged in an order that differs from the order in which the tasks are performed. Consequently, the `doSomething()` method of the `Derived` class cannot be used safely by multiple threads because it is not thread-safe.
    Advice: "**规范的使用样例1（同步方法）**：  \n```java\nclass Base {\n    public synchronized void doSomething() {\n        // ...\n    }\n}\n\nclass Derived extends Base {\n    @Override\n    public synchronized void doSomething() {\n        // ...\n    }\n}\n```  \n这个符合规范的方案同步了基类中的`doSomething()`方法。  \n**规范的使用样例2（私有的final锁对象）**：  \n```java\nclass Base {\n\n    public synchronized void doSomething() {\n        // ...\n    }\n}\n\nclass Derived extends Base {\n    private final Object lock = new Object();\n\n    @Override\n    public void doSomething() {\n        synchronized (lock) {\n            // ...\n        }\n    }\n}\n```   \n通过使用一个基于私有final锁对象来同步的方法覆写Base类中的同步方法`doSomething()`,这个符合规则的方案确保了Derived类是线程安全的。  \n**规范的使用样例3（私有锁）**：  \n```java\nclass Base {\n    private final Object lock = new Object();\n\n    public void doSomething() {\n        synchronized (lock) {\n            // ...\n        }\n    }\n}\n\nclass Derived extends Base {\n    Logger logger = // Initialize  \n\n    private final Object lock = new Object();\n\n    @Override\n    public void doSomething() {\n        synchronized (lock) {\n            try {\n                super.doSomething();\n            } finally {\n                logger.log(Level.FINE, \"Did something\");\n            }\n        }\n    }\n}\n```\n这个符合规范的方案使用自己的私有final锁对象来同步子类的`doSomething()`方法。Derived 和 Base 对象维持着各自的锁，而且不能访问对方的锁。因此，Derived可以提供线程安全保证并和Base相互独立。"
    Advice_En: |-
      **Compliant Solution (Synchronized Method)**

      TThis compliant solution synchronizes the doSomething() method of the subclass:

      ```java
      class Base {
        public synchronized void doSomething() {
          // ...
        }
      }

      class Derived extends Base {
        @Override public synchronized void doSomething() {
          // ...
        }
      }
      ```

      This solution also complies with LCK00-J. Use private final lock objects to synchronize classes that may interact with untrusted code because the accessibility of the class is package-private. Package-private accessibility is permitted when untrusted code cannot infiltrate the package.
      **Compliant Solution (Private Final Lock Object)**

      This compliant solution ensures that the `Derived` class is thread-safe by overriding the synchronized `doSomething()` method of the `Base` class with a method that synchronizes on a private final lock object.

      ```java
      class Base {

        public synchronized void doSomething() {
          // ...
        }
      }

      class Derived extends Base {
        private final Object lock = new Object();

        @Override public void doSomething() {
          synchronized (lock) {
            // ...
          }
        }
      }
      ```

      This is an acceptable solution, provided the locking policy of the `Derived` class is consistent with that of the `Base` class.
      **Compliant Solution (Private Lock)**

      This compliant solution synchronizes the `doSomething()` method of the subclass using its own private final lock object:

      ```java
      class Base {
        private final Object lock = new Object();

        public void doSomething() {
          synchronized (lock) {
            // ...
          }
        }
      }

      class Derived extends Base {
        Logger logger = // Initialize

        private final Object lock = new Object();

        @Override public void doSomething() {
          synchronized (lock) {
            try {
              super.doSomething();
            } finally {
              logger.log(Level.FINE, "Did something");
            }
          }
        }
      }
      ```

      Note that the `Base` and `Derived` objects maintain distinct locks that are inaccessible from each other's classes. Consequently, `Derived` can provide thread-safety guarantees independent of `Base`.
