        value: FIO04-J:Release resources when they are no longer needed
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "Java的垃圾回收机制可以回收那些没有引用而且没有被释放的内存。然而，垃圾回收不能释放那些非内存资源，例如打开的文件描述和数据库连接。因此，如果不能释放这样的资源会导致资源耗尽攻击。另外，在等待`finalize()`方法释放像Lock或者Semaphone对象的资源时，程序会经历资源枯竭，这种情况是因为Java不能保证什么时候执行`finalize()`方法，而只能保证它在程序结束前某个时刻执行。最后，输出流会引用缓存对象，直至输出流关闭为止，垃圾回收才会收集缓存对象，所以，输出流在使用后应该及时的关闭。  \n依赖`finalize()`方法释放系统资源，或者对使用哪部分程序来负责释放资源有疑问的话，一个程序就会发生资源泄漏。在一个忙碌的系统中，攻击者利用调用`finalize()`方法之前的延时引入Dos攻击。  \n程序员需要在非终结器方法中释放除原始内存之外的资源。  \n风险评估：违反该条准则可能会导致资源耗尽。    \n**不规范的代码样例1**：  \n```java\npublic int processFile(String fileName) throws IOException, FileNotFoundException {\n    FileInputStream stream = new FileInputStream(fileName);\n    BufferedReader bufRead = new BufferedReader(new InputStreamReader(stream));\n    String line;\n    while ((line = bufRead.readLine()) != null) {\n        sendLine(line);\n    }\n    return 1;\n}\n```  \n代码打开并使用了一个文件输入流，但没有的显式的关闭这个文件流。  \n**不规范的代码样例2**：  \n```java\npublic void getResults(String sqlQuery) {\n    try {\n        Connection conn = getConnection();\n        Statement stmt = conn.createStatement();\n        ResultSet rs = stmt.executeQuery(sqlQuery);\n        processResults(rs);\n        stmt.close();\n        conn.close();\n    } catch (SQLException e) {\n        /* forward to handler */ \n    }\n}\n```  \n代码打开并使用了一个数据库连接，使用完后，没有显式的关闭这个连接。这种情况下，资源池耗尽问题会更严重。  \n**不规范的代码样例3**：  \n```java\nStatement stmt = null;\nResultSet rs = null;\nConnection conn = getConnection();\ntry {\n  stmt = conn.createStatement();\n  rs = stmt.executeQuery(sqlQuery);\n  processResults(rs);\n} catch(SQLException e) {\n  // Forward to handler\n} finally {\n  rs.close();\n  stmt.close();\n  conn.close();\n}\n```  \n代码通过finally来释放数据库连接资源，然而，调用`rs.close()、stmt.close()`时会抛出NullPointerException，导致在这两个方法调用后的代码不能执行。"
    Description_En: |-
      The Java garbage collector is called to free unreferenced but as-yet unreleased memory. However, the garbage collector cannot free nonmemory resources such as open file descriptors and database connections. Consequently, failing to release such resources can lead to resource exhaustion attacks.In addition, programs can experience resource starvation while waiting for a finalizer to release resources such as Lock or Semaphore objects. This can occur because Java lacks any temporal guarantee of when finalizers execute other than "sometime before program termination." Finally, output streams may cache object references; such cached objects are not garbage-collected until after the output stream is closed. Consequently, output streams should be closed promptly after use.

      A program may leak resources when it relies on finalizers to release system resources or when there is confusion over which part of the program is responsible for releasing system resources. In a busy system, the delay before the finalizer is called for an object provides a window of vulnerability during which an attacker could induce a denial-of-service (DoS) attack. Consequently, resources other than raw memory must be explicitly freed in nonfinalizer methods because of the unsuitability of using finalizers. See MET12-J. Do not use finalizers for additional reasons to avoid the use of finalizers.

      Note that on Windows systems, attempts to delete open files fail silently (see FIO03-J. Remove temporary files before termination for more information).

      **Noncompliant Code Example (File Handle)**

      This noncompliant code example opens a file and uses it but fails to explicitly close the file:

      ```java
      public int processFile(String fileName)
                             throws IOException, FileNotFoundException {
        FileInputStream stream = new FileInputStream(fileName);
        BufferedReader bufRead =
            new BufferedReader(new InputStreamReader(stream));
        String line;
        while ((line = bufRead.readLine()) != null) {
          sendLine(line);
        }
        return 1;
      }
      ```

      **Noncompliant Code Example (SQL Connection)**

      The problem of resource pool exhaustion is exacerbated in the case of database connections. Many database servers allow only a fixed number of connections, depending on configuration and licensing. Consequently, failure to release database connections can result in rapid exhaustion of available connections. This noncompliant code example fails to close the connection when an error occurs during execution of the SQL statement or during processing of the results:

      ```java
      public void getResults(String sqlQuery) {
        try {
          Connection conn = getConnection();
          Statement stmt = conn.createStatement();
          ResultSet rs = stmt.executeQuery(sqlQuery);
          processResults(rs);
          stmt.close(); conn.close();
        } catch (SQLException e) { /* Forward to handler */ }
      }
      ```

      **Noncompliant Code Example**

      This noncompliant code example attempts to address exhaustion of database connections by adding cleanup code in a `finally` block. However, `rs`, `stmt`, or `conn` could be `null`, causing the code in the `finally` block to throw a `NullPointerException`.

      ```java
      Statement stmt = null;
      ResultSet rs = null;
      Connection conn = getConnection();
      try {
        stmt = conn.createStatement();
        rs = stmt.executeQuery(sqlQuery);
        processResults(rs);
      } catch(SQLException e) {
        // Forward to handler
      } finally {
        rs.close();
        stmt.close(); conn.close();
      }
      ```
    Advice: "**规范的代码样例1**：  \n采用try-catch-finally语法释放创建的文件流。 \n```java \ntry {\n    final FileInputStream stream = new FileInputStream(fileName);\n    try {\n        final BufferedReader bufRead = new BufferedReader(new InputStreamReader(stream));\n        String line;\n        while ((line = bufRead.readLine()) != null) {\n            sendLine(line);\n        }\n    } finally {\n        if (stream != null) {\n            try {\n                stream.close();\n            } catch (IOException e) {\n                // forward to handler\n            }\n        }\n    }\n} catch (IOException e) {\n    // forward to handler\n}\n```  \n采用Java 7 try-with-resource 语法在try语句结束后，不论其包括的代码是正常执行完毕还是发生异常，都会自动调用资源的Close方法。  \n```java\ntry (FileInputStream stream = new FileInputStream(fileName);\n        BufferedReader bufRead = new BufferedReader(new InputStreamReader(stream))) {\n    String line;\n    while ((line = bufRead.readLine()) != null) {\n        sendLine(line);\n    }\n} catch (IOException e) {\n    // forward to handler\n}\n```  \n**规范的代码代码样例2**：  \n```java\nStatement stmt = null;\nResultSet rs = null;\nConnection conn = getConnection();\ntry {\n  stmt = conn.createStatement();\n  rs = stmt.executeQuery(sqlQuery);\n  processResults(rs);\n} catch (SQLException e) {\n  // Forward to handler\n} finally {\n  try {\n    if (rs != null) {rs.close();}\n  } catch (SQLException e) {\n    // Forward to handler\n  } finally {\n    try {\n      if (stmt != null) {stmt.close();}\n    } catch (SQLException e) {\n      // Forward to handler\n    } finally {\n      try {\n        if (conn != null) {conn.close();}\n      } catch (SQLException e) {\n        // Forward to handler\n      }\n    }\n  }\n}\n```    \n代码捕获了调用`rs.close()`或者`stmt.close()`时可能会抛出的所有异常，保证后续的关闭其他资源的代码可以正常执行。"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution releases all acquired resources, regardless of any exceptions that might occur. Even though dereferencing `bufRead` might result in an exception, the `FileInputStream` object is closed as required.

      ```java
      try {
        final FileInputStream stream = new FileInputStream(fileName);
        try {
          final BufferedReader bufRead =
              new BufferedReader(new InputStreamReader(stream));

          String line;
          while ((line = bufRead.readLine()) != null) {
            sendLine(line);
          }
        } finally {
          if (stream != null) {
            try {
              stream.close();
            } catch (IOException e) {
              // Forward to handler
            }
          }
        }
      } catch (IOException e) {
        // Forward to handler
      }
      ```

      **Compliant Solution (`try`-with-resources)**

      This compliant solution uses the `try`-with-resources statement, introduced in Java SE 7, to release all acquired resources regardless of any exceptions that might occur:

      ```java
      try (FileInputStream stream = new FileInputStream(fileName);
           BufferedReader bufRead =
               new BufferedReader(new InputStreamReader(stream))) {

        String line;
        while ((line = bufRead.readLine()) != null) {
          sendLine(line);
        }
      } catch (IOException e) {
        // Forward to handler
      }
      ```

      The `try`-with-resources construct sends any `IOException` to the `catch` clause, where it is forwarded to an exception handler. Exceptions generated during the allocation of resources (that is, the creation of the `FileInputStream` or `BufferedReader`), as well as any `IOException` thrown during execution of the `while` loop and any `IOException` generated by closing `bufRead` or `stream`, are included.
      **Compliant Solution**

      This compliant solution ensures that resources are released as required:

      ```java
      Statement stmt = null;
      ResultSet rs = null;
      Connection conn = getConnection();
      try {
        stmt = conn.createStatement();
        rs = stmt.executeQuery(sqlQuery);
        processResults(rs);
      } catch (SQLException e) {
        // Forward to handler
      } finally {
        try {
          if (rs != null) {rs.close();}
        } catch (SQLException e) {
          // Forward to handler
        } finally {
          try {
            if (stmt != null) {stmt.close();}
          } catch (SQLException e) {
            // Forward to handler
          } finally {
            try {
              if (conn != null) {conn.close();}
            } catch (SQLException e) {
              // Forward to handler
            }
          }
        }
      }
      ```
