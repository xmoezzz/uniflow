      - type: SubClassChin
        value: Rule 49. 其他 (MSC)
      - type: DetailClassChin
        value: MSC01-J：不要使用空的无限循环
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 49. Miscellaneous (MSC)
      - type: DetailClassChin
        value: MSC01-J:Do not use an empty infinite loop
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: |-
      一个空的无限循环会消耗大量的CPU计算资源而不做任何事情。优化编译器和即时系统允许去除这样的循环。
      **不规范的代码样例1**：
      代码实现了一个闲置任务，这个任务会连续的执行一个循环，却在这个循环中不执行任何指令。一个优化编译器或者即时系统会去掉这个样例中的while循环。
      ```java
      public int nop() {
          while (true) {}
      }
      ```
    Description_En: |-
      An infinite loop with an empty body consumes CPU cycles but does nothing. Optimizing compilers and just-in-time systems (JITs) are permitted to (perhaps unexpectedly) remove such a loop. Consequently, programs must not include infinite loops with empty bodies.

      **Noncompliant Code Example**

      This noncompliant code example implements an idle task that continuously executes a loop without executing any instructions within the loop. An optimizing compiler or JIT could remove the `while` loop in this example.

      ```java
      public int nop() {
        while (true) {}
      }
      ```
    Advice: |-
      **规范的代码样例1**：
      通过在while循环中调用`Thread.sleep()`方法来避免毫无意义的无限循环。这个循环体包含一些有语义的操作，并且不会被优化掉。
      ```java
      public final int DURATION = 10000; // in milliseconds

      public void nop() throws InterruptedException {
          while (true) {
              // Useful operations
              Thread.sleep(DURATION);
          }
      }
      ```
      **规范的代码样例2**：
      通过在while循环中调用`Thread.yield()`方法，它会使得这个方法中运行的线程被其他线程延迟。
      ```java
      public void nop() {
          while (true) {
              Thread.yield();
          }
      }
      ```
    Advice_En: |-
      **Compliant Solution (`Thread.sleep()`)**

      This compliant solution avoids use of a meaningless infinite loop by invoking `Thread.sleep()` within the `while` loop. The loop body contains semantically meaningful operations and consequently cannot be optimized away.

      ```java
      public final int DURATION=10000; // In milliseconds

      public void nop() throws InterruptedException {
        while (true) {
          // Useful operations
          Thread.sleep(DURATION);
        }
      }
      ```

      **Compliant Solution (`yield()`)**

      This compliant solution invokes `Thread.yield()`, which causes the thread running this method to consistently defer to other threads:

      ```java
      public void nop() {
        while (true) {
          Thread.yield();
        }
      }
      ```
