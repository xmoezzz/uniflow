  - id: '02000010140706'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 06. 方法 (MET)
      - type: DetailClassChin
        value: MET06-J：不要在clone()方法中调用可覆写的方法
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 06. Methods (MET)
      - type: DetailClassChin
        value: MET06-J:Do not invoke overridable methods in clone()
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "在`clone()`方法中调用可覆写的方法是不安全的。首先，一个恶意的子类可以对方法进行覆写并改变`clone()`方法的行为。其次，子类可以监视（甚至修改）被克隆对象创建完成之前的某一特定初始化的状态。无论哪一种情况，子类可能使克隆过程、被克隆的对象或者两者处于一个不合逻辑的状态。  \n该规则与 MET05-J.确保构造函数不调用可覆盖的方法 密切相关。\n**不规范的代码样例1**：\n样例中有2个类：CloneExample和Sub。CloneExample类调用了可被覆写的方法`doSomething()`，可被覆写的方法`CloneExample.doSomething()`设置了cookies的值，覆写的方法`Sub.doSomething()`设置了cookies的域名值。基于多态的原因，`Sub.doSomething()`方法在运行时执行了2次。第一次是`CloneExample.clone()`，另一次是在`Sub.clone()`。因此，`cookies`的值并没有被初始化，而域名值却初始化了2次。\n此外，子类改变了克隆过程并不符合逻辑的复制。因为，`CloneExample.deepCopy()`方法是在调用`Sub.doSomething()`方法之后执行的，并且`Sub.doSomething()`错误的修改了对象。\n```java\nclass CloneExample implements Cloneable {\n  HttpCookie[] cookies;\n\n  CloneExample(HttpCookie[] c) {\n    cookies = c;\n  }\n\n  public Object clone() throws CloneNotSupportedException {\n    final CloneExample clone = (CloneExample) super.clone();\n    clone.doSomething(); // Invokes overridable method\n    clone.cookies = clone.deepCopy();\n    return clone;\n  }\n\n  void doSomething() { // Overridable\n    for (int i = 0; i < cookies.length; i++) {\n      cookies[i].setValue(\"\" + i);\n    }\n  }\n\n  HttpCookie[] deepCopy() {\n    if (cookies == null) {\n      throw new NullPointerException();\n    }\n\n    // Deep copy\n    HttpCookie[] cookiesCopy = new HttpCookie[cookies.length];\n\n    for (int i = 0; i < cookies.length; i++) {\n      // Manually create a copy of each element in array\n      cookiesCopy[i] = (HttpCookie) cookies[i].clone();\n    }\n    return cookiesCopy;\n  }\n}\n\nclass Sub extends CloneExample {\n  Sub(HttpCookie[] c) {\n    super(c);\n  }\n\n  public Object clone() throws CloneNotSupportedException {\n    final Sub clone = (Sub) super.clone();\n    clone.doSomething();\n    return clone;\n  }\n\n  void doSomething() { // Erroneously executed\n    for (int i = 0;i < cookies.length; i++) {\n      cookies[i].setDomain(i + \".foo.com\");\n    }\n  }\n\n  public static void main(String[] args)\n      throws CloneNotSupportedException {\n    HttpCookie[] hc = new HttpCookie[20];\n    for (int i = 0 ; i < hc.length; i++){\n      hc[i] = new HttpCookie(\"cookie\" + i,\"\" + i);\n    }\n    CloneExample bc = new Sub(hc);\n    bc.clone();\n  }\n}\n```\n当在对象的浅拷贝上调用可覆盖的方法时，原始对象也会被修改。"
    Description_En: |-
      Calling overridable methods from the `clone()` method is insecure. First, a malicious subclass could override the method and affect the behavior of the `clone()` method. Second, a trusted subclass could observe (and potentially modify) the cloned object in a partially initialized state before its construction has concluded. In either case, the subclass could leave the clone, the object being cloned, or both in an inconsistent state. Consequently, `clone()` methods may invoke only methods that are final or private.

      This rule is closely related to MET05-J. Ensure that constructors do not call overridable methods.

      **Noncompliant Code Example**

      This noncompliant code example shows two classes, `CloneExample` and `Sub`. The class `CloneExample` calls an overridable method `doSomething()`. The overridden method sets the value of the cookies; the overriding method sets the values of the domain names. The `doSomething()` method of the subclass `Sub` is erroneously executed twice at runtime because of polymorphism. The first invocation comes from `CloneExample.clone()`, and the other comes from `Sub.clone()`. Consequently, the values of the cookies are never initialized, whereas the domains are initialized twice.

      Furthermore, the subclass not only sees the clone in an inconsistent state but also modifies the clone in a manner that creates inconsistent copies. This is because the `deepCopy()` method occurs after the call to the `doSomething()` method, and the overriding `doSomething()` implementation erroneously modifies the object.

      ```java
      class CloneExample implements Cloneable {
        HttpCookie[] cookies;

        CloneExample(HttpCookie[] c) {
          cookies = c;
        }

        public Object clone() throws CloneNotSupportedException {
          final CloneExample clone = (CloneExample) super.clone();
          clone.doSomething(); // Invokes overridable method
          clone.cookies = clone.deepCopy();
          return clone;
        }

        void doSomething() { // Overridable
          for (int i = 0; i < cookies.length; i++) {
            cookies[i].setValue("" + i);
          }
        }

        HttpCookie[] deepCopy() {
          if (cookies == null) {
            throw new NullPointerException();
          }

          // Deep copy
          HttpCookie[] cookiesCopy = new HttpCookie[cookies.length];

          for (int i = 0; i < cookies.length; i++) {
            // Manually create a copy of each element in array
            cookiesCopy[i] = (HttpCookie) cookies[i].clone();
          }
          return cookiesCopy;
        }
      }

      class Sub extends CloneExample {
        Sub(HttpCookie[] c) {
          super(c);
        }

        public Object clone() throws CloneNotSupportedException {
          final Sub clone = (Sub) super.clone();
          clone.doSomething();
          return clone;
        }

        void doSomething() { // Erroneously executed
          for (int i = 0;i < cookies.length; i++) {
            cookies[i].setDomain(i + ".foo.com");
          }
        }

        public static void main(String[] args)
            throws CloneNotSupportedException {
          HttpCookie[] hc = new HttpCookie[20];
          for (int i = 0 ; i < hc.length; i++){
            hc[i] = new HttpCookie("cookie" + i,"" + i);
          }
          CloneExample bc = new Sub(hc);
          bc.clone();
        }
      }
      ```

      When an overridable method is invoked on a shallow copy of the object, the original object is also modified.
    Advice: "`clone()`方法只能调用private或者final方法。\n**规范的代码样例1**：  \n将`CloneExample.doSomething()`和`CloneExample.deepCopy()`声明为final。  \n```java\nclass CloneExample implements Cloneable {  \n    final void doSomething() {  \n    // . . .  \n    }  \n    final HttpCookie[] deepCopy() {  \n    // . . .  \n    }  \n    // . . .  \n}\n```\n**例外情况**\nMET06-J-EX0：允许通过 `super.<em>method</em>(...)` 调用父类的方法，因为此类调用不会动态分派给子类定义的方法。 事实上，调用 `super.clone()` 是预期的行为。"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution declares both the `doSomething()` and the `deepCopy()` methods final, preventing overriding of these methods:

      ```java
      class CloneExample implements Cloneable {
        final void doSomething() {
          // ...
        }
        final HttpCookie[] deepCopy() {
          // ...
        }

        // ...
      }
      ```

      Alternative solutions that prevent invocation of overridden methods include declaring these methods private or final or declaring the class containing these methods final.

      **Exceptions**

      MET06-J-EX0: It is permitted to call a superclass's method via `super.<em>method</em>(...)`, since such calls will not be dynamically dispatched to methods defined by a subclass. In fact, calling `super.clone()` is expected behavior.
