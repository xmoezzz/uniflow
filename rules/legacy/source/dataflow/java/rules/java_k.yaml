  - id: '02000010140608'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 05. 面向对象 (OBJ)
      - type: DetailClassChin
        value: OBJ08-J：不要在内部类中暴露外部类的私有字段
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 05. Object Orientation (OBJ)
      - type: DetailClassChin
        value: OBJ08-J:Do not expose private members of an outer class from within a nested class
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "内部类指那些声明在另一个类或者接口代码块中的任何类。使用内部类容易出错，除非语义很容易理解。一个通用的形式是，仅有内部类可以访问外部类的内容。不仅内部类可以访问外部类的私有字段，而且，当前内部类被声明为public或者它包含public方法或者构造方法时，私有字段也可以通过这些方法而被任何在同一个包里的其他类访问。  \n根据Java语言规范的8.3节“数据成员声明”的描述：  \n>注意，一个基类的私有字段可以被它的一个子类访问（例如：如果这两个类是同一个类的成员）。然而，私有字段是不能被子类继承的。  \n\n风险评估：当出现一个内部类的时候，Java语言系统弱化了对外部类的私有成员的访问性，从而会导致信息泄露。  \n**不规范的代码样例1**：  \n内部类代码通过`getPoint()`方法将外部类的私有的x，y变量，暴露给了与Coordinates同一包下面的其他的类AnotherClass。\n```java\nclass Coordinates {\n  private int x;\n  private int y;\n\n  public class Point {\n    public void getPoint() {\n      System.out.println(\"(\" + x + \",\" + y + \")\");\n    }\n  }\n}\n\nclass AnotherClass {\n  public static void main(String[] args) {\n    Coordinates c = new Coordinates();\n    Coordinates.Point p = c.new Point();\n    p.getPoint();\n  }\n}\n```"
    Description_En: |-
      A nested class is any class whose declaration occurs within the body of another class or interface [JLS 2015]. The use of a nested class is error prone unless the semantics are well understood. A common notion is that only the nested class may access the contents of the outer class. Not only does the nested class have access to the private fields of the outer class, but the same fields can be accessed by any other class within the package when the nested class is declared public or if it contains public methods or constructors. As a result, the nested class must not expose the private members of the outer class to external classes or packages.

      According to The Java Language Specification (JLS), §8.3, "Field Declarations" [JLS 2015]:

      > Note that a private field of a superclass might be accessible to a subclass (for example, if both classes are members of the same class). Nevertheless, a private field is never inherited by a subclass.

      **Noncompliant Code Example**

      This noncompliant code example exposes the private `(x,y)` coordinates through the `getPoint()` method of the inner class. Consequently, the `AnotherClass` class that belongs to the same package can also access the coordinates.

      ```java
      class Coordinates {
        private int x;
        private int y;

        public class Point {
          public void getPoint() {
            System.out.println("(" + x + "," + y + ")");
          }
        }
      }

      class AnotherClass {
        public static void main(String[] args) {
          Coordinates c = new Coordinates();
          Coordinates.Point p = c.new Point();
          p.getPoint();
        }
      }
      ```
    Advice: "内部类声明为非public，并且内部类中的public方法、public构造方法不能存在访问外部类private字段的操作。  \n**规范的代码样例1**：  \n```java\nclass Coordinates {\n    private int x;\n    private int y;\n\n    private class Point {\n        private void getPoint() {\n            System.out.println(\"(\" + x + \",\" + y + \")\");\n        }\n    }\n}\n```"
    Advice_En: |-
      **Compliant Solution**

      Use the `private` access specifier to hide the inner class and all contained methods and constructors.

      ```java
      class Coordinates {
        private int x;
        private int y;

        private class Point {
          private void getPoint() {
            System.out.println("(" + x + "," + y + ")");
          }
        }
      }

      class AnotherClass {
        public static void main(String[] args) {
          Coordinates c = new Coordinates();
          Coordinates.Point p = c.new Point();    // Fails to compile
          p.getPoint();
        }
      }
      ```

      Compilation of `AnotherClass` now results in a compilation error because the class attempts to access a private nested class.
    References:
      Reference:
      - type: CWE
        value: 492:Use of Inner Class Containing Sensitive Data
