  - id: '02000010140701'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 06. 方法 (MET)
      - type: DetailClassChin
        value: MET01-J：不要使用断言验证方法参数
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 06. Methods (MET)
      - type: DetailClassChin
        value: MET01-J:Never use assertions to validate method arguments
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "依据Java语言规范的14.10节“断言”：  \n> 断言不应用于公共方法中的参数检查。 参数检查通常是方法契约的一部分，无论断言是启用还是禁用，都必须维护这个契约。\n>\n> 使用断言进行参数检查的第二个问题是错误的参数应该导致适当的运行时异常（例如`IllegalArgumentException`、`IndexOutOfBoundsException` 或`NullPointerException`）。 断言失败不会引发适当的异常。\n**不规范的代码样例1**：\n`getAbsAdd()` 方法计算并返回参数 `x` 和 `y` 的绝对值之和。 它缺乏论证验证，违反了 MET00-J.验证方法参数。 因此，由于整数溢出或者当它的一个或两个参数都是 `Integer.MIN_VALUE` 时，它可能会产生不正确的结果。\n```java\npublic static int getAbsAdd(int x, int y) {\n  return Math.abs(x) + Math.abs(y);\n}\ngetAbsAdd(Integer.MIN_VALUE, 1);\n```\n**不规范的代码样例2**：\n这个不规范的代码示例使用断言来验证公共方法的参数：\n```java\npublic static int getAbsAdd(int x, int y) {\n  assert x != Integer.MIN_VALUE;\n  assert y != Integer.MIN_VALUE;\n  int absX = Math.abs(x);\n  int absY = Math.abs(y);\n  assert (absX <= Integer.MAX_VALUE - absY);\n  return absX + absY;\n}\n```\n断言检查的条件是合理的。 但是，禁用断言时不会执行验证代码。"
    Description_En: |-
      Never use assertions to validate arguments of public methods. The Java Language Specification, §14.10, "The assert Statement" [JLS 2015], states that

      > assertions should not be used for argument checking in public methods. Argument checking is typically part of the contract of a method, and this contract must be upheld whether assertions are enabled or disabled.
      >
      > A secondary problem with using assertions for argument checking is that erroneous arguments should result in an appropriate run-time exception (such as `IllegalArgumentException`, `IndexOutOfBoundsException`, or `NullPointerException`). An assertion failure will not throw an appropriate exception.

      **Noncompliant Code Example**

      The method `getAbsAdd()` computes and returns the sum of the absolute value of parameters `x` and `y`. It lacks argument validation, in violation of MET00-J. Validate method arguments. Consequently, it can produce incorrect results because of integer overflow or when either or both of its arguments are `Integer.MIN_VALUE`.

      ```java
      public static int getAbsAdd(int x, int y) {
        return Math.abs(x) + Math.abs(y);
      }
      getAbsAdd(Integer.MIN_VALUE, 1);
      ```

      **Noncompliant Code Example**

      This noncompliant code example uses assertions to validate arguments of a public method:

      ```java
      public static int getAbsAdd(int x, int y) {
        assert x != Integer.MIN_VALUE;
        assert y != Integer.MIN_VALUE;
        int absX = Math.abs(x);
        int absY = Math.abs(y);
        assert (absX <= Integer.MAX_VALUE - absY);
        return absX + absY;
      }
      ```

      The conditions checked by the assertions are reasonable. However, the validation code is not executed when assertions are disabled.
    Advice: "**规范的代码样例1**：  \n对于int参数的有效范围校验，采用Integer.MIN_VALUE和Integer.MIN_VALUE与参数进行比较。  \n```java\npublic static int getAbsAdd(int x, int y) {\n    if (x == Integer.MIN_VALUE || y == Integer.MIN_VALUE) {\n        throw new IllegalArgumentException();\n    }\n    int absX = Math.abs(x);\n    int absY = Math.abs(y);\n    if (absX > Integer.MAX_VALUE - absY) {\n        throw new IllegalArgumentException();\n    }\n    return absX + absY;\n}\n```"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution validates the method arguments by ensuring that values passed to `Math.abs()` exclude `Integer.MIN_VALUE` and also by checking for integer overflow:

      ```java
      public static int getAbsAdd(int x, int y) {
        if (x == Integer.MIN_VALUE || y == Integer.MIN_VALUE) {
          throw new IllegalArgumentException();
        }
        int absX = Math.abs(x);
        int absY = Math.abs(y);
        if (absX > Integer.MAX_VALUE - absY) {
          throw new IllegalArgumentException();
        }
        return absX + absY;
      }
      ```

      Alternatively, the addition could be performed using type `long` and the result of the addition stored in a local variable of type `long`. This alternate implementation would require a check to ensure that the resulting `long` can be represented in the range of the type `int`. Failure of this latter check would indicate that an `int` version of the addition would have overflowed.
    References:
      Reference:
      - type: CWE
        value: 617:Reachable Assertion
