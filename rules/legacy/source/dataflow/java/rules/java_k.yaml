  - id: '02000010141003'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 09. 锁 (LCK)
      - type: DetailClassChin
        value: LCK03-J：不要基于高层并发对象的内置锁来实现同步
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 09. Locking (LCK)
      - type: DetailClassChin
        value: LCK03-J:Do not synchronize on the intrinsic locks of high-level concurrency objects
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: |-
      那些实现其中一个或者都实现了在`java.util.concurrent.locks`包中Lock和Condition接口的类，被认为是高层的并发对象。对这样的对象使用内置锁是有问题的，尽管看起来代码的功能是正确的。因此，与这些对象交互的那些程序应该仅仅使用由接口提供的锁，而不允许使用内置锁。
      因此，与这些对象交互的程序必须只使用接口提供的高级锁定工具； 禁止使用内部锁。 当代码从内部锁定重构为 `java.util.concurrent` 动态锁定实用程序时，通常会出现此问题。
      不规范的代码样**例1**：
      这个不兼容的代码示例中的 `doSomething()` 方法在 `ReentrantLock` 实例的内在锁上同步，而不是在 `ReentrantLock` 封装的可重入互斥 `Lock` 上同步。
      ```java
      private final Lock lock = new ReentrantLock();

      public void doSomething() {
        synchronized(lock) {
          // ...
        }
      }
      ```
    Description_En: |-
      Instances of classes that implement either or both of the `Lock` and `Condition` interfaces of the `java.util.concurrent.locks` package are known as high-level concurrency objects. Using the intrinsic locks of such objects is a questionable practice even in cases where the code may appear to function correctly. Code that uses the intrinsic lock of a `Lock` object is likely to interact with code that uses the `Lock` interface. These two components will believe they are protecting data with the same lock, while they are, in fact, using two distinct locks. As such, the `Lock` will fail to protect any data.

      Consequently, programs that interact with such objects must use only the high-level locking facilities provided by the interfaces; use of the intrinsic locks is prohibited. This problem generally arises when code is refactored from intrinsic locking to the `java.util.concurrent` dynamic-locking utilities.

      **Noncompliant Code Example (`ReentrantLock`)**

      The `doSomething()` method in this noncompliant code example synchronizes on the intrinsic lock of an instance of `ReentrantLock` rather than on the reentrant mutual exclusion `Lock` encapsulated by `ReentrantLock`.

      ```java
      private final Lock lock = new ReentrantLock();

      public void doSomething() {
        synchronized(lock) {
          // ...
        }
      }
      ```
    Advice: "**规范的代码样例1**：使用`lock()`和`unlock()`  \n```java\nprivate final Lock lock = new ReentrantLock();\n\npublic void doSomething() {\n  lock.lock();\n  try {\n    // ...\n  } finally {\n    lock.unlock();\n  }\n}\n```\n如果不需要 `java.util.concurrent` 包的动态锁定实用程序的高级功能，最好使用其他并发原语，例如同步和原子类。"
    Advice_En: |-
      **Compliant Solution (`lock()` and `unlock()`)**

      This compliant solution uses the `lock()` and `unlock()` methods provided by the `Lock` interface.

      ```java
      private final Lock lock = new ReentrantLock();

      public void doSomething() {
        lock.lock();
        try {
          // ...
        } finally {
          lock.unlock();
        }
      }
      ```

      In the absence of a requirement for the advanced functionality of the `java.util.concurrent` package's dynamic-locking utilities, it is better to use other concurrency primitives such as synchronization and atomic classes.
