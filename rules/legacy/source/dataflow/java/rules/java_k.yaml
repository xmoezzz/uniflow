        value: Rule 13. Input Output (FIO)
      - type: DetailClassChin
        value: FIO02-J:Detect and handle file-related errors
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "Java的文件操作方法通常使用返回值而不是抛出异常来指示其错误。  \nJava 7 以前的版本，使用java.io.File类进行文件的IO操作，但它存在不少问题。  \n其中的一个问题是：许多方法在失败时不能抛出异常，所以不可能获得有用的错误信息。比如说，如果一个文件的删除失败了，程序会得到一个“删除失败”的信息，但并不知道造成删除失败的原因。  \n因此，忽略文件操作返回值的程序常常不能发现文件操作的失败。Java程序必须对执行文件IO方法的返回值进行检查。  \n**不规范的代码样例1（`delete()`）**：\n```java\nFile file = new File(args[0]);  \nfile.delete();\n```  \n代码想删除一个文件，但却没有对操作是否成功进行判断。Java 7之前，只有程序没有足够的权限来删除文件时，才会抛出SecurityException异常，不会抛出其他异常，所以删除操作可能失败而不被觉察。"
    Description_En: |-
      Java's file-manipulation methods often indicate failure with a return value instead of throwing an exception. Consequently, programs that ignore the return values from file operations often fail to detect that those operations have failed. Java programs must check the return values of methods that perform file I/O. This is a specific instance of EXP00-J. Do not ignore values returned by methods.
      **Noncompliant Code Example (`delete()`)**

      This noncompliant code example attempts to delete a specified file but gives no indication of its success. The Java platform requires `File.delete()` to throw a `SecurityException` only when the program lacks authorization to delete the file [API 2014]. No other exceptions are thrown, so the deletion can silently fail.
      ```java
      File file = new File(args[0]);
      file.delete();
      ```
    Advice: "**规范的代码样例1**：  \n检查`File.delete()`的返回值。  \n```java\nFile file = new File(\"file\");\nif (!file.delete()) {\n  System.out.println(\"Deletion failed\");\n}\n```\n**规范的代码样例2**：  \nJava 7 以后可以使用`java.nio.file.Files.delete()`方法删除文件。  \n```java\nPath file = new File(args[0]).toPath();\ntry {\n  Files.delete(file);\n} catch (IOException x) {\n  System.out.println(\"Deletion failed\");\n  // Handle error\n}\n```"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution checks the return value of `delete()`:

      ```java
      File file = new File("file");
      if (!file.delete()) {
        System.out.println("Deletion failed");
      }
      ```

      **Compliant Solution**

      This compliant solution uses the `java.nio.file.Files.delete()` method from Java SE 7 to delete the file:

      ```java
      Path file = new File(args[0]).toPath();
      try {
        Files.delete(file);
      } catch (IOException x) {
        System.out.println("Deletion failed");
        // Handle error
      }
      ```
