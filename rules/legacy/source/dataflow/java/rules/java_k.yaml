  - id: '02000010141405'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 13. 输入输出 (FIO)
      - type: DetailClassChin
        value: FIO05-J：不要让使用wrap()或duplicate()创建缓存暴露给非受信代码
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 13. Input Output (FIO)
      - type: DetailClassChin
        value: FIO05-J:Do not expose buffers or their backing arrays methods to untrusted code
    BugServerity: 5
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "Buffer类在java.nio包中定义，如IntBuffer、CharBuffer和ByteBuffer，同时还定义了一系列的`wrap()`方法来封装对应的基础数据类型，将其封装到一个缓冲区中，并返回一个Buffer对象来代表这个缓存区。这些方法创建了一个新的Buffer对象，新的Buffer对象由指定的输入数组支持。根据JavaAPI文档对这些方法的描述：新的缓存区由指定的字符数组来支持，也就是说，对缓冲区的修改会导致数值的修改，反之亦然。  \n将这些缓冲区暴露给非受信的代码，背后的数组也会暴露，可能会遭到恶意的修改。同样，`duplicate()`创建了额外的缓存区，这个缓存区的背后是支持原始缓冲区的数组。暴露额外的缓冲区给非受信的代码，同样这个缓存区也会暴露。  \n风险评估：违反该条准则会导致非受信的代码修改原始数据。    \n**不规范的代码样例1**：  \n```java\nfinal class Wrap {\n    private char[] dataArray;\n\n    public Wrap() {\n        dataArray = new char[10];\n        // Initialize\n    }\n\n    public CharBuffer getBufferCopy() {\n        return CharBuffer.wrap(dataArray);\n    }\n}\n```  \n代码声明了一个char数组，将其封装在一个缓存区里，并且将那个缓存区通过`getBufferCopy()`方法暴露给非受信代码。  \n**不规范的代码样例2**：  \n```java\nfinal class Dup {\n    CharBuffer cb;\n\n    public Dup() {\n        cb = CharBuffer.allocate(10);\n        // Initialize\n    }\n\n    public CharBuffer getBufferCopy() {\n        return cb.duplicate();\n    }\n}\n```\n代码调用`duplicate()`方法来创建并返回一个对CharBuffer的复制。"
    Description_En: |-
      Buffer classes defined in the java.nio package, such as IntBuffer, CharBuffer, and ByteBuffer, define a variety of methods that wrap an array (or a portion of the array) of the corresponding primitive data type into a buffer and return the buffer as a Buffer object. Although these methods create a new Buffer object, the new Buffer is backed by the given input array. According to the Java API for these methods [API 2014],

      > The new buffer will be backed by the given character array; that is, modifications to the buffer will cause the array to be modified and vice versa.

      Exposing these buffers to untrusted code exposes the backing array of the original buffer to malicious modification. Likewise, the `duplicate()`, `array()`, `slice()`, and `subsequence()` methods create additional buffers that are backed by the original buffer's backing array; exposing such additional buffers to untrusted code affords the same opportunity for malicious modification.
      This rule is an instance of OBJ06-J. Defensively copy mutable inputs and mutable internal components.
      **Noncompliant Code Example (`wrap()`)**

      This noncompliant code example declares a `char` array, wraps it within a `CharBuffer`, and exposes that `CharBuffer` to untrusted code via the `getBufferCopy()` method:

      ```java
      final class Wrap {
        private char[] dataArray;

        public Wrap() {
          dataArray = new char[10];
          // Initialize
        }

        public CharBuffer getBufferCopy() {
          return CharBuffer.wrap(dataArray);
        }
      }
      ```
      **Noncompliant Code Example (`duplicate()`)**

      This noncompliant code example invokes the `duplicate()` method to create and return a copy of the `CharBuffer`. As stated in the contract for the `duplicate()` method, the returned buffer is backed by the same array as is the original buffer. Consequently, if a caller were to modify the elements of the backing array, these modifications would also affect the original buffer.

      ```java
      final class Dup {
        CharBuffer cb;

        public Dup() {
          cb = CharBuffer.allocate(10);
          // Initialize
        }

        public CharBuffer getBufferCopy() {
          return cb.duplicate();
        }
      }
      ```
    Advice: "**规范的代码样例1**：  \n```java\nfinal class Wrap {\n    private char[] dataArray;\n\n    public Wrap() {\n        dataArray = new char[10];\n        // Initialize\n    }\n\n    public CharBuffer getBufferCopy() {\n        return CharBuffer.wrap(dataArray).asReadOnlyBuffer();\n    }\n}\n```  \n代码以一个只读形式返回一个字节数组的视图，在标准的类库中，可以保证一个对CharBuffer中元素的修改会导致一个`java.nio.ReadOnlyBufferException`异常。  \n**规范的代码样例2**：  \n```java\nfinal class Dup {\n    CharBuffer cb;\n\n    public Dup() {\n        cb = CharBuffer.allocate(10);\n        // Initialize\n    }\n\n    public CharBuffer getBufferCopy() {\n        return cb.asReadOnlyBuffer();\n    }\n}\n```  \n返回一个只读视图。"
    Advice_En: |-
      **Compliant Solution (`asReadOnlyBuffer()`)**

      This compliant solution returns a read-only view of the `char` array in the form of a read-only `CharBuffer`. The standard library implementation of `CharBuffer` guarantees that attempts to modify the elements of a read-only `CharBuffer` will result in a `java.nio.ReadOnlyBufferException`.

      ```java
      final class Wrap {
        private char[] dataArray;

        public Wrap() {
          dataArray = new char[10];
          // Initialize
        }

        public CharBuffer getBufferCopy() {
          return CharBuffer.wrap(dataArray).asReadOnlyBuffer();
        }
      }
      ```

      **Compliant Solution (`asReadOnlyBuffer()`)**

      This compliant solution exposes a read-only view of the `CharBuffer` to untrusted code:

      ```java
      final class Dup {
        CharBuffer cb;

        public Dup() {
          cb = CharBuffer.allocate(10);
          // Initialize
        }

        public CharBuffer getBufferCopy() {
          return cb.asReadOnlyBuffer();
        }
      }
      ```
