  - id: '02000010140207'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 00. 输入验证和数据处理 (IDS)
      - type: DetailClassChin
        value: IDS07-J：净化传递给Runtime.exec()方法的非受信数据
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 00. Input Validation and Data Sanitization (IDS)
      - type: DetailClassChin
        value: IDS07-J:Sanitize untrusted data passed to the Runtime.exec() method
    BugServerity: 5
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "外部程序通常被系统调用来完成某种需要的功能。这是一种重用的形式，也被认为是一种简单基于组件的软件工程方法。在应用没有净化非受信的输入并且在执行外部程序时使用这种数据，就会导致产生命令和参数注入漏洞。  \n每一个Java应用都有一个唯一的Runtime类的实例，通过它可以提供一个应用和应用运行环境的接口。当前的Runtime对象可以通过`Runtime.getRuntime()`方法获得。`Runtime.getRuntime()`的语义定义并不严格，所以最好仅仅使用它的那些必要的行为，然而，在通常情况下，它应当被命令直接调用，而不应通过shell来调用。如果需要使用shell来调用它，可以在POSIX中使用`/bin/sh`或者在Windows平台中使用cmd.exe的方式。作为`exec()`的另一种形式，它会使用StringTokenizer来分隔从命令行读入的字符串。在Windows平台中，在处理这些符号时，它们会被连接成一个单一的参数字符串。  \n因而，除非显式地调用命令行解释器，否则是不会产生命令行注入攻击的。然而，当参数中包含那些以空格、双引号或者其他以- /开头的用来表示分支的字符时，就可能发生参数注入攻击。  \n任何源于程序受信边界之外的字符串数据，在当前平台作为命令来执行之前，都必须经过净化。  \n**不规范的代码样例1（Windows）**：\n```java\nclass DirList {\n  public static void main(String[] args) throws Exception {\n    String dir = System.getProperty(\"dir\");\n    Runtime rt = Runtime.getRuntime();\n    Process proc = rt.exec(\"cmd.exe /C dir \" + dir);\n    int result = proc.waitFor();\n    if (result != 0) {\n      System.out.println(\"process error: \" + result);\n    }\n    InputStream in = (result == 0) ? proc.getInputStream() :\n                                     proc.getErrorStream();\n    int c;\n    while ((c = in.read()) != -1) {\n      System.out.print((char) c);\n    }\n  }\n}\n```\n该代码示例使用dir命令列出目录列表。这是通过`Runtime.exec()`方法调用Windows的dir命令来实现的。因为`Runtime.exec()`方法接受源于运行环境的未经净化的数据，所以这些代码会引起命令注入攻击。  \n攻击者可以通过以下命令利用该程序：  \n`java -Ddir='dummy & echo bad' Java`   \n该命令实际上执行的是两条命令：  \n`cmd.exe /C dir dummy & echo bad`   \n第一条命令会列出并不存在的dummy文件夹，并且在控制台上输出bad。  \n**不规范的代码样例2（POSIX）**：  \n```java\nclass DirList {\n  public static void main(String[] args) throws Exception {\n    String dir = System.getProperty(\"dir\");\n    Runtime rt = Runtime.getRuntime();\n    Process proc = rt.exec(new String[] {\"sh\", \"-c\", \"ls \" + dir});\n    int result = proc.waitFor();\n    if (result != 0) {\n      System.out.println(\"process error: \" + result);\n    }\n    InputStream in = (result == 0) ? proc.getInputStream() :\n                                     proc.getErrorStream();\n    int c;\n    while ((c = in.read()) != -1) {\n      System.out.print((char) c);\n    }\n  }\n}\n```\n这一个代码示例只是使用了POSIX中的ls命令。与Windows版本的唯一区别在于传入`Runtime.exec()`的参数。  \n攻击者可以通过使用与上例中一样的命令取得同样的效果。这个命令实际执行的是：  \n`sh -c 'ls dummy & echo bad'`"
    Description_En: |-
      External programs are commonly invoked to perform a function required by the overall system. This practice is a form of reuse and might even be considered a crude form of component-based software engineering. Command and argument injection vulnerabilities occur when an application fails to sanitize untrusted input and uses it in the execution of external programs.

      Every Java application has a single instance of class `Runtime` that allows the application to interface with the environment in which the application is running. The current runtime can be obtained from the `Runtime.getRuntime()` method. The semantics of `Runtime.exec()` are poorly defined, so it is best not to rely on its behavior any more than necessary, but typically it invokes the command directly without a shell. If you want a shell, you can use `/bin/sh -c` on POSIX or `cmd.exe` on Windows. The variants of `exec()` that take the command line as a single string split it using a `StringTokenizer`. On Windows, these tokens are concatenated back into a single argument string before being executed.

      Consequently, command injection attacks cannot succeed unless a command interpreter is explicitly invoked. However, argument injection attacks can occur when arguments have spaces, double quotes, and so forth, or when they start with a `-` or `/` to indicate a switch.

      Any string data that originates from outside the program's trust boundary must be sanitized before being executed as a command on the current platform.

      **Noncompliant Code Example (Windows)**

      This noncompliant code example provides a directory listing using the `dir` command. It is implemented using `Runtime.exec()` to invoke the Windows `dir` command.

      ```java
      class DirList {
        public static void main(String[] args) throws Exception {
          String dir = System.getProperty("dir");
          Runtime rt = Runtime.getRuntime();
          Process proc = rt.exec("cmd.exe /C dir " + dir);
          int result = proc.waitFor();
          if (result != 0) {
            System.out.println("process error: " + result);
          }
          InputStream in = (result == 0) ? proc.getInputStream() :
                                           proc.getErrorStream();
          int c;
          while ((c = in.read()) != -1) {
            System.out.print((char) c);
          }
        }
      }
      ```

      Because `Runtime.exec()` receives unsanitized data originating from the environment, this code is susceptible to a command injection attack.

      An attacker can exploit this program using the following command:

      ```
      java -Ddir='dummy & echo bad' Java
      ```

      The command executed is actually two commands:

      ```
      cmd.exe /C dir dummy & echo bad
      ```

      which first attempts to list a nonexistent `dummy` folder and then prints `bad` to the console.

      **Noncompliant Code Example (POSIX)**

      This noncompliant code example provides the same functionality but uses the POSIX `ls` command. The only difference from the Windows version is the argument passed to `Runtime.exec()`.

      ```java
      class DirList {
        public static void main(String[] args) throws Exception {
          String dir = System.getProperty("dir");
          Runtime rt = Runtime.getRuntime();
          Process proc = rt.exec(new String[] {"sh", "-c", "ls " + dir});
          int result = proc.waitFor();
          if (result != 0) {
            System.out.println("process error: " + result);
          }
          InputStream in = (result == 0) ? proc.getInputStream() :
                                           proc.getErrorStream();
          int c;
          while ((c = in.read()) != -1) {
            System.out.print((char) c);
          }
        }
      }
      ```

      The attacker can supply the same command shown in the previous noncompliant code example with similar effects. The command executed is actually

      ```java
      sh -c 'ls dummy & echo bad'
      ```
    Advice: "**规范的代码样例1（Sanitization）**：\n符合规则的方案会对非受信的用户输入进行净化，这种净化只允许一小组列入白名单的字符出现在参数中，并传给`Runtime.exec()`方法，其他所有的字符都会被排除掉。  \n ```java\n// ...    \nif (!Pattern.matches(\"[0-9A-Za-z@.]+\", dir)) {    \n    // Handle error    \n}    \n// ...\n```   \n尽管这是一个符合规则的方案，这个净化方案会拒绝合法的目录。同时，因为命令行解释器调用是依赖于系统的，所以很难有一个方案可以应付所有Java程序可以运行的平台上的命令行注入。  \n**规范的代码样例2（限制用户选择）**：\n这个符合规则的方案通过只向`Runtime.exec()`方法输入那些受信的字符串来防止命令注入。当用户可以控制使用哪一个字符串时，用户就可以不向`Runtime.exec()`方法直接提供字符串数据。  \n```java\n// ...    \nString dir = null;\n// only allow integer choices\nint number = Integer.parseInt(System.getproperty(\"dir\"));\nswitch (number) {\ncase 1:\n    dir = \"data1\";\n    break; // Option 1\ncase 2:\n    dir = \"data2\";\n    break; // Option 2\ndefault: // invalid\n    break;\n}\nif (dir == null) {\n    // handle error\n}\n```   \n这个方案将可能罗列出的目录直接写出来了。  \n如果有许多可用目录这个方案很快会变得不好管理。一个更富可伸缩性的方案是从一个属性文件中读取所有允许的目录至java.util.Properties对象中。  \n**规范的代码样例3（避免使用Runtime.exec()）**： \n```java\nimport java.io.File;\nclass DirList {\n    public static void main(String[] args) throws Exception {\n        File dir = new File(System.getProperty(\"dir\"));\n        if (!dir.isDirectory()) {\n            System.out.println(\"Not a directory\");\n        } else {\n            for (String file : dir.list()) {\n                System.out.println(file);\n            }\n        }\n    }\n} \n``` \n当通过执行系统命令可以完成的任务也可以用其他方式完成时，最好避免用执行系统命令的方式。这个符合规则的方案使用`File.list()`方法来提供目录列表，从而消除了命令或参数注入攻击发生的可能性。"
    Advice_En: |-
      **Compliant Solution (Sanitization)**

      This compliant solution sanitizes the untrusted user input by permitting only a small group of whitelisted characters in the argument that will be passed to `Runtime.exec()`; all other characters are excluded.

      ```java
      // ...
      if (!Pattern.matches("[0-9A-Za-z@.]+", dir)) {
        // Handle error
      }
      // ...
      ```

      Although it is a compliant solution, this sanitization approach rejects valid directories. Also, because the command interpreter invoked is system dependent, it is difficult to establish that this solution prevents command injections on every platform on which a Java program might run.

      **Compliant Solution (Restricted User Choice)**

      This compliant solution prevents command injection by passing only trusted strings to `Runtime.exec()`. The user has control over which string is used but cannot provide string data directly to `Runtime.exec()`.

      ```java
      // ...
      String dir = null;

      int number = Integer.parseInt(System.getProperty("dir")); // Only allow integer choices
      switch (number) {
        case 1:
          dir = "data1";
          break; // Option 1
        case 2:
          dir = "data2";
          break; // Option 2
        default: // Invalid
          break;
      }
      if (dir == null) {
        // Handle error
      }
      ```

      This compliant solution hard codes the directories that may be listed.

      This solution can quickly become unmanageable if you have many available directories. A more scalable solution is to read all the permitted directories from a properties file into a `java.util.Properties` object.

      **Compliant Solution (Avoid `Runtime.exec()`)**

      When the task performed by executing a system command can be accomplished by some other means, it is almost always advisable to do so. This compliant solution uses the `File.list()` method to provide a directory listing, eliminating the possibility of command or argument injection attacks.

      ```java
      import java.io.File;

      class DirList {
        public static void main(String[] args) throws Exception {
          File dir = new File(System.getProperty("dir"));
          if (!dir.isDirectory()) {
            System.out.println("Not a directory");
          } else {
            for (String file : dir.list()) {
              System.out.println(file);
            }
          }
        }
      }
      ```
