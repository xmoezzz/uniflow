        value: 污点规范
      - type: SubClassChin
        value: Rule 06. 方法 (MET)
      - type: DetailClassChin
        value: MET05-J：确保构造函数不会调用可覆写的方法
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 06. Methods (MET)
      - type: DetailClassChin
        value: MET05-J:Ensure that constructors do not call overridable methods
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "根据Java语言规范中12.5节“创建类的新实例”的描述：  \n> 在创建类的新实例时：Java编程语言没有为方法派生指定变更的规则。如果在初始化的对象的子类中覆写了被调用的方法，则将会使用这些覆写的方法，即使在新实例还没完全初始化。\n\n在创建对象时调用可覆写的方法可能造成使用未初始化的数据，进而导致执行异常或是预期外的结果。在构造函数中调用可覆写的方法也会在对象创建完成前泄露this引用，这会使得其他线程可能访问到未初始化或不一致的数据。  \n**不规范的代码样例1**：\n这个不合规的代码示例导致 `doLogic()` 方法使用了未初始化的数据：\n```java\nclass SuperClass {\n  public SuperClass () {\n    doLogic();\n  }\n\n  public void doLogic() {\n    System.out.println(\"This is superclass!\");\n  }\n}\n\nclass SubClass extends SuperClass {\n  private String color = \"red\";\n\n  public void doLogic() {\n    System.out.println(\"This is subclass! The color is :\" + color);\n    // ...\n  }\n}\n\npublic class Overridable {\n  public static void main(String[] args) {\n    SuperClass bc = new SuperClass();\n    // Prints \"This is superclass!\"\n    SuperClass sc = new SubClass();\n    // Prints \"This is subclass! The color is :null\"\n  }\n}\n```\n方法`doLogic()`使用了未初始化的数据。 方法`doLogic()`是在基类的构造方法中调用的。当直接创建基类的实例时：将调用基类中的方法`doLogic()`，从而正确的完成执行。然而，当子类发起基类的创建时，却调用了子类的`doLogic()`方法，在这种情况下，因为子类的构造方法还没有完成执行，所以`color`的数值还是null。"
    Description_En: |-
      According to The Java Language Specification, §12.5, "Creation of New Class Instances" [JLS 2015]:

      > Unlike C++, the Java programming language does not specify altered rules for method dispatch during the creation of a new class instance. If methods are invoked that are overridden in subclasses in the object being initialized, then these overriding methods are used, even before the new object is completely initialized.

      Invocation of an overridable method during object construction may result in the use of uninitialized data, leading to runtime exceptions or to unanticipated outcomes. Calling overridable methods from constructors can also leak the this reference before object construction is complete, potentially exposing uninitialized or inconsistent data to other threads (see TSM01-J. Do not let the this reference escape during object construction for additional information). As a result, a class's constructor must invoke (directly or indirectly) only methods in that class that are static, final or private.

      **Noncompliant Code Example**

      This noncompliant code example results in the use of uninitialized data by the `doLogic()` method:

      ```java
      class SuperClass {
        public SuperClass () {
          doLogic();
        }

        public void doLogic() {
          System.out.println("This is superclass!");
        }
      }

      class SubClass extends SuperClass {
        private String color = "red";

        public void doLogic() {
          System.out.println("This is subclass! The color is :" + color);
          // ...
        }
      }

      public class Overridable {
        public static void main(String[] args) {
          SuperClass bc = new SuperClass();
          // Prints "This is superclass!"
          SuperClass sc = new SubClass();
          // Prints "This is subclass! The color is :null"
        }
      }
      ```

      The `doLogic()` method is invoked from the superclass's constructor. When the superclass is constructed directly, the `doLogic()` method in the superclass is invoked and executes successfully. However, when the subclass initiates the superclass's construction, the subclass's `doLogic()` method is invoked instead. In this case, the value of `color` is still `null` because the subclass's constructor has not yet concluded.
    Advice: "构造函数只能调用private或者final方法。\n**规范的代码样例1**：  \n```java\nclass SuperClass {\n    public SuperClass() {\n        doLogic();\n    }\n\n    public final void doLogic() {\n        System.out.println(\"This is superclass!\");\n    }\n}\n```"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution declares the `doLogic()` method as final so that it cannot be overridden:

      ```java
      class SuperClass {
        public SuperClass() {
          doLogic();
        }

        public final void doLogic() {
          System.out.println("This is superclass!");
        }
      }
      ```
