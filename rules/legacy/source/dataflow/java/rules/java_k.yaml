    Description: "实体声明定义了常用文本或特殊字符的快捷方式。实体声明可以定义内部实体或外部实体。对于内部实体，实体的内容在声明中给出。对于外部实体，内容由统一资源标识符（URI）指定。\n实体可以是解析的，也可以是未解析的。已解析实体的内容称为其替换文本。未解析实体是一种资源，其内容可能是文本，也可能不是文本，如果是文本，则可能不是XML。已解析的实体通过实体引用来调用；未解析的实体通过名称来调用。\n根据XML W3C 4.4.3小节的建议[W3C 2008]：“包含所需的验证”部分：\n>当一个XML处理器找到一个已经解析过的实例的引用的时候，为了验证这个文档，处理器必须包含它的替代字段。如果该实体是外部的，而且处理器不打算验证这个XML文档，那么处理器可以（但不必）包含该实体的替代字段。\n\n由于包含来自外部实体的替换文本是可选的，因此并非所有XML处理器在验证期间都容易受到外部实体攻击。\n当包含外部实体引用的XML输入由配置不当的XML解析器处理时，就会发生XML外部实体（XXE）攻击。攻击者可能会通过操纵实体的URI来引用本地文件系统中包含密码和私人用户数据等敏感数据的文件，从而使用XXE攻击来访问敏感信息。攻击者可能会发起拒绝服务攻击，例如，将`/dev/random`或`/dev/tty`指定为输入URI，这可能会导致程序崩溃或永久阻塞程序。\n**不规范的代码样例1**：  \n下面的代码尝试对`evil.xml`进行解析，并且报告相关错误，然后退出。然而，SAX或者DOM解析器会尝试访问在SYSTEM属性中标识的URL，这意味着它将读取一个本地的`/dev/tty`文件的内容。在POSIX系统中，读取这个文件会导致程序阻塞，直到可以通过计算机控制台得到输入数据为止。攻击者可以使用这一类的恶意XML文件来导致系统挂起。\n```java\nimport java.io.FileInputStream;\nimport java.io.IOException;\nimport java.io.InputStream;\n\nimport javax.xml.parsers.ParserConfigurationException;\nimport javax.xml.parsers.SAXParser;\nimport javax.xml.parsers.SAXParserFactory;\n\nimport org.xml.sax.SAXException;\nimport org.xml.sax.helpers.DefaultHandler;\n\nclass XXE {\n  private static void receiveXMLStream(InputStream inStream,\n                                       DefaultHandler defaultHandler)\n      throws ParserConfigurationException, SAXException, IOException {\n    SAXParserFactory factory = SAXParserFactory.newInstance();\n    SAXParser saxParser = factory.newSAXParser();\n    saxParser.parse(inStream, defaultHandler);\n  }\n\n  public static void main(String[] args) throws ParserConfigurationException,\n      SAXException, IOException {\n    try {\n      receiveXMLStream(new FileInputStream(\"evil.xml\"), new DefaultHandler());\n    } catch (java.net.MalformedURLException mue) {\n      System.err.println(\"Malformed URL Exception: \" + mue);\n    }\n  }\n}\n```\n如果`evil.xml`文件中包含以下文本，程序会受到远程XXE攻击。\n```xml\n<?xml version=\"1.0\"?>\n<!DOCTYPE foo SYSTEM \"file:/dev/tty\">\n<foo>bar</foo>\n```"
    Description_En: |-
      *Entity declarations* define shortcuts to commonly used text or special characters. An entity declaration may define either an *internal* or *external entity*. For internal entities, the content of the entity is given in the declaration. For external entities, the content is specified by a Uniform Resource Identifier (URI).

      Entities may be either *parsed* or *unparsed*. The contents of a parsed entity are called its *replacement text*. An unparsed entity is a resource whose contents may or may not be text, and if text, may be other than XML. Parsed entities are invoked by name using an *entity reference*; unparsed entities are invoked by name.

      According to XML W3C Recommendation, section 4.4.3, "Included If Validating" [W3C 2008]:

      > When an XML processor recognizes a reference to a parsed entity, to validate the document, the processor MUST include its replacement text. If the entity is external, and the processor is not attempting to validate the XML document, the processor MAY, but need not, include the entity's replacement text.

      Because inclusion of replacement text from an external entity is optional, not all XML processors are vulnerable to external entity attacks during validation.

      An *XML external entity (XXE)* attack occurs when XML input containing a reference to an external entity is processed by an improperly configured XML parser. An attacker might use an XXE attack to gain access to sensitive information by manipulating the URI of the entity to refer to files on the local file system containing sensitive data such as passwords and private user data. An attacker might launch a denial-of-service attack, for example, by specifying `/dev/random` or `/dev/tty` as input URIs, which can crash or indefinitely block a program.

      **Noncompliant Code Example**

      This noncompliant code example attempts to parse the file `evil.xml`, report any errors, and exit. However, a SAX (Simple API for XML) or a DOM (Document Object Model) parser will attempt to access the URI specified by the `SYSTEM` attribute, which means it will attempt to read the contents of the local `/dev/tty` file. On POSIX systems, reading this file causes the program to block until input data is supplied to the machine's console. Consequently, an attacker can use this malicious XML file to cause the program to hang.

      ```java
      import java.io.FileInputStream;
      import java.io.IOException;
      import java.io.InputStream;

      import javax.xml.parsers.ParserConfigurationException;
      import javax.xml.parsers.SAXParser;
      import javax.xml.parsers.SAXParserFactory;

      import org.xml.sax.SAXException;
      import org.xml.sax.helpers.DefaultHandler;

      class XXE {
        private static void receiveXMLStream(InputStream inStream,
                                             DefaultHandler defaultHandler)
            throws ParserConfigurationException, SAXException, IOException {
          SAXParserFactory factory = SAXParserFactory.newInstance();
          SAXParser saxParser = factory.newSAXParser();
          saxParser.parse(inStream, defaultHandler);
        }

        public static void main(String[] args) throws ParserConfigurationException,
            SAXException, IOException {
          try {
            receiveXMLStream(new FileInputStream("evil.xml"), new DefaultHandler());
          } catch (java.net.MalformedURLException mue) {
            System.err.println("Malformed URL Exception: " + mue);
          }
        }
      }
      ```

      This program is subject to a remote XXE attack if the `evil.xml` file contains the following:

      ```xml
      <?xml version="1.0"?>
      <!DOCTYPE foo SYSTEM "file:/dev/tty">
      <foo>bar</foo>
      ```
    Advice: "使用EntityResolver方案来防止XML外部实体注入。  \n**规范的代码样例1**：  \n针对不规范的代码样例3的解决方案是，定义一个CustomResolver类，这个类实现了`org.xml.sax.EntityResolver`接口。它可以让SAX应用定制对外部实体的处理。这个定制的处理器使用的是一个为外部实体定义的简单的白名单。当输入不是任何指定的、安全地实体源路径时，`resolverEntity()`方法会返回一个空的InputSource对象。  \n```java\nimport java.io.IOException;\nimport org.xml.sax.EntityResolver;\nimport org.xml.sax.InputSource;\nimport org.xml.sax.SAXException;\n\nclass CustomResolver implements EntityResolver {\n    public InputSource resolveEntity(String publicId, String systemId) throws SAXException, IOException {\n\n        // Check for known good entities  \n        String entityPath = \"file:/Users/onlinestore/good.xml\";\n        if (systemId.equals(entityPath)) {\n            System.out.println(\"Resolving entity: \" + publicId + \" \" + systemId);\n            return new InputSource(entityPath);\n        } else {\n            // Disallow unknown entities by returning a blank path\n            return new InputSource();\n        }\n    }\n}\n```\n`setEntityResolver()`方法可以将对应的SAX驱动实例注册进来。当解析恶意输入时，这个由自定义的解析器返回的空的InputStream对象会抛出`java.net.MalformedURLException`异常。需要注意的是，必须创建一个XMLReader对象，以便通过这个对象来设置自定义的实体解析器。\n```java\nclass XXE {\n    private static void receiveXMLStream(InputStream inStream, DefaultHandler defaultHandler)\n            throws ParserConfigurationException, SAXException, IOException {\n        SAXParserFactory factory = SAXParserFactory.newInstance();\n        SAXParser saxParser = factory.newSAXParser();\n        // To set the Entity Resolver, an XML reader needs to be created  \n        XMLReader reader = saxParser.getXMLReader();\n        reader.setEntityResolver(new CustomResolver());\n        reader.setErrorHandler(defaultHandler);\n        InputSource is = new InputSource(inStream);\n        reader.parse(is);\n    }\n\n    public static void main(String[] args) throws ParserConfigurationException, SAXException, IOException {\n        receiveXMLStream(new FileInputStream(\"evil.xml\"), new DefaultHandler());\n    }\n}\n```"
    Advice_En: |-
      **Compliant Solution (`EntityResolver`)**

      This compliant solution defines a `CustomResolver` class that implements the interface `org.xml.sax.EntityResolver`. This interface enables a SAX application to customize handling of external entities. The customized handler uses a simple whitelist for external entities. The `resolveEntity()` method returns an empty `InputSource` when an input fails to resolve to any of the specified, safe entity source paths.

      ```java
      import java.io.IOException;
      import org.xml.sax.EntityResolver;
      import org.xml.sax.InputSource;
      import org.xml.sax.SAXException;

      class CustomResolver implements EntityResolver {
        public InputSource resolveEntity(String publicId, String systemId)
            throws SAXException, IOException {

          // Check for known good entities
          String entityPath = "file:/Users/onlinestore/good.xml";
          if (systemId.equals(entityPath)) {
            System.out.println("Resolving entity: " + publicId + " " + systemId);
            return new InputSource(entityPath);
          } else {
            // Disallow unknown entities by returning a blank path
            return new InputSource();
          }
        }
      }
      ```

      The `setEntityResolver()` method registers the instance with the corresponding SAX driver. When parsing malicious input, the empty `InputSource` returned by the custom resolver causes a `java.net.MalformedURLException` to be thrown. Note that you must create an `XMLReader` object on which to set the custom entity resolver.

      ```java
      import java.io.FileInputStream;
      import java.io.IOException;
      import java.io.InputStream;

      import javax.xml.parsers.ParserConfigurationException;
      import javax.xml.parsers.SAXParser;
      import javax.xml.parsers.SAXParserFactory;

      import org.xml.sax.InputSource;
      import org.xml.sax.SAXException;
      import org.xml.sax.XMLReader;
      import org.xml.sax.helpers.DefaultHandler;

      class XXE {
        private static void receiveXMLStream(InputStream inStream,
            DefaultHandler defaultHandler) throws ParserConfigurationException,
            SAXException, IOException {
          SAXParserFactory factory = SAXParserFactory.newInstance();
          SAXParser saxParser = factory.newSAXParser();

          // Create an XML reader to set the entity resolver.
          XMLReader reader = saxParser.getXMLReader();
          reader.setEntityResolver(new CustomResolver());
          reader.setContentHandler(defaultHandler);

          InputSource is = new InputSource(inStream);
          reader.parse(is);
        }

        public static void main(String[] args) throws ParserConfigurationException,
            SAXException, IOException {
          try {
            receiveXMLStream(new FileInputStream("evil.xml"), new DefaultHandler());
          } catch (java.net.MalformedURLException mue) {
            System.err.println("Malformed URL Exception: " + mue);
          }
        }
      }
      ```
