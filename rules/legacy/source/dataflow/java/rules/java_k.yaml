  - id: '02000010140613'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 05. 面向对象 (OBJ)
      - type: DetailClassChin
        value: OBJ13-J：确保可变对象的引用没有被泄露
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 05. Object Orientation (OBJ)
      - type: DetailClassChin
        value: OBJ13-J:Ensure that references to mutable objects are not exposed
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "不要将可变对象的引用暴露给客户端代码。永远不要将这样的字段初始化到客户端提供的对象引用，或者从访问器返回对象引用。暴露一个公共静态final对象允许客户修改对象的内容(尽管它们不能改变对象本身，因为它是final的)。  \n此规则不处理私有可变对象，请参阅规则OBJ05-J。有关详细信息，请不要返回对私有可变类成员的引用。\n**不规范的代码样例1**：\n假设 `SomeType` 是不可变的。\n```java\npublic static final SomeType [] SOMETHINGS = { ... };\n```\n即使 `SomeType` 是不可变的，此声明也允许 SOMETHINGS 数组也可被代码的不受信任的客户端修改。 可以为数组的任何元素分配一个新值，即对新  `SomeType`  对象的引用。\n这个不合规的代码示例也违反了 OBJ01-J.限制字段的可访问性。\n**不规范的代码样例2（getter方法）**\n此不合规代码示例符合 OBJ01-J.通过将数组声明为私有来限制字段的可访问性。 但是，在声明数组私有时，此代码示例违反了 OBJ05-J.不要返回对私有可变类成员的引用。\n假设 SomeType 是不可变的。\n```java\nprivate static final SomeType [] SOMETHINGS = { ... };\npublic static final getSomethings() {return SOMETHINGS;}\n```\n即使 `SomeType` 是不可变的，公共 getter 方法也允许不受信任的客户端修改 `SOMETHINGS` 数组。 可以为数组的任何元素分配一个新值，即对新的 `SomeType` 对象的引用。"
    Description_En: |-
      Do not expose references to mutable objects to client code. Never initialize such a field to a client-provided object reference or return the object reference from an accessor. Exposing a public static final object allows clients to modify the contents of the object (although they will not be able to change the object itself, as it is final).

      This rule does not address private mutable objects, see rule OBJ05-J. Do not return references to private mutable class members for more information.

      **Noncompliant Code Example**

      Suppose that `SomeType` is immutable.

      ```java
      public static final SomeType [] SOMETHINGS = { ... };
      ```

      Even though `SomeType` is immutable, this declaration allows the `SOMETHINGS` array to be modified by untrusted clients of the code. Any element of the array can be assigned a new value, namely a reference to a new `SomeType` object.

      This noncompliant code example also violates OBJ01-J. Limit accessibility of fields.

      **Noncompliant Code Example (getter method)**

      This noncompliant code example complies with OBJ01-J. Limit accessibility of fields by declaring the array private. But, in declaring the array private, this code example violates OBJ05-J. Do not return references to private mutable class members.

      Suppose that `SomeType` is immutable.

      ```java
      private static final SomeType [] SOMETHINGS = { ... };
      public static final getSomethings() {return SOMETHINGS;}
      ```

      Even though `SomeType` is immutable, the public getter method enables untrusted clients to modify the `SOMETHINGS` array. Any element of the array can be assigned a new value, namely a reference to a new `SomeType` object.
    Advice: "**规范的代码样例1**：  \n```java\nprivate static final SomeType [] SOMETHINGS = { ... };  \npublic static final SomeType [] somethings() {  \n    return SOMETHINGS.clone();  \n}\n```  \n在上面规范的代码中，数组的值不能被客户端修改。  \n**规范的代码样例2**：  \n```java\nprivate static final SomeType [] THE_THINGS = { ... };  \npublic static final List<SomeType> SOMETHINGS =  \n    Collections.unmodifiableList(Arrays.asList(THE_THINGS)); \n```\n在上面规范的代码中，数组的值和公有的List都不能被客户端修改。"
    Advice_En: |-
      **Compliant Solution (clone)**

      Continuing with the assumption that `SomeType` is immutable, one approach is to have a private array and a public method that returns a copy of the array:

      ```java
      private static final SomeType [] SOMETHINGS = { ... };
      public static final SomeType [] somethings() {
        return SOMETHINGS.clone();
      }
      ```

      Now, the original array cannot be modified by any client.  If `SomeType` were mutable, this approach would not be effective because the array clone references the same `SomeType` objects as the `SOMETHINGS` array. If the client modified the clone `SomeType` objects directly, the `SomeType` objects referenced by the `SOMETHINGS` array would also change.

      **Compliant Solution (Unmodifiable List)**

      Continuing with the assumption that `SomeType` is immutable, an alternative approach is to have a private array from which a public immutable list is constructed:

      ```java
      private static final SomeType [] THE_THINGS = { ... };
      public static final List<SomeType> SOMETHINGS =
        Collections.unmodifiableList(Arrays.asList(THE_THINGS));
      ```

      Now, neither the original array values nor the public list can be modified by a client. If `SomeType` were mutable, this would not be effective because the list references the same `SomeType` objects as the `SOMETHINGS` array. The `unmodifiabileList` prevents the list from being modified, not the elements in the list. If the client modified the list's `SomeType` objects directly, the `SomeType` objects referenced by the `SOMETHINGS` array would also change.
