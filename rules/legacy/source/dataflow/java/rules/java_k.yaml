    Description: "HTML允许web表单中的字段可见或隐藏。隐藏字段向web服务器提供值，但不为用户提供修改其内容的机制。但是，也有一些技术，攻击者可以用来修改这些内容。使用GET表单获取参数的web servlet也可以通过URL接受这些参数。URL允许用户在web请求中指定任何参数名称和值。因此，隐藏表单字段不应该被认为比可见的表单字段更值得信任。  \n**不规范的代码样例1**：\n```java\npublic class SampleServlet extends HttpServlet {\n\n  public void doGet(HttpServletRequest request, HttpServletResponse response)\n    throws IOException, ServletException {\n    response.setContentType(\"text/html\");\n    PrintWriter out = response.getWriter();\n    out.println(\"<html>\");\n\n    String visible = request.getParameter(\"visible\");\n    String hidden = request.getParameter(\"hidden\");\n\n    if (visible != null || hidden != null) {\n      out.println(\"Visible Parameter:\");\n      out.println( sanitize(visible));\n      out.println(\"<br>Hidden Parameter:\");\n      out.println(hidden);\n    } else {\n      out.println(\"<p>\");\n      out.print(\"<form action=\\\"\");\n      out.print(\"SampleServlet\\\" \");\n      out.println(\"method=POST>\");\n      out.println(\"Parameter:\");\n      out.println(\"<input type=text size=20 name=visible>\");\n      out.println(\"<br>\");\n\n      out.println(\"<input type=hidden name=hidden value=\\'a benign value\\'>\");\n      out.println(\"<input type=submit>\");\n      out.println(\"</form>\");\n    }\n  }\n\n  public void doPost(HttpServletRequest request, HttpServletResponse response)\n    throws IOException, ServletException {\n    doGet(request, response);\n  }\n\n  // Filter the specified message string for characters\n  // that are sensitive in HTML.\n  public static String sanitize(String message) {\n    // ...\n  }\n}\n```\n\n上面代码演示了一个servlet，它接受一个可见的字段和一个隐藏的字段，并将其返回给用户。在传递给浏览器之前，可见的参数是经过验证处理的，但是隐藏的字段没有验证。  \n当输入参数`param1`时，web页面将显示以下内容:  \n```\nVisible Parameter: param1\nHidden Parameter: a benign value\n```\n \n但是，攻击者可以通过在URL中编码来为隐藏参数提供一个值，如下:  \n```java\nhttp://localhost:8080/sample/SampleServlet?visible=dummy&hidden=%3Cfont%20color=red%3ESurprise%3C/font%3E!!!\n```\n当这个URL被提供给浏览器时，浏览器会显示:  \n当输入参数`param1`时，web页面将显示以下内容:  \n```\nVisible Parameter: dummy\nHidden Parameter: Surprise!!!\n```"
    Description_En: |-
      HTML allows fields in a web form to be visible or hidden. Hidden fields supply values to a web server but do not provide the user with a mechanism to modify their contents. However, there are techniques that attackers can use to modify these contents anyway. A web servlet that uses a `GET` form to obtain parameters can also accept these parameters through a URL. URLs allow a user to specify any parameter names and values in the web request. Consequently, hidden form fields should not be considered any more trustworthy than visible form fields.

      **Noncompliant Code Example**

      The following noncompliant code example demonstrates a servlet that accepts a visible field and a hidden field, and echoes them back to the user. The visible parameter is sanitized before being passed to the browser, but the hidden field is not.

      ```java
      public class SampleServlet extends HttpServlet {

        public void doGet(HttpServletRequest request, HttpServletResponse response)
          throws IOException, ServletException {
          response.setContentType("text/html");
          PrintWriter out = response.getWriter();
          out.println("<html>");

          String visible = request.getParameter("visible");
          String hidden = request.getParameter("hidden");

          if (visible != null || hidden != null) {
            out.println("Visible Parameter:");
            out.println( sanitize(visible));
            out.println("<br>Hidden Parameter:");
            out.println(hidden);
          } else {
            out.println("<p>");
            out.print("<form action=\"");
            out.print("SampleServlet\" ");
            out.println("method=POST>");
            out.println("Parameter:");
            out.println("<input type=text size=20 name=visible>");
            out.println("<br>");

            out.println("<input type=hidden name=hidden value=\'a benign value\'>");
            out.println("<input type=submit>");
            out.println("</form>");
          }
        }

        public void doPost(HttpServletRequest request, HttpServletResponse response)
          throws IOException, ServletException {
          doGet(request, response);
        }

        // Filter the specified message string for characters
        // that are sensitive in HTML.
        public static String sanitize(String message) {
          // ...
        }
      }
      ```

      When fed the parameter `param1`, the web page displays the following:

      ```
      Visible Parameter: param1
      Hidden Parameter: a benign value
      ```

      However, an attacker can easily supply a value to the hidden parameter by encoding it in the URL as follows:

      ```
      http://localhost:8080/sample/SampleServlet?visible=dummy&hidden=%3Cfont%20color=red%3ESurprise%3C/font%3E!!!
      ```

      When this URL is provided to the browser, the browser displays:

      ```
      Visible Parameter: dummy
      Hidden Parameter: Surprise!!!
      ```
    Advice: "符合规范的解决方案是将应用于可见的参数的净化处理也应用于隐藏的参数。  \n**规范的代码样例1**：  \n```java\npublic class SampleServlet extends HttpServlet {\n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        response.setContentType(\"text/html\");\n        PrintWriter out = response.getWriter();\n        out.println(\"<html>\");\n\n        String visible = request.getParameter(\"visible\");\n        String hidden = request.getParameter(\"hidden\");\n\n        if (visible != null || hidden != null) {\n            out.println(\"Visible Parameter:\");\n            out.println(sanitize(visible));\n            out.println(\"<br>Hidden Parameter:\");\n            out.println(sanitize(hidden)); // Hidden variable sanitized\n        } else {\n            out.println(\"<p>\");\n            out.print(\"<form action=\\\"\");\n            out.print(\"SampleServlet\\\" \");\n            out.println(\"method=POST>\");\n            out.println(\"Parameter:\");\n            out.println(\"<input type=text size=20 name=visible>\");\n            out.println(\"<br>\");\n\n            out.println(\"<input type=hidden name=hidden value=\\'a benign value\\'>\");\n            out.println(\"<input type=submit>\");\n            out.println(\"</form>\");\n        }\n    }\n\n    public void doPost(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        doGet(request, response);\n    }\n\n    // Filter the specified message string for characters\n    // that are sensitive in HTML.\n    public static String sanitize(String message) {\n        // ...\n    }\n}\n```\n因此，当恶意URL进入浏览器时，servlet产生以下内容:  \n```\nVisible Parameter: dummy   \nHidden Parameter: <font color=red>Surprise</font>!!!\n```"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution applies the same sanitization to the hidden parameter as is applied to the visible parameter:

      ```java
      public class SampleServlet extends HttpServlet {
        public void doGet(HttpServletRequest request, HttpServletResponse response)
          throws IOException, ServletException {
          response.setContentType("text/html");
          PrintWriter out = response.getWriter();
          out.println("<html>");

          String visible = request.getParameter("visible");
          String hidden = request.getParameter("hidden");

          if (visible != null || hidden != null) {
            out.println("Visible Parameter:");
            out.println( sanitize(visible));
            out.println("<br>Hidden Parameter:");
            out.println( sanitize(hidden));          // Hidden variable sanitized
          } else {
            out.println("<p>");
            out.print("<form action=\"");
            out.print("SampleServlet\" ");
            out.println("method=POST>");
            out.println("Parameter:");
            out.println("<input type=text size=20 name=visible>");
            out.println("<br>");

            out.println("<input type=hidden name=hidden value=\'a benign value\'>");
            out.println("<input type=submit>");
            out.println("</form>");
          }
        }

        public void doPost(HttpServletRequest request, HttpServletResponse response)
          throws IOException, ServletException {
          doGet(request, response);
        }

        // Filter the specified message string for characters
        // that are sensitive in HTML.
        public static String sanitize(String message) {
          // ...
        }
      }
      ```

      Consequently, when the malicious URL is entered into a browser, the servlet produces the following:

      ```
      Visible Parameter: dummy
      Hidden Parameter: <font color=red>Surprise</font>!!!
      ```
