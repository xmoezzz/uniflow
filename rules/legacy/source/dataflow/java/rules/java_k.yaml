        value: IDS04-J:Safely extract files from ZipInputStream
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: |-
      Java提供了 `java.util.zip` 包，可实现与zip兼容的数据压缩。它提供的类使您能够读取、创建和修改ZIP和GZIP文件格式。
      在使用`java.util.zip.ZipInputStream`从ZIP文件提取文件条目时，必须考虑一些安全问题，文件名可能包含路径遍历信息，这些信息可能导致它们被提取到目标目录之外，通常是为了覆盖现有系统文件。*目录遍历*或路径等价漏洞可以通过按照FIO16-J规范化路径名来消除。在验证路径名之前规范化路径名，然后在提取之前验证位置。
      第二个问题是，提取过程可能会导致系统资源的过度消耗，当资源使用量与输入数据相比不成比例时，可能会导致拒绝服务攻击。zip算法可以产生非常大的压缩比[Mahmoud 2002]。例如，由a字符和b字符交替组成的文件可以实现200比1以上的压缩比。使用针对压缩算法的输入数据可以获得更高的压缩比。这允许存在压缩炸弹，其中一个小的zip或GZIP文件在解压缩时会消耗过多的资源。zip炸弹的一个例子是：文件42.zip是一种zip文件，由42千字节的压缩数据组成，包含五层嵌套的zip文件，每组16个，每个底层存档包含一个4.3千兆字节（429497295字节；~3.99Gib）的文件，总容量为4.5千兆字节（450359966321920字节；~3.99Pib）的未压缩数据。Zip炸弹通常依靠重复相同的文件来达到极高的压缩比。程序必须限制此类文件的遍历，或者拒绝提取超出一定限制的数据。实际限制取决于平台的功能和预期使用情况。
      **不规范的代码样例1**：
      此不合规代码无法验证正在解压缩的文件的名称。它将名称直接传递给 `FileOutputStream` 的构造方法。它也无法检查正在解压缩的文件的资源消耗。它允许操作运行到完成或直到本地资源耗尽。
      ```java
      static final int BUFFER = 512;
      // ...

      public final void unzip(String filename) throws java.io.IOException{
        FileInputStream fis = new FileInputStream(filename);
        ZipInputStream zis = new ZipInputStream(new BufferedInputStream(fis));
        ZipEntry entry;
        try {
          while ((entry = zis.getNextEntry()) != null) {
            System.out.println("Extracting: " + entry);
            int count;
            byte data[] = new byte[BUFFER];
            // Write the files to the disk
            FileOutputStream fos = new FileOutputStream(entry.getName());
            BufferedOutputStream dest = new BufferedOutputStream(fos, BUFFER);
            while ((count = zis.read(data, 0, BUFFER)) != -1) {
              dest.write(data, 0, count);
            }
            dest.flush();
            dest.close();
            zis.closeEntry();
          }
        } finally {
          zis.close();
        }
      }
      ```

      **不规范的代码样例2(getSize())**：
      这个不符合规则的代码示例，使用`ZipEntry.getSize()`方法在解压之前，判断zip文档中需解压文件的大小。然而，攻击者可以伪造ZIP文档中未压缩的文件的大小，因此通过getSize()返回的值是不可靠的。
      ```java
      static final int BUFFER = 512;
      static final int TOOBIG = 0x6400000; // 100MB
      // ...

      public final void unzip(String filename) throws java.io.IOException{
        FileInputStream fis = new FileInputStream(filename);
        ZipInputStream zis = new ZipInputStream(new BufferedInputStream(fis));
        ZipEntry entry;
        try {
          while ((entry = zis.getNextEntry()) != null) {
            System.out.println("Extracting: " + entry);
            int count;
            byte data[] = new byte[BUFFER];
            // Write the files to the disk, but only if the file is not insanely big
            if (entry.getSize() > TOOBIG ) {
               throw new IllegalStateException("File to be unzipped is huge.");
            }
            if (entry.getSize() == -1) {
               throw new IllegalStateException("File to be unzipped might be huge.");
            }
            FileOutputStream fos = new FileOutputStream(entry.getName());
            BufferedOutputStream dest = new BufferedOutputStream(fos, BUFFER);
            while ((count = zis.read(data, 0, BUFFER)) != -1) {
              dest.write(data, 0, count);
            }
            dest.flush();
            dest.close();
            zis.closeEntry();
          }
        } finally {
          zis.close();
        }
      }
      ```
    Description_En: |-
      Java provides the `java.util.zip` package for zip-compatible data compression. It provides classes that enable you to read, create, and modify ZIP and GZIP file formats.

      A number of security concerns must be considered when extracting file entries from a ZIP file using `java.util.zip.ZipInputStream`. File names may contain path traversal information that may cause them to be extracted outside of the intended directory, frequently with the purpose of overwriting existing system files.Directory traversal or path equivalence vulnerabilities can be eliminated by canonicalizing the path name, in accordance with FIO16-J. Canonicalize path names before validating them, and then validating the location before extraction.

      A second issue is that the extraction process can cause excessive consumption of system resources, possibly resulting in a denial-of-service attack when resource usage is disproportionately large compared to the input data. The zip algorithm can produce very large compression ratios [Mahmoud 2002]. For example, a file consisting of alternating lines of a characters and b characters can achieve a compression ratio of more than 200 to 1. Even higher compression ratios can be obtained using input data that is targeted to the compression algorithm. This permits the existence of zip bombs in which a small ZIP or GZIP file consumes excessive resources when uncompressed. An example of a zip bomb is the file 42.zip, which is a zip file consisting of 42 kilobytes of compressed data, containing five layers of nested zip files in sets of 16, each bottom layer archive containing a 4.3 gigabyte (4 294 967 295 bytes; ~ 3.99 GiB) file for a total of 4.5 petabytes (4 503 599 626 321 920 bytes; ~ 3.99 PiB) of uncompressed data. Zip bombs often rely on repetition of identical files to achieve their extreme compression ratios. Programs must either limit the traversal of such files or refuse to extract data beyond a certain limit. The actual limit depends on the capabilities of the platform and expected usage.

      **Noncompliant Code Example**

      This noncompliant code fails to validate the name of the file that is being unzipped. It passes the name directly to the constructor of `FileOutputStream`. It also fails to check the resource consumption of the file that is being unzipped. It permits the operation to run to completion or until local resources are exhausted.

      ```java
      static final int BUFFER = 512;
      // ...

      public final void unzip(String filename) throws java.io.IOException{
        FileInputStream fis = new FileInputStream(filename);
        ZipInputStream zis = new ZipInputStream(new BufferedInputStream(fis));
        ZipEntry entry;
        try {
          while ((entry = zis.getNextEntry()) != null) {
            System.out.println("Extracting: " + entry);
            int count;
            byte data[] = new byte[BUFFER];
            // Write the files to the disk
            FileOutputStream fos = new FileOutputStream(entry.getName());
            BufferedOutputStream dest = new BufferedOutputStream(fos, BUFFER);
            while ((count = zis.read(data, 0, BUFFER)) != -1) {
              dest.write(data, 0, count);
            }
            dest.flush();
            dest.close();
            zis.closeEntry();
          }
        } finally {
          zis.close();
        }
      }
      ```

      **Noncompliant Code Example (`getSize()`)**

      This noncompliant code attempts to overcome the problem by calling the method `ZipEntry.getSize()` to check the uncompressed file size before uncompressing it. Unfortunately, a malicious attacker can forge the field in the ZIP file that purports to show the uncompressed size of the file, so the value returned by `getSize()` is unreliable, and local resources may still be exhausted.

      ```java
      static final int BUFFER = 512;
      static final int TOOBIG = 0x6400000; // 100MB
      // ...

      public final void unzip(String filename) throws java.io.IOException{
        FileInputStream fis = new FileInputStream(filename);
        ZipInputStream zis = new ZipInputStream(new BufferedInputStream(fis));
        ZipEntry entry;
        try {
          while ((entry = zis.getNextEntry()) != null) {
            System.out.println("Extracting: " + entry);
            int count;
            byte data[] = new byte[BUFFER];
            // Write the files to the disk, but only if the file is not insanely big
            if (entry.getSize() > TOOBIG ) {
               throw new IllegalStateException("File to be unzipped is huge.");
            }
            if (entry.getSize() == -1) {
               throw new IllegalStateException("File to be unzipped might be huge.");
            }
            FileOutputStream fos = new FileOutputStream(entry.getName());
            BufferedOutputStream dest = new BufferedOutputStream(fos, BUFFER);
            while ((count = zis.read(data, 0, BUFFER)) != -1) {
              dest.write(data, 0, count);
            }
            dest.flush();
            dest.close();
            zis.closeEntry();
          }
        } finally {
          zis.close();
        }
      }
      ```
    Advice: "**规范的代码样例1**：  \n```java\nstatic final int BUFFER = 512;\nstatic final int TOOBIG = 0x6400000; // Max size of unzipped data, 100MB\nstatic final int TOOMANY = 1024; // Max number of files\n// ...\n\nprivate String validateFilename(String filename, String intendedDir) throws java.io.IOException {\n    File f = new File(filename);\n    String canonicalPath = f.getCanonicalPath();\n\n    File iD = new File(intendedDir);\n    String canonicalID = iD.getCanonicalPath();\n\n    if (canonicalPath.startsWith(canonicalID)) {\n        return canonicalPath;\n    } else {\n        throw new IllegalStateException(\"File is outside extraction target directory.\");\n    }\n}\n\npublic final void unzip(String filename) throws java.io.IOException {\n    FileInputStream fis = new FileInputStream(filename);\n    ZipInputStream zis = new ZipInputStream(new BufferedInputStream(fis));\n    ZipEntry entry;\n    int entries = 0;\n    long total = 0;\n    try {\n        while ((entry = zis.getNextEntry()) != null) {\n            System.out.println(\"Extracting: \" + entry);\n            int count;\n            byte data[] = new byte[BUFFER];\n            // Write the files to the disk, but ensure that the filename is valid,\n            // and that the file is not insanely big\n            String name = validateFilename(entry.getName(), \".\");\n            if (entry.isDirectory()) {\n                System.out.println(\"Creating directory \" + name);\n                new File(name).mkdir();\n                continue;\n            }\n            FileOutputStream fos = new FileOutputStream(name);\n            BufferedOutputStream dest = new BufferedOutputStream(fos, BUFFER);\n            while (total + BUFFER <= TOOBIG && (count = zis.read(data, 0, BUFFER)) != -1) {\n                dest.write(data, 0, count);\n                total += count;\n            }\n            dest.flush();\n            dest.close();\n            zis.closeEntry();\n            entries++;\n            if (entries > TOOMANY) {\n                throw new IllegalStateException(\"Too many files to unzip.\");\n            }\n            if (total > TOOBIG) {\n                throw new IllegalStateException(\"File being unzipped is too big.\");\n            }\n        }\n    } finally {\n        zis.close();\n    }\n}\n```\n在这个解决方案方案中，代码在提取条目之前验证每个条目的名称。如果名称无效，那么整个提取就会被中止。 另外一个解决方案也可以跳过该条目并继续提取过程，或者甚至可以将条目提取到某个安全的位置。\n此外，while循环中的代码将跟踪zip归档中每个条目的未压缩文件大小，同时提取条目。如果提取的条目太大，在本例中为100MB，则会抛出异常。代码不使用`ZipEntry.getSize()`方法, 因为它返回的值是不可靠的。最后，代码还计算存档中文件条目的数量，如果有超过1024个条目，则抛出一个异常。"
