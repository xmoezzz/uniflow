    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 14. 序列化 (SER)
      - type: DetailClassChin
        value: SER09-J：不要从readObject()方法中调用可复用的方法
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 14. Serialization (SER)
      - type: DetailClassChin
        value: SER09-J:Do not invoke overridable methods from the readObject() method
    BugServerity: 3
    DynamicDescription: ''
    Description: |-
      `readObject()`方法不能调用任何可重写的方法。从`readObject()`方法中调用可重写方法，可以让重写方法在对象完全初始化之前访问其状态。这种过早的访问是可能的，因为在反序列化中，`readObject`扮演着对象构造器的角色，因此在`readObject`退出之前，对象的初始化还没有完成（参见[MET06-J.不要在clone()中调用可重写方法]）。
      **不规范的代码样例1**
      这个不符合规定的代码例子从`readObject()`方法中调用了一个可重写的方法。
      ```java
      private void readObject(final ObjectInputStream stream)
                              throws IOException, ClassNotFoundException {
        overridableMethod();
        stream.defaultReadObject();
      }

      public void overridableMethod() {
        // ...
      }
      ```
    Description_En: |-
      The `readObject()` method must not call any overridable methods. Invoking overridable methods from the `readObject()` method can provide the overriding method with access to the object's state before it is fully initialized. This premature access is possible because, in deserialization, `readObject` plays the role of object constructor and therefore object initialization is not complete until `readObject` exits (see also [MET06-J. Do not invoke overridable methods in clone()]).

      **Noncompliant Code Example**

      This noncompliant code example invokes an overridable method from the `readObject()` method:

      ```java
      private void readObject(final ObjectInputStream stream)
                              throws IOException, ClassNotFoundException {
        overridableMethod();
        stream.defaultReadObject();
      }

      public void overridableMethod() {
        // ...
      }
      ```
    Advice: |-
      **规范的代码样例1**
      这个解决方案删除了对可重写方法的调用。当移除这种调用不可行时，请声明该方法为私有或最终方法。
      ```java
      private void readObject(final ObjectInputStream stream)
                              throws IOException, ClassNotFoundException {
        stream.defaultReadObject();
      }
      ```
      **特例**
      SER09-J-EX0: `readObject()`方法可以调用`defaultReadObject()`和`readFields()`类中的可重写方法`java.io.ObjectInputStream` [SCG 2009]。
    Advice_En: |-
      **Compliant Solution**

      This compliant solution removes the call to the overridable method. When removing such calls is infeasible, declare the method private or final.

      ```java
      private void readObject(final ObjectInputStream stream)
                              throws IOException, ClassNotFoundException {
        stream.defaultReadObject();
      }
      ```

      **Exceptions**

      SER09-J-EX0: The `readObject()` method may invoke the overridable methods `defaultReadObject()` and `readFields()` in class `java.io.ObjectInputStream` [SCG 2009].
