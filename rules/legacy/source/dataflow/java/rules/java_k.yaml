        value: ERR09-J:Do not allow untrusted code to terminate the JVM
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "调用`System.exit()`终止Java虚拟机(JVM)，从而终止所有正在运行的程序和线程。这可能导致拒绝服务(DoS)攻击。例如：嵌入到Java Server Pages（JSP）代码中的`System.exit()`的调用可能导致Web服务器终止，从而阻止用户进一步的服务。程序必须防止对`System.exit()`的无意和恶意的调用。此外，程序在强制终止时应执行必要的清除操作（**例如**：使用Windows任务管理器，POSIX kill命令或其他机制）。  \n**不规范的代码样例1**：  \n以下代码使用`System.exit()`强制关闭JVM并终止正在运行的进程。该程序缺乏安全管理，同时无法检测调用者是否有权调用`System.exit()`。  \n```java\npublic class InterceptExit {\n  public static void main(String[] args) {\n    // ...\n    System.exit(1);  // Abrupt exit\n    System.out.println(\"This never executes\");\n  }\n}\n```"
    Description_En: |-
      Invocation of `System.exit()` terminates the Java Virtual Machine (JVM), consequently terminating all running programs and threads. This can result in denial-of-service (DoS) attacks. For example, a call to `System.exit()` that is embedded in Java Server Pages (JSP) code can cause a web server to terminate, preventing further service for users. Programs must prevent both inadvertent and malicious calls to `System.exit()`. Additionally, programs should perform necessary cleanup actions when forcibly terminated (for example, by using the Windows Task Manager, POSIX `kill` command, or other mechanisms).

      **Noncompliant Code Example**

      This noncompliant code example uses `System.exit()` to forcefully shut down the JVM and terminate the running process. The program lacks a security manager; consequently, it lacks the capability to check whether the caller is permitted to invoke `System.exit()`.

      ```java
      public class InterceptExit {
        public static void main(String[] args) {
          // ...
          System.exit(1);  // Abrupt exit
          System.out.println("This never executes");
        }
      }
      ```
    Advice: "程序必须避免无意地和恶意地调用`System.exit()`。而且，在被强迫终止时（例如通过Windows任务管理器、POSIX kill命令或者其他机制），程序应该进行必要的清理操作。\n**规范的代码样例1**：  \n以下代码设置了一个自定义的安全管理器PasswordSecurityManager，并重写SecurityManager类中定义的`checkExit()`方法。为了实现退出前启用清除代码的调用，必须重写该方法。SecurityManager类中默认的`checkExit()`方法没有该功能。  \n```java\nclass PasswordSecurityManager extends SecurityManager {\n  private boolean isExitAllowedFlag;\n\n  public PasswordSecurityManager(){\n    super();\n    isExitAllowedFlag = false;\n  }\n\n  public boolean isExitAllowed(){\n    return isExitAllowedFlag;\n  }\n\n  @Override\n  public void checkExit(int status) {\n    if (!isExitAllowed()) {\n      throw new SecurityException();\n    }\n    super.checkExit(status);\n  }\n\n  public void setExitAllowed(boolean f) {\n    isExitAllowedFlag = f;\n  }\n}\n\npublic class InterceptExit {\n  public static void main(String[] args) {\n    PasswordSecurityManager secManager =\n        new PasswordSecurityManager();\n    System.setSecurityManager(secManager);\n    try {\n      // ...\n      System.exit(1);  // Abrupt exit call\n    } catch (Throwable x) {\n      if (x instanceof SecurityException) {\n        System.out.println(\"Intercepted System.exit()\");\n        // Log exception\n      } else {\n        // Forward to exception handler\n      }\n    }\n\n    // ...\n    secManager.setExitAllowed(true);  // Permit exit\n    // System.exit() will work subsequently\n    // ...\n  }\n}\n```\n此实现使用内部标志来跟踪是否允许退出。`setExitAllowed()`方法设置此标志。当标志未设置（即为false）时，`checkExit()`方法会抛出SecurityException异常。因为这个标志没有初始设置，正常的异常处理会绕过初始调用`System.exit()`。程序捕获SecurityException并执行强制清除操作，包括记录异常。`System.exit()`方法仅在清除完成后才能启用。  \n**特例**：一个命令行应用程序调用`System.exit()`是允许的，例如：当没有输入足够数量要求的参数时[Bloch 2008], [ESA 2005]."
    Advice_En: |-
      **Compliant Solution**

      This compliant solution installs a custom security manager `PasswordSecurityManager` that overrides the `checkExit()` method defined in the `SecurityManager` class. This override is required to enable invocation of cleanup code before allowing the exit. The default `checkExit()` method in the `SecurityManager` class lacks this facility.

      ```java
      class PasswordSecurityManager extends SecurityManager {
        private boolean isExitAllowedFlag;

        public PasswordSecurityManager(){
          super();
          isExitAllowedFlag = false;
        }

        public boolean isExitAllowed(){
          return isExitAllowedFlag;
        }

        @Override
        public void checkExit(int status) {
          if (!isExitAllowed()) {
            throw new SecurityException();
          }
          super.checkExit(status);
        }

        public void setExitAllowed(boolean f) {
          isExitAllowedFlag = f;
        }
      }

      public class InterceptExit {
        public static void main(String[] args) {
          PasswordSecurityManager secManager =
              new PasswordSecurityManager();
          System.setSecurityManager(secManager);
          try {
            // ...
            System.exit(1);  // Abrupt exit call
          } catch (Throwable x) {
            if (x instanceof SecurityException) {
              System.out.println("Intercepted System.exit()");
              // Log exception
            } else {
              // Forward to exception handler
            }
          }

          // ...
          secManager.setExitAllowed(true);  // Permit exit
          // System.exit() will work subsequently
          // ...
        }
      }
      ```
      This implementation uses an internal flag to track whether the exit is permitted. The method `setExitAllowed()` sets this flag. The `checkExit()` method throws a `SecurityException` when the flag is unset (that is, false). Because this flag is not initially set, normal exception processing bypasses the initial call to `System.exit()`. The program catches the `SecurityException` and performs mandatory cleanup operations, including logging the exception. The `System.exit()` method is enabled only after cleanup is complete.
      **Exceptions**
      ERR09-J-EX0: It is permissible for a command-line utility to call `System.exit()`, for example, when the required number of arguments are not input [Bloch 2008], [ESA 2005].
    References:
