  - id: '02000010140400'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 02. 表达式 (EXP)
      - type: DetailClassChin
        value: EXP00-J：不要忽略方法返回值
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 02. Expressions (EXP)
      - type: DetailClassChin
        value: EXP00-J:Do not ignore values returned by methods
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "方法返回值通常可以知道方法的执行结果，如果忽略了方法返回值，就难以知道方法的执行结果，特别是调用该方法的代码中没有进行适当处理，可能会导致不可预期的结果，尤其是方法执行类似权限校验的操作，甚至会导致安全风险。所以，程序必须重视方法的返回值。\n当getter方法在一个动作之后定义时，程序员可能无法意识到预期的返回值。例如， `ProcessBuilder.redirectErrorStream()` 方法的唯一目的是通过返回值报告流程构建器是否成功合并标准错误和标准输出。 实际执行错误流重定向的方法是重载的单参数方法 `ProcessBuilder.redirectErrorStream(boolean)`\n**不规范的代码样例1**：  \n```java\npublic void deleteFile(){\n\n  File someFile = new File(\"someFileName.txt\");\n  // Do something with someFile\n  someFile.delete();\n\n}\n```\n代码中调用了`File.delete()`方法用来删除一个文件，但是不确认文件是否删除成功。\n**不规范的代码样例2（替换字符串）**：\n```java\npublic class Replace {\n  public static void main(String[] args) {\n    String original = \"insecure\";\n    original.replace('i', '9');\n    System.out.println(original);\n  }\n}\n```\n这段代码忽略了`String.replace()`方法的返回值，`String.replace()`方法不会修改当前的字符串，而是返回一个新的字符串引用，新的字符串引用才是修改后的数据。"
    Description_En: |-
      Methods can return values to communicate failure or success or to update local objects or fields. Security risks can arise when method return values are ignored or when the invoking method fails to take suitable action. Consequently, programs must not ignore method return values.

      When getter methods are named after an action, a programmer could fail to realize that a return value is expected. For example, the only purpose of the `ProcessBuilder.redirectErrorStream()` method is to report via return value whether the process builder successfully merged standard error and standard output. The method that actually performs redirection of the error stream is the overloaded single-argument method `ProcessBuilder.redirectErrorStream(boolean)`.

      **Noncompliant Code Example (File Deletion)**

      This noncompliant code example attempts to delete a file but fails to check whether the operation has succeeded:

      ```java
      public void deleteFile(){

        File someFile = new File("someFileName.txt");
        // Do something with someFile
        someFile.delete();

      }
      ```

      **Noncompliant Code Example (String Replacement)**

      This noncompliant code example ignores the return value of the `String.replace()` method, failing to update the original string. The `String.replace()` method cannot modify the state of the `String` (because `String` objects are immutable); rather, it returns a reference to a new `String` object containing the modified string.

      ```java
      public class Replace {
        public static void main(String[] args) {
          String original = "insecure";
          original.replace('i', '9');
          System.out.println(original);
        }
      }
      ```

      It is especially important to process the return values of immutable object methods. Although many methods of mutable objects operate by changing some internal state of the object, methods of immutable objects cannot change the object and often return a mutated new object, leaving the original object unchanged.
    Advice: "对方法的返回值进行检查。\n**规范的代码样例1**：  \n```java\npublic void deleteFile() {\n    File someFile = new File(\"someFileName.txt\");\n    // do something with someFile\n    if (!someFile.delete()) {\n        // handle failure to delete the f ile\n    }\n}\n```  \n代码对`delete()`方法的boolean返回值进行检查，并且对没有删除成功的情况进行处理。  \n**规范的代码样例2**：  \n```java\npublic class Replace {\n    public static void main(String[] args) {\n        String original = \"insecure\";\n        String originalNew = original.replace('i', '9');\n        System.out.println(originalNew);\n    }\n}\n```  \n代码将`String.replace()`方法的返回值赋值给了一个新的字符串`originalNew`。"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution checks the Boolean value returned by the `delete()` method and handles any resulting errors:

      ```java
      public void deleteFile(){

        File someFile = new File("someFileName.txt");
        // Do something with someFile
        if (!someFile.delete()) {
          // Handle failure to delete the file
        }

      }
      ```
      **Compliant Solution**

      This compliant solution correctly updates the `String` reference `original` with the return value from the `String.replace()` method:

      ```java
      public class Replace {
        public static void main(String[] args) {
          String original = "insecure";
          original = original.replace('i', '9');
          System.out.println(original);
        }
      }
      ```
