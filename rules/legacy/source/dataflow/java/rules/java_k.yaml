        value: LCK08-J：在异常时保证释放已持有的锁
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 09. Locking (LCK)
      - type: DetailClassChin
        value: LCK08-J:Ensure actively held locks are released on exceptional conditions
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "一个异常条件会阻碍释放锁，从而导致死锁。根据Java API描述：一个ReentrantLock是由一个成功的执行了锁定但是没有执行解锁操作的线程所拥有的，如果没有其他线程持有锁，一个调用Lock的线程会成功的获得锁并返回。  \n因此，一个在任何线程中没有被释放的锁会阻止其他线程得到这个锁。在发生异常条件的情况下，线程必须释放当前持有的锁。  \n风险评估：如果在异常条件下释放锁失败，会导致线程饥饿或死锁。  \n**不规范的代码样例1**：  \n```java\npublic final class Client {\n    public void doSomething(File file) {\n        final Lock lock = new ReentrantLock();\n        InputStream in = null;\n        try {\n            lock.lock();\n            in = new FileInputStream(file);\n            // Perform operations on the open file\n            lock.unlock();\n        } catch (FileNotFoundException x) {\n            // Handle exception\n        } finally {\n            if (in != null) {\n                try {\n                    in.close();\n                } catch (IOException x) {\n                    // Handle exception\n                }\n            }\n        }\n    }\n}\n```  \n代码使用了ReentrantLock来保护资源，当打开的文件进行操作而发生异常时，却不能释放持有的锁。当发生异常时，控制权会移交给catch代码块，并且`unlock()`方法不会执行。"
    Description_En: |-
      An exceptional condition can circumvent the release of a lock, leading to deadlock. According to the Java API [API 2014]:

      > A `ReentrantLock` is owned by the thread last successfully locking, but not yet unlocking it. A thread invoking `lock` will return, successfully acquiring the lock, when the lock is not owned by another thread.

      Consequently, an unreleased lock in any thread will prevent other threads from acquiring the same lock. Programs must release all actively held locks on exceptional conditions. Intrinsic locks of class objects used for method and block synchronization are automatically released on exceptional conditions (such as abnormal thread termination).

      This guideline is an instance of FIO04-J. Release resources when they are no longer needed. However, most Java lock objects are not closeable, so they cannot be automatically released using Java 7's `try`-with-resources feature.

      **Noncompliant Code Example (Checked Exception)**

      This noncompliant code example protects a resource, an open file, by using a `ReentrantLock`. However, the method fails to release the lock when an exception occurs while performing operations on the open file. When an exception is thrown, control transfers to the `catch` block and the call to `unlock()` never executes.

      ```java
      public final class Client {
        private final Lock lock = new ReentrantLock();

        public void doSomething(File file) {
          InputStream in = null;
          try {
            in = new FileInputStream(file);
            lock.lock();

            // Perform operations on the open file

            lock.unlock();
          } catch (FileNotFoundException x) {
            // Handle exception
          } finally {
            if (in != null) {
              try {
                in.close();
              } catch (IOException x) {
                // Handle exception
              }
            }
          }
        }
      }
      ```
    Advice: |-
      **规范的代码样例1**：
      ```java
      public final class Client {
        private final Lock lock = new ReentrantLock();

        public void doSomething(File file) {
          InputStream in = null;
          lock.lock();
          try {
            in = new FileInputStream(file);
            // Perform operations on the open file
          } catch (FileNotFoundException fnf) {
            // Forward to handler
          } finally {
            lock.unlock();

            if (in != null) {
              try {
                in.close();
              } catch (IOException e) {
                // Forward to handler
              }
            }
          }
        }
      }
      ```
      代码使用了ReentrantLock来保护资源，当打开的文件进行操作而发生异常时或不发生异常时，程序都会走到finally代码块，`lock.unlock()`方法执行，可成功释放持有的锁。
    Advice_En: |-
      **Compliant Solution (`finally` Block)**

      This compliant solution encapsulates operations that could throw an exception in a `try` block immediately after acquiring the lock (which cannot throw). The lock is acquired just before the `try` block, which guarantees that it is held when the `finally` block executes.

      ```java
      public final class Client {
        private final Lock lock = new ReentrantLock();

        public void doSomething(File file) {
          InputStream in = null;
          lock.lock();
          try {
            in = new FileInputStream(file);
            // Perform operations on the open file
          } catch (FileNotFoundException fnf) {
            // Forward to handler
          } finally {
            lock.unlock();

            if (in != null) {
              try {
                in.close();
              } catch (IOException e) {
                // Forward to handler
              }
            }
          }
        }
      }
      ```
