        value: Rule 07. 异常行为 (ERR)
      - type: DetailClassChin
        value: ERR04-J：不要从finally块中突然完成
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 07. Exceptional Behavior (ERR)
      - type: DetailClassChin
        value: ERR04-J:Do not complete abruptly from a finally block
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "不要在finally块中使用return、break、continue或throw语句。当程序进行带有finally块的try块时，不管try块代码（或catch块代码）是否完成执行，finally程序块总是会执行的。造成finally块程序非正常终止的语句也会导致整个try块非正常终止，从而消除了从try或者catch块抛出的任何异常。  \n**不规范的代码样例1**：\n在这个不合规的代码示例中，“finally”块由于块中的“return”语句而突然完成：\n```java\nclass TryFinally {\n  private static boolean doLogic() {\n    try {\n      throw new IllegalStateException();\n    } finally {\n      System.out.println(\"logic done\");\n      return true;\n    }\n  }\n}\n```\n`IllegalStateException` 被`return` 语句导致的`finally` 块的突然完成抑制。"
    Description_En: |-
      Never use `return`, `break`, `continue`, or `throw` statements within a `finally` block. When program execution enters a `try` block that has a `finally` block, the `finally` block always executes regardless of whether the `try` block (or any associated `catch` blocks) executes to normal completion. Statements that cause the `finally` block to complete abruptly also cause the `try` block to complete abruptly and consequently suppress any exception thrown from the `try` or `catch` blocks. According to *The Java Language Specification*, §14.20.2, &#34;Execution of `try-finally` and `try-catch-finally`&#34; [JLS 2015]:

      > If execution of the `try` block completes abruptly for any other reason `R`, then the `finally` block is executed. Then there is a choice:
      >
      > * If the `finally` block completes normally, then the `try` statement completes abruptly for reason `R`.
      > * If the `finally` block completes abruptly for reason `S`, then the `try` statement completes abruptly for reason `S` (and reason `R` is discarded).

      **Noncompliant Code Example**

      In this noncompliant code example, the `finally` block completes abruptly because of a `return` statement in the block:

      ```java
      class TryFinally {
        private static boolean doLogic() {
          try {
            throw new IllegalStateException();
          } finally {
            System.out.println("logic done");
            return true;
          }
        }
      }
      ```

      The `IllegalStateException` is suppressed by the abrupt completion of the `finally` block caused by the `return` statement.
    Advice: "finally块中只能存在不会异常终止程序的语句。  \n**规范的代码样例1**：   \n```java\nclass TryFinally {\n  private static boolean doLogic() {\n    try {\n      throw new IllegalStateException();\n    } finally {\n      System.out.println(\"logic done\");\n    }\n    // Any return statements must go here;\n    // applicable only when exception is thrown conditionally\n  }\n}\n```\n在finally块中不返回，仅打印logic done。\n**特例**：程序控制流语句处于finally块中，break、continue语句可以在控制流语句内使用。\n```java\nclass TryFinally {\n  private static boolean doLogic() {\n    try {\n      throw new IllegalStateException();\n    } finally {\n      int c;\n      try {\n        while ((c = input.read()) != -1) {\n          if (c > 128) {\n            break;\n          }\n        }\n      } catch (IOException x) {\n        // Forward to handler\n      }\n      System.out.println(\"logic done\");\n    }\n    // Any return statements must go here; applicable only when exception is thrown conditionally\n  }\n}\n```"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution removes the `return` statement from the `finally` block:

      ```java
      class TryFinally {
        private static boolean doLogic() {
          try {
            throw new IllegalStateException();
          } finally {
            System.out.println("logic done");
          }
          // Any return statements must go here;
          // applicable only when exception is thrown conditionally
        }
      }
      ```

      **Exceptions**

      ERRO4-J-EX0: Control flow statements whose destination is within the `finally` block are perfectly acceptable. For example, the following code does not violate this rule because the `break` statement exits within the `while` loop but not within the `finally` block:

      ```java
      class TryFinally {
        private static boolean doLogic() {
          try {
            throw new IllegalStateException();
          } finally {
            int c;
            try {
              while ((c = input.read()) != -1) {
                if (c > 128) {
                  break;
                }
              }
            } catch (IOException x) {
              // Forward to handler
            }
            System.out.println("logic done");
          }
          // Any return statements must go here; applicable only when exception is thrown conditionally
        }
      }
      ```
    References:
      Reference:
