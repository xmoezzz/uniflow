    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "当程序想要使用更多可获得的堆空间时，Java的 OutofMemoryError 就会发生。这个错误会基于以下原因：  \n内存泄漏（参考规则MSC04-J）  \n一个无限的循环  \n可获得的有限的默认堆内存  \n对常用数据结构（散列表、vector等）的不正确实现  \n不受限制的序列化  \n在ObjectOutputStream中写入大量的对象（参考规则 SER10-J）  \n创建大量的线程  \n解压一个文件（参考规则 IDS04-J）  \n\n其中一个原因与平台相关，并且难以预测。其它的比较容易预测，比如从文件中读取数据。因此，如果一种方式会导致内存耗尽，那么程序不能使用这种方法来接收非受信的输入。  \n**不规范的代码样例1**：  \n```java\nclass ReadNames {\n  private Vector<String> names = new Vector<String>();\n  private final InputStreamReader input;\n  private final BufferedReader reader;\n\n  public ReadNames(String filename) throws IOException {\n    this.input = new FileReader(filename);\n    this.reader = new BufferedReader(input);\n  }\n\n  public void addNames() throws IOException {\n    try {\n      String newName;\n      while (((newName = reader.readLine()) != null) &&\n             !(newName.equalsIgnoreCase(\"quit\"))) {\n        names.addElement(newName);\n        System.out.println(\"adding \" + newName);\n      }\n    } finally {\n      input.close();\n    }\n  }\n\n  public static void main(String[] args) throws IOException {\n    if (args.length != 1) {\n      System.out.println(\"Arguments: [filename]\");\n      return;\n    }\n    ReadNames demo = new ReadNames(args[0]);\n    demo.addNames();\n  }\n}\n```\n不合规则的方案从文件中读入行文本，并且把每一行加入到vector中，直到在这一行中遇到\"quit\"一词。这段代码没有限制需要执行程序的内存空间上限，因此，程序可以通过两种方式很容易的耗尽已有的堆空间。第一种方式是，攻击者可以在文件中提供任意多的行，使得vector一直增长直到内存消耗完为止。第二种方式是，攻击者通过简单的提供一个任意长的行，使得`readLine()`方法将内存消耗完。根据Java API 文档的描述[API 2014], BufferedReader.readLine()方法的描述：  \n>读取文本的一行，认为这一行结束，在遇到以下任意一个符号时，如换行符（‘\\n’）、回车符（‘\\r’）或者回车换行符。  \n\n任何使用这个方法的代码都容易受到资源耗尽型攻击，因为一个用户可能输入一个任意长度的字符串。  \n**不规范的代码样例2**：  \n```java\n/*\n * Assuming the heap size as 512 MB (calculated as 1/4 of 2GB RAM = 512MB)\n * Considering long values being entered (64 bits each, the max number of\n * elements would be 512MB/64 bits = 67108864)\n */\npublic class ReadNames {\n    // Accepts unknown number of records\n    Vector<Long> names = new Vector<Long>();\n    long newID = 0L;\n    int count = 67108865;\n    int i = 0;\n    InputStreamReader input = new InputStreamReader(System.in);\n    Scanner reader = new Scanner(input);\n\n    public void addNames() {\n        try {\n            do {\n                // Adding unknown number of records to a list\n                // The user can enter more IDs than the heap can support and,\n                // as a result, exhaust the heap. Assume that the record ID\n                // is a 64-bit long value\n                System.out.print(\"Enter recordID (To quit, enter -1): \");\n                newID = reader.nextLong();\n\n                names.addElement(newID);\n                i++;\n            } while (i < count || newID != -1);\n        } finally {\n            input.close();\n        }\n    }\n\n    public static void main(String[] args) {\n        ReadNames demo = new ReadNames();\n        demo.addNames();\n    }\n}\n```\n在使用并行垃圾回收器的服务器类的机器中，默认的初始化和最大的堆大小遵守Java SE 6 [Sun 2006]的要求：  \n初始化堆大小：高于1/64的机器物理内存或合理的最小值  \n最大的堆大小：小于1/4的物理内存或者1GB内存  \n上面不符合规则的代码示例要求得到比默认值更多的堆内存。"
    Description_En: |-
      A Java `OutofMemoryError` occurs when the program attempts to use more heap space than is available. Among other causes, this error may result from the following:

      * A memory leak (see MSC04-J. Do not leak memory)
      * An infinite loop
      * Limited amounts of default heap memory available
      * Incorrect implementation of common data structures (hash tables, vectors, and so on)
      * Unbounded deserialization
      * Writing a large number of objects to an `ObjectOutputStream` (see SER10-J. Avoid memory and resource leaks during serialization)
      * Creating a large number of threads.
      * Uncompressing a file (see IDS04-J. Safely extract files from ZipInputStream)

      Some of these causes are platform-dependent and difficult to anticipate. Others, such as reading data from a file, are fairly easy to anticipate. As a result, programs must not accept untrusted input in a manner that can cause the program to exhaust memory.

      **Noncompliant Code Example (`readLine()`)**

      This noncompliant code example reads lines of text from a file and adds each one to a vector until a line with the word "quit" is encountered:

      ```java
      class ReadNames {
        private Vector<String> names = new Vector<String>();
        private final InputStreamReader input;
        private final BufferedReader reader;

        public ReadNames(String filename) throws IOException {
          this.input = new FileReader(filename);
          this.reader = new BufferedReader(input);
        }

        public void addNames() throws IOException {
          try {
            String newName;
            while (((newName = reader.readLine()) != null) &&
                   !(newName.equalsIgnoreCase("quit"))) {
              names.addElement(newName);
              System.out.println("adding " + newName);
            }
          } finally {
            input.close();
          }
        }

        public static void main(String[] args) throws IOException {
          if (args.length != 1) {
            System.out.println("Arguments: [filename]");
            return;
          }
          ReadNames demo = new ReadNames(args[0]);
          demo.addNames();
        }
      }
      ```

      The code places no upper bounds on the memory space required to execute the program. Consequently, the program can easily exhaust the available heap space in two ways. First, an attacker can supply arbitrarily many lines in the file, causing the vector to grow until memory is exhausted. Second, an attacker can simply supply an arbitrarily long line, causing the readLine() method to exhaust memory. According to the Java API documentation [API 2014],`BufferedReader.readLine()` method

      > Reads a line of text. A line is considered to be terminated by any one of a line feed ('`\n`'), a carriage return ('`\r`'), or a carriage return followed immediately by a linefeed.

      Any code that uses this method is susceptible to a resource exhaustion attack because the user can enter a string of any length.

      **Noncompliant Code Example**

      In a server-class machine using a parallel garbage collector, the default initial and maximum heap sizes are as follows for Java SE 6 [Sun 2006]:

      * Initial heap size: larger of 1/64 of the machine's physical memory or some reasonable minimum.
      * Maximum heap size: smaller of 1/4 of the physical memory or 1GB.

      This noncompliant code example requires more memory on the heap than is available by default:

      ```java
      /* Assuming the heap size as 512 MB
       * (calculated as 1/4 of 2GB RAM = 512MB)
       * Considering long values being entered (64 bits each,
       * the max number of elements would be 512MB/64 bits =
       * 67108864)
       */
      public class ReadNames {
        // Accepts unknown number of records
        Vector<Long> names = new Vector<Long>();
        long newID = 0L;
        int count = 67108865;
        int i = 0;
        InputStreamReader input = new InputStreamReader(System.in);
        Scanner reader = new Scanner(input);

        public void addNames() {
          try {
            do {
              // Adding unknown number of records to a list
              // The user can enter more IDs than the heap can support and,
              // as a result, exhaust the heap. Assume that the record ID
              // is a 64-bit long value
              System.out.print("Enter recordID (To quit, enter -1): ");
              newID = reader.nextLong();

              names.addElement(newID);
              i++;
            } while (i < count || newID != -1);
          } finally {
            input.close();
          }
        }

        public static void main(String[] args) {
          ReadNames demo = new ReadNames();
          demo.addNames();
        }
      }
      ```

      **Compliant Solution**

      A simple compliant solution is to reduce the number of names to read:

      ```java
      // ...
      int count = 10000000;
      // ...
      ```

      **Compliant Solution**

      The `OutOfMemoryError` can be avoided by ensuring the absence of infinite loops, memory leaks, and unnecessary object retention. When memory requirements are known ahead of time, the heap size can be tailored to fit the requirements using the following runtime parameters [Java 2006]:

      `java -Xms<initial heap size> -Xmx<maximum heap size>`

      For example,

      `java -Xms128m -Xmx512m ReadNames`

      Here the initial heap size is set to 128MB and the maximum heap size to 512MB.

      These settings can be changed either using the Java Control Panel or from the command line. They cannot be adjusted through the application itself.
    Advice: "**规范的代码样例1（限制文件大小）**：  \n```java\nclass ReadNames {\n    // ... Other methods and variables\n\n    public static final int fileSizeLimit = 1000000;\n\n    public ReadNames(String filename) throws IOException {\n        long size = Files.size(Paths.get(filename));\n        if (size > fileSizeLimit) {\n            throw new IOException(\"File too large\");\n        } else if (size == 0L) {\n            throw new IOException(\"File size cannot be determined, possibly too large\");\n        }\n        this.input = new FileReader(filename);\n        this.reader = new BufferedReader(input);\n    }\n}\n```    \n这个符合规则的方案对被读入的文件设置了大小的限制，这通过`Files.size()`方法来实现，这个方法是在 Java SE 7 中新出现的。如果一个文件在这个限制范围内，我们认为标准的`readLine()`方法不会耗尽内存，或者也不会被while循环耗尽内存。    \n**规范的代码样例2（有限的输入长度）**：\n```java\nclass ReadNames {\n    // ... Other methods and variables\n\n    public static String readLimitedLine(Reader reader, int limit) throws IOException {\n        StringBuilder sb = new StringBuilder();\n        for (int i = 0; i < limit; i++) {\n            int c = reader.read();\n            if (c == -1) {\n                return ((sb.length() > 0) ? sb.toString() : null);\n            }\n            if (((char) c == '\\n') || ((char) c == '\\r')) {\n                break;\n            }\n            sb.append((char) c);\n        }\n        return sb.toString();\n    }\n\n    public static final int lineLengthLimit = 1024;\n    public static final int lineCountLimit = 1000000;\n\n    public void addNames() throws IOException {\n        try {\n            String newName;\n            for (int i = 0; i < lineCountLimit; i++) {\n                newName = readLimitedLine(reader, lineLengthLimit);\n                if (newName == null || newName.equalsIgnoreCase(\"quit\")) {\n                    break;\n                }\n                names.addElement(newName);\n                System.out.println(\"adding \" + newName);\n            }\n        } finally {\n            input.close();\n        }\n    }\n\n}\n```  \n这个符合规则的方案对每一行的长度加入vector的总数量都加以限制。`readLimitedLine()`方法使用一个数值限制，用它来表示在一行中可以存在的所有字符数量。如果一行包含了更多的字符，这一行会被截断，并且字符会被返回到下一次调用。这可以防止攻击者通过提供没有行中断的输入来耗尽内存。  \n**规范的代码样例3**：  \n```java\n// ...  \nint count = 10000000;  \n// ...\n```  \n这个符合规范的简单方案减少了读入的名称的数量。  \n**规范的代码样例4**：  \n通过保证不使用无限循环、不出现内存泄漏并且不保留不需要的对象，可以避免OutOfMemoryError。当预先知道内存需求时，可以使用下面的方法来对内存进行剪裁，以满足要求。  \n`java -Xms<initial heap size> -Xmx<maximum heap size>`  \n  \n**例如**：  \n`java -Xms128m -Xmx512m ReadNames`  \n上面的代码将初始的堆大小设置为128MB，而最大的堆大小设置为512MB。  \n这些设置可以使用命令行下的Java控制台来改变。它们通过应用自身进行调整。"
    Advice_En: |-
      **Compliant Solution (Limited File Size)**

      This compliant solution imposes a limit on the size of the file being read. The limit is set with the `Files.size()` method, which was introduced in Java SE 7. If the file is within the limit, we can assume the standard `readLine()` method will not exhaust memory, nor will memory be exhausted by the `while` loop.

      ```java
      class ReadNames {
        // ... Other methods and variables

        public static final int fileSizeLimit = 1000000;

        public ReadNames(String filename) throws IOException {
          long size = Files.size( Paths.get( filename));
          if (size > fileSizeLimit) {
            throw new IOException("File too large");
          } else if (size == 0L) {
            throw new IOException("File size cannot be determined, possibly too large");
          }
          this.input = new FileReader(filename);
          this.reader = new BufferedReader(input);
        }
      }
      ```

      **Compliant Solution (Limited Length Input)**

      This compliant solution imposes limits both on the length of each line and on the total number of items to add to the vector. (It does not depend on any Java SE 7 or later features.)

      ```java
      class ReadNames {
        // ... Other methods and variables

        public static String readLimitedLine(Reader reader, int limit)
                                             throws IOException {
          StringBuilder sb = new StringBuilder();
          for (int i = 0; i < limit; i++) {
            int c = reader.read();
            if (c == -1) {
              return ((sb.length() > 0) ? sb.toString() : null);
            }
            if (((char) c == '\n') || ((char) c == '\r')) {
              break;
            }
            sb.append((char) c);
          }
          return sb.toString();
        }

        public static final int lineLengthLimit = 1024;
        public static final int lineCountLimit = 1000000;

        public void addNames() throws IOException {
          try {
            String newName;
            for (int i = 0; i < lineCountLimit; i++) {
              newName = readLimitedLine(reader, lineLengthLimit);
              if (newName == null || newName.equalsIgnoreCase("quit")) {
                break;
              }
              names.addElement(newName);
              System.out.println("adding " + newName);
            }
          } finally {
            input.close();
          }
        }

      }
      ```

      The `readLimitedLine()` method takes a numeric limit, indicating the total number of characters that may exist on one line. If a line contains more characters, the line is truncated, and the characters are returned on the next invocation. This prevents an attacker from exhausting memory by supplying input with no line breaks.
      **Compliant Solution**

      A simple compliant solution is to reduce the number of names to read:

      ```java
      // ...
      int count = 10000000;
      // ...
      ```

      **Compliant Solution**

      The `OutOfMemoryError` can be avoided by ensuring the absence of infinite loops, memory leaks, and unnecessary object retention. When memory requirements are known ahead of time, the heap size can be tailored to fit the requirements using the following runtime parameters [Java 2006]:

      `java -Xms<initial heap size> -Xmx<maximum heap size>`

      For example,

      `java -Xms128m -Xmx512m ReadNames`

      Here the initial heap size is set to 128MB and the maximum heap size to 512MB.

      These settings can be changed either using the Java Control Panel or from the command line. They cannot be adjusted through the application itself.
