    Description: |-
      可扩展标记语言（XML）旨在帮助存储、构造和传输数据。由于其平台独立性、灵活性和相对简单性，XML已被广泛应用。然而，由于其多功能性，XML容易受到各种攻击，包括XML注入。
      如果用户有能力使用结构化XML文档做为输入，那么他能够通过在数据字段中插入XML标签来重写这个XML文档的内容。允许用户指定可购买商品数量的在线商店应用程序可能会生成以下XML文档：
      ```xml
      <item>
        <description>Widget</description>
        <price>500.0</price>
        <quantity>1</quantity>
      </item>
      ```
      攻击者可能会输入以下字符串，而不是数量计数：
      ```xml
      1</quantity><price>1.0</price><quantity>1
      ```
      在本例中，XML解析为以下内容：
      ```java
      <item>
        <description>Widget</description>
        <price>500.0</price>
        <quantity>1</quantity><price>1.0</price><quantity>1</quantity>
      </item>
      ```
      XML解析器可以解释本例中的XML，以便第二个价格字段覆盖第一个，从而将商品的价格更改为1美元。或者，攻击者可能会插入特殊字符，例如注释块和 `CDATA` 分隔符，这会破坏XML的含义。
      **不规范的代码样例1**：
      在这段代码示例中，客户端方法使用简单的字符串连接来构建XML查询以发送到服务器。在这时就有可能出现XML注入问题，因为这个方法没有进行任何输入验证。
      ```java
      import java.io.BufferedOutputStream;
      import java.io.ByteArrayOutputStream;
      import java.io.IOException;

      public class OnlineStore {
        private static void createXMLStreamBad(final BufferedOutputStream outStream,
            final String quantity) throws IOException {
          String xmlString = "<item>\n<description>Widget</description>\n"
              + "<price>500</price>\n" + "<quantity>" + quantity
              + "</quantity></item>";
          outStream.write(xmlString.getBytes());
          outStream.flush();
        }
      }
      ```
      当XML可能已经载入还未处理的输入数据时，一般情况下使用XML模板或者DTD验证XML。如果还没有创建这样的XML字符串，那么在创建XML之前处理输入，这种方式性能较高。
    Description_En: |-
      The extensible markup language (XML) is designed to help store, structure, and transfer data. Because of its platform independence, flexibility, and relative simplicity, XML has found use in a wide range of applications. However, because of its versatility, XML is vulnerable to a wide spectrum of attacks, including *XML injection*.

      A user who has the ability to provide input string data that is incorporated into an XML document can inject XML tags. These tags are interpreted by the XML parser and may cause data to be overridden.

      An online store application that allows the user to specify the quantity of an item available for purchase might generate the following XML document:

      ```java
      <item>
        <description>Widget</description>
        <price>500.0</price>
        <quantity>1</quantity>
      </item>
      ```

      An attacker might input the following string instead of a count for the quantity:

      ```java
      1</quantity><price>1.0</price><quantity>1
      ```

      In this case, the XML resolves to the following:

      ```java
      <item>
        <description>Widget</description>
        <price>500.0</price>
        <quantity>1</quantity><price>1.0</price><quantity>1</quantity>
      </item>
      ```

      An XML parser may interpret the XML in this example such that the second price field overrides the first, changing the price of the item to $1. Alternatively, the attacker may be able to inject special characters, such as comment blocks and `CDATA` delimiters, which corrupt the meaning of the XML.

      **Noncompliant Code Example**

      In this noncompliant code example, a client method uses simple string concatenation to build an XML query to send to a server. XML injection is possible because the method performs no input validation.

      ```java
      import java.io.BufferedOutputStream;
      import java.io.ByteArrayOutputStream;
      import java.io.IOException;

      public class OnlineStore {
        private static void createXMLStreamBad(final BufferedOutputStream outStream,
            final String quantity) throws IOException {
          String xmlString = "<item>\n<description>Widget</description>\n"
              + "<price>500</price>\n" + "<quantity>" + quantity
              + "</quantity></item>";
          outStream.write(xmlString.getBytes());
          outStream.flush();
        }
      }
      ```
    Advice: "当XML可能已经载入还未处理的输入数据时，一般情况下使用XML模板或者DTD验证XML。如果还没有创建这样的XML字符串，那么在创建XML之前处理输入，这种方式性能较高。  \n**规范的代码样例1**：输入验证  \n下面代码的解决方案是验证`quantity`是一个无符号整数。 \n```java\nimport java.io.BufferedOutputStream;\nimport java.io.ByteArrayOutputStream;\nimport java.io.IOException;\n\npublic class OnlineStore {\n    private static void createXMLStream(final BufferedOutputStream outStream, final String quantity)\n            throws IOException, NumberFormatException {\n        // Write XML string only if quantity is an unsigned integer (count).  \n        int count = Integer.parseUnsignedInt(quantity);\n        String xmlString = \"<item>\\n<description>Widget</description>\\n\" + \"<price>500</price>\\n\" + \"<quantity>\" + count\n                + \"</quantity></item>\";\n        outStream.write(xmlString.getBytes());\n        outStream.flush();\n    }\n}\n``` \n**规范的代码样例2**：XML模板  \n更为通用的验证XML，防止注入的方法是：使用文档类型定义（Document Type Definition， DTD）或者schema来验证。schema必须严格定义，从而防止通过注入的方式将一个合法的XML文档变成错误的文档。以下是用来对样例2进行验证的schema模板：  \n```xml\n<xs:schema xmlns:xs=\"http://www.w3.org/2001/XMLSchema\">\n\t<xs:element name=\"item\" >\n\t\t<xs:complexType>\n\t\t\t<xs:sequence>\n\t\t\t\t<xs:element name=\"description\" type=\"xs:string\" />\n\t\t\t\t<xs:element name=\"price\" type=\"xs:decimal\" />\n\t\t\t\t<xs:element name=\"quantity\" type=\"xs:nonNegativeInteger\" />\n\t\t\t</xs:sequence>\n\t\t</xs:complexType>\n\t</xs:element>\n</xs:schema> \n``` \n在schema.xsd文件中可以得到XML模板。下面解决方案使用这个模板来防止XML注入。它同时需要使用在IDS17-J中定义的CustomResolver类来防止XXE攻击。  \n```java\nimport java.io.BufferedOutputStream;\nimport java.io.ByteArrayOutputStream;\nimport java.io.File;\nimport java.io.IOException;\nimport java.io.StringReader;\n\nimport javax.xml.XMLConstants;\nimport javax.xml.parsers.ParserConfigurationException;\nimport javax.xml.parsers.SAXParser;\nimport javax.xml.parsers.SAXParserFactory;\nimport javax.xml.transform.stream.StreamSource;\nimport javax.xml.validation.Schema;\nimport javax.xml.validation.SchemaFactory;\n\nimport org.xml.sax.InputSource;\nimport org.xml.sax.SAXException;\nimport org.xml.sax.SAXParseException;\nimport org.xml.sax.XMLReader;\nimport org.xml.sax.helpers.DefaultHandler;\n\npublic class OnlineStore {\n\n    private static void createXMLStream(final BufferedOutputStream outStream, final String quantity)\n            throws IOException {\n        String xmlString;\n        xmlString = \"<item>\\n<description>Widget</description>\\n\" + \"<price>500.0</price>\\n\" + \"<quantity>\" + quantity\n                + \"</quantity></item>\";\n        InputSource xmlStream = new InputSource(new StringReader(xmlString));\n// Build a validating SAX parser using our schema  \n        SchemaFactory sf = SchemaFactory.newInstance(XMLConstants.W3C_XML_SCHEMA_NS_URI);\n        DefaultHandler defHandler = new DefaultHandler() {\n            public void warning(SAXParseException s) throws SAXParseException {\n                throw s;\n            }\n\n            public void error(SAXParseException s) throws SAXParseException {\n                throw s;\n            }\n\n            public void fatalError(SAXParseException s) throws SAXParseException {\n                throw s;\n            }\n        };\n        StreamSource ss = new StreamSource(new File(\"schema.xsd\"));\n        try {\n            Schema schema = sf.newSchema(ss);\n            SAXParserFactory spf = SAXParserFactory.newInstance();\n            spf.setSchema(schema);\n            SAXParser saxParser = spf.newSAXParser();\n            // To set the custom entity resolver,\n            // an XML reader needs to be created\n            XMLReader reader = saxParser.getXMLReader();\n            reader.setEntityResolver(new CustomResolver());\n            saxParser.parse(xmlStream, defHandler);\n        } catch (ParserConfigurationException x) {\n            throw new IOException(\"Unable to validate XML\", x);\n        } catch (SAXException x) {\n            throw new IOException(\"Invalid quantity\", x);\n        }\n// Our XML is valid, proceed  \n        outStream.write(xmlString.getBytes());\n        outStream.flush();\n    }\n}\n```"
    Advice_En: |-
      **Compliant Solution (Input Validation)**

      Depending on the specific data and command interpreter or parser to which data is being sent, appropriate methods must be used to sanitize untrusted user input. This compliant solution validates that `quantity` is an unsigned integer:

      ```java
      import java.io.BufferedOutputStream;
      import java.io.ByteArrayOutputStream;
      import java.io.IOException;

      public class OnlineStore {
        private static void createXMLStream(final BufferedOutputStream outStream,
            final String quantity) throws IOException, NumberFormatException {
          // Write XML string only if quantity is an unsigned integer (count).
          int count = Integer.parseUnsignedInt(quantity);
          String xmlString = "<item>\n<description>Widget</description>\n"
              + "<price>500</price>\n" + "<quantity>" + count + "</quantity></item>";
          outStream.write(xmlString.getBytes());
          outStream.flush();
        }
      }
      ```

      **Compliant Solution (XML Schema)**

      A more general mechanism for checking XML for attempted injection is to validate it using a Document Type Definition (DTD) or schema. The schema must be rigidly defined to prevent injections from being mistaken for valid XML. Here is a suitable schema for validating our XML snippet:

      ```java
      <xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">
      <xs:element name="item">
        <xs:complexType>
          <xs:sequence>
            <xs:element name="description" type="xs:string"/>
            <xs:element name="price" type="xs:decimal"/>
            <xs:element name="quantity" type="xs:nonNegativeInteger"/>
          </xs:sequence>
        </xs:complexType>
      </xs:element>
      </xs:schema>
      ```

      The schema is available as the file `schema.xsd`. This compliant solution employs this schema to prevent XML injection from succeeding. It also relies on the `CustomResolver` class defined in IDS17-J. Prevent XML External Entity Attacks to prevent XML external entity (XXE) attacks.

      ```java
      import java.io.BufferedOutputStream;
      import java.io.ByteArrayOutputStream;
      import java.io.File;
      import java.io.IOException;
      import java.io.StringReader;

      import javax.xml.XMLConstants;
      import javax.xml.parsers.ParserConfigurationException;
      import javax.xml.parsers.SAXParser;
      import javax.xml.parsers.SAXParserFactory;
      import javax.xml.transform.stream.StreamSource;
      import javax.xml.validation.Schema;
      import javax.xml.validation.SchemaFactory;

      import org.xml.sax.InputSource;
      import org.xml.sax.SAXException;
      import org.xml.sax.SAXParseException;
      import org.xml.sax.XMLReader;
      import org.xml.sax.helpers.DefaultHandler;

      public class OnlineStore {

        private static void createXMLStream(final BufferedOutputStream outStream,
            final String quantity) throws IOException {
          String xmlString;
          xmlString = "<item>\n<description>Widget</description>\n"
              + "<price>500.0</price>\n" + "<quantity>" + quantity
              + "</quantity></item>";
          InputSource xmlStream = new InputSource(new StringReader(xmlString));
          // Build a validating SAX parser using our schema
          SchemaFactory sf = SchemaFactory
              .newInstance(XMLConstants.W3C_XML_SCHEMA_NS_URI);
          DefaultHandler defHandler = new DefaultHandler() {
            public void warning(SAXParseException s) throws SAXParseException {
              throw s;
            }
            public void error(SAXParseException s) throws SAXParseException {
              throw s;
            }
            public void fatalError(SAXParseException s) throws SAXParseException {
              throw s;
            }
          };
          StreamSource ss = new StreamSource(new File("schema.xsd"));
          try {
            Schema schema = sf.newSchema(ss);
            SAXParserFactory spf = SAXParserFactory.newInstance();
            spf.setSchema(schema);
            SAXParser saxParser = spf.newSAXParser();
            // To set the custom entity resolver,
            // an XML reader needs to be created
            XMLReader reader = saxParser.getXMLReader();
            reader.setEntityResolver(new CustomResolver());
            saxParser.parse(xmlStream, defHandler);
          } catch (ParserConfigurationException x) {
            throw new IOException("Unable to validate XML", x);
          } catch (SAXException x) {
            throw new IOException("Invalid quantity", x);
          }
          // Our XML is valid, proceed
          outStream.write(xmlString.getBytes());
          outStream.flush();
        }
      }
      ```

      Using a schema or DTD to validate XML is convenient when receiving XML that may have been loaded with unsanitized input. If such an XML string has not yet been built, sanitizing input before constructing XML yields better performance.
