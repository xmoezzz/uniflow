  - id: '02000010141409'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 13. 输入输出 (FIO)
      - type: DetailClassChin
        value: FIO09-J：不要使用write()方法输出超过0~255的整数
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 13. Input Output (FIO)
      - type: DetailClassChin
        value: FIO09-J:Do not rely on the write() method to output integers outside the range 0 to 255
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "在`java.io.OutputStream`中定义的`write()`方法，将一个类型为int的值做为参数，而这个参数必须在0~255之间。因为一个类型为int的数值会超出这个范围，该方法会将数值的高位部分截去。  \n风险评估：违反该条准则可能会导致数据被截断。    \n**不符合规范的样例1**：  \n```java\nclass ConsoleWrite {\n    public static void main(String[] args) {\n        // Any input value > 255 will result in unexpected output\n        System.out.write(Integer.valueOf(args[0]));\n        System.out.flush();\n    }\n}\n```  \n代码没有对参数进行数值的验证，任何不在0~255之间的数值都会被截断。"
    Description_En: |-
      The `write()` method, defined in the class `java.io.OutputStream`, takes an argument of type `int` the value of which must be in the range 0 to 255. Because a value of type `int` could be outside this range, failure to range check can result in the truncation of the higher-order bits of the argument.

      The general contract for the `write()` method says that it writes one byte to the output stream. The byte to be written constitutes the eight lower-order bits of the argument `b`, passed to the `write()` method; the 24 high-order bits of `b` are ignored (see `<a class="external-link" href="https://docs.oracle.com/javase/8/docs/api/java/io/OutputStream.html" rel="nofollow">java.io.OutputStream.write()</a>` [[API 2014] for more information).
      **Noncompliant Code Example**

      This noncompliant code example accepts a value from the user without validating it. Any value that is not in the range of 0 to 255 is truncated. For instance, `write(303)` prints `/` on ASCII-based systems because the lower-order 8 bits of 303 are used while the 24 high-order bits are ignored (303 % 256 = 47, which is the ASCII code for `/`). That is, the result is the remainder of the input divided by 256.

      ```java
      class ConsoleWrite {
        public static void main(String[] args) {
          // Any input value > 255 will result in unexpected output
          System.out.write(Integer.valueOf(args[0]));
          System.out.flush();
        }
      }
      ```
    Advice: "对`write()`方法的参数进行数值0~255的检查。或可采用DataOutputStream类中的`writeInt()`方法，该方法可以输出int类型可表示的所有数值。  \n**规范的代码样例1**：  \n```java\nclass FileWrite {\n    public static void main(String[] args) throws NumberFormatException, IOException {\n        // Perform range checking\n        int value = Integer.valueOf(args[0]);\n        if (value < 0 || value > 255) {\n            throw new ArithmeticException(\"Value is out of range\");\n        }\n        System.out.write(value);\n        System.out.flush();\n    }\n}\n```\n**规范的代码样例2**：  \n```java\nclass FileWrite {\n    public static void main(String[] args) throws NumberFormatException, IOException {\n        DataOutputStream dos = new DataOutputStream(System.out);\n        dos.writeInt(Integer.valueOf(args[0].toString()));\n        System.out.flush();\n    }\n}\n```"
    Advice_En: |-
      **Compliant Solution (Range-Check Inputs)**

      This compliant solution prints the corresponding character only if the input integer is in the proper range. If the input is outside the representable range of an `int`, the `Integer.valueOf()` method throws a `NumberFormatException`. If the input can be represented by an `int` but is outside the range required by `write()`, this code throws an `ArithmeticException`.

      ```java
      class FileWrite {
        public static void main(String[] args) throws NumberFormatException, IOException {
          // Perform range checking
          int value = Integer.valueOf(args[0]);
          if (value < 0 || value > 255) {
            throw new ArithmeticException("Value is out of range");
          }

          System.out.write(value);
          System.out.flush();
        }
      }
      ```

      **Compliant Solution (`writeInt()`)**

      This compliant solution uses the `writeInt()` method of the `DataOutputStream` class, which can output the entire range of values representable as an `int`:

      ```java
      class FileWrite {
        public static void main(String[] args)
                                throws NumberFormatException, IOException {
          DataOutputStream dos = new DataOutputStream(System.out);
          dos.writeInt(Integer.valueOf(args[0].toString()));
          System.out.flush();
        }
      }
      ```
