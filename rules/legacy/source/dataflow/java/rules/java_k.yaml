  - id: '02000010140511'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 03. 数据类型与运算 (NUM)
      - type: DetailClassChin
        value: NUM11-J：不要比较或检查浮点值的字符串表示法
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 03. Numeric Types and Operations (NUM)
      - type: DetailClassChin
        value: NUM11-J:Do not compare or inspect the string representation of floating-point values
    BugServerity: 1
    DynamicDescription: ''
    Description: |-
      不得比较或检查浮点数的字符串表示形式。
      **不规范的代码示例1（字符串比较）**
      此不合规代码示例比较两个浮点值的字符串表示形式：

      ```java
      int i = 1;
      String s = Double.valueOf(i / 1000.0).toString();
      if (s.equals("0.001")) {
        // ...
      }
      ```

      比较失败，因为s包含字符串`0.0010`，该字符串不等于`0.001`。
      **不规范的代码示例2（正则表达式）**
      此不合规代码示例试图在比较字符串之前，通过在字符串上使用正则表达式来减少额外的尾随零：

      ```java
      int i = 1;
      String s = Double.valueOf(i / 1000.0).toString();
      s = s.replaceFirst("[.0]*$", "");
      if (s.equals("0.001")) {
        // ...
      }
      ```

      虽然在前面的代码中比较成功，但在下面的类似代码中比较失败，该代码使用`1/10000.0`而不是`1/1000.0`。生成的字符串不是`0.0`0010，而是`1.0E-4`。

      ```java
      int i = 1;
      String s = Double.valueOf(i / 10000.0).toString();
      s = s.replaceFirst("[.0]*$", "");
      if (s.equals("0.0001")) {
        // ...
      }
      ```
    Description_En: |-
      String representations of floating-point numbers must not be compared or inspected.

      **Noncompliant Code Example (String Comparison)**

      This noncompliant code example compares the string representations of two floating-point values:

      ```java
      int i = 1;
      String s = Double.valueOf(i / 1000.0).toString();
      if (s.equals("0.001")) {
        // ...
      }
      ```

      The comparison unexpectedly fails because `s` contains the string `"0.0010"`, which is not equal to `<code>"0.001"</code>`.

      **Noncompliant Code Example (Regex)**

      This noncompliant code example attempts to mitigate the extra trailing zero by using a regular expression on the string before comparing it:

      ```java
      int i = 1;
      String s = Double.valueOf(i / 1000.0).toString();
      s = s.replaceFirst("[.0]*$", "");
      if (s.equals("0.001")) {
        // ...
      }
      ```

      Although the comparison succeeds on the preceding code, it fails on the following similar code, which uses `1/10000.0` instead of `1/1000.0`. The string produced is not `0.00010` but rather `1.0E-4`.

      ```java
      int i = 1;
      String s = Double.valueOf(i / 10000.0).toString();
      s = s.replaceFirst("[.0]*$", "");
      if (s.equals("0.0001")) {
        // ...
      }
      ```
    Advice: |-
      **规范的代码示例1（字符串比较）**
      解决方案使用`BigDecimal`类来避免精度损失。它执行一个数字比较，结果符合预期。

      ```java
      int i = 1;
      BigDecimal d = new BigDecimal(Double.valueOf(i / 1000.0).toString());
      if (d.compareTo(new BigDecimal("0.001")) == 0) {
        // ...
      }
      ```
    Advice_En: |-
