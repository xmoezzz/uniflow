        value: FIO12-J:Provide methods to read and write little-endian data
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "在Java中，数据是按照大端字节序（big-endian，同样被称为network-order）进行存储的。这意味着，线性的从最高位到最低位表示数据。在同时包括了大端字节序和小端字节序（little-endian）主机的网络化环境中，或者与使用JNI的其他语言在一起工作时，正确的处理相关的字节顺序问题是很重要的。不能处理字节顺序问题，会导致不可预期的行为。在Java 4之前，要求提供对相反字节顺序进行管理的方法的定义，同时需要维护这些相反字节顺序与采用小端字节编码的系统的兼容性。  \n风险评估：违反该条准则可能会导致错误的解读数据，这种错误的解读包括对数据值、数据符号属性的错误解读。    \n**不规范的代码样例1**：  \n```java\ntry {\n  DataInputStream dis = null;\n  try {\n    dis = new DataInputStream(new FileInputStream(\"data\"));\n    // Little-endian data might be read as big-endian\n    int serialNumber = dis.readInt();\n  } catch (IOException x) {\n    // Handle error\n  } finally {\n    if (dis != null) {\n      try {\n       dis.close();\n      } catch (IOException e) {\n      // Handle error\n      }\n    }\n  }\n}\n```\n由类`java.io.DataInputStream`和`java.io.DataOutputStream`定义的数据读取的方法（`readByte()、readShort()、readInt()、readLong()、readFloat()、readDouble()`）和对应的写方法仅对大端字节序数据进行操作。使这些方法与C、C++语言进行交互操作是不安全的，这些语言不能保证字节顺序。"
    Description_En: |-
      In Java, data is stored in big-endian format (also called network order). That is, all data is represented sequentially starting from the most significant bit to the least significant. JDK versions prior to JDK 1.4 required definition of custom methods that manage reversing byte order to maintain compatibility with little-endian systems. Correct handling of byte order–related issues is critical when exchanging data in a networked environment that includes both big-endian and little-endian machines or when working with other languages using Java Native Interface (JNI). Failure to handle byte-ordering issues can cause unexpected program behavior.
        **Noncompliant Code Example**

      The read methods (`readByte()`, `readShort()`, `readInt()`, `readLong()`, `readFloat()`, and `readDouble()`) and the corresponding write methods defined by class `java.io.DataInputStream` and class `java.io.DataOutputStream` operate only on big-endian data. Use of these methods while interoperating with traditional languages, such as C and C++, is insecure because such languages lack any guarantees about endianness. This noncompliant code example shows such a discrepancy:

      ```java
      try {
        DataInputStream dis = null;
        try {
          dis = new DataInputStream(new FileInputStream("data"));
          // Little-endian data might be read as big-endian
          int serialNumber = dis.readInt();
        } catch (IOException x) {
          // Handle error
        } finally {
          if (dis != null) {
            try {
             dis.close();
            } catch (IOException e) {
            // Handle error
            }
          }
        }
      }
      ```
    Advice: "**规范的代码样例1**：  \n```java\nDataInputStream dis = null;\ntry {\n    dis = new DataInputStream(new FileInputStream(\"data\"));\n    byte[] buffer = new byte[4];\n    int bytesRead = dis.read(buffer); // Bytes are read into buffer\n    if (bytesRead != 4) {\n        throw new IOException(\"Unexpected End of Stream\");\n    }\n    int serialNumber = ByteBuffer.wrap(buffer).order(ByteOrder.LITTLE_ENDIAN).getInt();\n} finally {\n    if (dis != null) {\n        try {\n            dis.close();\n        } catch (IOException x) {\n            // handle error\n        }\n    }\n}\n```  \n代码通过使用类ByteBuffer提供的方法来正确的从初始的输入数值中提取一个int值。它使用ByteBuffer来封装输入的字节数组，设置字节顺序为小端字节序，并提取出int值，结果存储在serialNumber整数中。类ByteBuffer提供了类似get、put方法来处理其他的数值类型。  \n**规范的代码样例2**：\n另一种解决方案是定义读取和写入方法，以在读取或写入文件时支持必要的字节交换。 在此示例中，`readLittleEndianInteger()` 方法将四个字节读入字节缓冲区，然后以正确的顺序将整数拼凑在一起。 `writeLittleEndianInteger()` 方法通过重复转换整数来获取字节，以便在连续右移时提取最低有效字节。 `Long` 值可以通过定义大小为 8 的字节缓冲区来处理。\n```java\n// Read method\npublic static int readLittleEndianInteger(InputStream ips)\n                                          throws IOException {\n  byte[] buffer = new byte[4];\n  int check = ips.read(buffer);\n\n  if (check != 4) {\n    throw new IOException(\"Unexpected End of Stream\");\n  }\n\n  int result = (buffer[3] << 24) | (buffer[2] << 16) |\n               (buffer[1] << 8)  | buffer[0];\n  return result;\n}\n\n// Write method\npublic static void writeLittleEndianInteger(int i, OutputStream ops)\n  throws IOException {\n  byte[] buffer = new byte[4];\n  buffer[0] = (byte) i;\n  buffer[1] = (byte) (i >> 8);\n  buffer[2] = (byte) (i >> 16);\n  buffer[3] = (byte) (i >> 24);\n  ops.write(buffer);\n}\n```\n**规范的代码样例3**：\n使用Java 5+进行编程时，使用定义在类Character、Short、Integer、Long的`reverseBytes()`方法转换整型数值的字节顺序。但是在类Float和Bouble中没有提供这个方法。  \n```java\npublic static int reverse(int i) {  \n  return Integer.reverseBytes(i);  \n}\n```"
    Advice_En: |-
      **Compliant Solution (`ByteBuffer`)**
      This compliant solution uses methods provided by class `<a class="external-link" href="https://docs.oracle.com/javase/8/docs/api/java/nio/ByteBuffer.html" rel="nofollow">ByteBuffer</a>` [[API 2014] to correctly extract an `int` from the original input value. It wraps the input byte array with a `ByteBuffer`, sets the byte order to little-endian, and extracts the `int`. The result is stored in the integer `serialNumber`. Class `ByteBuffer` provides analogous get and put methods for other numeric types.
      ```java
      try {
        DataInputStream dis = null;
        try {
          dis = new DataInputStream( new FileInputStream("data"));
          byte[] buffer = new byte[4];
          int bytesRead = dis.read(buffer);  // Bytes are read into buffer
          if (bytesRead != 4) {
            throw new IOException("Unexpected End of Stream");
          }
          int serialNumber =
              ByteBuffer.wrap(buffer).order(ByteOrder.LITTLE_ENDIAN).getInt();
        } finally {
          if (dis != null) {
        try {
          dis.close();
        } catch (IOException x) {
          // Handle error
        }
          }
        }
      } catch (IOException x) {
        // Handle error
      }
      ```
      **Compliant Solution (Define Special-Purpose Methods)**

      An alternative compliant solution is to define read and write methods that support the necessary byte-swapping while reading from or writing to the file. In this example, the `readLittleEndianInteger()` method reads four bytes into a byte buffer and then pieces together the integer in the correct order. The `writeLittleEndianInteger()` method obtains bytes by repeatedly casting the integer so that the least significant byte is extracted on successive right shifts. `Long` values can be handled by defining a byte buffer of size 8.

      ```java
      // Read method
      public static int readLittleEndianInteger(InputStream ips)
                                                throws IOException {
        byte[] buffer = new byte[4];
        int check = ips.read(buffer);

        if (check != 4) {
          throw new IOException("Unexpected End of Stream");
        }

        int result = (buffer[3] << 24) | (buffer[2] << 16) |
                     (buffer[1] << 8)  | buffer[0];
        return result;
      }

      // Write method
      public static void writeLittleEndianInteger(int i, OutputStream ops)
        throws IOException {
        byte[] buffer = new byte[4];
        buffer[0] = (byte) i;
        buffer[1] = (byte) (i >> 8);
        buffer[2] = (byte) (i >> 16);
        buffer[3] = (byte) (i >> 24);
        ops.write(buffer);
      }
      ```

      **Compliant Solution (`reverseBytes()`)**

      When programming for JDK 1.5 and later, use the `reverseBytes()` method defined in the classes `Character`, `Short`, `Integer`, and `Long` to reverse the order of the integral value's bytes. Note that classes `Float` and `Double` lack such a method.

      ```java
      public static int reverse(int i) {
        return Integer.reverseBytes(i);
      }
      ```
