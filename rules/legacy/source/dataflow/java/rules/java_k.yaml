    Description: "当初始化的SQL查询被修改成另外一个完全不同形式的查询的时候，就会出现SQL注入漏洞。执行这个被修改过的查询，可能导致信息泄露或者数据被修改。防止SQL注入的主要方法是：净化并验证非受信输入，并采用参数化查询。\n假设一个数据库的表db_user中存储了用户名和密码，它们用于对系统用户进行认证。用户名使用长度为8的字符串表示，密码使用长度为20的字符串表示。\n一个用来验证用户的SQL命令如下：`SELECT * FROM db_user WHERE username='<USERNAME>' AND password='<PASSWORD>' `\n如果它可以返回记录，那么意味着用户名和密码是合法的。\n然而，如果攻击者能够替换`<USERNAME>`和`<PASSWORD>`中的任意字符串，它们就可以使用下面关于`<USERNAME>`的字符串进行SQL注入攻击：`validuser' OR '1'='1 `\n当其提交SQL查询时，命令就变成：`SELECT * FROM db_user WHERE username='validuser' OR '1'='1' AND password='<PASSWORD>'`\n如果`validuser`确实是一个存在的用户名，那么这条语句就会返回表中存储的`validuser`用户的记录。这个操作就成功的跳过了密码验证。\n同样，如果攻击者为`<PASSWORD>`提交字符串：`' OR '1'='1`\n这样就会产生以下命令：`SELECT * FROM db_user WHERE username='' AND password='' OR '1'='1'`\n这一次`'1'='1'`是永远成立的，它使得用户名和密码验证都是无效的，攻击者可以不需要用户名和密码就通过了用户认证。\n**不规范的代码样例1**：  \n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.ResultSet;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\nclass Login {\n    public Connection getConnection() throws SQLException {\n        DriverManager.registerDriver(new com.microsoft.sqlserver.jdbc.SQLServerDriver());\n        String dbConnection = PropertyManager.getProperty(\"db.connection\");\n        // Can hold some value like\n        // \"jdbc:microsoft:sqlserver://\\<HOST\\>:1433,<UID>,<PWD>\"\n        return DriverManager.getConnection(dbConnection);\n    }\n\n    String hashPassword(char[] password) {\n        // Create hash of password\n    }\n\n    public void doPrivilegedAction(String username, char[] password) throws SQLException {\n        Connection connection = getConnection();\n        if (connection == null) {\n            // Handle error\n        }\n        try {\n            String pwd = hashPassword(password);\n\n            String sqlString = \"SELECT * FROM db_user WHERE username = '\" + username + \"' AND password = '\" + pwd + \"'\";\n            Statement stmt = connection.createStatement();\n            ResultSet rs = stmt.executeQuery(sqlString);\n\n            if (!rs.next()) {\n                throw new SecurityException(\"User name or password incorrect\");\n            }\n\n            // Authenticated; proceed\n        } finally {\n            try {\n                connection.close();\n            } catch (SQLException x) {\n                // Forward to handler\n            }\n        }\n    }\n}\n```\n代码使用JDBC代码来认证用户，提交`stmt.executeQuery(sqlString)`查询的SQL为`sqlString`，它是通过一个拼接字符串组合而来，并且`sqlString`未经过净化或验证，`Statement.executeQuery(String)`方法不能防止SQL注入，该代码将会引发SQL注入漏洞攻击。  \n**不规范的代码样例2**：  \n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.ResultSet;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\nclass Login {\n    public Connection getConnection() throws SQLException {\n        DriverManager.registerDriver(new com.microsoft.sqlserver.jdbc.SQLServerDriver());\n        String dbConnection = PropertyManager.getProperty(\"db.connection\");\n        // Can hold some value like  \n        // \"jdbc:microsoft:sqlserver://\\<HOST\\>:1433,<UID>,<PWD>\"  \n        return DriverManager.getConnection(dbConnection);\n    }\n\n    String hashPassword(char[] password) {\n        // Create hash of password  \n    }\n\n    public void doPrivilegedAction(String username, char[] password) throws SQLException {\n        Connection connection = getConnection();\n        if (connection == null) {\n            // Handle error\n        }\n        try {\n            String pwd = hashPassword(password);\n            String sqlString = \"select * from db_user where username=\" + username + \" and password =\" + pwd;\n            PreparedStatement stmt = connection.prepareStatement(sqlString);\n\n            ResultSet rs = stmt.executeQuery();\n            if (!rs.next()) {\n                throw new SecurityException(\"User name or password incorrect\");\n            }\n\n            // Authenticated; proceed\n        } finally {\n            try {\n                connection.close();\n            } catch (SQLException x) {\n                // Forward to handler\n            }\n        }\n    }\n}\n```\n`java.sql.PreparedStatement`类恰当转义输入字符串。当正确使用时，可以防止SQL注入。这段代码示例修改`doPrivilegedAction()`方法使用`PreparedStatement`代替`java.sql.Statement`。在预处理语句中，当未验证的用户输入，仍然会导致SQL注入。"
    Description_En: |-
      SQL injection vulnerabilities arise in applications where elements of a SQL query originate from an untrusted source. Without precautions, the untrusted data may maliciously alter the query, resulting in information leaks or data modification. The primary means of preventing SQL injection are sanitization and validation, which are typically implemented as parameterized queries and stored procedures.

      Suppose a system authenticates users by issuing the following query to a SQL database. If the query returns any results, authentication succeeds; otherwise, authentication fails.

      ```
      SELECT * FROM db_user WHERE username='<USERNAME>' AND
                                  password='<PASSWORD>'
      ```

      Suppose an attacker can substitute arbitrary strings for `<USERNAME>` and `<PASSWORD>`. In that case, the authentication mechanism can be bypassed by supplying the following `<USERNAME>` with an arbitrary password:

      ```
      validuser' OR '1'='1
      ```

      The authentication routine dynamically constructs the following query:

      ```
      SELECT * FROM db_user WHERE username='validuser' OR '1'='1' AND password='<PASSWORD>'
      ```

      If `validuser` is a valid user name, this `SELECT` statement yields the `validuser` record in the table. The password is never checked because `username='validuser'` is true; consequently, the items after the `OR` are not tested. As long as the components after the `OR` generate a syntactically correct SQL expression, the attacker is granted the access of `validuser`.

      Similarly, an attacker could supply the following string for `<PASSWORD>` with an arbitrary username:

      ```
      ' OR '1'='1
      ```

      producing the following query:

      ```
      SELECT * FROM db_user WHERE username='<USERNAME>' AND password='' OR '1'='1'
      ```

      `'1'='1'` always evaluates to true, causing the query to yield every row in the database. In this scenario, the attacker would be authenticated without needing a valid username or password.

      **Noncompliant Code Example**

      This noncompliant code example shows JDBC code to authenticate a user to a system. The password is passed as a `char` array, the database connection is created, and then the passwords are hashed.

      Unfortunately, this code example permits a SQL injection attack by incorporating the unsanitized input argument `username` into the SQL command, allowing an attacker to inject `validuser' OR '1'='1`. The `password` argument cannot be used to attack this program because it is passed to the `hashPassword()` function, which also sanitizes the input.

      ```java
      import java.sql.Connection;
      import java.sql.DriverManager;
      import java.sql.ResultSet;
      import java.sql.SQLException;
      import java.sql.Statement;

      class Login {
        public Connection getConnection() throws SQLException {
          DriverManager.registerDriver(new
                  com.microsoft.sqlserver.jdbc.SQLServerDriver());
          String dbConnection =
            PropertyManager.getProperty("db.connection");
          // Can hold some value like
          // "jdbc:microsoft:sqlserver://<HOST>:1433,<UID>,<PWD>"
          return DriverManager.getConnection(dbConnection);
        }

        String hashPassword(char[] password) {
          // Create hash of password
        }

        public void doPrivilegedAction(String username, char[] password)
                                       throws SQLException {
          Connection connection = getConnection();
          if (connection == null) {
            // Handle error
          }
          try {
            String pwd = hashPassword(password);

            String sqlString = "SELECT * FROM db_user WHERE username = '"
                               + username +
                               "' AND password = '" + pwd + "'";
            Statement stmt = connection.createStatement();
            ResultSet rs = stmt.executeQuery(sqlString);

            if (!rs.next()) {
              throw new SecurityException(
                "User name or password incorrect"
              );
            }

            // Authenticated; proceed
          } finally {
            try {
              connection.close();
            } catch (SQLException x) {
              // Forward to handler
            }
          }
        }
      }
      ```

      **Noncompliant Code Example (`PreparedStatement`)**

      The JDBC library provides an API for building SQL commands that sanitize untrusted data. The `java.sql.PreparedStatement` class properly escapes input strings, preventing SQL injection when used correctly. This code example modifies the `doPrivilegedAction()` method to use a `PreparedStatement` instead of `java.sql.Statement`. However, the prepared statement still permits a SQL injection attack by incorporating the unsanitized input argument `username` into the prepared statement.

      ```java
      import java.sql.Connection;
      import java.sql.DriverManager;
      import java.sql.ResultSet;
      import java.sql.SQLException;
      import java.sql.Statement;

      class Login {
        public Connection getConnection() throws SQLException {
          DriverManager.registerDriver(new
                  com.microsoft.sqlserver.jdbc.SQLServerDriver());
          String dbConnection =
            PropertyManager.getProperty("db.connection");
          // Can hold some value like
          // "jdbc:microsoft:sqlserver://<HOST>:1433,<UID>,<PWD>"
          return DriverManager.getConnection(dbConnection);
        }

        String hashPassword(char[] password) {
          // Create hash of password
        }

        public void doPrivilegedAction(
          String username, char[] password
        ) throws SQLException {
          Connection connection = getConnection();
          if (connection == null) {
            // Handle error
          }
          try {
            String pwd = hashPassword(password);
            String sqlString = "select * from db_user where username=" +
              username + " and password =" + pwd;
            PreparedStatement stmt = connection.prepareStatement(sqlString);

            ResultSet rs = stmt.executeQuery();
            if (!rs.next()) {
              throw new SecurityException("User name or password incorrect");
            }

            // Authenticated; proceed
          } finally {
            try {
              connection.close();
            } catch (SQLException x) {
              // Forward to handler
            }
          }
        }
      }
      ```
    Advice: "采用`java.sql.PreparedStatement`来执行参数化查询，正确的使用该类可以避免含有注入代码的SQL语句提交执行。  \n**规范的代码样例1**：  \n```java\npublic void doPrivilegedAction(String username, char[] password) throws SQLException {\n    Connection connection = getConnection();\n    if (connection == null) {\n        // Handle error\n    }\n    try {\n        String pwd = hashPassword(password);\n\n        // Validate username length\n        if (username.length() > 8) {\n            // Handle error\n        }\n\n        String sqlString = \"select * from db_user where username=? and password=?\";\n        PreparedStatement stmt = connection.prepareStatement(sqlString);\n        stmt.setString(1, username);\n        stmt.setString(2, pwd);\n        ResultSet rs = stmt.executeQuery();\n        if (!rs.next()) {\n            throw new SecurityException(\"User name or password incorrect\");\n        }\n\n        // Authenticated; proceed\n    } finally {\n        try {\n            connection.close();\n        } catch (SQLException x) {\n            // Forward to handler\n        }\n    }\n}\n```  \n代码使用参数化查询来防止SQL注入，通过使用`prepareStatement`类的`set*()`方法，可以进行强类型检查。这样可以减少SQL注入漏洞，因为程序会正确的转义双引号内的输入数据。需要注意的是，那些将数据插入数据库的查询也必须使用`prepareStatement`。"
    Advice_En: |-
      **Compliant Solution (`PreparedStatement`)**

      This compliant solution uses a parametric query with a `?` character as a placeholder for the argument. This code also validates the length of the `username` argument, preventing an attacker from submitting an arbitrarily long user name.

      ```java
      public void doPrivilegedAction(
        String username, char[] password
      ) throws SQLException {
        Connection connection = getConnection();
        if (connection == null) {
          // Handle error
        }
        try {
          String pwd = hashPassword(password);

          // Validate username length
          if (username.length() > 8) {
            // Handle error
          }

          String sqlString =
            "select * from db_user where username=? and password=?";
          PreparedStatement stmt = connection.prepareStatement(sqlString);
          stmt.setString(1, username);
          stmt.setString(2, pwd);
          ResultSet rs = stmt.executeQuery();
          if (!rs.next()) {
            throw new SecurityException("User name or password incorrect");
          }

          // Authenticated; proceed
        } finally {
          try {
            connection.close();
          } catch (SQLException x) {
            // Forward to handler
          }
        }
      }
      ```

      Use the `set*()` methods of the `PreparedStatement` class to enforce strong type checking. This technique mitigates the SQL injection vulnerability because the input is properly escaped by automatic entrapment within double quotes. Note that prepared statements must be used even with queries that insert data into the database.
