        value: 污点规范
      - type: SubClassChin
        value: Rule 06. 方法 (MET)
      - type: DetailClassChin
        value: MET02-J：不要使用弃用的或过时的类和方法
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 06. Methods (MET)
      - type: DetailClassChin
        value: MET02-J:Do not use deprecated or obsolete classes or methods
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: |-
      切勿在新代码中使用已弃用的字段、方法或类。 Java 提供了一个`@deprecated`注释来指示特定字段、方法和类的弃用。例如，`java.util.Date` 的许多方法，例如` Date.getYear()`，已被明确弃用。 THI05-J.不要使用 Thread.stop() 终止线程描述了使用已弃用的 Thread.stop() 方法可能导致的问题。

      Java SE 文档为每个语言版本提供了已弃用的 API 列表：

      * Java SE 6
      * Java SE 7
      * Java SE 8

      程序员应该使用特定于他们正在使用的语言版本的已弃用函数列表，尽管如果有合适的替代方案可用，也可以避免使用在更高版本中已弃用的 API。
      不应使用过时的字段、方法和类。 Java 缺少任何表明过时的注释；然而，有几个类和方法被记录为过时的。例如，`java.util.Dictionary `类被标记为过时；新代码应使用` java.util.Map` 代替 [API 2014]。
    Description_En: |-
      Never use deprecated fields, methods, or classes in new code. Java provides an `@deprecated` annotation to indicate the deprecation of specific fields, methods, and classes. For example, many methods of `java.util.Date`, such as `Date.getYear()`, have been explicitly deprecated. THI05-J. Do not use Thread.stop() to terminate threads describes issues that can result from using the deprecated `Thread.stop()` method.

      The Java SE documentation provides a list of deprecated APIs for each version of the language:

      * Java SE 6
      * Java SE 7
      * Java SE 8

      Programmers should use the list of deprecated functions specific to the language version they are using, although it may also be possible to avoid the use of APIs that are deprecated in later versions as well if suitable alternatives are available.

      Obsolete fields, methods, and classes should not be used. Java lacks any annotation that indicates obsolescence; nevertheless, several classes and methods are documented as obsolete. For instance, the `java.util.Dictionary<K,V>` class is marked as obsolete; new code should use `java.util.Map<K,V>` instead [API 2014].
    Advice: |-
      以下是部分不推荐使用的类（方法）及推荐使用的替代类（方法）：

      |Class or Method|Replacement|
      |:-----:|:-----:|
      |java.lang.Character.isJavaLetter()|java.lang.Character.isJavaIdentifierStart()|
      |java.lang.Character.isJava Letter Or Digit()|java.lang.Character.isJavaIdentifierPart()|
      |java.lang.Character.isSpace()|java.lang.Character.isWhitespace()|
      |java.lang.Class.newInstance()|java.lang.reflect.Constructor.newInstance()|
      |java.util.Date|java.util.Calendar|
      |java.util.Dictionary|java.util.Map<K,V>|
      |java.util.Properties.save()|java.util.Properties.store()|
      |java.lang.Thread.run()|java.lang.Thread.start()|
      |java.lang.Thread.stop()|java.lang.Thread.interrupt()|
      |java.lang.ThreadGroup|java.util.concurrent.Executor|
    Advice_En: |-
      **Obsolete Methods and Classes**

      The methods and classes listed in the following table must not be used:

      | Class or Method | Replacement | Rule |
      | - | - | - |
      | `java.lang.Character.isJavaLetter()` | `java.lang.Character.isJavaIdentifierStart()` |  |
      | `java.lang.Character.isJavaLetterOrDigit()` | `java.lang.Character.isJavaIdentifierPart()` |  |
      | `java.lang.Character.isSpace()` | `java.lang.Character.isWhitespace()` |  |
      | `java.lang.Class.newInstance()` | `java.lang.reflect.Constructor.newInstance()` | ERR06-J. Do not throw undeclared checked exceptions |
      | `java.util.Date` (many methods) | `java.util.Calendar` |  |
      | `java.util.Dictionary` | `java.util.Map` |  |
      | `java.util.Properties.save()` | `java.util.Properties.store()` |  |
      | `java.lang.Thread.run()` | `java.lang.Thread.start()` | THI00-J. Do not invoke Thread.run() |
      | `java.lang.Thread.stop()` | `java.lang.Thread.interrupt()` | THI05-J. Do not use Thread.stop() to terminate threads |
      | `java.lang.ThreadGroup` (many methods) | `java.util.concurrent.Executor` | THI01-J. Do not invoke ThreadGroup methods |
      | java.util.Date | java.time (since Java 8) |  |

      The Java Virtual Machine Profiler Interface (JVMPI) and JVM Debug Interface (JVMDI) are also deprecated and have been replaced by the JVM Tool Interface (JVMTI) (see ENV05-J. Do not deploy an application that can be remotely monitored for more information).
    References:
      Reference:
      - type: CWE
        value: 477:Use of Obsolete Functions
      - type: ISO/IEC TR 24772
        value: 2013:Programming Language Vulnerabilities Dead and Deactivated Code [XYQ]
