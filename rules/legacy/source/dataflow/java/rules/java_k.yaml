  - id: '02000010141004'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 09. 锁 (LCK)
      - type: DetailClassChin
        value: LCK04-J：即使集合是可访问的，也不要基于集合视图使用同步
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 09. Locking (LCK)
      - type: DetailClassChin
        value: LCK04-J:Do not synchronize on a collection view if the backing collection is accessible
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "`java.util.Collections`的接口文档中提到了在对集合视图进行迭代时，如果没有对可访问的集合对象进行同步会产生以下后果：  \n当对任何一个集合视图进行迭代的时候，认为用户手动对返回的map进行同步时必要的。  \n任何一个使用集合视图而不是后台集合做为锁对象的类，会面临两种不同的锁策略。当多个线程可以后台访问集合时，基于集合视图实现锁的类违反了线程安全的属性，同时也是不安全的。因此，当程序需要迭代集合视图并访问后台集合时，程序应该基于后台集合进行同步。  \n**不规范的代码样例1**：  \n```java\nprivate final Map<Integer, String> mapView =\n    Collections.synchronizedMap(new HashMap<Integer, String>());\nprivate final Set<Integer> setView = mapView.keySet();\n\npublic Map<Integer, String> getMap() {\n  return mapView;\n}\n\npublic void doSomething() {\n  synchronized (setView) {  // Incorrectly synchronizes on setView\n    for (Integer k : setView) {\n      // ...\n    }\n  }\n}\n```\n代码创建了一个HashMap对象和两个视图对象：一个空的HashMap同步视图，这个空的HashMap视图被`mapView`数据成员封装；另一个是被`setView`数据成员封装的`mapView`的索引视图。这个HashMap对象是不可访问的，但`mapView`可以通过公有的`getMap()`方法访问。因为同步的语句使用了`setView`的内在锁而不是mapView的，另一个线程可以修改这个同步的map且使k迭代器失效。"
    Description_En: |-
      The Java Tutorials, Wrapper Implementations [Java Tutorials], warns about the consequences of failing to synchronize on an accessible collection object when iterating over its view:

      > It is imperative that the user manually synchronize on the returned `Map` when iterating over any of its `Collection` views rather than synchronizing on the `Collection` view itself.

      Disregarding this advice may result in nondeterministic behavior.

      Any class that uses a collection view rather than the backing collection as the lock object may end up with two distinct locking strategies. When the backing collection is accessible to multiple threads, the class that locked on the collection view has violated the thread-safety properties and is unsafe. Consequently, programs that both require synchronization while iterating over collection views and have accessible backing collections must synchronize on the backing collection; synchronization on the view is a violation of this rule.

      **Noncompliant Code Example (Collection View)**
      This noncompliant code example creates a `HashMap` object and two view objects: a synchronized view of an empty `HashMap` encapsulated by the `mapView` field and a set view of the map's keys encapsulated by the `setView` field. This example synchronizes on `setView` [Java Tutorials].

      ```java
      private final Map<Integer, String> mapView =
          Collections.synchronizedMap(new HashMap<Integer, String>());
      private final Set<Integer> setView = mapView.keySet();

      public Map<Integer, String> getMap() {
        return mapView;
      }

      public void doSomething() {
        synchronized (setView) {  // Incorrectly synchronizes on setView
          for (Integer k : setView) {
            // ...
          }
        }
      }
      ```
    Advice: "**规范的代码样例1**：  \n```java\nprivate final Map<Integer, String> mapView =\n    Collections.synchronizedMap(new HashMap<Integer, String>());\nprivate final Set<Integer> setView = mapView.keySet();\n\npublic Map<Integer, String> getMap() {\n  return mapView;\n}\n\npublic void doSomething() {\n  synchronized (mapView) {  // Synchronize on map, rather than set\n    for (Integer k : setView) {\n      // ...\n    }\n  }\n}\n```\n\n这个代码基于mapView字段实现了同步，在map的底层结构中，它在迭代过程中是不能改变的。"
    Advice_En: |-
      **Compliant Solution (Collection Lock Object)**

      This compliant solution synchronizes on the `mapView` field rather than on the `setView` field:

      ```java
      private final Map<Integer, String> mapView =
          Collections.synchronizedMap(new HashMap<Integer, String>());
      private final Set<Integer> setView = mapView.keySet();

      public Map<Integer, String> getMap() {
        return mapView;
      }

      public void doSomething() {
        synchronized (mapView) {  // Synchronize on map, rather than set
          for (Integer k : setView) {
            // ...
          }
        }
      }
      ```

      This code is compliant because the map's underlying structure cannot be changed during the iteration.
