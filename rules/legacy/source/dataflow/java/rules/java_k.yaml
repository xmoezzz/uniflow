      - type: DetailClassChin
        value: JNI00-J：为本地代码定义包装器
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 17. Java Native Interface (JNI)
      - type: DetailClassChin
        value: JNI00-J:Define wrappers around native methods
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "本地方法是用Java定义的，用C和C++等语言编写[JNI 2006]。增加的可扩展性是以灵活性和可移植性为代价的，因为代码不再符合Java所强制执行的政策。本地方法被用于执行特定平台的操作、与遗留库代码的对接，以及提高程序性能[Bloch 2008]。\n定义一个封装方法有助于安装适当的安全管理器检查，验证传递给本地代码的参数，验证返回值，防御性地复制易变的输入，以及清理不受信任的数据。因此，每个本地方法都必须是私有的，并且只能由包装方法调用。\n**不规范的代码样例1**：  \n```java\npublic final class NativeMethod {\n\n    // Public native method\n    public native void nativeOperation(byte[] data, int offset, int len);\n\n    // Wrapper method that lacks security checks and input validation\n    public void doOperation(byte[] data, int offset, int len) {\n        nativeOperation(data, offset, len);\n    }\n\n    static {\n        // Load native library in static initializer of class\n        System.loadLibrary(\"NativeMethodLib\");\n    }\n}\n```  \n这个例子包括`doOperation()`包装器方法,该调用`nativeOperation()`本地方法但未能提供输入验证或安全检查。"
    Description_En: |-
      Native methods are defined in Java and written in languages such as C and C++ [JNI 2006]. The added extensibility comes at the cost of flexibility and portability because the code no longer conforms to the policies enforced by Java. Native methods have been used for performing platform-specific operations, interfacing with legacy library code, and improving program performance [Bloch 2008].

      Defining a wrapper method facilitates installing appropriate security manager checks, validating arguments passed to native code, validating return values, defensively copying mutable inputs, and sanitizing untrusted data. Consequently, every native method must be private and must be invoked only by a wrapper method.

      **Noncompliant Code Example**

      In this noncompliant code example, the `nativeOperation()` method is both native and public; consequently, untrusted callers may invoke it. Native method invocations bypass security manager checks.

      This example includes the `doOperation()` wrapper method, which invokes the `nativeOperation()` native method but fails to provide input validation or security checks.

      ```java
      public final class NativeMethod {

        // Public native method
        public native void nativeOperation(byte[] data, int offset, int len);

        // Wrapper method that lacks security checks and input validation
        public void doOperation(byte[] data, int offset, int len) {
          nativeOperation(data, offset, len);
        }

        static {
          // Load native library in static initializer of class
          System.loadLibrary("NativeMethodLib");
        }
      }
      ```
    Advice: "**规范的代码样例1**：  \n```java\npublic final class NativeMethodWrapper {\n\n    // Private native method\n    private native void nativeOperation(byte[] data, int offset, int len);\n\n    // Wrapper method performs SecurityManager and input validation checks\n    public void doOperation(byte[] data, int offset, int len) {\n        // Permission needed to invoke native method\n        securityManagerCheck();\n\n        if (data == null) {\n            throw new NullPointerException();\n        }\n\n        // Copy mutable input\n        data = data.clone();\n\n        // Validate input\n        if ((offset < 0) || (len < 0) || (offset > (data.length - len))) {\n            throw new IllegalArgumentException();\n        }\n\n        nativeOperation(data, offset, len);\n    }\n\n    static {\n        // Load native library in static initializer of class\n        System.loadLibrary(\"NativeMethodLib\");\n    }\n}\n```\n这个合规的解决方案声明了本地方法私有。`doOperation()`包装器方法检查权限,创建了一个可变数组副本,并检查参数的范围。  \n  \n**例外**：JN100-J-EX0:不需要安全管理器检查、验证参数或返回值或可变输入的(例如：标准C函数int rand(void))本地方法不需要被包装。"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution declares the native method private. The `doOperation()` wrapper method checks permissions, creates a defensive copy of the mutable input array `data`, and checks the ranges of the arguments. The `nativeOperation()` method is consequently called with secure inputs. Note that the validation checks must produce outputs that conform to the input requirements of the native methods.

      ```java
      public final class NativeMethodWrapper {

        // Private native method
        private native void nativeOperation(byte[] data, int offset, int len);

        // Wrapper method performs SecurityManager and input validation checks
        public void doOperation(byte[] data, int offset, int len) {
          // Permission needed to invoke native method
          securityManagerCheck();

          if (data == null) {
            throw new NullPointerException();
          }

          // Copy mutable input
          data = data.clone();

          // Validate input
          if ((offset < 0) || (len < 0) || (offset > (data.length - len))) {
            throw new IllegalArgumentException();
          }

          nativeOperation(data, offset, len);
        }

        static {
          // Load native library in static initializer of class
          System.loadLibrary("NativeMethodLib");
        }
      }
      ```

      **Exceptions**

      JN100-J-EX0: Native methods that do not require security manager checks, validation of arguments or return values, or defensive copying of mutable inputs (for example, the standard C function `int rand(void)`) do not need to be wrapped.
