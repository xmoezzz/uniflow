  - id: '02000010141811'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 49. 其他 (MSC)
      - type: DetailClassChin
        value: MSC11-J：不要在servlet中泄露会话信息
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 49. Miscellaneous (MSC)
      - type: DetailClassChin
        value: MSC11-J:Do not let session information leak within a servlet
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "Java servlet提供了一个用于存储会话相关数据的HttpSession类，这些数据被编码在每个web请求中。这个类的使用可以防止跨会话信息泄漏和数据竞争。  \n**不规范的代码样例1**：  \n```java\npublic class SampleServlet extends HttpServlet {\n\n    private String lastAddr = \"nobody@nowhere.com\";\n\n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        response.setContentType(\"text/html\");\n        PrintWriter out = response.getWriter();\n        out.println(\"<html>\");\n\n        String emailAddr = request.getParameter(\"emailAddr\");\n\n        if (emailAddr != null) {\n            out.println(\"Email Address:\");\n            out.println(sanitize(emailAddr));\n            out.println(\"<br>Previous Address:\");\n            out.println(sanitize(lastAddr));\n        }\n        ;\n\n        out.println(\"<p>\");\n        out.print(\"<form action=\\\"\");\n        out.print(\"SampleServlet\\\" \");\n        out.println(\"method=POST>\");\n        out.println(\"Parameter:\");\n        out.println(\"<input type=text size=20 name=emailAddr>\");\n        out.println(\"<br>\");\n        out.println(\"<input type=submit>\");\n        out.println(\"</form>\");\n\n        lastAddr = emailAddr;\n    }\n\n    public void doPost(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        doGet(request, response);\n    }\n\n    // Filter the specified message string for characters\n    // that are sensitive in HTML.\n    public static String sanitize(String message) {\n        // ...\n    }\n}\n```\n这个不合规范的代码示例创建了一个servlet，它会提示用户输入一个电子邮件地址，然后将地址返回给用户。地址存储在lastAddr变量,这是一个实例字段。  \n因为HttpServlet类是单例的：每一个客户访问servlet共享一个`lastAddr`字段。因此,`lastAddr`字段的内容可以是一个不同的客户端先前设置的字段。另外，由于这个代码示例缺少线程安全性，因此，`lastAddr`字段可以在两个客户端同时请求该参数时使用一个陈旧的值，这违反了VNA01-J.保证对一个不可变对象的共享引用的可见性。  \n**不规范的代码样例2**：  \n```java\npublic class SampleServlet extends HttpServlet {  \n   \n  private static String lastAddr = \"nobody@nowhere.com\";  \n   \n  // ... Other methods unchanged  \n}\n```  \n这个不合规范的代码示例，`lastAddr`字段是静态的。每一个客户端访问servlet共享一个`lastAddr`字段。违反了VNA01-J。确保对不可变对象的共享引用的可见性。  \n**不规范的代码样例3**：  \n```java\npublic class SampleServlet extends HttpServlet {\n\n    private static String lastAddr = \"nobody@nowhere.com\";\n    private static final Object lastAddrLock = new Object();\n\n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        response.setContentType(\"text/html\");\n        PrintWriter out = response.getWriter();\n        out.println(\"<html>\");\n\n        String emailAddr = request.getParameter(\"emailAddr\");\n\n        if (emailAddr != null) {\n            out.println(\"Email Address::\");\n            out.println(sanitize(emailAddr));\n            synchronized (lock) {\n                out.println(\"<br>Previous Email Address::\");\n                out.println(sanitize(lastAddr));\n            }\n        }\n        ;\n\n        out.println(\"<p>\");\n        out.print(\"<form action=\\\"\");\n        out.print(\"SampleServlet\\\" \");\n        out.println(\"method=POST>\");\n        out.println(\"Parameter:\");\n        out.println(\"<input type=text size=20 name=emailAddr>\");\n        out.println(\"<br>\");\n        out.println(\"<input type=submit>\");\n        out.println(\"</form>\");\n\n        synchronized (lock) {\n            lastAddr = emailAddr;\n        }\n    }\n\n    public void doPost(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        doGet(request, response);\n    }\n\n    // Filter the specified message string for characters\n    // that are sensitive in HTML.\n    public static String sanitize(String message) {\n        // ...\n    }\n}\n```\n这个不合规范的代码示例，该`lastAddr`字段是静态的，是由一个单独的锁定对象防止并发访问，该加锁方案由LCK00-J. 通过私有final锁对象来同步那些与非受信代码交互的类。这种方法保证了servlet中的线程安全性。但是，servlet仍然可以返回由不同会话提供的电子邮件地址。"
    Description_En: |-
      Java servlets often must store information associated with each client that connects to them. Using member fields in the `javax.servlet.http.HttpServlet` to store information specific to individual clients is a common, simple practice. However, doing so is a mistake for the following reasons:

      * In any Java servlet container, such as Apache Tomcat, `HttpServlet` is a singleton class (see MSC07-J. Prevent multiple instantiations of singleton objects for information related to singleton classes). Therefore, there can be only one instance of member variables, even if they are not declared static.
      * A servlet container is permitted to invoke the servlet from multiple threads. Consequently, accessing fields in the servlet can lead to data races.
      * If two clients initiate sessions with the servlet, the servlet can leak information from one client to the other client.

      Java servlets provide an `HttpSession` class for storing session-specific data, which is encoded in each web request. Use of this class prevents both cross-session information leakage and data races.

      **Noncompliant Code Example**

      This noncompliant code example creates a servlet that prompts the user for an email address, then repeats the address back to the user. The previous address is stored in the `lastAddr` variable, which is an instance field.

      ```java
      public class SampleServlet extends HttpServlet {

        private String lastAddr = "nobody@nowhere.com";

        public void doGet(HttpServletRequest request, HttpServletResponse response)
          throws IOException, ServletException {
          response.setContentType("text/html");
          PrintWriter out = response.getWriter();
          out.println("<html>");

          String emailAddr = request.getParameter("emailAddr");

          if (emailAddr != null) {
            out.println("Email Address:");
            out.println(sanitize(emailAddr));
            out.println("<br>Previous Address:");
            out.println(sanitize(lastAddr));
          };

          out.println("<p>");
          out.print("<form action=\"");
          out.print("SampleServlet\" ");
          out.println("method=POST>");
          out.println("Parameter:");
          out.println("<input type=text size=20 name=emailAddr>");
          out.println("<br>");
          out.println("<input type=submit>");
          out.println("</form>");

          lastAddr = emailAddr;
        }

        public void doPost(HttpServletRequest request, HttpServletResponse response)
          throws IOException, ServletException {
          doGet(request, response);
        }

        // Filter the specified message string for characters
        // that are sensitive in HTML.
        public static String sanitize(String message) {
          // ...
        }
      }
      ```

      Because the `HttpServlet` class is a singleton, there is only one `lastAddr` field shared by every client who accesses the servlet. Consequently, the contents of the `lastAddr` field can be the previous setting of the field by a different client. Also, because this code example lacks thread-safety, it is possible for the `lastAddr` field to take on a stale value should two clients request the parameter simultaneously, which violates VNA01-J. Ensure visibility of shared references to immutable objects.

      **Noncompliant Code Example**

      In this noncompliant code example, the `lastAddr` field is static. It more accurately reflects the fact that there is never more than a single instance of the field. However, this code has the same behavior as the previous noncompliant code example and also violates VNA01-J. Ensure visibility of shared references to immutable objects.

      ```java
      public class SampleServlet extends HttpServlet {

        private static String lastAddr = "nobody@nowhere.com";

        // ... Other methods unchanged
      }
      ```

      **Noncompliant Code Example**

      In this noncompliant code example, the `lastAddr` field is static and is protected from concurrent access by a separate lock object, as is recommended by LCK00-J. Use private final lock objects to synchronize classes that may interact with untrusted code. This approach guarantees thread-safety in the servlet. However, the servlet can still return the email address provided by a different session.

      ```java
      public class SampleServlet extends HttpServlet {

        private static String lastAddr = "nobody@nowhere.com";
        private static final Object lastAddrLock = new Object();

        public void doGet(HttpServletRequest request, HttpServletResponse response)
          throws IOException, ServletException {
          response.setContentType("text/html");
          PrintWriter out = response.getWriter();
          out.println("<html>");

          String emailAddr = request.getParameter("emailAddr");

          if (emailAddr != null) {
            out.println("Email Address::");
            out.println(sanitize(emailAddr));
            synchronized (lock) {
              out.println("<br>Previous Email Address::");
              out.println(sanitize(lastAddr));
            }
          };

          out.println("<p>");
          out.print("<form action=\"");
          out.print("SampleServlet\" ");
          out.println("method=POST>");
          out.println("Parameter:");
          out.println("<input type=text size=20 name=emailAddr>");
          out.println("<br>");
          out.println("<input type=submit>");
          out.println("</form>");

          synchronized (lock) {
            lastAddr = emailAddr;
          }
        }

        public void doPost(HttpServletRequest request, HttpServletResponse response)
          throws IOException, ServletException {
          doGet(request, response);
        }

        // Filter the specified message string for characters
        // that are sensitive in HTML.
        public static String sanitize(String message) {
          // ...
        }
      }
      ```
    Advice: "**规范的代码样例1**：  \n```java\npublic class SampleServlet extends HttpServlet {\n\n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        response.setContentType(\"text/html\");\n        PrintWriter out = response.getWriter();\n        out.println(\"<html>\");\n\n        String emailAddr = request.getParameter(\"emailAddr\");\n        HttpSession session = request.getSession();\n        Object attr = session.getAttribute(\"lastAddr\");\n        String lastAddr = (attr == null) ? \"null\" : attr.toString();\n\n        if (emailAddr != null) {\n            out.println(\"Email Address::\");\n            out.println(sanitize(emailAddr));\n            out.println(\"<br>Previous Email Address::\");\n            out.println(sanitize(lastAddr));\n        }\n        ;\n\n        out.println(\"<p>\");\n        out.print(\"<form action=\\\"\");\n        out.print(\"SampleServlet\\\" \");\n        out.println(\"method=POST>\");\n        out.println(\"Parameter:\");\n        out.println(\"<input type=text size=20 name=emailAddr>\");\n        out.println(\"<br>\");\n        out.println(\"<input type=submit>\");\n        out.println(\"</form>\");\n\n        session.setAttribute(\"lastAddr\", emailAddr);\n    }\n\n    public void doPost(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        doGet(request, response);\n    }\n\n    // Filter the specified message string for characters\n    // that are sensitive in HTML.\n    public static String sanitize(String message) {\n        // ...\n    }\n}\n```\n上面符合规范的代码中，在HttpSession对象中存储的`lastAddr`参数。servlet机制跟踪会话，为客户机提供会话ID，它由客户端浏览器作为cookie存储。会话中的其它信息，包括lastAddr属性，由服务器存储。因此，servlet提供了在同一会话中向servlet提交的最后一个电子邮件地址（避免了其他会话请求的竞争条件）。在这个例子中保存数据的临时变量，不会受到竞争条件的危害。"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution stores the `lastAddr` parameter in the `HttpSession` object, which is provided as part of the `HttpServletRequest`. The servlet mechanism keeps track of the session, providing the client with the session's ID, which is stored as a cookie by the client's browser. The other information in the session, including the `lastAddr` attribute, is stored by the server. Consequently, the servlet provides the last email address that was presented to the servlet in the same session (avoiding race conditions with requests from other sessions). The local variables, which temporarily hold data in this example, are not vulnerable to race conditions.

      ```java
      public class SampleServlet extends HttpServlet {

        public void doGet(HttpServletRequest request, HttpServletResponse response)
          throws IOException, ServletException {
          response.setContentType("text/html");
          PrintWriter out = response.getWriter();
          out.println("<html>");

          String emailAddr = request.getParameter("emailAddr");
          HttpSession session = request.getSession();
          Object attr = session.getAttribute("lastAddr");
          String lastAddr = (attr == null) ? "null" : attr.toString();

          if (emailAddr != null) {
            out.println("Email Address::");
            out.println(sanitize(emailAddr));
            out.println("<br>Previous Email Address::");
            out.println(sanitize(lastAddr));
          };

          out.println("<p>");
          out.print("<form action=\"");
          out.print("SampleServlet\" ");
          out.println("method=POST>");
          out.println("Parameter:");
          out.println("<input type=text size=20 name=emailAddr>");
          out.println("<br>");
          out.println("<input type=submit>");
          out.println("</form>");

          session.setAttribute("lastAddr", emailAddr);
        }

        public void doPost(HttpServletRequest request, HttpServletResponse response)
          throws IOException, ServletException {
          doGet(request, response);
        }

        // Filter the specified message string for characters
        // that are sensitive in HTML.
        public static String sanitize(String message) {
          // ...
        }
      }
      ```
