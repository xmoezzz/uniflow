  - id: '02000010140513'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 03. 数据类型与运算 (NUM)
      - type: DetailClassChin
        value: NUM13-J：转换基本整数类型至浮点数类型时应避免精度损失
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 03. Numeric Types and Operations (NUM)
      - type: DetailClassChin
        value: NUM13-J:Avoid loss of precision when converting primitive integers to floating-point
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: |-
      以下 19 种基本类型的特定转换称为*扩展基本类型转换*：

      * `byte` 到 `short`, `int`, `long`, `float`, 或`double`
      * `short` 到`int`, `long`, `float`, 或`double`
      * `char` to `int`, `long`, `float`, 或`double`
      * `int` 到`long`, `float`, 或`double`
      * `long` 到`float` 或r `double`
      * `float` 到`double`

      从 int 或 long 到 float 或从 long 到 double 的转换会导致精度损失（丢失最低有效位）。在这些情况下，生成的浮点值是整数值的舍入版本，使用 IEEE 754 舍入到最近模式。尽管有这种精度损失，Java 语言规范 (JLS) 要求转换和舍入默认发生，也就是说，没有任何运行时异常（参见 JLS，§5.1.2，“Widening Primitive Conversion”[JLS 2015]）。从小于 int 的整数类型到浮点类型的转换以及从 int 到 double 的转换永远不会导致精度损失。因此，程序必须确保从 int 或 long 到浮点类型或从 long 到 double 的转换不会导致所需精度的损失。
      请注意，从 float 到 double 的转换也可能会丢失有关转换值的整体大小的信息（请参阅 NUM53-J。使用 strictfp 修饰符实现跨平台的浮点计算一致性以获取更多信息）。

      **不规范的代码样例1**
      在这个不规范的代码示例中，两个相同的大整数作为参数传递给 `subFloatFromInt()` 方法。 第二个参数被强制转换为浮点数，再转换回 `int`，并作为减数减去。 结果作为 `int `类型的值返回。

      由于精度损失，这种方法可能会产生意想不到的结果。 在 FP-strict 模式下，`float` 类型的值有 23 个尾数位、一个符号位和一个 8 位指数（请参阅 NUM53-J。使用 strictfp 修饰符实现跨平台的浮点计算一致性以了解有关 FP-strict 的更多信息）。 指数允许浮点类型表示比 int 类型更大的范围。 但是，23 位尾数意味着 `float `仅支持表示适合 23 位的整数的精确表示； `float `仅支持该范围之外的整数的近似表示。

      ```java
      strictfp class WideSample {
        public static int subFloatFromInt(int op1, float op2) {
          return op1 - (int)op2;
        }

        public static void main(String[] args) {
          int result = subFloatFromInt(1234567890, 1234567890);
          // This prints -46, not 0, as may be expected
          System.out.println(result);
        }
      }
      ```

      请注意，从 `long` 到 `float` 或 `double` 的转换可能会导致类似的精度损失。
    Description_En: |-
      The following 19 specific conversions on primitive types are called the *widening primitive conversions*:

      * `byte` to `short`, `int`, `long`, `float`, or `double`
      * `short` to `int`, `long`, `float`, or `double`
      * `char` to `int`, `long`, `float`, or `double`
      * `int` to `long`, `float`, or `double`
      * `long` to `float` or `double`
      * `float` to `double`

      Conversion from `int` or `long` to `float` or from `long` to `double` can lead to loss of precision (loss of least significant bits). In these cases, the resulting floating-point value is a rounded version of the integer value, using IEEE 754 round-to-nearest mode. Despite this loss of precision, *The Java Language Specification* (JLS) requires that the conversion and rounding occur silently, that is, without any runtime exception (see the JLS, §5.1.2, &#34;Widening Primitive Conversion&#34;) [JLS 2015], for more information). Conversions from integral types smaller than `int` to a floating-point type and conversions from `int` to `double` can never result in a loss of precision. Consequently, programs must ensure that conversions from an `int` or `long` to a floating-point type or from `long` to `double` do not result in a loss of required precision.

      Note that conversions from `float` to `double` can also lose information about the overall magnitude of the converted value (see NUM53-J. Use the strictfp modifier for floating-point calculation consistency across platforms for additional information).

      **Noncompliant Code Example**

      In this noncompliant code example, two identical large integer literals are passed as arguments to the `subFloatFromInt()` method. The second argument is coerced to `float`, cast back to `int`, and subtracted from a value of type `int`. The result is returned as a value of type `int`.

      This method could have unexpected results because of the loss of precision. In FP-strict mode, values of type float have 23 mantissa bits, a sign bit, and an 8-bit exponent (see NUM53-J. Use the strictfp modifier for floating-point calculation consistency across platforms for more information about FP-strict mode). The exponent allows type float to represent a larger range than that of type int. However, the 23-bit mantissa means that float supports exact representation only of integers whose representation fits within 23 bits; float supports only approximate representation of integers outside that range.

      ```java
      strictfp class WideSample {
        public static int subFloatFromInt(int op1, float op2) {
          return op1 - (int)op2;
        }

        public static void main(String[] args) {
          int result = subFloatFromInt(1234567890, 1234567890);
          // This prints -46, not 0, as may be expected
          System.out.println(result);
        }
      }
      ```

      Note that conversions from `long` to either `float` or `double` can lead to similar loss of precision.
    Advice: "程序必须确保从int、long类型转换为float类型，从long类型转换为double类型，不会造成丢失所需精度。\n**规范的代码样例1**：  \n方法`subFloatFromInt()`对传入的参数进行范围检查。  \n```java\nstrictfp class WideSample {\n    public static int subFloatFromInt(int op1, float op2) throws ArithmeticException {\n        // The significand can store at most 23 bits\n        if ((op1 > 0x007FFFFF) || (op1 < -0x800000)) {\n            throw new ArithmeticException(\"Insufficient precision\");\n        }\n        return op1 - (int) op2;\n    }\n\n    public static void main(String[] args) {\n        int result = subFloatFromInt(1234567890, 1234567890);\n        System.out.println(result);\n    }\n}\n```\n**特例**\nNUM13-J-EX0：当合适的数值分析表明损失最小有效位的精度是可以接受的，允许从积分类型转换到浮点类型而不进行范围检查。"
    Advice_En: |-
      **Compliant Solution (`ArithmeticException`)**

      This compliant solution range checks the argument of the integer argument (`op1`) to ensure it can be represented as a value of type `float` without a loss of precision:

      ```java
      strictfp class WideSample {
        public static int subFloatFromInt(int op1, float op2)
                          throws ArithmeticException {

          // The significand can store at most 23 bits
          if ((op2 > 0x007fffff) || (op2 < -0x800000)) {
            throw new ArithmeticException("Insufficient precision");
          }

          return op1 - (int)op2;
        }

        public static void main(String[] args) {
          int result = subFloatFromInt(1234567890, 1234567890);
          System.out.println(result);
        }
      }
      ```

      In this example, the `subFloatFromInt()` method throws `ArithmeticException`. This general approach, with appropriate range checks, can be used for conversions from `long` to either `float` or `double`.
      **Exceptions**
      NUM13-J-EX0: Conversion from integral types to floating-point types without a range check is permitted when suitable numerical analysis demonstrates that the loss of the least significant bits of precision is acceptable.
