  - id: '02000010141408'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 13. 输入输出 (FIO)
      - type: DetailClassChin
        value: FIO08-J：区分从流中读取的字符（或字节）和-1的不同
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 13. Input Output (FIO)
      - type: DetailClassChin
        value: FIO08-J:Distinguish between characters or bytes read from a stream and -1
    BugServerity: 5
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "抽象方法`InputStream.read()`方法从一个输入源中读取一个简单的字节，返回一个范围在0~255的整数。仅当在读取到输入流末尾的时候，它会返回-1。类似的`Reader.read()`方法读取一个单独的字符，返回范围在0~65535的整数。仅当在读取到输入流的末尾时，它会返回-1。这两个方法都会被子类覆写。  \n通常会用这些方法来从一个流中读取一个字节或者字符。遗憾的是，在检查是否已经达到流末尾之前，许多开发者过早的将返回类型转换为byte或者char类型。  \n风险评估：违反该条准则可能会导致诸多注入攻击：如命令注入。    \n**不规范的代码样例1**：  \n代码将`read()`方法返回的值直接强转为byte类型，并且与-1做比较，通过这种方法来检查是否达到了流的末尾。如果`read()`方法返回的是0xFF的字节值，那么返回的字节值专用来表示以及达到末尾的-1的值是没有差别的，这个字节在与-1进行比较之前会被转换并且使用符号来扩展为一个int类型。  \n```java\nFileInputStream in;\n// initialize stream\nbyte data;\nwhile ((data = (byte) in.read()) != -1) {\n    // ...\n}\n```  \n**不规范的代码样例2**：  \n代码将由`read()`方法返回的类型为int的值直接转换为char类型，它会与-1进行比较，用来检测是否达到了流末尾。它的值最好为0xFFFF而非-1，这个是否达到流末尾的判断永远不会返回true。  \n```java\nFileReader in;\n// initialize stream\nchar c;\nwhile ((c = (char) in.read()) != -1) {\n    // ...\n}\n```"
    Description_En: |-
      The abstract `InputStream.read()` and `Reader.read()` methods are used to read a byte or character, respectively, from a stream. The  `InputStream.read()` method reads a single byte from an input source and returns its value as an `int` in the range 0 to 255 (`0x00`-`0xff`). The `Reader.read()` method reads a single character and returns its value as an `int` in the range 0 to 65,535 (`0x0000`-`0xffff`). Both methods return the 32-bit value `-1` (`0xffffffff`) to indicate that the end of the stream has been reached and no data is available. The larger `int` size is used by both methods to differentiate between the end-of-stream indicator and the maximum byte (`0xff`) or character (`0xffff`) value. The end-of-stream indicator is an example of an in-band error indicator. In-band error indicators are problematic to work with, and the creation of new in-band-error indicators is discouraged.
      Prematurely converting the resulting `int` to a `byte` or `char` before testing for the value −1 makes it impossible to distinguish between characters read and the end of stream indicator. Programs must check for the end of stream before narrowing the return value to a `byte` or `char`.
      This rule applies to any method that returns the value −1 to indicate the end of a stream. It includes any `InputStream` or `Reader` subclass that provides an implementation of the `read()` method. This rule is a specific instance ofNUM12-J. Ensure conversions of numeric types to narrower types do not result in lost or misinterpreted data.
      **Noncompliant Code Example (`byte`)**

      `FileInputStream` is a subclass of `InputStream`. It will return −1 only when the end of the input stream has been reached. This noncompliant code example casts the value returned by the `read()` method directly to a value of type `byte` and then compares this value with −1 in an attempt to detect the end of the stream.

      ```java
      FileInputStream in;
      // Initialize stream
      byte data;
      while ((data = (byte) in.read()) != -1) {
        // ...
      }
      ```

      If the `read()` method encounters a `0xFF` byte in the file, this value becomes indistinguishable from the −1 value used to indicate the end of stream, because the byte value is promoted and sign-extended to an `int` before being compared with −1. Consequently, the loop will halt prematurely if a `0xFF` byte is read.
      **Noncompliant Code Example (`char`)**

      `FileReader` is a subclass of `InputStreamReader`, which is in turn a subclass of`<span> </span>Reader`. It also returns −1 only when the end of the stream is reached. This noncompliant code example casts the value of type `int` returned by the `read()` method directly to a value of type `char`, which is then compared with −1 in an attempt to detect the end of stream. This conversion leaves the value of `data` as `0xFFFF` (e.g., `Character.MAX_VALUE`) instead of −1. Consequently, the test for the end of file never evaluates to true.

      ```java
      FileReader in;
      // Initialize stream
      char data;
      while ((data = (char) in.read()) != -1) {
        // ...
      }
      ```
    Advice: "**规范的代码样例1**：\n代码使用一个类型为int的变量来获取`read()`方法的返回值。当`read()`方法返回值不是-1的时候，它会被安全的转换为byte类型。  \n```java\nFileInputStream in;\n// initialize stream\nint inbuff;\nbyte data;\nwhile ((inbuff = in.read()) != -1) {\n    data = (byte) inbuff;\n    // ...\n}\n```  \n**规范的代码样例2**：  \n代码使用一个类型为int的变量来获取`read()`方法的返回值。当`read()`方法返回值不是-1的时候，它会被安全的转换为char类型。  \n```java\nFileReader in;\n// initialize stream\nint inbuff;\nchar data;\nwhile ((inbuff = in.read()) != -1) {\n    data = (char) inbuff;\n    // ...\n}\n```"
    Advice_En: |-
      **Compliant Solution (`byte`)**

      Use a variable of type `int` to capture the return value of the `byte` input method. When the value returned by `read()` is not −1, it can be safely cast to type `byte`. When `read()` returns `0x000000FF`, the comparison will test against `0xFFFFFFFF`, which evaluates to false.

      ```java
      FileInputStream in;
      // Initialize stream
      int inbuff;
      byte data;
      while ((inbuff = in.read()) != -1) {
        data = (byte) inbuff;
        // ...
      }
      ```
      **Compliant Solution (`char`)**

      Use a variable of type `int` to capture the return value of the character input method. When the value returned by `read()` is not −1, it can be safely cast to type `char`.

      ```java
      FileReader in;
      // Initialize stream
      int inbuff;
      char data;
      while ((inbuff = in.read()) != -1) {
        data = (char) inbuff;
        // ...
      }
      ```
