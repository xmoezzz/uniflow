  - id: '02000010140703'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 06. 方法 (MET)
      - type: DetailClassChin
        value: MET03-J：进行安全检测的方法必须声明为private或final
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 06. Methods (MET)
      - type: DetailClassChin
        value: MET03-J:Methods that perform a security check must be declared private or final
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "恶意子类可以覆写进行安全检测的Nonfinal类的成员方法，并忽略这些检测。从而使安全检测不起作用。因此，这些方法必须声明为private或final来避免覆写。  \n**不规范的代码样例1**：  \n```java\npublic void readSensitiveFile() {\n  try {\n    SecurityManager sm = System.getSecurityManager();\n    if (sm != null) {  // Check for permission to read file\n      sm.checkRead(\"/temp/tempFile\");\n    }\n    // Access the file\n  } catch (SecurityException se) {\n    // Log exception\n  }\n}\n```\n这个不符合规范的代码示例允许子类覆写方法`readSensitiveFile()`，并省略了所需的安全检测。"
    Description_En: |-
      Nonfinal member methods that perform security checks can be compromised when a malicious subclass overrides the methods and omits the checks. Consequently, such methods must be declared private or final to prevent overriding.

      **Noncompliant Code Example**

      This noncompliant code example allows a subclass to override the `readSensitiveFile()` method and omit the required security check:

      ```java
      public void readSensitiveFile() {
        try {
          SecurityManager sm = System.getSecurityManager();
          if (sm != null) {  // Check for permission to read file
            sm.checkRead("/temp/tempFile");
          }
          // Access the file
        } catch (SecurityException se) {
          // Log exception
        }
      }
      ```
    Advice: "**规范的代码样例1**：\n```java\npublic final void readSensitiveFile() {\n    try {\n        SecurityManager sm = System.getSecurityManager();\n        if (sm != null) { // Check for permission to read file\n            sm.checkRead(\"/temp/tempFile\");\n        }\n        // Access the file\n    } catch (SecurityException se) {\n        // Log exception\n    }\n}\n```  \n这个符合规范的方案将`readSensitiveFile()`声明为final的，从而避免了覆写。  \n**规范的代码样例2**：\n```java\nprivate void readSensitiveFile() {\n    try {\n        SecurityManager sm = System.getSecurityManager();\n        if (sm != null) { // Check for permission to read file\n            sm.checkRead(\"/temp/tempFile\");\n        }\n        // Access the file\n    } catch (SecurityException se) {\n        // Log exception\n    }\n}\n```  \n这个符合规范的方案将`readSensitiveFile()`声明为private的，从而避免了覆写。  \n**特例**  \nMET03-EX0:声明为final的类不受这条规则的限制，这是因为它们的成员方法是不能被覆写的。"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution prevents overriding of the `readSensitiveFile()` method by declaring it final:

      ```java
      public final void readSensitiveFile() {
        try {
          SecurityManager sm = System.getSecurityManager();
          if (sm != null) {  // Check for permission to read file
            sm.checkRead("/temp/tempFile");
          }
          // Access the file
        } catch (SecurityException se) {
          // Log exception
        }
      }
      ```

      **Compliant Solution**

      This compliant solution prevents overriding of the `readSensitiveFile()` method by declaring it private:

      ```java
      private void readSensitiveFile() {
        try {
          SecurityManager sm = System.getSecurityManager();
          if (sm != null) {  // Check for permission to read file
            sm.checkRead("/temp/tempFile");
          }
          // Access the file
        } catch (SecurityException se) {
          // Log exception
        }
      }
      ```

      **Exceptions**

      MET03-J-EX0: Classes that are declared final are exempt from this rule because their member methods cannot be overridden.
    References:
      Reference:
      - type: CWE
        value: 358:Improperly Implemented Security Check for Standard
