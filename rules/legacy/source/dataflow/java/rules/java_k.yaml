  - id: '02000010140403'
    language: Java
    Type: cert
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: Rule 02. 表达式 (EXP)
      - type: DetailClassChin
        value: EXP03-J：不要使用相等操作符比较封装的基础数据类型
    Categories_En:
      Category:
      - type: ClassChin
        value: SEI CERT Oracle Coding Standard for Java
      - type: SubClassChin
        value: Rule 02. Expressions (EXP)
      - type: DetailClassChin
        value: EXP03-J:Do not use the equality operators when comparing values of boxed primitives
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "两个封装的基础数据类型的值是不能直接使用` == `或者` != `操作符来比较，因为这些操作符比较的是对象的引用而不是对象的值。考虑到自动封装会内存化或存储一些基础数据类型变量的值，程序员往往认为这条规则的要求是难以相信的。但是，引用比较和值的比较，对于那些完全内存化的变量是会产生相同的值，但没有完全内存化的变量则不会。  \n在Java语言规范5.1.7节“装箱转换”中关于自动封装时，哪些基础结构数据是要被内存化的：  \n>如果要装箱的p值为true、false、一个byte、一个在\\u0000~\\u007f之间的char或者一个位于-128~127之间的int或short数字，设r1和r2是p的任何两个装箱转化的结果，则始终有r1==r2。（设p为100，Integer r1 = 100，Integer r2 = 100，则r1一定等于r2）  \n\n在JVM中，对额外的数据的内存化是允许的，但不是必需的。所以，在内存比较宽松的实现中，有可能会对所有的char、short的值，甚至是值在-32K~+32K之间的int、long进行缓存。\n完全内存化的封装后的基础数据类型：Boolean、Byte。  \n没有完全内存化的封装后的基础数据类型：Character、Short、Integer、Long、Float、Double。  \n在封装后的基础数据类型不是直接来自于其构造函数的情况下，即属于自动封装，可以：  \n1）如果使用 `==` 或者 `!=` 操作符来比较两个完全内存化的封装过的基础数据类型的值是允许的。  \n2）如果使用 `==` 或者 `!=` 操作符来比较两个没有完全内存化的封装过的基础数据类型的值，必须保证两个值处于对应类型的有效范围之内。  \n**不规范的代码样例1**：  \n代码定义了一个`compare()`方法，在方法内对传入的两个Integer对象进行了`==`比较，实际上比较的是这两个对象的地址而不是值。\n```java\nimport java.util.Comparator;\n\nstatic Comparator<Integer> cmp = new Comparator<Integer>() {\n  public int compare(Integer i, Integer j) {\n    return i < j ? -1 : (i == j ? 0 : 1);\n  }\n};\n```\n注意，此方法也可接受 `int`型数据，在调用时被自动包装。\n**不规范的代码样例2**：\n这个不合规的代码示例使用 `==` 运算符来尝试比较成对的 `Integer` 对象的值。 但是，`==` 运算符比较的是对象引用而不是对象的值。\n```java\npublic class Wrapper {\n  public static void main(String[] args) {\n    Integer i1 = 100;\n    Integer i2 = 100;\n    Integer i3 = 1000;\n    Integer i4 = 1000;\n    System.out.println(i1 == i2);\n    System.out.println(i1 != i2);\n    System.out.println(i3 == i4);\n    System.out.println(i3 != i4);\n  }\n}\n```\n`Integer` 类保证只缓存从 `-128` 到 `127` 的整数值，这可能导致在此范围之外的相等值在使用等于运算符进行测试时会不相等。 例如，在运行该程序时没有缓存任何其他值的 JVM 将输出\n| `true``false``false``true` |\n| - |"
    Description_En: |-
      The *values* of boxed primitives cannot be directly compared using the `==` and `!=` operators because these operators compare object references rather than object values. Programmers can find this behavior surprising because autoboxing memoizes, or caches, the values of some primitive variables. Consequently, reference comparisons and value comparisons produce identical results for the subset of values that are memoized.

      Autoboxing automatically wraps a value of a primitive type with the corresponding wrapper object. *The Java Language Specification* (JLS), §5.1.7, &#34;Boxing Conversion&#34; JLS 2015, explains which primitive values are memoized during autoboxing:

      > If the value `p` being boxed is `true`, `false`, a `byte`, a `char` in the range `\u0000` to `\u007f`, or an `int` or `short` number between `-128` and `127`, then let `r1` and `r2` be the results of any two boxing conversions of `p`. It is always the case that `r1 == r2`.

      Use of the `==` and `!=` operators for comparing the values of fully memoized boxed primitive types is permitted.

      Use of the `==` and `!=` operators for comparing the *values* of boxed primitive types that are not fully memoized is permitted only when the range of values represented is guaranteed to be within the ranges specified by the JLS to be fully memoized.

      Use of the `==` and `!=` operators for comparing the *values* of boxed primitive types is not allowed in all other cases.

      Note that Java Virtual Machine (JVM) implementations are allowed, but not required, to memoize additional values [JLS 2015]:

      > Less memory-limited implementations could, for example, cache all characters and shorts, as well as integers and longs in the range of −32K to +32K. (§5.1.7)

      Code that depends on implementation-defined behavior is nonportable. It is permissible to depend on implementation-specific ranges of memoized values provided that all targeted implementations support these greater ranges.

      **Noncompliant Code Example**

      This noncompliant code example defines a `Comparator` with a `compare()` method [Bloch 2009]. The `compare()` method accepts two boxed primitives as arguments. The `==` operator is used to compare the two boxed primitives. In this context, however, it compares the *references* to the wrapper objects rather than comparing the *values* held in those objects.

      ```java
      import java.util.Comparator;

      static Comparator<Integer> cmp = new Comparator<Integer>() {
        public int compare(Integer i, Integer j) {
          return i < j ? -1 : (i == j ? 0 : 1);
        }
      };
      ```

      Note that primitive integers are also accepted by this declaration because they are autoboxed at the call site.

      **Noncompliant Code Example**

      This noncompliant code example uses the `==` operator in an attempt to compare the values of pairs of `Integer` objects. However, the `==` operator compares object references rather than object values.

      ```java
      public class Wrapper {
        public static void main(String[] args) {
          Integer i1 = 100;
          Integer i2 = 100;
          Integer i3 = 1000;
          Integer i4 = 1000;
          System.out.println(i1 == i2);
          System.out.println(i1 != i2);
          System.out.println(i3 == i4);
          System.out.println(i3 != i4);
        }
      }
      ```

      The `Integer` class is guaranteed to cache only integer values from `-128` to `127`, which can result in equivalent values outside this range comparing as unequal when tested using the equality operators. For example, a JVM that did not cache any other values when running this program would output

      | `true``false``false``true` |
      | - |
    Advice: "方案1：采用比较操作符`<、<=、>、>=`来比较封装后的基础数据类型，因为这些操作符会自动解封封装；\n方案2：采用`equals`来比较两个封装后的基础数据类型。  \n**规范的代码样例1**：  \n```java\npublic int compare(Integer i, Integer j) {  \n    return i < j ? -1 : (i > j ? 1 : 0);  \n}  \n```\n**规范的代码样例2**：  \n```java\npublic class Wrapper {\n    public static void main(String[] args) {\n        Integer i1 = 100;\n        Integer i2 = 100;\n        Integer i3 = 1000;\n        Integer i4 = 1000;\n        System.out.println(i1.equals(i2));\n        System.out.println(!i1.equals(i2));\n        System.out.println(i3.equals(i4));\n        System.out.println(!i3.equals(i4));\n    }\n}\n```"
    Advice_En: |-
      **Compliant Solution**

      This compliant solution uses the comparison operators, `<`, `>`, `<=`, or `>=`, because these cause automatic unboxing of the primitive values. The `==` and `!=` operators should not be used to compare boxed primitives.

      ```java
      import java.util.Comparator;

      static Comparator<Integer> cmp = new Comparator<Integer>() {
        public int compare(Integer i, Integer j) {
          return i < j ? -1 : (i > j ? 1 : 0) ;
        }
      };
      ```
      **Compliant Solution**

      This compliant solution uses the `equals()` method instead of the `==` operator to compare the values of the objects. The program now prints `true`, `false`, `true`, `false` on all platforms, as expected.

      ```java
      public class Wrapper {
        public static void main(String[] args) {
          Integer i1 = 100;
          Integer i2 = 100;
          Integer i3 = 1000;
          Integer i4 = 1000;
          System.out.println(i1.equals(i2));
          System.out.println(!i1.equals(i2));
          System.out.println(i3.equals(i4));
          System.out.println(!i3.equals(i4));
        }
      }
      ```
