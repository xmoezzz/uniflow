    Description: "增强的for语句是为通过集合和数组进行迭代而设计的。\nJava语言规范（JLS）在§14.14.2 \"增强型for语句\"[JLS 2014]中提供了增强型for语句的如下示例。\n```java\nfor (I #i = Expression.iterator(); #i.hasNext(); ) {\n    {VariableModifier} TargetType Identifier =\n        (TargetType) #i.next();\n    Statement\n}\n```\n#i是一个自动生成的标识符，它与任何其他标识符（自动生成或其他）不同，这些标识符作用在增强for语句范围内。\n增强的for语句等同于基本for语句的形式。\nJava 5平台引入了增强的for语句，用来对对象集合进行迭代。与基本的for语句不同，在基本的for语句中，给循环变量赋值是不能对循环的迭代次序有所影响，但在增强的for语句中，给循环变量赋值就可以有影响。\n**不规范的代码样例1**：  \n以下代码尝试使用增强型for循环来处理整数集合，并且打算修改集合中的某一条目。  \n```java\nList<Integer> list = Arrays.asList(new Integer[] { 13, 14, 15 });\nboolean first = true;\nSystem.out.println(\"Processing list...\");\nfor (Integer i : list) {\n    if (first) {\n        first = false;\n        i = new Integer(99);\n    }\n    System.out.println(\" New item: \" + i);\n    // Process i\n}\nSystem.out.println(\"Modified list?\");\nfor (Integer i : list) {\n    System.out.println(\"List item: \" + i);\n}\n```\n但是，该代码并没有修改列表，其输出如下：  \n```\nProcessing list... \nNew item: 99  \nNew item: 14  \nNew item: 15  \nModified list?  \nList item: 13  \nList item: 14  \nList item: 15\n```"
    Description_En: |-
      The enhanced for statement is designed for iteration through Collections and arrays.

      The Java Language Specification (JLS) provides the following example of the enhanced for statement in §14.14.2, "The Enhanced for Statement" [JLS 2014]:
      The enhanced for statement is equivalent to a basic for statement of the form:

      ```java
      for (I #i = Expression.iterator(); #i.hasNext(); ) {
          {VariableModifier} TargetType Identifier =
              (TargetType) #i.next();
          Statement
      }
      ```

      #i is an automatically generated identifier that is distinct from any other identifiers (automatically generated or otherwise) that are in scope...at the point where the enhanced for statement occurs.

      Unlike the basic `for` statement, assignments to the loop variable fail to affect the loop's iteration order over the underlying set of objects. Consequently, an assignment to the loop variable is equivalent to modifying a variable local to the loop body whose initial value is the object referenced by the loop iterator. This modification is not necessarily erroneous but can obscure the loop functionality or indicate a misunderstanding of the underlying implementation of the enhanced `for` statement.

      Declare all enhanced `for` statement loop variables final. The `final` declaration causes Java compilers to flag and reject any assignments made to the loop variable.

      **Noncompliant Code Example**

      This noncompliant code example attempts to process a collection of integers using an enhanced `for` loop. It further intends to modify one item in the collection for processing:

      ```java
      List<Integer> list = Arrays.asList(new Integer[] {13, 14, 15});
      boolean first = true;

      System.out.println("Processing list...");
      for (Integer i: list) {
        if (first) {
          first = false;
          i = new Integer(99);
        }
        System.out.println(" New item: " + i);
        // Process i
      }

      System.out.println("Modified list?");
      for (Integer i: list) {
        System.out.println("List item: " + i);
      }
      ```

      However, this code does not actually modify the list, as shown by the program's output:

      > Processing list...
      > New item: 99
      > New item: 14
      > New item: 15
      > Modified list?
      > List item: 13
      > List item: 14
      > List item: 15
    Advice: "可以将所有的for语句中循环变量声明为final。这个final声明可以让Java编译器做一个标志，并且拒绝对这个循环变量的任何赋值。  \n**规范的代码样例1**：  \n下面规范的代码将Integer声明为final类型。  \n ```java\n// ...  \n for (final Integer i: list) {  \n // ...  \n }  \n // ...\n```   \n**规范的代码样例2**：  \n下面符合规范的代码处理集合，但是保持实际的集合不变。  \n  \n```java\n// ...    \nfor (final Integer i : list) {\n    Integer item = i;\n    if (first) {\n        first = false;\n        item = new Integer(99);\n    }\n    System.out.println(\" New item: \" + item);\n    // Process item\n}    \n// ...\n```"
    Advice_En: |-
      **Compliant Solution**

      Declaring `i` to be final mitigates this problem by causing the compiler to fail to permit `i` to be assigned a new value:

      ```java
      // ...
      for (final Integer i: list) {

      // ...
      ```

      **Compliant Solution**

      This compliant solution processes the "modified" list but leaves the actual list unchanged:

      ```java
      // ...

      for (final Integer i: list) {
        Integer item = i;
        if (first) {
          first = false;
          item = new Integer(99);
        }
        System.out.println(" New item: " + item);
        // Process item
      }

      // ...
      ```
