        value: A.2.4.2 不要将未经验证的用户输入记录日志
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：当日志条目包含未经净化的用户输入时会引发记录注入漏洞。恶意用户会插入伪造的日志数据，从而让系统管理员以为是系统行为 [OWASP 2008]。例如，用户在将冗长的日志记录拆分成两份时，日志中使用的回车和换行符可能会被误解。记录注入攻击可以通过对任何非受信的发送到日志的输入进行净化和验证来阻止。  \n对于不要将未经验证的用户输入记录日志的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nif (loginSuccessful) {    \n    logger.severe(\"User login succeeded for: \" + username);    \n} else {    \n    logger.severe(\"User login failed for: \" + username);    \n}\n```   \n这个不符合规则的代码示例中，在接收到非法请求的时候，会记录用户的用户名。这时没有执行任何输入净化。  \n如果没有净化，那么可能会出现日志注入攻击。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。当出现`username`是david时，标准的日志信息如下所示：  \n```\nMay 15, 2011 2:19:10 PM java.util.logging.LogManager$RootLogger log    \nSEVERE: User login failed for: david   \n```\n如果日志信息中使用的`username`不是david而是多行字符串，如下所示：  \n```\ndavid    \nMay 15, 2011 2:25:52 PM java.util.logging.LogManager$RootLogger log    \nSEVERE: User login succeeded for: administrator  \n``` \n那么日志中包含了以下可能引起误导的信息：  \n```\nMay 15, 2011 2:19:10 PM java.util.logging.LogManager$RootLogger log    \nSEVERE: User login failed for: david    \nMay 15, 2011 2:25:52 PM java.util.logging.LogManager$RootLogger log    \nSEVERE: User login succeeded for: administrator\n ``` \n**示例2**：  \n```java\nif (!Pattern.matches(\"[A-Za-z0-9_]+\", username)) {    \n    // Unsanitized username    \n    logger.severe(\"User login failed for unauthorized user\");    \n} else if (loginSuccessful) {    \n    logger.severe(\"User login succeeded for: \" + username);    \n} else {    \n    logger.severe(\"User login failed for: \" + username);    \n}\n```   \n这个符合规范的代码在登录之前会净化用户名输入，从而防止注入攻击。"
    Advice_En: ''
    References:
