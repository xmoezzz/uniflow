    Description: "规范说明：`org.apache.struts.action.Action`的对象以及Spring框架下单例类（比如使用`@Controller`、`@Service`和`@Repository`注解的类默认都是单例类）都不是线程安全的。Web容器默认采用单实例多线程的方式来处理Http请求，单例对象将在一个多线程的环境中并发执行，这将导致单例对象成员变量访问的线程安全问题。  \n对于不要使用单例对象下的成员变量的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\n@Controller  \npublic class User {\n    String username;\n\n    @RequestMapping(\"/login\", method = GET)  \n    public String greet(String username) {  \n        this.username= username;  \n        ...\n        return \" 欢迎您，\"+username+\" !\";      \n    }\n}\n```  \n上面是一段使用Spring框架搭建的WEB服务中的Controller代码片断，变量`username`为成员变量，当User的对象处理多个请求时，变量`username`将被多个请求共享，这将导致线程间数据泄露。  \n使用struts1的Action或Spring框架写的一些单例类时，必须保证其是线程安全的。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。修复方式如下：  \n**示例2**： \n```java  \n@Controller\n@Scope(\"prototype\")\npublic class User {\n    String username;\n\n    @RequestMapping(\"/login\", method = GET)  \n    public String greet(String username) {  \n        this.username= username;  \n        ...\n        return \" 欢迎您，\"+username+\" !\";      \n    }\n}\n```  \n上面代码示例，可以将User控制器设为多例，每一次请求将会新建一个User对象,从而保证线程安全。  \n同样，也可以使用局部变量解决此问题。"
