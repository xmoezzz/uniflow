    Description: "规范说明：在安全性要求较高的系统中，使用不安全的加密算法（如DES、3DES、RC4、RC5等），将无法保证敏感数据的保密性。  \n对于避免使用不安全的加密算法的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：   \n```java\nBufferedReader bufread2 = null;\nInputStreamReader inread2 = null;\ntry {\n    inread2 = new InputStreamReader(System.in);\n    bufread2 = new BufferedReader(inread2);\n    String str = bufread2.readLine();\n    /* FLAW: Insecure cryptographic algorithm (DES) */\n    Cipher des = Cipher.getInstance(\"DES\");\n    SecretKey key = KeyGenerator.getInstance(\"DES\").generateKey();\n    des.init(Cipher.ENCRYPT_MODE, key);\n    byte[] enc_str = des.doFinal(str.getBytes());\n    IO.writeLine(IO.toHex(enc_str));\n} catch (IOException e) {\n    log_bsnk.warning(\"Error reading from console\");\n} finally {\n    ...\n} \n...\n```  \n以上代码片段中，采用DES对数据进行加密。  \n在安全性要求较高的系统中，建议使用安全的加密算法（如AES、RSA)对敏感数据进行加密。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：   \n```java\nBufferedReader bufread2 = null;\nInputStreamReader inread2 = null;\ntry {\n    inread2 = new InputStreamReader(System.in);\n    bufread2 = new BufferedReader(inread2);\n    String str = bufread2.readLine();\n    /* FIX: Secure cryptographic algorithm (AES) */\n    Cipher aes = Cipher.getInstance(\"AES\");\n    KeyGenerator kg = KeyGenerator.getInstance(\"AES\");\n    kg.init(128);\n    SecretKey key = kg.generateKey();\n    aes.init(Cipher.ENCRYPT_MODE, key);\n    byte[] enc_str = aes.doFinal(str.getBytes());\n    IO.writeLine(IO.toHex(enc_str));\n} catch (IOException e) {\n    log_gsnk.warning(\"Error reading from console\");\n} finally {\n    ...\n} \n...\n```  \n以上代码片段中，使用AES取代DES保证数据完整性。"
