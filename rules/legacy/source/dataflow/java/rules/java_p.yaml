    Description: "规范说明：程序创建或分配流资源后，不进行合理释放，将会降低系统性能。攻击者可能会通过耗尽资源池的方式发起拒绝服务攻击。  \n对于需确保流得到释放的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：   \n```java\npublic void processFile(String filePath) {\n    try {\n        FileInputStream fis = new FileInputStream(filePath);\n        InputStreamReader isr = new InputStreamReader(fis);\n        BufferedReader br = new BufferedReader(isr);\n        String line = \"\";\n        while ((line = br.readLine()) != null) {\n            processLine(line);\n        }\n    } catch (FileNotFoundException e) {\n        log(e);\n    } catch (IOException e) {\n        log(e);\n    }\n}\n```  \n在上面Java方法中，创建I/O流对象后未进行合理释放，程序依靠Java虚拟机的垃圾回收机制释放I/O流资源，事实上，程序不能确定何时调用虚拟机的`finalize()`方法。在繁忙的程序环境下，可能导致Java虚拟机不能有效的使用I/O对象。程序不应依赖于`finalize()`回收流资源，应在finally代码块中手动释放流资源。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：   \n```java\npublic void processFile(String filePath) {\n    FileInputStream fis = null;\n    InputStreamReader isr = null;\n    BufferedReader br = null;\n    try {\n        fis = new FileInputStream(filePath);\n        isr = new InputStreamReader(fis);\n        br = new BufferedReader(isr);\n        String line = \"\";\n        while ((line = br.readLine()) != null) {\n            // processLine(line);\n        }\n    } catch (FileNotFoundException e) {\n        // log(e);\n    } catch (IOException e) {\n        // log(e);\n    } finally {\n        if (br != null) {\n            try {\n                br.close();\n            } catch (IOException e) {\n                // log(e);\n            }\n        }\n        if (isr != null) {\n            try {\n                isr.close();\n            } catch (IOException e) {\n                // log(e);\n            }\n        }\n        if (fis != null) {\n            try {\n                fis.close();\n            } catch (IOException e) {\n                // log(e);\n            }\n        }\n    }\n}\n```  \n以上代码片段中，在finally代码块中对流资源进行了合理的释放。"
