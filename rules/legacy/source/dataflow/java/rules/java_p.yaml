      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：在异常传递的过程中，如果不对敏感信息进行过滤，会导致信息泄露，这将有助于攻击者实现对系统的攻击。  \n对于不能允许异常泄露敏感信息的情况，示例1、给出了不规范用法（java语言）示例。  \n**示例1**：   \n```java\nclass ExceptionExample {\n    public static void main(String[] args) throws FileNotFoundException {\n        // Linux stores a user's home directory path in\n        // the environment variable $HOME, Windows in %APPDATA%\n        FileInputStream fis = new FileInputStream(System.getenv(\"APPDATA\") + args[0]);\n    }\n}\n```  \n在这个不合规范的代码示例中，如果要求的文件不存在，将会抛出FileNotFoundException异常，通过不断的传递虚构的路径给程序，攻击者可以重建内部文件系统结构。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\nclass ExceptionExample {\n    public static void main(String[] args) {\n\n        File file = null;\n        try {\n            file = new File(System.getenv(\"APPDATA\") + args[0]).getCanonicalFile();\n            if (!file.getPath().startsWith(\"c:\\\\homepath\")) {\n                System.out.println(\"Invalid file\");\n                return;\n            }\n        } catch (IOException x) {\n            System.out.println(\"Invalid file\");\n            return;\n        }\n\n        try {\n            FileInputStream fis = new FileInputStream(file);\n        } catch (FileNotFoundException x) {\n            System.out.println(\"Invalid file\");\n            return;\n        }\n    }\n}\n```  \n这个符合规范的方案实现了一个安全策略，用户只能打开`c:\\homepath`中的文件。当文件不能打开或不在正确的目录内时，这个方案将会返回一个简洁的错误信息。`c:\\homepath`目录外文件的任何信息都被屏蔽了。  \n这个方案还使用了`File.getCanonicalFile()`方法对文件进行标准化，简化了之后的对路径名进行比较的过程。"
    Advice_En: ''
