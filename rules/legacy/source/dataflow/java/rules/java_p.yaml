  - id: '02000010170030'
    language: Java
    Type: guide
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.1 面向对象程序安全
      - type: DetailClassChin
        value: A.3.1.4 构造方法中不要调用可覆写的方法
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：在创建对象时调用可覆写的方法可能造成未初始化的数据，进而导致执行异常或是预期外的结果。在构造函数中调用可覆写的方法同时会在对象创建完成前泄露this引用，这使得其它线程可访问到未初始化或不一致的数据。  \n对于构造方法中不要调用可覆写的方法的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nclass SuperClass {  \n    public SuperClass() {  \n        doLogic();  \n    }  \n    public void doLogic() {  \n        System.out.println(\"This is superclass!\");  \n    }  \n}  \nclass SubClass extends SuperClass {  \n    private String color = null;  \n    public SubClass() {  \n        super();  \n        color = \"Red\";  \n    }  \n    public void doLogic() {  \n        System.out.println(\"This is subclass! The color is :\" + color);  \n            // ...  \n    }  \n}     \npublic class Overridable {  \n    public static void main(String[] args) {  \n        SuperClass bc = new SuperClass();  \n        // Prints \"This is superclass!\"  \n        SuperClass sc = new SubClass();  \n        // Prints \"This is subclass! The color is :null\"  \n    }  \n}\n```  \n这个不符合规则的代码示例中，方法`doLogic()`使用了未初始化的数据。  \n方法`doLogic()`是在基类的构造函数中调用的。当直接创建基类的实例时，将调用基类的方法`doLogic()`，从而正确的执行。然而，当子类发起基类的创建时，却调用了子类的`doLogic()`方法，这种情况下，因为子类的构造函数还没有完成执行，所有`color`的数值还是null。  \n构造函数只能调用final或private的方法。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\nclass SuperClass {  \npublic SuperClass () {  \n    doLogic();  \n}  \npublic final void  doLogic() {  \n    System.out.println(\"This is superclass!\");  \n}  \n}\n```  \n这个符合规范的方案将`doLogic()`声明为final的，从而确保了`doLogic()`方法不会被覆写。"
    Advice_En: ''
    References:
      Reference:
      - type: CERT
        value: MET05-J:Ensure that constructors do not call overridable methods
