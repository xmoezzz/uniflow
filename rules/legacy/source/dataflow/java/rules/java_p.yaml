    Description: "规范说明：应用程序从数据库或其它后端数据存储获取不可信赖的数据，在未检验数据是否存在恶意代码的情况下，便将其传送给了Web用户，应用程序将易于受到存储型XSS攻击。  \n对于预防存储型XSS的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**： \n```java \n<%  \nStatement stmt = conn.createStatement();  \nResultSet rs = stmt.executeQuery(\"select * from users where id =\" + id);  \nString address = null;  \nif (rs != null) {  \n    rs.next();  \n    address = rs.getString(\"address\");  \n}%>  \n家庭地址: <%= address %>  \n```\n上面JSP代码片段的功能是根据一个已知雇员ID（eid）从数据库中查询出该雇员的姓名，并显示在JSP页面上。  \n如果name的值是由用户提供的，且存入数据库时没有进行合理的校验，那么攻击者就可以利用上面的代码进行存储型XSS攻击。"
    Description_En: ''
    Advice: "为了避免存储型XSS攻击，建议采用以下方式进行防御：  \n1. 与预防反射型XSS相同，对用户的输入进行合理验证（如年龄只能是数字），对特殊字符（如`<`、`>`、`'`、`\"`以及`<script>`、`javascript`等进行过滤。  \n2. 与预防反射型XSS相同，根据数据将要置于HTML上下文中的不同位置（HTML标签、HTML属性、JavaScript脚本、CSS、URL），对所有不可信数据进行恰当的输出编码。  \n3. 与预防反射型XSS相同，设置HttpOnly属性。"
