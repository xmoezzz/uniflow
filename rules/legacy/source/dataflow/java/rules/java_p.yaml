      - type: DetailClassChin
        value: A.3.1.5 进行安全检测的方法必须声明为private或final
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：恶意子类可以覆写进行安全检测的Nonfinal类的成员方法，并忽略这些检测。从而使安全检测不起作用。因此，这些方法必须声明为private或final来避免覆写。  \n对于进行安全检测的方法必须声明为private或final的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic void readSensitiveFile() {\n    try {\n        SecurityManager sm = System.getSecurityManager();\n        if (sm != null) { // Check for permission to read file\n            sm.checkRead(\"/temp/tempFile\");\n        }\n        // Access the file\n    } catch (SecurityException se) {\n        // Log exception\n    }\n}\n```  \n这个不符合规范的代码示例允许子类覆写方法`readSensitiveFile()`，并省略了所需的安全检测。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\npublic final void readSensitiveFile() {\n    try {\n        SecurityManager sm = System.getSecurityManager();\n        if (sm != null) { // Check for permission to read file\n            sm.checkRead(\"/temp/tempFile\");\n        }\n        // Access the file\n    } catch (SecurityException se) {\n        // Log exception\n    }\n}\n```\n这个符合规范的方案将`readSensitiveFile()`声明为final的，从而避免了覆写。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 358:Improperly Implemented Security Check for Standard
      - type: CERT
        value: MET03-J:Methods that perform a security check must be declared private or final
