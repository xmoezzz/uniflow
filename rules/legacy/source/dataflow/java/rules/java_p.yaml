    Description: "规范说明：程序未进行恰当的访问控制，执行的SQL语句包含用户所控制的主键，可能会导致攻击者访问未经授权的记录。  \n对于避免数据库访问控制的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nid = Integer.decode(request.getParameter(\"invoiceID\"));  \nString query = \"SELECT * FROM invoices WHERE id = ?\";  \nPreparedStatement stmt = conn.prepareStatement(query);  \nstmt.setInt(1, id);  \nResultSet results = stmt.execute();  \n...\n```  \n上述代码片段中的SQL语句用于查询与指定标识符相匹配的清单。  \n在上面代码中，攻击者可以通过为`invoiceID`设置不同的值，获取所需的任何清单信息。  \n任何情况下都不应该允许用户在没有取得相应权限的情况下获取或修改数据库中的记录。可以通过把当前被授权的用户名作为查询语句的一部分来实现。"
