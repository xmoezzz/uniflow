        value: A.2.1.1.4 净化传递给Runtime.exec()方法的非受信数据
    Categories_En:
      Category: []
    BugServerity: 5
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明： 每个Java应用都有一个Runtime类的实例，一般需要使用shell时调用它，从而可以在POSIX中使用`/bin/sh`或者在Windows平台中使用cmd.exe。当参数中包含以空格、双引号或者其他以- /开头的用来表示分支的字符时，就可能发生参数注入攻击。任何源于程序受信边界之外的字符串数据，在当前平台作为命令来执行之前，都必须经过净化。  \n对于净化传递给`Runtime.exec()`方法的非受信数据的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1（Windows）**：\n```java  \nclass DirList {\n    public static void main(String[] args) throws Exception {\n        String dir = System.getProperty(\"dir\");\n        Runtime rt = Runtime.getRuntime();\n        Process proc = rt.exec(\"cmd.exe /C dir \" + dir);\n        int result = proc.waitFor();\n        if (result != 0) {\n            System.out.println(\"process error: \" + result);\n        }\n        InputStream in = (result == 0) ? proc.getInputStream() : proc.getErrorStream();\n        int c;\n        while ((c = in.read()) != -1) {\n            System.out.print((char) c);\n        }\n    }\n}\n```  \n该代码示例使用dir命令列出目录列表。这是通过`Runtime.exec()`方法调用Windows的dir命令来实现的。因为`Runtime.exec()`方法接受源于运行环境的未经净化的数据，所以这些代码会引起命令注入攻击。  \n攻击者可以通过以下命令利用该程序：  \n`java -Ddir='dummy & echo bad' Java `  \n该命令实际上执行的是两条命令：  \n`cmd.exe /C dir dummy & echo bad`   \n第一条命令会列出并不存在的dummy文件夹，并且在控制台上输出bad。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2（净化）**：  \n```java\n// ...    \nif (!Pattern.matches(\"[0-9A-Za-z@.]+\", dir)) {    \n // ...   \n}    \n// ...\n```   \n这个符合规范的代码实例会对非受信的用户输入进行净化，只允许白名单中的字符出现在参数中，并传给`Runtime.exec()`方法，其他所有的字符都会被排除掉。"
    Advice_En: ''
