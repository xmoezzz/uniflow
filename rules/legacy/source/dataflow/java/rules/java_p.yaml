    Description: "规范说明：当程序中使用硬编码加密密匙时，所有项目开发人员都可以查看该密匙，甚至如果攻击者能够获取程序class文件，可通过反编译得到密匙，硬编码加密密匙会大大降低系统安全性。  \n对于避免使用硬编码密匙的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：   \n```java\nprivate static String encryptionKey = \"dfashsdsdfsdgagascv\";  \n...  \nbyte[] keyBytes = encryptionKey.getBytes();  \nSecretKeySpec key = new SecretKeySpec(keyBytes, \"AES\");  \nCipher encryptCipher = Cipher.getInstance(\"AES\");  \nencryptCipher.init(Cipher.ENCRYPT_MODE, key);  \n...\n```  \n上述代码使用硬编码加密密钥执行AES加密。  \n程序应采用不小于8个字节的随机生成的字符串作为密匙。"
