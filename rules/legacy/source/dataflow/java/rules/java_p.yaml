    Description: "规范说明：程序创建或分配文件句柄后，不进行合理释放，将会降低系统性能，攻击者可能会通过耗尽资源池的方式发起拒绝服务攻击。  \n对于需确保文件得到释放的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：   \n```java\npublic void getZipContents(String fileName){  \n    ZipFile zFile = null;  \n    try{  \n        zFile = new ZipFile(fileName);  \n        ...  \n    } catch (IOException e) {  \n        e.printStackTrace();  \n    }  \n}\n```  \n上述代码片段中，创建了一个文件句柄`zFile`，但未进行合理释放。程序不应依赖于`finalize()`回收文件句柄资源，应在finally代码块中手动释放文件句柄资源。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\npublic void getZipContents(String fileName) {\n    ZipFile zFile = null;\n    try {\n        zFile = new ZipFile(fileName);\n        ...\n    } catch (IOException e) {\n        e.printStackTrace();\n    } finally {\n        if (zFile != null) {\n            try {\n                zFile.close();\n            } catch (IOException e) {\n                e.printStackTrace();\n            }\n        }\n    }\n}\n```  \n上述代码片段中，使用完之前创建的文件句柄`zFile`后，在finally代码块中进行了释放。"
    Advice_En: ''
    References:
