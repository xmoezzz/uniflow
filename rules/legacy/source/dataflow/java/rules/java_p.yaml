    Description: "规范说明：程序调用Double的解析方法时，可能导致线程被挂起。`java.lang.Double.parseDouble()`方法解析位于`[2^(-1022) - 2^(-1075) :2^(-1022) - 2^(-1076)]`范围内的任何数字时可能导致线程被挂起，攻击者可以故意触发该漏洞执行拒绝服务攻击。该漏洞在java6 update24或更高版本中进行了修复。  \n对于避免解析Double类型数据导致拒绝服务的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**： \n```java\nDouble d = Double.parseDouble(request.getParameter(\"d\"));\n```  \n上述代码片段中，使用了易受攻击的方法。攻击者可发送d参数值位于该范围(例如`\"0.0222507385850720119e-00306\"`）内的请求，致使程序在处理该请求时被挂起。"
    Description_En: ''
    Advice: "避免该缺陷的方式如下：  \n1. 验证传递给parseDouble数据的合法性。  \n2. 升级JDK版本到6 Update 24或更高版本。"
    Advice_En: ''
