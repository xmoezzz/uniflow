    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：硬编码如密码、服务器IP地址、加密密匙这样的敏感信息，会将信息暴露给攻击者。任何一个可以访问类文件的人都可以对其进行反编译，然后得到敏感信息。因此，程序不能对敏感信息进行硬编码。对敏感信息进行硬编码会使代码管理变得更复杂。例如，在一个已部署的程序中，改变其硬编码密码需要发布补丁。对敏感数据进行硬编码会向攻击者泄露信息。  \n对于不要硬编码敏感信息的情况，示例1、给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nclass IPaddress {  \n    String ipAddress = new String(\"172.16.254.1\");  \n    public static void main(String[] args) {  \n        // ...  \n    }  \n}\n```  \n代码在一个String常量中对服务器IP地址进行了硬编码。使用java反编译工具（例如：javap -c IPaddress）进行反汇编，从而可以得到硬编码的服务器IP地址。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\nclass IPaddress {\n    public static void main(String[] args) throws IOException {\n        char[] ipAddress = new char[100];\n        BufferedReader br = new BufferedReader(new InputStreamReader(new FileInputStream(\"serveripaddress.txt\")));\n        // Reads the server IP address into the char array,\n        // returns the number of bytes read\n        int n = br.read(ipAddress);\n        // Validate server IP address\n        // Manually clear out the server IP address\n        // immediately after use\n        for (int i = n - 1; i >= 0; i--) {\n            ipAddress[i] = 0;\n        }\n        br.close();\n    }\n}\n```  \n代码通过一个安全目录下的外部文件得到服务器IP地址。通过使用后立即清除内存中的服务器IP，可以防止进一步泄露。"
    Advice_En: ''
