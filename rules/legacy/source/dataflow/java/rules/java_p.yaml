    BugServerity: 5
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：SQL注入是一种数据库攻击手段。攻击者通过向应用程序提交恶意代码来改变原SQL语句的含义，进而执行任意SQL命令，达到入侵数据库乃至操作系统的目的。防止SQL注入的主要方法有：净化并验证非受信输入，采用参数化查询。  \n对于预防SQL注入的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic void doPrivilegedAction(String username, char[] password) throws SQLException {\n    Connection connection = getConnection();\n    //...  \n    try {\n        String pwd = hashPassword(password);\n        String sqlString = \"SELECT * FROM db_user WHERE username = '\" + username + \"' AND password = '\" + pwd + \"'\";\n        Statement stmt = connection.createStatement();\n        ResultSet rs = stmt.executeQuery(sqlString);\n        // ...  \n    } finally {\n        try {\n            connection.close();\n        } catch (SQLException x) {\n            // ...  \n        }\n    }\n}\n```  \n在这个不规范的代码示例中，使用JDBC来认证用户，提交`stmt.executeQuery(sqlString)`查询的SQL为`sqlString`，它是通过一个拼接字符串组合而来，并且`sqlString`未经过净化或验证，当`pwd`为`' OR '1'='1` 时，`sqlString`就会变成： `SELECT * FROM db_user WHERE username='' AND password='' OR '1'='1'。Statement.executeQuery(String)`方法不能防止SQL注入，该代码将会引发SQL注入漏洞攻击。 "
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。 \n**示例2**：  \n```java\npublic void doPrivilegedAction(String username, char[] password) throws SQLException {\n    Connection connection = getConnection();\n    try {\n        String pwd = hashPassword(password);\n        if (username.length() > 8) {\n            // ...  \n        }\n        String sqlString = \"select * from db_user where username=? and password=?\";\n        PreparedStatement stmt = connection.prepareStatement(sqlString);\n        stmt.setString(1, username);\n        stmt.setString(2, pwd);\n        //...  \n    } finally {\n        try {\n            connection.close();\n        } catch (SQLException x) {\n            // ...  \n        }\n    }\n}\n```  \n在这个规范的代码示例中，采用`java.sql.PreparedStatement`执行参数化查询，可以避免含有注入代码的SQL语句提交执行。通过使用`prepareStatement`类的`set*()`方法，可以进行强类型检查。程序会正确的转义双引号内的输入数据，以减少SQL注入漏洞。类似的，对数据的增删改操作也必须使用`prepareStatement`。"
