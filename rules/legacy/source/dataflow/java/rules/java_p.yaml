    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：在finally块中调用会抛出异常的方法，如果没有捕获这样的异常会造成整个try块的非正常终止。这导致了在try块中抛出的异常丢失，从而阻碍了任何可能的恢复方法去处理这些问题。而且，由于异常改变了程序流程，因此可能不会执行finally程序段中在异常抛出后的任何语句。  \n对于不要在finally块中遗漏可检测异常的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic class Operation {\n    public static void doOperation(String some_file) {\n        // ... code to check or set character encoding ...\n        try {\n            BufferedReader reader = new BufferedReader(new FileReader(some_file));\n            try {\n                // Do operations\n            } finally {\n                reader.close();\n                // ... Other cleanup code ...\n            }\n        } catch (IOException x) {\n            // Forward to handler\n        }\n    }\n} \n```\n`reader.close()`会抛出IOException。如果抛出这个异常，程序将不会执行随后的代码。  \n对于在finally块中的会抛出异常的语句，应采用try-catch进行处理。Java7以后新增了try-with-resource新功能，它可以在异常发生时自动的关闭特定资源。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\npublic class Operation {\n    public static void doOperation(String some_file) {\n        // ... code to check or set character encoding ...\n        try {\n            BufferedReader reader = new BufferedReader(new FileReader(some_file));\n            try {\n                // Do operations\n            } finally {\n                try {\n                    reader.close();\n                } catch (IOException ie) {\n                    // log ie\n                }\n                // ... Other cleanup code ...\n            }\n        } catch (IOException x) {\n            // Forward to handler\n        }\n    }\n}\n```"
    Advice_En: ''
    References:
