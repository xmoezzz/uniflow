      - type: DetailClassChin
        value: A.3.2.6 不要基于集合视图使用同步
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：任何一个使用集合视图而不是集合做为锁对象的类时，当多个线程可以后台访问集合时，基于集合视图实现锁的类违反了线程安全的属性，是不安全的。因此，当程序需要迭代集合视图并访问集合时，程序应该基于集合进行同步。  \n对于不要基于集合视图使用同步的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nprivate final Map<Integer, String> mapView = Collections.synchronizedMap(new HashMap<Integer, String>());\nprivate final Set<Integer> setView = mapView.keySet();\n\npublic Map<Integer, String> getMap() {\n    return mapView;\n}\n\npublic void doSomething() {\n    synchronized (setView) { // Incorrectly synchronizes on setView\n        for (Integer k : setView) {\n            // . . .\n        }\n    }\n}\n``` \n代码创建了一个HashMap对象和两个视图对象：一个空的HashMap同步视图，这个空的HashMap视图被`mapView`数据成员封装；另一个是被`setView`数据成员封装的`mapView`的索引视图。这个HashMap对象是不可访问的，但`mapView`可以通过公有的`getMap()`方法访问。因为同步的语句使用了`setView`的内在锁而不是`mapView`的，另一个线程可以修改这个同步的map且使k迭代器失效。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\nprivate final Map<Integer, String> mapView = Collections.synchronizedMap(new HashMap<Integer, String>());\nprivate final Set<Integer> setView = mapView.keySet();\n\npublic Map<Integer, String> getMap() {\n    return mapView;\n}\n\npublic void doSomething() {\n    synchronized (mapView) { // Synchronize on map, rather than set\n        for (Integer k : setView) {\n            // . . .\n        }\n    }\n}\n```\n这个代码基于`mapView`字段实现了同步，在map的底层结构中，它在迭代过程中是不能改变的。"
    Advice_En: ''
    References:
      Reference: []
