    Description: "规范说明：如果用户有能力使用结构化XML文档作为输入，那么他能够通过在数据字段中插入XML标签来重写这个XML文档的内容。XML解析器会将这些标签按照正常标签进行解析。下面是一段在线商店的XML代码，主要用于查询后台数据库。  \n```xml\n<item>\n\t<description>Widget</description>\n\t<price>500.0</price>\n\t<quantity>1</quantity>\n</item>\n```\n恶意用户可以在<quantity>元素中输入以下字符串：1</quantity><price>1.0</price><quantity>1  \n会生成以下的XML文档：  \n```xml\n<item>\n\t<description>Widget</description>\n\t<price>500.0</price>\n\t<quantity>1</quantity><price>1.0</price><quantity>1</quantity>\n</item>  \n```\n通过使用简单的API解析器（`org.xml.sax and javax.xml.parsers.SAXParser`）可以解析该XML文件，如果解析XML的代码获取的是最后一个元素`<price>`的值，那么商品价格就被设置为1.0。  \n对于预防XML注入的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic class OnlineStore {\n    private static void createXMLStreamBad(final BufferedOutputStream outStream, final String quantity)\n            throws IOException {\n        String xmlString = \"<item>\\n<description>Widget</description>\\n\" + \"<price>500</price>\\n\" + \"<quantity>\"\n                + quantity + \"</quantity></item>\";\n        outStream.write(xmlString.getBytes());\n        outStream.flush();\n    }\n}\n```  \n上面的代码样例中，一个方法简单的使用了字符串拼接来创建一个XML查询，然后将其发送到服务器。在这时就有可能出现XML注入问题，因为这个方法没有进行任何输入验证。  \n当XML可能已经载入还未处理的输入数据时，一般情况下使用XML模板或者DTD验证XML。如果还没有创建这样的XML字符串，那么应在创建XML之前处理输入，这种方式性能较高。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2（输入验证）**：  \n```java\npublic class OnlineStore {\n    private static void createXMLStream(final BufferedOutputStream outStream, final String quantity)\n            throws IOException, NumberFormatException {\n        // Write XML string only if quantity is an unsigned integer (count).\n        int count = Integer.parseUnsignedInt(quantity);\n        String xmlString = \"<item>\\n<description>Widget</description>\\n\" + \"<price>500</price>\\n\" + \"<quantity>\"\n                + count + \"</quantity></item>\";\n        outStream.write(xmlString.getBytes());\n        outStream.flush();\n    }\n}\n```  \n代码的解决方案是验证`quantity`是一个无符号整数。"
