        value: A.3.1.2 比较类而不是类名
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：在JVM中，如果两个类可以被同一个类装载器装载，并且拥有相同的全名，那么这两个类被认为是相同的类（并且具有相同的类型）。  \n如果一个受保护的资源的访问是需要授权的，而该授权是基于类名的比较，如果攻击者提供一个完全与目标类全名相同的恶意类，那么攻击者就能访问到受保护的资源。仅仅使用类的名称来比较类，会允许恶意类绕过安全检查并且获得受保护的资源。  \n对于比较类而不是类名的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nif (auth.getClass().getName().equals(\"com.application.auth.DefaultAuthenticationHandler\")) {  \n  // . . .访问受保护资源的代码  \n}  \n```\n比较两个类是否相同的时候，应该比较两个类对象。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\n// Determine whether object auth has required/expected class name  \nif(auth.getClass()==this.getClass().getClassLoader().loadClass(\"com.application.auth. DefaultAuthenticationHandler\")) {  \n   // . . .访问受保护资源的代码  \n} \n```\n上述示例中，使用`class`来比较两个类是否相同。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 486:Comparison of Classes by Name
      - type: CERT
        value: OBJ09-J:Compare classes and not class names
