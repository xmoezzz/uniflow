    Description: "规范说明：方法返回值通常可以知道方法的执行结果，如果忽略了方法返回值，就难以知道方法的执行结果，特别是调用该方法的代码中没有进行适当处理，可能会导致不可预期的结果，尤其是方法执行类似权限校验的操作，甚至会导致安全风险。所以，程序必须重视方法的返回值。  \n对于不要忽略方法返回值的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic void deleteFile() {\n    File someFile = new File(\"someFileName.txt\");\n    // do something with someFile\n    someFile.delete();\n}\n```  \n代码中调用了`File.delete()`方法用来删除一个文件，但是不确认文件是否删除成功。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\npublic void deleteFile() {\n    File someFile = new File(\"someFileName.txt\");\n    // do something with someFile\n    if (!someFile.delete()) {\n        // handle failure to delete the f ile\n    }\n}\n```\n代码对`delete()`方法的boolean返回值进行检查，并且对没有删除成功的情况进行处理。"
