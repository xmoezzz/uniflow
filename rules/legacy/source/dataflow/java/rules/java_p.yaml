    Description: "规范说明：在安全性要求较高的系统中，不应使用被业界公认不安全的哈希算法（如MD2、MD4、MD5、SHA、SHA1等)来保证数据的完整性。  \n对于避免使用不安全的哈希算法的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\n...   \nbyte[] b = str.getBytes();   \nMessageDigest md = null;   \ntry {   \n    md = MessageDigest.getInstance(\"MD5\");   \n    md.update(b);   \n    ...  \n}catch (NoSuchAlgorithmException e){  \n    ...  \n}  \n...\n```  \n以上代码片段中，采用MD5算法来保证数据的完整性。"
