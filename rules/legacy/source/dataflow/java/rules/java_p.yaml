        value: A.3.2.7 不要使用实例锁来保护共享静态数据
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：程序不应该使用实例锁来保护共享静态数据，原因在于实例锁在两个或者多个实例的情况下是无效的。因此，如果不使用一个静态的锁对象，会导致共享状态在并发进入时是不被保护的。  \n对于不要使用实例锁来保护共享静态数据的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic final class CountBoxes implements Runnable {  \n    private static volatile int counter;\n    // . . .\n    private final Object lock = new Object();\n\n    @Override\n    public void run() {\n        synchronized (lock) {\n            counter++;\n            // . . .\n        }\n    }\n\n    public static void main(String[] args) {\n        for (int i = 0; i < 2; i++) {\n            new Thread(new CountBoxes()).start();\n        }\n    } \n}\n```  \n代码通过一个非静态的锁对象来保护静态`counter`字段的进入。当启动两个Runnable任务时，它们创建了两个锁对象实例，并且分别基于每一个实例进行锁定。然而，这个代码不能防止线程得到一个不一致的`counter`的数值，这是因为volatile字段的递增操作不是原子性的。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\npublic class CountBoxes implements Runnable {  \n    private static int counter;\n    // . . .\n    private static final Object lock = new Object();\n\n    public void run() {\n        synchronized (lock) {\n            counter++;\n            // . . .\n        }\n    }\n    // . . .\n}\n```  \n代码通过静态对象实现的锁来保证递增操作的原子性。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 667:Improper Locking
