    Description: "规范说明：`createSocket(InetAddress addr,int port)`方法和`createSocket(InetAddress addr,int port,InetAddress localaddr,int localport)`方法不执行主机名验证，`getInsecure(int handshakeTimeoutMillis,SSLSessionCache cache)`方法返回socket工厂实例，其所有的SSL安全检查都会被禁用。应用程序中调用这些方法易受到to-man-in-the-middle攻击。  \n对于避免使用不安全的SSLSocket，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nSSLCertificateSocketFactory sslCertificateSocketFactory = (SSLCertificateSocketFactory)SSLCertificateSocketFactory.getDefault(0);  \nSSLSocket sslSocket = sslCertificateSocketFactory.createSocket(inetAddress,port);\n```  \n上述代码中SSLCertificateSocketFactory使用`createSocket (InetAddress addr,int port)`方法获取SSLSocket。"
    Description_En: ''
    Advice: "由于在断开SSL连接上进行的通信可能会泄漏用户信息，因此应用程序不应放弃SSL验证检查。采用`createSocket(Socket k,String host,int port,boolean close)`方法，以主机和端口号作为参数建立安全SSL连接。若一定要使用`createSocket()`方法、`createSocket(InetAddress addr,int port)`方法或`createSocket(InetAddress addr,int port,InetAddress localaddr,int localport)`方法，应验证服务器标识，避免受到to-man-in-the-middle攻击。"
