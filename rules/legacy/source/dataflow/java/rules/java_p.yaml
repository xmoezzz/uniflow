    Description: "规范说明：一个在任何线程中没有被释放的锁会阻止其他线程得到这个锁。在发生异常条件的情况下，线程必须释放当前持有的锁。如果在异常条件下释放锁失败，会导致线程饥饿或死锁。  \n对于在异常时保证释放已持有的锁的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic final class Client {  \n    public void doSomething(File file) {\n        final Lock lock = new ReentrantLock();\n        InputStream in = null;\n        try {\n            lock.lock();\n            in = new FileInputStream(file);\n            // Perform operations on the open file\n            lock.unlock();\n        } catch (FileNotFoundException x) {\n            // Handle exception\n        } finally {\n            if (in != null) {\n                try {\n                    in.close();\n                } catch (IOException x) {\n                    // Handle exception\n                }\n            }\n        }\n    } \n}\n```  \n代码使用了ReentrantLock来保护资源，当打开的文件进行操作而发生异常时，却不能释放持有的锁。当发生异常时，控制权会移交给catch代码块，并且`unlock()`方法不会执行。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\npublic final class Client {  \n    public void doSomething(File file) {\n        final Lock lock = new ReentrantLock();\n        InputStream in = null;\n        try {\n            lock.lock();\n            in = new FileInputStream(file);\n            // Perform operations on the open file\n            lock.unlock();\n        } catch (FileNotFoundException x) {\n            // Handle exception\n        } finally {\n            lock.unlock();\n            if (in != null) {\n                try {\n                    in.close();\n                } catch (IOException x) {\n                    // Handle exception\n                }\n            }\n        }\n    } \n}\n```  \n代码使用了ReentrantLock来保护资源，当打开的文件进行操作而发生异常或不发生异常时，程序都会走到finally代码块，`lock.unlock()`方法执行，可成功释放持有的锁。"
