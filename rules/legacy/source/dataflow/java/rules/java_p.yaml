      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：当一个依赖于基类提供线程安全的客户无意中对子类的实例进行操作时，如果使用对并发不安全的方法来覆写线程安全的方法，会导致不恰当的同步。比如，如果子类提供了对并发操作不安全的实现，那么可能会违反一个被覆写的同步方法的合约。这样的覆写很容易造成难以诊断的错误。因此，程序禁止使用非并发安全的方法来覆写线程安全方法。  \n对于不要使用非线程安全方法来覆写线程安全方法的情况，示例1给出了不规范用法（java语言）示例。  \n示例1（同步方法）：  \n```java\nclass Base {\n    public synchronized void doSomething() {\n        // ...\n    }\n}\n\nclass Derived extends Base {\n    @Override\n    public void doSomething() {\n        // ...\n    }\n}\n```  \n这个不符合规范的代码示例在Derived类中使用了一个非同步的方法覆写了Base类中的同步方法`doSomething`。  \nBase类中的`doSomething()`方法可以安全的被多个线程使用，但这并不适用于Derived子类的实例。  \n因为接受Base实例的线程同时也接受它的子类的实例，所以可能很难诊断这个程序的错误。因此，客户可能不会意识到他们是在对继承了线程安全的类的非线程安全的子类实例进行操作。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n示例2（同步方法）：  \n```java\nclass Base {\n    public synchronized void doSomething() {\n        // ...\n    }\n}\n\nclass Derived extends Base {\n    @Override\n    public synchronized void doSomething() {\n        // ...\n    }\n}\n``` \n这个符合规范的方案同步了基类中的`doSomething()`方法。"
    Advice_En: ''
    References:
      Reference:
      - type: CERT
        value: TSM00-J:Do not override thread-safe methods with methods that are not thread-safe
