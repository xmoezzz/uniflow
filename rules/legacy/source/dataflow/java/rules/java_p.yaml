    Description: "规范说明：Java中每一个线程在创建时都赋予了一个线程组。这些线程组是由`java.lang.ThreadGroup`类来实现的。如果没有明确的指定线程组的名字，JVM会分配一个默认的主线程组。ThreadGroup类提供了针对属于同一个线程组的线程进行同时操作的便利方法。但是ThreadGroup类中很多方法是不提倡使用的，如：`allowThreadSuspension()、resume()、stop()、suspend()`，而且有些方法不是线程安全的，如：`activeCount()、enumerate()`。使用ThreadGroup API中的某些方法（如：`allowThreadSuspension()、resume()、stop()、suspend()`、`activeCount()、enumerate()`）可能会导致竞态、内存泄漏，以及不一致的对象状态。  \n 对于不要调用ThreadGroup方法的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic int docreate(ThreadGroup tg) {\n    int alive = tg.activeCount();\n    return alive;\n}\n```  \n代码调用了`ThreadGroup.activeCount()`方法，该方法在API中描述为返回线程组中活跃线程数的一个估计值，该方法可能不能正确的反应线程组中那些正在运行的线程的数量。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\npublic final class NetworkHandler {  \n    private final ExecutorService executor;\n\n    NetworkHandler(int poolSize) {  \n        this.executor = Executors.newFixedThreadPool(poolSize);  \n    }\n\n    public void startThreads() {\n        for (int i = 0; i < 3; i++) {\n            executor.execute(new HandleRequest());\n        }\n    }\n\n    public void shutdownPool() {\n        executor.shutdown();\n    }\n\n    public static void main(String[] args) {\n        NetworkHandler nh = new NetworkHandler(3);\n        nh.startThreads();\n        nh.shutdownPool();\n    }  \n}\n```  \n代码使用了一个固定的线程池来管理它的3个线程，而不是采用ThreadGroup。接口`java.util.concurrent.ExecutorService`提供了管理线程池的方法。虽然这个接口没有提供方法来获取活跃线程的数量或是进行线程列举，但是逻辑上的分组可以有助于全局化管理线程组。如：代码中`shutdownPool()`方法可以终止属于同一线程组的所有线程。"
    Advice_En: ''
