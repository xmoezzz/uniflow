    Description: "规范说明：当进行SSL连接时，服务器身份验证处于禁用状态。在某些使用SSL连接的库中，默认情况下不验证服务器证书。这相当于信任所有证书。  \n对SSL连接时要进行服务器身份验证的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nSimpleEmail email = new SimpleEmail();  \nemail.setHostName(\"smtp.testemail.com\");  \nemail.setCharset(\"UTF-8\");  \nemail.setSmtpPort(25);  \nemail.setAuthenticator(new DefaultAuthenticator(name, pwd));  \nemail.setSSLOnConnect(true);  \nemail.setFrom(\"test@163.com\");  \nemail.setSubject(\"测试主题\");  \nemail.setMsg(\"邮件内容)\");  \nemail.addTo(\"admin@163.com\");  \nemail.send();\n```  \n上述代码片段没有明确地验证服务器证书。  \n当尝试连接到`smtp.testemail.com:25`时，此应用程序将随时接受颁发给`“hackedserver.com”`的证书。此时，当服务器被黑客攻击发生SSL连接中断时，应用程序可能会泄漏用户敏感信息。  \n当进行SSL连接时，应该进行服务器验证检查。根据所使用的库，验证服务器身份并建立安全的SSL连接。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：   \n```java\nSimpleEmail email = new SimpleEmail();  \nemail.setHostName(\"smtp.testemail.com\");  \nemail.setCharset(\"UTF-8\");  \nemail.setSmtpPort(25);  \nemail.setAuthenticator(new DefaultAuthenticator(name, pwd));  \nemail.setSSLCheckServerIdentity(true);  \nemail.setSSLOnConnect(true);  \nemail.setFrom(\"test@163.com\");  \nemail.setSubject(\"测试主题\");  \nemail.setMsg(\"邮件内容)\");  \nemail.addTo(\"admin@163.com\");  \nemail.send();\n```  \n上述代码示例中，明确验证服务器证书。"
