        value: A.2.1.1.3 从ZipInputStream安全解压文件
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：对`java.util.ZipInputStream`的输入进行检查可以防止消耗过多的系统资源。解压一个文件，比如zip、gif或者gzip编码的HTTP内容，可能会消耗过多的资源，并且在压缩率极高的情况下，可能会导致zip炸弹的出现。  \n对于从ZipInputStream安全解压文件的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nstatic final int BUFFER = 512;\n// ...\n\npublic final void unzip(String filename) throws java.io.IOException {\n    FileInputStream fis = new FileInputStream(filename);\n    ZipInputStream zis = new ZipInputStream(new BufferedInputStream(fis));\n    ZipEntry entry;\n    try {\n        while ((entry = zis.getNextEntry()) != null) {\n            System.out.println(\"Extracting: \" + entry);\n            int count;\n            byte data[] = new byte[BUFFER];\n            // Write the files to the disk\n            FileOutputStream fos = new FileOutputStream(entry.getName());\n            BufferedOutputStream dest = new BufferedOutputStream(fos, BUFFER);\n            while ((count = zis.read(data, 0, BUFFER)) != -1) {\n                dest.write(data, 0, count);\n            }\n            dest.flush();\n            dest.close();\n            zis.closeEntry();\n        }\n    } finally {\n        zis.close();\n    }\n}\n```  \n这个不规范的代码示例没有检查解压一个文件时所消耗的资源。它会允许操作持续进行直至完成，或者直至本地资源耗尽为止。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。 \n**示例2**：  \n```java\nstatic final int BUFFER = 512;\nstatic final int TOOBIG = 0x6400000; // Max size of unzipped data, 100MB\nstatic final int TOOMANY = 1024; // Max number of files\n// ...\n\nprivate String validateFilename(String filename, String intendedDir) throws java.io.IOException {\n    File f = new File(filename);\n    String canonicalPath = f.getCanonicalPath();\n\n    File iD = new File(intendedDir);\n    String canonicalID = iD.getCanonicalPath();\n\n    if (canonicalPath.startsWith(canonicalID)) {\n        return canonicalPath;\n    } else {\n        throw new IllegalStateException(\"File is outside extraction target directory.\");\n    }\n}\n\npublic final void unzip(String filename) throws java.io.IOException {\n    FileInputStream fis = new FileInputStream(filename);\n    ZipInputStream zis = new ZipInputStream(new BufferedInputStream(fis));\n    ZipEntry entry;\n    int entries = 0;\n    long total = 0;\n    try {\n        while ((entry = zis.getNextEntry()) != null) {\n            System.out.println(\"Extracting: \" + entry);\n            int count;\n            byte data[] = new byte[BUFFER];\n            // Write the files to the disk, but ensure that the filename is valid,\n            // and that the file is not insanely big\n            String name = validateFilename(entry.getName(), \".\");\n            if (entry.isDirectory()) {\n                System.out.println(\"Creating directory \" + name);\n                new File(name).mkdir();\n                continue;\n            }\n            FileOutputStream fos = new FileOutputStream(name);\n            BufferedOutputStream dest = new BufferedOutputStream(fos, BUFFER);\n            while (total + BUFFER <= TOOBIG && (count = zis.read(data, 0, BUFFER)) != -1) {\n                dest.write(data, 0, count);\n                total += count;\n            }\n            dest.flush();\n            dest.close();\n            zis.closeEntry();\n            entries++;\n            if (entries > TOOMANY) {\n                throw new IllegalStateException(\"Too many files to unzip.\");\n            }\n            if (total > TOOBIG) {\n                throw new IllegalStateException(\"File being unzipped is too big.\");\n            }\n        }\n    } finally {\n        zis.close();\n    }\n}\n``` \n在这个规范的代码示例中，代码在提取条目之前验证每个条目的名称。如果名称无效，那么整个提取就会被中止。while循环中的代码将判断zip归档中每个条目的文件大小，同时提取条目。如果提取的条目太大，在本例中为100MB，则会抛出异常。代码不要使用`ZipEntry.getSize()`方法, 因为攻击者可以伪造ZIP文档中未压缩的文件的大小。最后，代码还计算压缩包中文件条目的数量，如果超过1024个条目，则抛出异常。"
