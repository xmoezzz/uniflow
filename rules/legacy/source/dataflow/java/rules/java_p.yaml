        value: A.3.1.3 确保可变对象的引用没有被泄露
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：不要将可变对象的引用暴露给客户端代码。永远不要可变对象字段初始化到客户端提供的对象引用，或者从访问器返回对象引用。暴露一个公共静态final对象允许客户修改对象的内容(尽管它们不能改变对象本身，因为它是final的)。  \n对于确保可变对象的引用没有被泄露的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic static final SomeType [] SOMETHINGS = { ... };\n``` \n不规范的代码中， `SOMETHINGS`中数组的值可以被客户端的代码修改。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\nprivate static final SomeType [] SOMETHINGS = { ... };  \npublic static final SomeType [] somethings() {  \n    return SOMETHINGS.clone();  \n}\n```  \n在上面规范的代码中，数组的值不能被客户端修改。"
    Advice_En: ''
