    Description: "规范说明：拒绝服务是攻击者通过极度消耗应用资源，以致程序崩溃或其他合法用户无法进行使用的一种攻击方式。  \n对于避免拒绝服务攻击的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：   \n```java\nFileInputStream fileInputStream = new FileInputStream(file);  \nfileInputStream.read(bytes, 0, length);  \n...\n```  \n上述代码片段中，攻击者控制了输入流的长度length，当文件足够大和length足够长时，会导致DOS攻击。拒绝服务攻击是一种滥用资源性的攻击。从程序源代码角度讲，对涉及到系统资源的外部数据应该进行严格校验，防止无限制的输入。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\nstatic final int MAX = 0x3200000; // 50MB\n// ...\n// write the files to the disk, but only if file is not insanely big\nif (file.length > MAX) {\n    throw new IllegalStateException(\"File is huge.\");\n}\nFileOutputStream fos = new FileOutputStream(file_name);\nbop = new BufferedOutputStream(fos, SIZE);\nwhile ((count = fileInputStream.read(bytes)) != -1) {\n    bop.write(bytes, 0, count);\n}\n```  \n上述代码片段中，对文件大小进行检验，并不设置读取长度。"
