    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：非final对象意味着此对象可修改，基于可能被修改的对象进行同步，可能会导致死锁和不确定的行为。  \n对于不要基于非final对象进行同步的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：   \n```java\npublic Object lock = new Object();  \npublic void doSomething() {  \n    synchronized (lock) {  \n        // ...  \n    }  \n}\n```  \n上述代码片段中锁定了一个非final的对象。当程序中创建Object对象，并将此对象赋给`lock`，这将导致这个新的Object对象控制锁对象。  \n程序中应使用private、final的Object对象作为锁对象。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n  **示例2**：   \n```java\nprivate final Object lock = new Object();  \npublic void doSomething() {  \n    synchronized (lock) {  \n        // ...  \n    }  \n}\n```  \n上述代码使用了private、final的Object对象作为锁对象。"
    Advice_En: ''
    References:
