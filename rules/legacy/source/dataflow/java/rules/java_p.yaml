        value: A.3.1.6 不要增加可被覆写方法和被隐藏方法的可访问性
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：如果增加了被覆写方法和被隐藏方法的可访问性，恶意子类将拥有这些受限制的方法更大的访问权限。因此，程序只能在必要的时候对方法进行覆写，并且必须尽可能的将方法声明为final以避免恶意扩展。如果不能将方法声明为final的，程序必须防止增加被覆写方法的访问性。扩展允许弱化可访问性的限制，这会危及Java应用的安全性。  \n对于不要增加可被覆写方法和被隐藏方法的可访问性的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nclass Super {\n    protected void doLogic() {\n        System.out.println(\"Super invoked\");\n    }\n}\n\npublic class Sub extends Super {\n    public void doLogic() {\n        System.out.println(\"Sub invoked\");\n        // Do sensitive operations\n    }\n}\n```  \n对于实现了`java.lang.Cloneable`接口的类，应该将方法`Object.clone()`的可访问性增加为public。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\nclass Super {\n    protected final void doLogic() {\n        System.out.println(\"Super invoked\");\n    }\n}\n```  \n声明方法为final的。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 487:Reliance on Package-level Scope
