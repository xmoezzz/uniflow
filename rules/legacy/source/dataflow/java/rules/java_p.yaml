        value: A.2.1.1.5 不要信任隐藏字段的内容
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：HTML允许web表单中的字段可见或隐藏。隐藏字段向web服务器提供值，但不应被用户修改其内容。但是，攻击者仍然可以通过特殊方式来修改隐藏字段。  \n对于不信任隐藏字段的内容的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic class SampleServlet extends HttpServlet {\n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        response.setContentType(\"text/html\");\n        PrintWriter out = response.getWriter();\n        out.println(\"<html>\");\n        String visible = request.getParameter(\"visible\");\n        String hidden = request.getParameter(\"hidden\");\n        if (visible != null || hidden != null) {\n            out.println(\"Visible Parameter:\");\n            out.println(sanitize(visible));\n            out.println(\"<br>Hidden Parameter:\");\n            out.println(hidden);\n        } else {\n            out.println(\"<p>\");\n            out.print(\"<form action=\\\"\");\n            out.print(\"SampleServlet\\\" \");\n            out.println(\"method=POST>\");\n            out.println(\"Parameter:\");\n            out.println(\"<input type=text size=20 name=visible>\");\n            out.println(\"<br>\");\n            out.println(\"<input type=hidden name=hidden value=\\'a benign value\\'>\");\n            out.println(\"<input type=submit>\");\n            out.println(\"</form>\");\n        }\n    }\n\n    public void doPost(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        doGet(request, response);\n    }\n\n    // Filter the specified message string for characters\n    // that are sensitive in HTML.\n    public static String sanitize(String message) {\n        // ...\n    }\n}\n```\n上面代码演示了一个servlet，它接受一个可见的字段和一个隐藏的字段，并将其返回给用户。在传递给浏览器之前，可见的参数是经过验证处理的，但是隐藏的字段没有验证。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n当输入参数`param1`时，web页面将显示以下内容: \n```\nVisible Parameter: param1  \nHidden Parameter: a benign value \n``` \n但是，攻击者可以通过在URL中编码来为隐藏参数提供一个值，如下:  \n`http://localhost:8080/sample/SampleServlet?visible=dummy&hidden=%3Cfont%20color=red%3ESurprise%3C/font%3E!!!`  \n当这个URL被提供给浏览器时，浏览器会显示: \n``` \nVisible Parameter: dummy   \nHidden Parameter: Surprise!!!  \n``` \n**示例2**： \n```java \npublic class SampleServlet extends HttpServlet {\n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        response.setContentType(\"text/html\");\n        PrintWriter out = response.getWriter();\n        out.println(\"<html>\");\n\n        String visible = request.getParameter(\"visible\");\n        String hidden = request.getParameter(\"hidden\");\n\n        if (visible != null || hidden != null) {\n            out.println(\"Visible Parameter:\");\n            out.println(sanitize(visible));\n            out.println(\"<br>Hidden Parameter:\");\n            out.println(sanitize(hidden)); // Hidden variable sanitized\n        } else {\n            out.println(\"<p>\");\n            out.print(\"<form action=\\\"\");\n            out.print(\"SampleServlet\\\" \");\n            out.println(\"method=POST>\");\n            out.println(\"Parameter:\");\n            out.println(\"<input type=text size=20 name=visible>\");\n            out.println(\"<br>\");\n\n            out.println(\"<input type=hidden name=hidden value=\\'a benign value\\'>\");\n            out.println(\"<input type=submit>\");\n            out.println(\"</form>\");\n        }\n    }\n\n    public void doPost(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        doGet(request, response);\n    }\n\n    // Filter the specified message string for characters\n    // that are sensitive in HTML.\n    public static String sanitize(String message) {\n        // ...\n    }\n}\n```\n上面代码片段对隐藏字段进行净化，因此，当恶意URL进入浏览器时，servlet产生以下内容:\n```  \nVisible Parameter: dummy   \nHidden Parameter: <font color=red>Surprise</font>!!!\n```"
