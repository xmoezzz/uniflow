    Description: "规范说明：`Object.wait()`方法会暂时放弃所拥有的锁，这让其他线程可以有机会得到锁并继续执行。 `Object.wait()`方法通常会在同步代码块及方法中调用。等待的线程只有在它接到通知后才会恢复执行，不管是在调用`wait()`之前还是之后，while循环都是检查等候条件的最好方式。类似Condition接口中的`await()`方法也必须是在循环中调用。违反该条准则可能会导致无限期的阻塞，导致拒绝服务漏洞。  \n对于始终在循环中调用`wait()`和`await()`方法的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nprivate Vector vector;\n\npublic void consumeElement() throws InterruptedException {\n    synchronized (vector) {\n        if (vector.isEmpty()) {\n            vector.wait();\n        }\n        // Resume when condition holds\n    }\n}\n```"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。   \n**示例2**：  \n```java\nprivate Vector vector;\n\npublic void consumeElement() throws InterruptedException {\n    synchronized (vector) {\n        while (vector.isEmpty()) {\n            vector.wait();\n        }\n        // Resume when condition holds\n    }\n}\n```"
    Advice_En: ''
