    Description: "规范说明： `Thread.stop()`方法会导致线程抛出一个ThreadDeath异常，通常会停止线程。调用`Thread.stop()`会使得一个线程释放它获得的所有锁，这有可能暴露这些锁保护的对象，而这些对象正处于一个不一致的状态中。线程可以捕获ThreadDeath异常，并使用finally来尝试修复处于不一致的状态对象。  \n对于确保可以终止受阻线程的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic final class Container implements Runnable {\n    private final Vector<Integer> vector = new Vector<Integer>(1000);\n\n    public Vector<Integer> getVector() {\n        return vector;\n    }\n\n    @Override\n    public synchronized void run() {\n        Random number = new Random(123L);\n        int i = vector.capacity();\n        while (i > 0) {\n            vector.add(number.nextInt(100));\n            i--;\n        }\n    }\n\n    public static void main(String[] args) throws InterruptedException {\n        Thread thread = new Thread(new Container());\n        thread.start();\n        Thread.sleep(5000);\n        thread.stop();\n    }\n}\n```\nVector类是线程安全的，所以多个线程对共享实例进行的操作时不会让其处于一个不一致的状态的。vector实例是使用自身的隐含锁来防止在实例状态暂时不一致时其他线程对它的访问。然而，`Thread.stop()`方法会造成线程停止正在进行的操作并抛出一个ThreadDeath异常。所有获得的锁则会被释放。如果线程是在加入一个新的整数至vector时被停止，就有可能导致访问处于不一致状态的vector。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\npublic final class Container implements Runnable {\n    private final Vector<Integer> vector = new Vector<Integer>(1000);\n\n    public Vector<Integer> getVector() {\n        return vector;\n    }\n\n    @Override\n    public synchronized void run() {\n        Random number = new Random(123L);\n        int i = vector.capacity();\n        while (i > 0) {\n            vector.add(number.nextInt(100));\n            i--;\n        }\n    }\n\n    public static void main(String[] args) throws InterruptedException {\n        Thread thread = new Thread(new Container());\n        thread.start();\n        Thread.sleep(5000);\n        thread.interrupt();\n    }\n}\n```\n调用`Thread.interrupt()`方法设置了一个内部的中断状态标志。线程可以通过`Thread.interrupt()`方法来查询这个标志。这个方法会在当前线程被中断时返回true，并会清除中断状态标志。"
    Advice_En: ''
    References:
      Reference:
      - type: CERT
        value: THI05-J:Do not use Thread.stop() to terminate threads
