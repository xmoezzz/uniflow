    Description: "规范说明：java.io包中的PrintStream类包含两个等效的格式化方法：`format()`和`printf()`。System.out和System.err作为PrintStream对象，允许在标准输出和错误流上调用PrintStream方法。当任何转换参数无法匹配相应的格式符时，标准类库的实现将抛出一个相应的异常。虽然抛出异常能降低被恶意利用的可能，但如果将不受信任的数据包含到格式字符串中，则可能会造成信息泄露或拒绝服务。因此，不能在格式字符串中使用非受信来源的字符串。  \n对于从格式化字符串中排除用户输入的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nclass Format {\n    static Calendar c = new GregorianCalendar(1995, GregorianCalendar.MAY, 23);\n\n    public static void main(String[] args) {\n        // args[0] should contain the credit card expiration date\n        // but might contain %1$tm, %1$te or %1$tY format specifiers\n        System.out.format(args[0] + \" did not match! HINT: It was issued on %1$terd of some month\", c);\n    }\n}\n```  \n以上代码在格式字符串中包含不受信任的数据，可能会出现信息泄露问题。  \n在没有适当的输入验证的情况下，攻击者可以通过提供包含`%1$tm`, `%1$te`,或者`%1$tY`格式符的输入字符串来确定输入被验证的日期。在此例中，这些格式符分别打印05（5月），23（日）和1995（年）。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：      \n```java\nclass Format {\n    static Calendar c = new GregorianCalendar(1995, GregorianCalendar.MAY, 23);\n\n    public static void main(String[] args) {\n        // args[0] is the credit card expiration date\n        // Perform comparison with c,\n        // if it doesn't match, print the following line\n        System.out.format(\"%s did not match! HINT: It was issued on %terd of some month\", args[0], c);\n    }\n}\n```  \n以上示例能保证用户产生的输入会被排除在格式化字符串之外。"
