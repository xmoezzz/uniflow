      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：那些实现其中一个或者都实现了在`java.util.concurrent.locks`包中Lock和Condition接口的类，被认为是高层的并发对象。对这样的对象使用内置锁是有问题的，尽管看起来代码的功能是正确的。因此，与这些对象交互的那些程序应该仅仅使用由接口提供的锁，而不允许使用内置锁。  \n对于不要基于高层并发对象的内置锁来实现同步的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nprivate final Lock lock = new ReentrantLock();  \npublic void doSomething() {  \n    synchronized (lock) {  \n        // . . .  \n    }  \n}\n```  \n这个代码中，基于ReentrantLock的内置锁实现同步，对这样的对象使用内置锁是有问题的。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：使用lock()和unlock()  \n```java\nprivate final Lock lock = new ReentrantLock();  \npublic void doSomething() {  \n    lock.lock()  \n    try{  \n        // do something  \n    }finally{  \n        lock.unlock()  \n    }  \n}\n```  \n这个代码中，基于被ReentrantLock封装的可重入的互斥锁实现同步。"
