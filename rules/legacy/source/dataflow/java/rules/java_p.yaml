    Description: "规范说明：异常是为了中断预期外的应用程序流程。例如，在try程序段中，不会执行在异常抛出之后的表达式或语句。因此，必须恰当的处理异常。  \n对于不要消除或忽略可检查异常的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\ntry {  \n    //...  \n} catch (IOException ioe) {  \n    //do nothing  \n}\n```  \n对于捕获的异常，需要进行对应的处理，而不是忽略异常，或者消除异常。"
