    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：JavaAPI提供了`java.util.Random`类来实现PRNG。这个PRNG是可移植和可重复的。因此，如果两个`java.util.Random`类的实例使用了相同的种子，会在所有的Java实现中生成相同的数值序列。在应用初始化时，或者在每一次系统重启后，种子常常会被重用。在其他情况下，种子会从系统时钟基于当前的时刻获取。攻击者可以通过对有漏洞的目标系统做探查而获取种子数值，然后可以建立一个查找表来对所有的种子值进行估计。  \n因此，`java.util.Random`不能在安全应用或者在需对敏感数据进行保护的场合使用（如：密码学），应该使用更安全的随机数生成器，比如`java.security.SecureRandom`、`java.util.concurrent.ThreadLocalRandom`类。可预测的随机数序列在像密码学这样的关键应用中会消弱其安全性。  \n对于生成强随机数的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nimport java.util.Random;  \n// ...  \nRandom number = new Random(123L);\n// ...\nfor (int i = 0; i < 20; i++) {\n    // Generate another random integer in the range [0, 20]\n    int n = number.nextInt(21);\n    System.out.println(n);\n}\n```  \n在如上示例中，使用了`java.util.Random`生成随机数。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\nimport java.security.SecureRandom;  \nimport java.security.NoSuchAlgorithmException;  \n// ...\npublic static void main(String args[]) {\n    try {\n        SecureRandom number = SecureRandom.getInstance(\"SHA1PRNG\");\n        // Generate 20 integers 0..20\n        for (int i = 0; i < 20; i++) {\n            System.out.println(number.nextInt(21));\n        }\n    } catch (NoSuchAlgorithmException nsae) {\n        // Forward to handler\n    }\n}\n```  \n在如上示例中，使用了`java.security.SecureRandom`生成随机数。"
    Advice_En: ''
    References:
      Reference:
