    Description: "规范说明：方法禁止抛出RuntimeException、Exception、Throwable。抛出RuntimeException会产生微妙的错误，很少有方法能处理潜在的运行异常，例如，一个调用者不能通过检查异常来判断异常抛出的原因，从而不能进行有效的恢复操作。  \n方法RuntimeException、Exception、Throwable可能掩盖其他异常。  \n对于不要抛出RuntimeException、Exception、Throwable的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nboolean isCapitalized(String s) {\n    if (s == null) {\n        throw new RuntimeException(\"Null String\");\n    }\n    if (s.equals(\"\")) {\n        return true;\n    }\n    String first = s.substring(0, 1);\n    String rest = s.substring(1);\n    return (first.equals(first.toUpperCase()) && rest.equals(rest.toLowerCase()));\n}\n```  \n方法可以抛出继承自RuntimeException、Exception的明确异常。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n抛出明确的NullPointerException()。 \n```java \nboolean isCapitalized(String s) {\n    if (s == null) {\n        throw new NullPointerException();\n    }\n    if (s.equals(\"\")) {\n        return true;\n    }\n    String first = s.substring(0, 1);\n    String rest = s.substring(1);\n    return (first.equals(first.toUpperCase()) && rest.equals(rest.toLowerCase()));\n}\n```"
