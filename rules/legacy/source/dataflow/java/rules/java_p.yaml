    Description: "规范说明：notify()方法只唤醒一个线程，而并不保证哪一个线程会接到通知。如果没有满足等候条件，那么选中的线程会继续等待，这通常违背了通知的目的。另外，`Condition.signal()`和`Condition.signalAll()`方法唤醒在调用`Condition.await()`时受阻线程的原理也与`Object.notify()`和`Object.notifyAll()`方法相同。  \n对于通知所有等待中的线程而不是单一的线程的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic final class ProcessStep implements Runnable {  \n    private static final Object lock = new Object();\n    private static int time = 0;\n    private final int step; // Perform operations when field time\n    // reaches this value\n\n    public ProcessStep(int step) {  \n        this.step = step;  \n    }\n\n    @Override\n    public void run() {\n        try {\n            synchronized (lock) {\n                while (time != step) {\n                    lock.wait();\n                }\n                // Perform operations\n                time++;\n                lock.notify();\n            }\n        } catch (InterruptedException ie) {\n            Thread.currentThread().interrupt(); // Reset interrupted status\n        }\n    }\n\n    public static void main(String[] args) {\n        for (int i = 4; i >= 0; i--) {\n            new Thread(new ProcessStep(i)).start();\n        }\n    } \n}\n```  \n这个代码演示了一个由多线程执行的复杂的多步过程。每一个线程的执行由`time`字段决定步骤。线程会等待`time`字段的指示，来确定是否执行对应线程的步骤。在执行任务后，每一个线程先是增加`time`，然后再通知负责下一个步骤的线程。但是，每一个线程拥有不同的等候条件，`Object.notify()`每次只唤醒一个线程。除非正好唤醒执行下一个步骤的线程，否则这个程序会发生死锁。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\npublic final class ProcessStep implements Runnable {  \n    private static final Object lock = new Object();\n    private static int time = 0;\n    private final int step; // Perform operations when field time\n    // reaches this value\n\n    public ProcessStep(int step) {  \n        this.step = step;  \n    }\n\n    @Override\n    public void run() {\n        try {\n            synchronized (lock) {\n                while (time != step) {\n                    lock.wait();\n                }\n                // Perform operations\n                time++;\n                lock.notifyAll(); // Use notifyAll() instead of notify()\n            }\n        } catch (InterruptedException ie) {\n            Thread.currentThread().interrupt(); // Reset interrupted status\n        }\n    } \n}\n```  \n代码中每一个限制在完成它自己的步骤后调用`Object.notifyAll()`方法来通知所有等待中的线程，准备好的线程可以执行它的任务，而那些其他等待条件为假的线程则会继续等待。"
    Advice_En: ''
