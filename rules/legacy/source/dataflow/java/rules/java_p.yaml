      - type: SubClassChin
        value: 6.2 并发程序安全
      - type: DetailClassChin
        value: A.3.2.4 不要基于通过getClass()返回的类对象进行同步
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：基于`Object.getClass()`方法的返回值进行同步，会导致不可预期的行为。当类实现继承时，子类会对基类进行锁定。对于子类的Class对象来说，它与其基类的Class对象是完全不同的。  \n对于不要基于通过`getClass()`返回的类对象进行同步的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nclass Base {\n    static DateFormat format = DateFormat.getDateInstance(DateFormat.MEDIUM);\n\n    public Date parse(String str) throws ParseException {\n        synchronized (getClass()) {\n            return format.parse(str);\n        }\n    }\n}\n\nclass Derived extends Base {\n    public Date doSomethingAndParse(String str) throws ParseException {\n        synchronized (Base.class) {\n            // . . .\n            return format.parse(str);\n        }\n    }\n}\n```  \nBase类的方法`parse()`方法会解析一个日期并且直接使用`getClass()`方法返回的对象进行同步。Derived同样继承了`parse()`方法。然而，这个继承方法基于Derived类实现同步，因为继承的`parse()`方法对`getClass()`进行调用，实际上调用的是`this.getClass()`，这个this参数实际上是指向Derived类实例的一个引用。"
    Description_En: ''
    Advice: "示例2 给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\nclass Base {  \n    static DateFormat format = DateFormat.getDateInstance(DateFormat.MEDIUM);  \n    public Date parse(String str) throws ParseException {  \n        synchronized (Base.class) {  \n            return format.parse(str);  \n        }  \n    }  \n}\n```  \n这个代码样例是基于Base.class进行同步，也可使用`Class.forName(\"…\")`进行同步。"
    Advice_En: ''
