    Description: "规范说明：Java servlet提供了一个用于存储会话相关数据的HttpSession类，这些数据被编码在每个web请求中。这个类的使用可以防止跨会话信息泄漏和数据竞争。  \n对于不要在servlet中泄露会话信息的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic class SampleServlet extends HttpServlet {\n\n    private String lastAddr = \"nobody@nowhere.com\";\n\n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        response.setContentType(\"text/html\");\n        PrintWriter out = response.getWriter();\n        out.println(\"<html>\");\n\n        String emailAddr = request.getParameter(\"emailAddr\");\n\n        if (emailAddr != null) {\n            out.println(\"Email Address:\");\n            out.println(sanitize(emailAddr));\n            out.println(\"<br>Previous Address:\");\n            out.println(sanitize(lastAddr));\n        }\n        ;\n\n        out.println(\"<p>\");\n        out.print(\"<form action=\\\"\");\n        out.print(\"SampleServlet\\\" \");\n        out.println(\"method=POST>\");\n        out.println(\"Parameter:\");\n        out.println(\"<input type=text size=20 name=emailAddr>\");\n        out.println(\"<br>\");\n        out.println(\"<input type=submit>\");\n        out.println(\"</form>\");\n\n        lastAddr = emailAddr;\n    }\n\n    public void doPost(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        doGet(request, response);\n    }\n\n    // Filter the specified message string for characters\n    // that are sensitive in HTML.\n    public static String sanitize(String message) {\n        // ...\n    }\n}\n``` \n这个不符合规范的代码示例创建了一个servlet，它会提示用户输入一个电子邮件地址，然后将地址返回给用户。地址存储在`lastAddr`变量,这是一个实例字段。  \n因为HttpServlet类是单例的,每一个客户访问servlet共享一个`lastAddr`字段。因此,`lastAddr`字段的内容可以是一个不同的客户端先前设置的字段。另外，由于这个代码示例缺少线程安全性，因此，`lastAddr`字段可以在两个客户端同时请求该参数时使用一个陈旧的值，保证对一个不可变对象的共享引用的可见性。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n```java\npublic class SampleServlet extends HttpServlet {\n\n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        response.setContentType(\"text/html\");\n        PrintWriter out = response.getWriter();\n        out.println(\"<html>\");\n\n        String emailAddr = request.getParameter(\"emailAddr\");\n        HttpSession session = request.getSession();\n        Object attr = session.getAttribute(\"lastAddr\");\n        String lastAddr = (attr == null) ? \"null\" : attr.toString();\n\n        if (emailAddr != null) {\n            out.println(\"Email Address::\");\n            out.println(sanitize(emailAddr));\n            out.println(\"<br>Previous Email Address::\");\n            out.println(sanitize(lastAddr));\n        }\n        ;\n\n        out.println(\"<p>\");\n        out.print(\"<form action=\\\"\");\n        out.print(\"SampleServlet\\\" \");\n        out.println(\"method=POST>\");\n        out.println(\"Parameter:\");\n        out.println(\"<input type=text size=20 name=emailAddr>\");\n        out.println(\"<br>\");\n        out.println(\"<input type=submit>\");\n        out.println(\"</form>\");\n        session.setAttribute(\"lastAddr\", emailAddr);\n    }\n\n    public void doPost(HttpServletRequest request, HttpServletResponse response)\n            throws IOException, ServletException {\n        doGet(request, response);\n    }\n\n    // Filter the specified message string for characters\n    // that are sensitive in HTML.\n    public static String sanitize(String message) {\n        // ...\n    }\n}\n```\n上面符合规范的代码中，在HttpSession对象中存储的`lastAddr`参数。servlet机制跟踪会话，为客户机提供会话ID，它由客户端浏览器作为cookie存储。会话中的其它信息，包括`lastAddr`属性，由服务器存储。因此，servlet提供了在同一会话中向servlet提交的最后一个电子邮件地址（避免了其他会话请求的竞争条件）。在这个例子中保存数据的临时变量，不会受到竞争条件的危害。"
    Advice_En: ''
    References:
