    Description: "规范说明：在类初始化时启动和使用后台线程，会造成类的初始化循环和死锁。例如，负责类初始化的main线程可能会阻塞并等待后台线程，而后台线程也会等待main线程完成类的初始化。例如，在初始化类的过程中使用后台线程创建数据库连接时。  \n对于不要在初始化类的时候使用后台线程的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\npublic final class ConnectionFactory {\n    private static Connection dbConnection;\n    // Other fields . . .\n    static {\n        Thread dbInitializerThread = new Thread(new Runnable() {\n            @Override\n            public void run() {\n                // Initialize the database connection\n                try {\n                    dbConnection = DriverManager.getConnection(\"connection string\");\n                } catch (SQLException e) {\n                    dbConnection = null;\n                }\n            }\n        });\n        // Other initialization, for example, start other threads\n        dbInitializerThread.start();\n        try {\n            dbInitializerThread.join();\n        } catch (InterruptedException ie) {\n            throw new AssertionError(ie);\n        }\n    }\n\n    public static Connection getConnection() {\n        if (dbConnection == null) {\n            throw new IllegalStateException(\"Error initializing connection\");\n        }\n        return dbConnection;\n    }\n\n    public static void main(String[] args) {\n        // . . .\n        Connection connection = getConnection();\n    }\n}\n```  \n作为类初始化的一部分，静态的初始化方法启动了一个后台线程。这个后台线程尝试创建一个数据库连接，但是它应该等待ConnectionFactory类中所有成员(包括`dbConnection)`完成初始化。后台代码在执行之前必须等待`main`前台线程完成初始化。然后，样例中ConnectionFactory类的`main()`线程调用了`join()`方法，这会等候后台线程的结束。这种相互依赖的关系会造成类初始化的循环，从而导致死锁。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：  \n在`main()`线程初始化所有的成员，而不是从静态的初始化方法中生成一个后台线程。  \n```java\npublic final class ConnectionFactory {\n    private static Connection dbConnection;\n    // Other fields . . .\n    static {\n        // Initialize a database connection\n        try {\n            dbConnection = DriverManager.getConnection(\"connection string\");\n        } catch (SQLException e) {\n            dbConnection = null;\n        }\n        // Other initialization (do not start any threads)\n    }\n    // . . .\n}\n```"
