    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "规范说明：不要在finally块中使用return、break、continue或throw语句。当程序进入带有finally块的try块时，不管try块代码（或catch块代码）是否完成执行，finally程序块总是会执行的。造成finally块程序非正常终止的语句也会导致整个try块非正常终止，从而消除了从try或者catch块抛出的任何异常。  \n对于不要在finally块中非正常退出的情况，示例1给出了不规范用法（java语言）示例。  \n**示例1**：  \n```java\nclass TryFinally {\n    private static boolean doLogic() {\n        try {\n            throw new IllegalStateException();\n        } finally {\n            System.out.println(\"logic done\");\n            return true;\n        }\n    }\n}\n```  \nfinally块中只能存在不会异常终止程序的语句。"
    Description_En: ''
    Advice: "示例2给出了规范用法（java语言）示例。  \n**示例2**：   \n```java\nclass TryFinally {\n    private static boolean doLogic() {\n        try {\n            throw new IllegalStateException();\n        } finally {\n            System.out.println(\"logic done\");\n        }\n    }\n}\n```  \n在finally块中不返回，仅打印`logic done`。"
    Advice_En: ''
    References:
      Reference:
