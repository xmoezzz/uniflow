    Description: "规范说明：Apache Struts2是Apache基金会发布的一款实现了MVC模式的开源框架，广泛应用于 Web开发和大型网站建设。  \n使用了Apache Struts 1插件的Apache Struts 2.3.X版本中存在远程代码执行漏洞（漏洞编号： CNNVD-201706-928，CVE-2017-9791）。该漏洞出现于Struts2的Struts 1插件的`org.apache.struts2.s1.Struts1Action`类中，该类是为了将 Struts1中的Action包装成为Struts2中的 Action ，以保证Struts2的兼容性。在Struts2中的Struts1 插件启用的情况下，远程攻击者可通过使用恶意字段值，构造特定的输入，发送到 ActionMessage类中，从而导致任意命令执行，进而获取目标主机系统权限。"
    Description_En: ''
    Advice: "1.不要启用Struts2-struts1-plugin插件；  \n2.不要使用showcase.war；  \n3.始终使用资源键，而不是将原始消息传递给ActionMessage：  \n建议采用如下方式：  \n```java\nmessages.add(\"msg\", new ActionMessage(\"struts1.gangsterAdded\", gform.getName()));\n```\n禁止采用如下方式：  \n```java\nmessages.add(\"msg\", new ActionMessage(\"Gangster \" + gform.getName() + \" was added\"));\n```"
    Advice_En: ''
