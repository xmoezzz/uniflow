        value: 2017:A5 Broken Access Control
      - type: OWASP TOP 10
        value: 2013:A4 Insecure Direct Object References
      - type: OWASP TOP 10
        value: 2010:A4 Insecure Direct Object References
      - type: OWASP TOP 10
        value: 2007:A4 Insecure Direct Object Reference
      - type: OWASP TOP 10
        value: 2004:A1 Unvalidated Input
      - type: OWASP MOBILE TOP 10
        value: 2014:M8 Security Decisions Via Untrusted Inputs
      - type: CWE/SANS TOP 25
        value: 2019:CWE ID 22
      - type: CWE/SANS TOP 25
        value: 2020:CWE ID 22
      - type: CWE/SANS TOP 25
        value: 2011:Risky Resource Management - CWE ID 22
      - type: CWE/SANS TOP 25
        value: 2010:Risky Resource Management - CWE ID 22
      - type: CWE/SANS TOP 25
        value: 2009:Risky Resource Management - CWE ID 73
