  - id: '02000010160056'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.2 面对对象程序安全
      - type: DetailClassChin
        value: C.6.7 不要在clone()中调用可覆写的方法
    Categories_En:
      Category: []
    BugServerity: 5
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \nclone()方法只能调用 final或 private的方法，即不可覆写的方法。   \n2) 原理   \n在`clone()`方法中调用可覆写的方法是不安全的。首先，一个恶意的子类可以对方法进行覆写并改变`clone()`方法的行为。其次，一个可信任的子类可以观察（并有可能修改）被克隆对象在创建完成之前的某一特定初始化的状态。无论哪一种情况，子类可能是克隆过程、被克隆的物体或两者处于一个不合逻辑的状态。   \n3) 示例   \n    这个不符合规则的代码示例中，有两个类：CloneExample 和 SubCloneExample 类调用可覆写的方法 `doSomething()`。被覆写的方法设置了 cookies 的值，覆写的方法则设置了域名的值。基于多态性的原因，子类 Sub 中 `doSomething()`方法在运行时被错误地执行了两次。第一次调用是发生在`CloneExample.clone()`,另一次是在 `Sub.clone()`。因此，cookies 的值并没有被初始化，而域名却初始化了两次。   \n    ```java\n    class CloneExample implements Cloneable {\n        HttpCookie[] cookies;\n    \n        CloneExample(HttpCookie[] c) {\n            cookies = c;\n        }\n    \n        public Object clone() throws CloneNotSupportedException {\n            final CloneExample clone = (CloneExample) super.clone();\n            clone.doSomething(); // Invokes overridable method\n            clone.cookies = clone.deepCopy();\n            return clone;\n        }\n    \n        void doSomething() { // Overridable\n            for (int i = 0; i < cookies.length; i++) {\n                cookies[i].setValue(\"\" + i);\n            }\n        }\n    \n        HttpCookie[] deepCopy() {\n            if (cookies == null) {\n                throw new NullPointerException();\n            }\n            // deep copy\n            HttpCookie[] cookiesCopy = new HttpCookie[cookies.length];\n            for (int i = 0; i < cookies.length; i++) {\n                // Manually create a copy of each element in array\n                cookiesCopy[i] = (HttpCookie) cookies[i].clone();\n            }\n            return cookiesCopy;\n        }\n    }\n    \n    class Sub extends CloneExample {\n        Sub(HttpCookie[] c) {\n            super(c);\n        }\n    \n        public Object clone() throws CloneNotSupportedException {\n            final Sub clone = (Sub) super.clone();\n            clone.doSomething();\n            return clone;\n        }\n    \n        void doSomething() { // Erroneously executed\n            for (int i = 0; i < cookies.length; i++) {\n                cookies[i].setDomain(i + \".foo.com\");\n            }\n        }\n    \n        public static void main(String[] args) throws CloneNotSupportedException {\n            HttpCookie[] hc = new HttpCookie[20];\n            for (int i = 0; i < hc.length; i++) {\n                hc[i] = new HttpCookie(\"cookie\" + i, \"\" + i);\n            }\n            CloneExample bc = new Sub(hc);\n            bc.clone();\n        }\n    }\n    ```   \n      \n       \n    "
    Description_En: ''
    Advice: "对应的符合规定的解决方案是：将 `doSomething()`和 `deepCopy()`方法声明为 final，从而避免对这些方法的覆写。   \n    ```java\n    class CloneExample implements Cloneable {  \n        final void doSomething() {  \n        // . . .  \n        }  \n        final HttpCookie[] deepCopy() {  \n        // . . .  \n        }  \n        // . . .  \n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CERT
        value: MET06-J:Do not invoke overridable methods in clone()
