    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n不能在格式字符串中使用非受信来源的字符串。   \n2) 原理   \n对Java格式字符串的解释要比对在像C语言这样的语言中更严格。当任何转换参数不能匹配相应的格式符时，标准类库实现会抛出一个相应的异常。这种方法降低了被恶意利用的可能性。然而，恶意用户输入可以利用格式字符串，并且造成信息泄露或者拒绝服务。因此，不能在格式字符串中使用非受信来源的字符串。   \n3) 示例   \n    这个不符合规则的代码示例展示了可能出现信息泄露的问题。它将信用卡的失效日期作为输入参数并将其用在格式字符串中。   \n    ```java\n    class Format {\n        static Calendar c = new GregorianCalendar(1995, GregorianCalendar.MAY, 23);\n    \n        public static void main(String[] args) {\n            // args[0] is the credit card expiration date\n            // args[0] can contain either %1$tm, %1$te or %1$tY as malicious\n            // arguments\n            // First argument prints 05 (May), second prints 23 (day)\n            // and third prints 1995 (year)\n            // Perform comparison with c, if it doesn’t match print the\n            // following line\n            System.out.printf(args[0] + \" did not match! HINT: It was issued on %1$terd of some month\", c);\n        }\n    }\n    ```   \n    如果没有经过正确输入验证，攻击者通过在输入语句中包含以下参数之一：`%1$tm`、 `%1$te`或 `%1$tY`，就可以判断验证中所用来和输入相对比的日期。"
    Description_En: ''
    Advice: "该对应的符合规则的方案能够保证用户产生的输入会被排除在格式字符串之外。   \n    ```java\n    class Format {\n        static Calendar c = new GregorianCalendar(1995, GregorianCalendar.MAY, 23);\n    \n        public static void main(String[] args) {\n            // args[0] is the credit card expiration date\n            // Perform comparison with c,\n            // if it doesn't match print the following line\n            System.out.printf(\"%s did not match! \" + \" HINT: It was issued on %1$terd of some month\", args[0], c);\n        }\n    }\n    ```"
    Advice_En: ''
    References:
