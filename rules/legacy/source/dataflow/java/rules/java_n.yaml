        value: C.7.10 禁止非受信代码终止JVM
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n程序应该尽量避免无意地和恶意地调用 `System.exit()`终止 Java 虚拟机的行为，在被迫终止时，程序应该进行必要的清理操作。   \n2) 原理   \n调用 `system.exit()`会终止 Java 虚拟机（JVM），从而终止所有运行中的程序和线程。这会导致拒绝服务攻击。例如，一个嵌入在 `Java Server Pages(JSP)`中的 `System.exit()`的调用会停止网络服务器，阻碍了对用户的服务。   \n3) 示例   \n    如下不符合规则的代码示例使用 `System.exit()`来强制关闭 JVM 并终止运行中的进程。这个程序没有安全管理器，因此它缺乏检査是否允许调用者使用 `System.exit()`的能力。   \n    ```java\n    public class InterceptExit {   \n        public static void main(String[] args) {   \n            // . . .    \n            System.exit(1); // Abrupt exit   \n            System.out.println(\"This never executes\");   \n        }   \n    }\n    ```   \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：代码设置一个自定义的安全管理器PasswordSecurityManager，并覆写在SecurityManager类中定义的`checkExit()`方法。为实现退出前对清理代码的调用，这一覆写是必须的。  \n    ```java\n    class PasswordSecurityManager extends SecurityManager {\n        private boolean isExitAllowedFlag;\n    \n        public PasswordSecurityManager() {\n            super();\n            isExitAllowedFlag = false;\n        }\n    \n        public boolean isExitAllowed() {\n            return isExitAllowedFlag;\n        }\n    \n        @Override\n        public void checkExit(int status) {\n            if (!isExitAllowed()) {\n                throw new SecurityException();\n            }\n            super.checkExit(status);\n        }\n    \n        public void setExitAllowed(boolean f) {\n            isExitAllowedFlag = f;\n        }\n    }\n    \n    public class InterceptExit {\n        public static void main(String[] args) {\n            PasswordSecurityManager secManager = new PasswordSecurityManager();\n            System.setSecurityManager(secManager);\n            try {\n                // ...\n                System.exit(1); // Abrupt exit call\n            } catch (Throwable x) {\n                if (x instanceof SecurityException) {\n                    System.out.println(\"Intercepted `System.exit()`\");\n                    // Log exception\n                } else {\n                    // Forward to exception handler\n                }\n            }\n            // ...\n            secManager.setExitAllowed(true); // Permit exit\n            // `System.exit()` will work subsequently\n            // ...\n        }\n    }\n    ```   \n   \n4) 特例   \n—个命令行应用调用 `System.exit()`是允许的，例如，当没有输入足够数量要求的参数时。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: '382:J2EE Bad Practices: Use of System.exit()'
      - type: CERT
        value: ERR09-J:Do not allow untrusted code to terminate the JVM
      - type: OWASP TOP 10
        value: 2004:A9 Application Denial of Service
      - type: SJ/T 11683-2017
        value: 调用System.exit方法
