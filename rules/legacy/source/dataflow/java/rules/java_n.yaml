    Description: "1) 规定   \n不要硬编码敏感信息。   \n2) 原理   \n对密码、服务器 IP 地址和加密密钥这样的敏感信息进行硬编码，会导致信息泄露。任何一个能够访问类文件的人都可以对其进行反编译，从而得到敏感信息。因此，程序不能对敏感信息进行硬编码。   \n对敏感信息进行硬编码，会引起代码管理和变更的负担。   \n3) 示例   \n    1.这个不符合规则的代码示例在一个 String 常量中对服务器 IP 地址进行了硬编码。   \n    ```java\n    class IPaddress {   \n        String ipAddress = new String (\"172.15.254.1\"); \n        public static void main(String[] args) {\n    ```\n    攻击者使用 javap-cIPaddress 命令将类反汇编，得到服务器 IP 地址。    \n    ```java\n    Compiled from \"IPaddress.java\"\n    class IPaddress extends java.lang.Object{   \n    java.lang.String ipAddress;   \n    IPaddress();   \n    Code:   \n    0: aload_0   \n    1: invokespecial #1; //Method java/lang/Object.\"\\<init\\>\":()V 4: aload_0   \n    5: new #2; //class java/lang/String   \n    8: dup   \n    9: ldc #3; //String 172.15.254.1   \n    11: invokespecial #4 ; //Method java/lang/String.u\\<init\\>\": (Ljava/lang/   \n    String;)V   \n    14: putfield #5; //Field ipAddress:Ljava/lang/String;   \n    17: return   \n    public static void main(java.lang.String[]);   \n    Code:   \n    0: return   \n    }  \n    ```   \n    "
    Description_En: ''
    Advice: "对应的符合规则的代码示例：通过位于一个安全目录下的外部文件得到服务器的 IP 地址，使用后立即清除内存中的服务器 IP 地址，以防止泄漏。   \n    ```java\n    class IPaddress {   \n        public static void main(String[] args) throws IOException { \n            char[] ipAddress = new char[100];   \n            BufferedReader br = new BufferedReader(new InputStreamReader( new   \n            FilelnputStreara(\"serveripaddress.txt\")));   \n            // Reads the server IP address into the char array,   \n            // returns the number of bytes read int n = br.read(ipAddress);   \n            // Validate server IP address // Manually clear out the server IP address // immediately after use \n            for (int i = n  - 1; i >= 0; i --) {   \n                ipAddress[i] = 0;   \n            }   \n            br.close();   \n        }   \n    }\n```"
