        value: C.5.9 不要在嵌套类中暴露外部类的私有字段
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n禁止嵌套类将外部类的私有成员暴露给外部的类或者包。   \n2) 原理   \n嵌套类是指那些声明在另一个类或者接口代码块中的任何类。使用嵌套类易出错，除非其语义易理解。一个通用形式是，仅有嵌套类可以访问外部类的内容。不仅嵌套类可以访问外部类的私有字段，当嵌套类被声明为公有或者当它包含公有的方法或者构造方法时，同样的字段也可以被任何在同一个包里的其他类访问。因此，嵌套类禁止将外部类的私有成员暴露给外部的类或者包。   \n3) 示例   \n    1、不符合规则的代码示例，该示例将私有的（x, y)坐标通过`getPoint()`方法暴露给内部类。因此，属于同一个包的 AnotherClass 类同样可以访问这些坐标。   \n    ```java\n    class Coordinates {\n        private int x;\n        private int y;\n    \n        public class Point {\n            public void getPoint() {\n                System.out.println(\"(\" + x + \",\" + y + \")\");\n            }\n        }\n    }\n    \n    class AnotherClass {\n        public static void main(String[] args) {\n            Coordinates c = new Coordinates();\n            Coordinates.Point p = c.new Point();\n            p.getPoint();\n        }\n    }\n    ```   \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：使用私有的访问描述符来隐藏内部类以及所有包含的方法和构造函数。   \n    ```java\n    class Coordinates {\n        private int x;\n        private int y;\n    \n        private class Point {\n            private void getPoint() {\n                System.out.println(\"(\" + x + \",\" + y + \")\");\n            }\n        }\n    }\n    class AnotherClass {\n        public static void main(String[] args) {\n            Coordinates c = new Coordinates();\n            Coordinates.Point p = c.new Point();\n            p.getPoint();\n        }\n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 492:Use of Inner Class Containing Sensitive Data
