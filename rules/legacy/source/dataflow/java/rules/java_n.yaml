      - type: DetailClassChin
        value: C.6.13 不要使用析构函数
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n避免不恰当地使用析构函数，防止可回收对象的重新引用。   \n2) 原理   \n垃圾回收器在认为对象是不可达到的时候，在回收对象所占用空间之前会调用对象的终结方法。析构函数的执行提供了一种方式来释放资源，例如流、文件和网络连接。这些资源可能并不会由于垃圾回收器的执行而自动释放。"
    Description_En: ''
    Advice: "因为析构函数有太多的问题，所以限制它使用在某些特殊的情况中。   \n同时，必须避免在新的类中使用析构函数。   \n3) 示例   \n    当一个基类定义了`fmalize()`方法时，要确保可以分离立即回收的对象和依赖于析构函数的对象。这个符合规定的方案确保在对象不可达到时可以马上回收缓冲区。   \n    ```java\n    class MyFrame {   \n        private JFrame frame;   \n        private byte[] buffer = new byte[16 * 1024 * 1024]; // now decoupled   \n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 586:Explicit Call to Finalize()
      - type: CWE
        value: 568:finalize() Method Without super.finalize()
      - type: CERT
        value: MET12-J:Do not use ﬁnalizers
      - type: SJ/T 11683-2017
        value: 6.6.18 调用finalize方法
