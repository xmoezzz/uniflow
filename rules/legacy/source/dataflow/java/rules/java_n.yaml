        value: C.13.4 在终止前移除临时文件
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n确保临时文件在终止前被移除。   \n2) 原理   \n开发人员通常在任何人都可以进行写操作的目录中创建临时文件。例如，POSIX 中的`/tap`、`/var/tmp`、Windows 中的 `C:\\TEMP`。这些目录中的文件会被定期地清理，例如在每天晚上或者每次重启动时。然而，当那些文件被不安全地创建或者在使用后仍然保持可访问状态的时候，可访问本地文件系统的攻击者可以操作共享目录中的文件。   \n3) 示例   \n    以下这段代码示例认为在安全目录中创建的文件是符合规则要求的，并且使用了正确的访问权限来进行创建，符合规则的要求。这两个要求是在 JVM 之外进行管理的。 这个不符合规则的代码示例没有在结束时删除文件。   \n    ```java\n    class TempFile {\n        public static void main(String[] args) throws IOException {\n            File f = new File(\"tempnam.tmp\");\n            if (f.exists()) {\n                System.out.printIn(\"This file already exists\");\n                return;\n            }\n    \n            FileOutputStream fop = null;\n            try {\n                fop = new FileOutputStream(f);\n                String str = \"Data\";\n                Fop.write(str.getBytes());\n            } finally {\n                if (fop != null) {\n                    try {\n                        fop.close();\n                    } catch (IOException x) {\n                        // handle error\n                    }\n                }\n            }\n        }\n    }\n    ```   \n       \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：使用 Java SE 7 的 NIO2 包中的若干方法创建临时文件。它使用   `createTempFile()`方法创建一个不可预测的名字。   \n    ```java\n        class TempFile {\n            public static void main(String[] args) {\n                Path tempFile = null;\n                try {\n                    tempFile = Files.createTempFile(\"tempnam\", \".tmp\");\n                    try (BufferedWriter writer = Files.newBufferedWriter(tempFile, Charset.forName(\"UTF8\"),\n                            StandardOpenOption.DELETE_ON_CLOSE)) {\n                        // write to file\n                    }\n                    System.out.println(\"Temporary file write done, file erased\");\n                } catch (FileAlreadyExistsException x) {\n                    System.err.println(\"File exists: \" + tempFile);\n                } catch (IOException x) {\n                    // Some other sort of failure, such as permissions.\n                    System.err.println(\"Error creating temporary file: \" + x);\n    ```"
    Advice_En: ''
    References:
      Reference:
