  - id: '02000010160015'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.2 面对对象程序安全
      - type: DetailClassChin
        value: C.2.1 防止类的初始化循环
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n对类进行的初始化，必须避免类的初始化循环。   \n2) 原理   \n类初始化包括：执行该类的 static 静态初始化方法和初始化该类中的静态数据成员（类变量）。   \n一个静态数据成员的出现会触发类的初始化。一个静态数据成员可能会依赖于其他类的初始化，这样可能形成一个初始化循环。   \n一般来说，程序，特别是对安全敏感的程序，必须消除所有类的初始化循环。   \n3) 示例   \n    1.这个不符合规则的代码示例，存在一个涉及多个类的类初始化循环。   \n    Cycle 类声明了一个 private static final 类变量，这个变量在创建 Cycle对象时初始化。静态的初始化方法只调用一次，调用在第一次使用静态类变量或者在第一次调用构造函数前发生。   \n    ```java\n    public class Cycle {\n        private final int balance;\n        private static final Cycle c = new Cycle();\n        // Random deposit\n        private static final int deposit = (int) (Math.random() * 100);\n    \n        public Cycle() {\n            balance = deposit - 10; // Subtract processing fee\n        }\n    \n        public static void main(String[] args) {\n            System.out.println(\"The account balance is: \" + c.balance);\n        }\n    }\n    ```   \n    "
    Description_En: ''
    Advice: "对应的符合规则的代码示例：通过改变 Cycle类的初始化次序，使得对数据成员的初始化不会形成依赖循环。对 c 的初始化，在编码上处于对 `deposit` 初始化之后，因而它会在 `deposit` 被完全初始化之后初始化。   \n    ```java\n    public class Cycle {\n        private final int balance;\n        // Random deposit\n        private static final int deposit = (int) (Math.random() * 100);\n        // Inserted after initialization of required fields\n        private static final Cycle c = new Cycle();\n\n        public Cycle() {\n            balance = deposit - 10; // Subtract processing fee\n        }\n\n        public static void main(String[] args) {\n            System.out.println(\"The account balance is: \" + c.balance);\n        }\n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 367:Time-of-check Time-of-use (TOCTOU) Race Condition
      - type: CWE
