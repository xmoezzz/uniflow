  - id: '02000010160047'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.2 面对对象程序安全
      - type: DetailClassChin
        value: C.5.10 比较类而不是类名称
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n不能基于类名称进行类比较。   \n2) 原理   \n在 JVM 中，如果两个类被同一个类装载器装载且有相同的全名，则被认为是相同的类（且有相同的类型）。有相同名称但却有不同包名的两个类是不同的类，就像是被不同的类装载器载入的有相同的全名的两个类一样。   \n有时需要检查一个指定对象是否是特定的类型，或两个对象的类型是否相同。如果这个比较不能正确完成，代码会认为这两个对象是同样的类，但它们实际上并不相同。因此，不能基于类名称进行比较。   \n一些不安全代码，可能容易受到混合与匹配攻击。攻击者会提供与目标类全限定名相同的恶意类。如果对一个受保护资源的访问是被授权的，并且该授权只是基于对类名称的比较，那么非特权类会未经授权就能够访问资源。   \n3) 示例   \n    1、不符合规则的代码示例，该示例将对象`auth`的类的名称和字符串“`com.application.autli.DefaultAuthenticationHandler”`进行比较，并且基于该比较结果进行分支。   \n    ```java\n    //Determine whether object auth has required/expected class object \n    if (auth.getClass().getName().equals( \"com.application.auth.DefaultAuthenticationHandler\")) {   \n        //...   \n    }\n    ```   \n       \n    "
    Description_En: ''
    Advice: "对应符合规则的解决方案是将类对象`auth`与当前类装载器装载的类对象进行了比较，而不仅仅对类名称进行比较。   \n    ```java\n    //Determine whether object auth has required/expected class name \n    if (auth.getClass() ==   this.getClass().getClassLoader().loadClass( \"com.application.auth.DefaultAuthenticationHandler11)) {   \n        // ...   \n    }\n    ```   \n    2、不符合规则的代码示例，该示例使用`equals()`方法对类对象 x 和 y 的名称进行比较。如果它们来自不同的类装载器，即使是同样的名称，x 和 y 也可能是不同的类。   \n    ```java\n    // Determine whether objects x and y have the same class name \n    if (x.getClass() .getName() .equals(y.getClass() .getName())) {   \n        //Objects have the same class   \n    }\n    ```\n    对应符合规则的解决方案是：   \n    ```java\n    // Determine whether objects x and y have the same class \n    if (x.getClass() == y.getClass()) {   \n        // Objects have the same class   \n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 486:Comparison of Classes by Name
      - type: CERT
        value: OBJ09-J:Compare classes and not class names
