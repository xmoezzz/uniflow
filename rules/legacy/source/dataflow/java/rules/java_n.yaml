        value: 2017:A9 Using Components with Known Vulnerabilities
      - type: OWASP TOP 10
        value: 2013:A9 Using Components with Known Vulnerabilities
      - type: OWASP TOP 10
        value: 2004:A9 Application Denial of Service
      - type: OWASP MOBILE TOP 10
        value: 2014:M1 Weak Server Side Controls
