        value: C.7.5 不要在finally程序段非正常退出
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n不要在 finally 程序段中使用 return、break、continue 或 throw 语句。   \n2) 原理   \n当程序进入带有 finally 程序段的 try 程序段时，不管 try 程序段（或是相应的 catch 程序段）是否完成执行，finally 程序段总是会执行的。造成 finally 程序段非正常终止的语句也会导致 try 程序段非正常终止，从而消除了从 try 或 catch 程序段抛出的任何异常。   \n3) 示例   \n    如下不符合规则的代码示例中，在代码段中的 return 语句造成了 finally 程序段非正常终止。   \n    ```java\n    class TryFinally {   \n        private static boolean doLogic()  {    \n            try {   \n                throw new IllegalStateException();   \n            } finally {   \n                System.out.printIn(\"logic done\");    \n                return true;   \n            }   \n        }   \n    }\n    ```   \n    return 语句引起的 finally 程序段的非正常终止消除了 IllegalStateException 异常。   \n       \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：去除 finally 程序段中的 return 语句。   \n    ```java\n    class TryFinally {   \n    private static boolean doLogic() {   \n        try {   \n            throw new IllegalStateException ();   \n        } finally {   \n            System.out.println(\"logic done\");   \n        }   \n            // Any return statements must go here;   \n            //applicable only when exception is thrown conditionally   \n        }   \n    }  \n    ```\n4) 特例   \n程序流控制语句的目的地在 finally 程序段内时，是可以接受的。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 584:Return Inside Finally Block
      - type: CERT
        value: ERR04-J:Do not exit abruptly from a finally block
      - type: OWASP TOP 10
        value: 2007:A6 Information Leakage and Improper Error Handling
      - type: OWASP TOP 10
        value: 2004:A7 Improper Error Handling
      - type: SJ/T 11683-2017
        value: 6.4.2 finally语句块中包含return语句
