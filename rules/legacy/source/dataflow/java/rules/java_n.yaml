  - id: '02000010160001'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 5.2 数据净化
      - type: DetailClassChin
        value: C.1.1 净化穿越受信边界的非受信数据
    Categories_En:
      Category: []
    BugServerity: 5
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n程序必须对传递给命令行解释器或者解析器的所有字符串数据进行净化，以保证解析器处理后或者解释器处理后的字符串是无害的。   \n2) 原理   \n许多程序会接受来自未经验证的用户数据、网络连接以及其它来自于非受信域的不可信数据，然后会将这些不可信数据（经过修改或不经修改）穿过受信边界送到另一个受信域中。通常，这些数据是以字符串的形式出现的，并且会有既定的内部数据结构，这种数据结构必须能够被子系统所解析。同时，必须净化这些数据。因为子系统可能并不具备处理恶意输入信息的能力，而未经净化数据输入很有可能包含注入攻击。   \n一些命令行解释器和解析器会提供自己的数据净化和数据验证的方法。当存在这样的方法时，应当优先使用这些方法。   \n然而，需要注意的是，自定义的净化方法可能会忽略一些特殊的情况，或者会忽略在解析器中所隐含着的那些复杂性。还要注意一种情况是：当有新的功能添加到命令行解释器或者添加到解析器软件时，自定义的处理方法可能并不能得到很好的维护。   \n在JDBC 类库中，提供了能够构建SQL 命令并且处理非受信数据的API。`java.sql.PreparedStatement`类中，可以对输入字符串进行转义，如果使用正确的话，可以防止SQL 注入。   \n通过使用PreparedStatement 类的`set*()`方法，可以进行强类型检查。这样可以减少SQL 注入漏洞，因为自动化例程会正确地转义双引号内的输入数据。需要注意的是，那些将数据插入数据库的查询也会使用PreparedStatement 。   \n3) 示例   \n    **例 1**：在这个不符合规则的代码示例中，系统使用 JDBC 代码来认证用户。密码通过 char 数组传入，建立数据库连接，然后进行哈希编码。   \n    这段代码会出现SQL 注入问题，因为在SQL 语句中，`sqlString` 允许输入未经净化的输入参数。   \n    ```java \n    class Login {\n        public Connection getConnection() throws SQLException {\n            DriverManager.registerDriver(new com.microsoft.sqlserver.jdbc.SQLServerDriver());\n            String dbConnection = PropertyManager.getProperty(\"db.connection\");\n            // can hold some value like\n            // \"jdbc:microsoft:sqlserver://<HOST>:1433,<UID>,<PWD>\"\n            return DriverManager.getConnection(dbConnection);\n        }\n    \n        String hashPassword(char[] password) {\n            // create hash of password\n        }\n    \n        public void doPrivilegedAction(String username, char[] password) throws SQLException {\n            Connection connection = getConnection();\n            if (connection == null) {\n                // handle error\n            }\n            try {\n                String pwd = hashPassword(password);\n                String sqlString = \"SELECT * FROM db_user WHERE username = '\" + username + \"’ AND password = '\" + pwd\n                        + \"’\";\n                Statement stmt = connection.createStatement();\n                ResultSet rs = stmt.executeQuery(sqlString);\n                if (!rs.next()) {\n                    throw new SecurityException(\"User name or password incorrect\");\n                }\n                // Authenticated; proceed\n            } finally {\n                try {\n                    connection.close();\n                } catch (SQLException x) {\n                    // forward to handler\n                }\n            }\n        }\n    }  \n    ```\n    对应的符合规则的方案修改了`doPrivilegedAction()` 方法， 使用PreparedStatement 类来代替`java.sql.Statement`。并且这段代码会验证`username`参数的长度，防止如果提交一个长用户名的时候可能会出现的攻击。   \n    ```java\n    public void doPrivilegedAction(String username, char[] password) throws SQLException {\n        Connection connection = getConnection();\n        if (connection == null) {\n            // Handle error\n        }\n        try {\n            String pwd = hashPassword(password);\n            // Ensure that the length of user name is legitimate\n            if (username.length() > 8) {   \n                // Handle error   \n            }  \n            String sqlString = \"select * from db_user where username=? and password=?\";\n            PreparedStatement stmt = connection.prepareStatement(sqlString);\n            stmt.setString(1, username);\n            stmt.setString(2, pwd);\n            ResultSet rs = stmt.executeQuery();\n            if (!rs.next()) {\n                throw new SecurityException(\"User name or password incorrect\");\n            }\n            // Authenticated, proceed\n        } finally {\n            try {\n                connection.close();\n            } catch (SQLException x) {\n                // forward to handler\n            }\n        }\n    }\n    ```    \n    \n    **例 2**：在下面这段不符合规则的代码示例中，一个客户方法使用简单的字符串链接来创建一个 XML 查询，然后将其发送到服务器。在这时就有可能出现 XML 注入问题，因为这个方法并没有进行任何输入验证。   \n    ```java\n    private void createXMLStream(BufferedOutputStream outStream, String quantity) throws IOException {\n        String xmlString;\n        xmlString = \"<item>\\n<description>Widget</description>\\n\" + \"<price>500.0</price>\\n\" + \"<quantity>\" + quantity\n                + \"</quantity></item>\";\n        outStream.write(xmlString.getBytes());\n        outStream.flush();\n    }\n    ```   \n    根据特定的数据和接收这些数据的命令解释器或者解析器的情况，必须使用一个适当的方法来净化这些非受信的用户输入。"
    Description_En: ''
    Advice: "这个符合规则的方案使用白名单来净化输入数据。在这个方案中，处理方法要求输入的数字必须为0 ～ 9。   \n    ```java\n    private void createXMLStream(BufferedOutputStream outStream, String quantity) throws IOException {\n        // Write XML string if quantity contains numbers only.\n        // Blacklisting of invalid characters can be performed\n        // in conjunction.\n        if (!Pattern.matches(\"[0-9]+\", quantity)) {\n            // Format violation\n        }\n        String xmlString = \"<item>\\n<description>Widget</description>\\n\" + \"<price>500</price>\\n\" + \"<quantity>\"\n                + quantity + \"</quantity></item>\";\n        outStream.write(xmlString.getBytes());\n        outStream.flush();\n    }\n    ```   \n    一个更为通用的检查XML以防止注入的方法是，可以使用文档类型定义（Document TypeDefinition，DTD）或模板（schema）来进行验证。模板必须严格定义，从而防止通过注入的方式将一个合法的XML 文档变成错误的文档。以下是一个用来验证XML 文档片段的合适的模板：   \n    ```xml\n    <xs:schema xmlns:xs=\"http://www.w3.org/2001/XMLSchema\">\n        <xs:element name=\"item\">\n            <xs:complexType>\n                <xs:sequence>\n                    <xs:element name=\"description\" type=\"xs:string\" />\n                    <xs:element name=\"price\" type=\"xs:decimal\" />\n                    <xs:element name=\"quantity\" type=\"xs:integer\" />\n                </xs:sequence>\n            </xs:complexType>\n        </xs:element>\n    </xs:schema>\n    ```   \n    在`schema.xsd`文件中可以得到XML 模板。在这个符合规则的方案中，可以采用这个模板来防止XML   \n    注入。它同时需要使用CustomResolver 类来防止XXE 攻击。关于这个类和所谓的XXE 攻击，可以参见如下代码示例中的描述。   \n    ```java\n    private void createXMLStream(BufferedOutputStream outStream, String quantity) throws IOException {\n        String xmlString;\n        xmlString = \"<item>\\n<description>Widget</description>\\n\" + \"<price>500.0</price>\\n\" + \"<quantity>\" + quantity\n                + \"</quantity></item>\";\n        InputSource xmlStream = new InputSource(new StringReader(xmlString));\n        // Build a validating SAX parser using our schema\n        SchemaFactory sf = SchemaFactory.newInstance(XMLConstants.W3C_XML_SCHEMA_NS_URI);\n        DefaultHandler defHandler = new DefaultHandler() {\n            public void warning(SAXParseException s) throws SAXParseException {\n                throw s;\n            }\n    \n            public void error(SAXParseException s) throws SAXParseException {\n                throw s;\n            }\n    \n            public void fatalError(SAXParseException s) throws SAXParseException {\n                throw s;\n            }\n        };\n        StreamSource ss = new StreamSource(new File(\"schema.xsd\"));\n        try {\n            Schema schema = sf.newSchema(ss);\n            SAXParserFactory spf = SAXParserFactory.newInstance();\n            spf.setSchema(schema);\n            SAXParser saxParser = spf.newSAXParser();\n            // To set the custom entity resolver\n            // an XML reader needs to be created\n            XMLReader reader = saxParser.getXMLReader();\n            reader.setEntityResolver(new CustomResolver());\n            saxParser.parse(xmlStream, defHandler);\n        } catch (ParserConfigurationException x) {\n            throw new IOException(\"Unable to validate XML\", x);\n        } catch (SAXException x) {\n            throw new IOException(\"Invalid quantity\", x);\n        }\n        // Our XML is valid, proceed\n        outStream.write(xmlString.getBytes());\n        outStream.flush();\n    }\n    ```"
