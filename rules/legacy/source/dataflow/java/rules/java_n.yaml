  - id: '02000010160082'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.3 并发程序安全
      - type: DetailClassChin
        value: C.9.4 不要基于高层并发对象的内置锁来实现同步
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n与高层的并发对象交互的程序应该仅仅使用由接口提供的锁，而不允许使用内置锁。   \n2) 原理   \n那些实现其中一个或者都实现了在 `java.util.concurrent.locks` 包中 Lock 和 Condition 接口的类，被认为是高层的并发对象。对这样的对象使用内置锁会带来安全问题，尽管看起来代码的功能是正确的。因此，与这些对象交互的那些程序应该仅仅使用由接口提供的锁，而不允许使用内置锁。这个问题通常在代码重构时发生，比如说从使用内置锁重构成使用 `java.util.concurrent` 的动态锁。   \n3) 示例   \n    如下不符合规则的代码示例（重入锁），该示例的 `doSomething()`方法中，基于 ReentrantLock 的内置锁实现同步而不是基于被 ReentrantLock 封装的可重入的互斥锁实现同步。   \n    ```java\n    private final Lock lock = new ReentrantLock();\n    \n    public void doSomething() {\n        synchronized (lock) {\n            // . . .\n        }\n    }\n    ``` \n        \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案使用`lock()`和`unlock()`方法，这些方法由 Lock 接口提供。   \n    ```java\n    private final Lock lock = new ReentrantLock();\n    \n    public void doSomething() {\n        lock.lock();\n        try {\n            // do something\n        } finally {\n            lock.unlock();\n        }\n    }\n    ```"
    Advice_En: ''
