    Description: "1) 规定   \n程序应禁止直接调用 `Thread.run()`方法。   \n2) 原理   \n调用 `Thread.start()`方法标志着 Java 运行库开始执行线程的`run()`方法，但直接调用一个 Thread 对象的`run()`方法是不正确的。如果直接调用 Thread 对象的`run()`方 法，`run()`方法中的语句是由当前线程而不是由新创建的线程来执行的，而且当 Thread 对象是通过实例化一个没有覆写`run()`方法的 Thread 子类来创建，而不是用 Runnable 对象来创建时，任何对子类中`run()`方法的调用都会调用 `Thread.run()`，这个方法不会做任何操作。因此，程序禁止直接调用 `Thread.run()`方法。   \n3) 示例   \n    一个不符合规则的代码示例，该示例在当前线程中直接调用`run()`。   \n    ```java\n    public final class Foo implements Runnable {\n        @Override\n        public void run() {\n            // . . .\n        }\n    \n        public static void main(String[] args) {\n            Foo foo = new Foo();\n            new Thread(foo).run();\n        }\n    }\n    ```  \n    这里假设`run()`会启动新线程是错误的，因为这个新创建的线程并不会开始执行。因此，`run()`方法中的语句是由当前线程而不是新线程来执行的。   \n       \n    "
    Description_En: ''
    Advice: "对应符合规则的解决方案中，正确地使用`start()`方法来通知 Java 运行库开始执行新线程。   \n    ```java\n    public final class Foo implements Runnable {\n        @Override\n        public void run() {\n            // . . .\n        }\n    \n        public static void main(String[] args) {\n            Foo foo = new Foo();\n            new Thread(foo).start();\n        }\n    }  \n    ```\n4) 特例   \n1、在进行单元测试时，可以直接调用`run()`方法的。注意，这个方法不能用来测试那些在多线程场景中应用的类。   \n2、在运行系统中，与启动新线程有关的代码是可以直接调用 Thread 对象的`run()`方法的。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 572:Call to Thread run() instead of start()
      - type: CERT
