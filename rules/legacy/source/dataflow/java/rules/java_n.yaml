  - id: '02000010160053'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.2 面对对象程序安全
      - type: DetailClassChin
        value: C.6.4 进行安全检测的方法必须声明为private或final
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n安全检测方法必须声明为 private或 final，以避免恶意的子类覆写 nonfinal类的成员方法。   \n2) 原理   \n恶意的子类可以覆写进行安全检测的 nonfinal 类的成员方法，并忽略这些检测，从而使安全检测不起作用。因此，这些方法必须声明为 private或 final来避免覆写。   \n3) 示例   \n    这个不符合规则的代码示例：允许子类覆写方法 `readSensitiveFile()`，并省略了所需的安全检测。\n    ```java\n    public void readSensitiveFile() {\n        try {\n            SecurityManager sm = System.getSecurityManager();\n            if (sm != null) { // Check for permission to read file\n                sm.checkRead(\"/temp/tempFile\"); // Access the file\n            }\n        } catch (SecurityException se) { // Log exception\n        }\n    }\n    ```    \n    "
    Description_En: ''
    Advice: "对应的符合规定的解决方案 1：将 `readSensitiveFile()`声明为 final，从而避免覆写。\n    ```java\n    public final void readSensitiveFile() {\n        try {\n            SecurityManager sm = System.getSecurityManager();\n            if (sm != null) { // Check for permission to read file\n                sm.checkRead(\"/temp/tempFile\");\n            }\n            // Access the file\n        } catch (SecurityException se) {\n            // Log exception\n        }\n    }\n    ```      \n    对应的符合规定的解决方案 2：将 `readSensitiveFile()`声明为 private:，从而避免覆写。\n    ```java\n    private void readSensitiveFile() {\n        try {\n            SecurityManager sm = System.getSecurityManager();\n            if (sm != null) { // Check for permission to read file\n                sm.checkRead(\"/temp/tempFile\");\n            }\n        }\n        // Access the file }\n        catch (SecurityException se) {\n            // Log exception\n        }\n    }\n    ```   \n4) 特例   \n声明为 final 的类不受这条规则的限制，因为它们的成员方法不能够被覆写。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 358:Improperly Implemented Security Check for Standard
      - type: CERT
        value: MET03-J:Methods that perform a security check must be declared private or final
