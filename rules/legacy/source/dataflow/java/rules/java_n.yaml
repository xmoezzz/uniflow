  - id: '02000010160020'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.2 面对对象程序安全
      - type: DetailClassChin
        value: C.3.3 使用参数的Arrays,equals()方法比较两个数组的内容
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n应使用参数的 `Arrays.equals()`方法比较两个数组的内容。   \n2) 原理   \n数组不会重写 `Object.equals()`方法，而 equals()方法比较的是数组引用而不是数组的内容值。应使用参数的 `Arrays.equals()`方法比较两个数组的内容。   \n若要测试引用是否相等，应使用引用相等操作符：`==`和`!=`，而不是使用数组的`equals()`方法，否则会导致不可预期的后果。   \n3) 示例   \n    1.这个不符合规则的代码示例错误的使用了 `Object．equals()`方法比较两个数组。   \n    ```java\n    public void arrayEqualsExample(){   \n        int[] arr1=new int[20];//initialized to 0   \n        int[] arr2=new int[20];//initialized to 0   \n        arr1.equals(arr2);//false   \n    }\n    ```   \n    "
    Description_En: ''
    Advice: "相应的符合规则的代码示例：使用参数的 `Arrays.equals()`方法比较两个数组。   \n    ```java\n    public void arrayEqualsExample(){   \n        int[] arr1=new int[20];//initialized to 0   \n        int[] arr2=new int[20];//initialized to 0   \n        Arrays.equals(arr1,arr2);//true   \n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 754:Improper Check for Unusual or Exceptional Conditions
      - type: CWE
        value: 398:Indicator of Poor Code Quality
      - type: CERT
        value: EXP02-J:Do not use the Object.equals() method to compare two arrays
      - type: CWE/SANS TOP 25
        value: 2011:Risky Resource Management - CWE ID 754
      - type: SJ/T 11683-2017
        value: 6.3.4 equals方法的错误使用
