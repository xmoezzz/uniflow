      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n必须重视方法的返回值。   \n2) 原理   \n通过返回值来判断方法调用成功与否，或者通过返回值来更新本地的对象或数据成员时，若忽略方法的返回值，会产生安全风险，因此必须重视方法调用的返回值。   \n当获取器(getter)方法是以所做的操作命名时，程序员可能无法确认是否有返回值。   \n3) 示例   \n    1.这个不符合规则的代码示例想要删除一个文件，但没有确认这个删除动作是否成功。   \n    ```java\n    public void deleteFile()  {   \n        File someFile=new File (\"someFileName.txt“);   \n        //do something with someFile   \n        someFile.delete();   \n    }\n    ```   \n    "
    Description_En: ''
    Advice: "对应的符合规则的代码示例：对`delete()`方法返回的 boolean 变量进行检查，并且处理了可能出现的错误。   \n    ```java\n    public void deleteFile()  {   \n        File someFile=new File (\"someFileName.txt\");   \n           //do something with someFile   \n        if (!someFile.delete())  {   \n           //handle failure to delete the file   \n        }   \n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
