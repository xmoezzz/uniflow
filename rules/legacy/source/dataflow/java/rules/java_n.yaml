        value: C.4.10 不要使用浮点变量作为循环计数器
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n绝对不能使用浮点变量作为循环计数器。   \n2) 原理   \n有限精度的 IEEE 754 浮点类型不能表达：   \n•  精确的分数。   \n•  精确的小数，即使是可以用少量数字就可以表达的小数。   \n•  大数值的数字。这意味着在允许的精度内，对大浮点数值的增量可能并不会改变其实际数值。   \n使用浮点变量作为循环计数器会导致意外的行为。   \n3) 示例   \n    如下不符合规则的代码示例使用一个浮点变量作为循环计数器。小数 0.1 不能精确地用 float 甚至double 来表达。   \n    ```java\n    for (float x = 0.1f; x <= 1.0f; x += 0.1f) {   \n        System.out.printIn(x);   \n    }\n    ```   \n       \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：使用整数作为循环计数器，并由此得到期望的浮点数值。   \n    ```java\n    for (int count = 1; count <= 10; count += 1) {   \n        float x = count/10.Of;   \n        System.out.println(x);   \n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CERT
        value: NUM09-J:Do not use floating-point variables as loop counters
