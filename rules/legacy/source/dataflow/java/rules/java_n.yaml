  - id: '02000010160016'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.2 面对对象程序安全
      - type: DetailClassChin
        value: C.2.2 不要重用Java 标准库的已经公开的标识
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n不要重用 Java 标准库中已经使用过的公共标识、公共工具类、接口或者包。   \n2) 原理   \n定义一个类，使用和公开类相同的名字，这个自定义的类会遮蔽原来的公开类，从而导致不可预期的程序行为。   \n使用定义良好的 import 语句可以解决该问题，但容易产生错误。在 Java 包含的 import 引用路径中，如果在预期的类出现之前出现了一个自定义的类，就不会再进一步搜索，这样就会使用错误的类。   \n3) 示例   \n    1.这个不符合规则的代码示例实现了一个类，这个类重用了`java.util.Vector`的类名称。它在`isEmpty()`中使用了一个不同的条件判断，尝试通过重写`java.util.Vector`中对应的方法来达到与遗留代码接口的目的。如果维护者混淆了这个`isEmpty()`和 `java.util.Vector. isEmpty()`，就会出现不可预知行为。   \n    ```java\n    class Vector {\n        private int val = 1;\n    \n        public boolean isEmpty() {\n            if (val == 1) { // compares with 1 instead of 0\n                return true;\n            } else {\n                return false;\n            }\n        }\n        // other functionality is same as java.util.Vector\n    }\n    \n    // import java.util.Vector; omitted\n    public class VectorUser {\n        public static void main(String[] args) {\n            Vector v = new Vector();\n            if (v.isEmpty()) {\n                System.out.println(\"Vector is empty\");\n            }\n        }\n    }\n    ```   \n       \n    "
    Description_En: ''
    Advice: "对应的符合规则的代码示例：为定义的类使用不同的名字。   \n    ```java\n    class MyVector {   \n        // other code   \n    }\n    ```"
    Advice_En: ''
    References:
      Reference: []
