      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n方法禁止抛出 RuntimeException、Exception 或是 ```java\nThrowable。   \n2) 原理   \n处理上述异常需要捕捉 RimtimeException，这是不被允许的。而且，抛出 RuntimeException 会产生微妙的错误，例如，一个调用者不能通过检查异常来判断异常抛出的原因，从而不能尝试恢复操作。   \n方法可以抛出继承 Exception 或 RuntimeException 的明确异常。要注意，对一个单独的 throw 语句创建一个异常类是允许的。   \n当抛出 RuntimeException、Exception 或 Throwable 时，在要求类捕捉预期的异常的同时，必须捕捉预料外的异常。   \n3) 示例   \n    如下不符合规则的代码示例在 `doSomething()`方法声明的 throws 语句中指定了 Exception 类。\n    ```java\n    private void doSomething() throws Exception {   \n        // . . .   \n    } \n    ```   \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：在 `doSomething()`方法声明的 throws 语句中指定一个更具体的异常类。\n    ```java\n    private void doSomething() throws IOException {   \n        // . . .    \n    }\n    ```   \n   \n4) 特例   \n通过过滤异常来符合安全策略的类是允许将具体的异常转化成通用异常的。在某些情况下，根据安全策略的需求，这样的转化可能会导致抛出 RuntimeException、Exception 或 Throwable。"
    Advice_En: ''
