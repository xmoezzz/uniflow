    Description: "1) 规定   \n只有在“所有线程拥有一致的等候条件”、“所有线程在被唤醒后会进行相同的操作”、“在发出通知后，只需要一个线程恢复工作”都满足的情况下，才能调用 notify()方法。   \n2) 原理   \n调用 `Object.wait()`的线程期望在它们的等候条件成真时恢复继续运行。等待中的线程在接到通知时，必须测试它们的等候条件，而且在等候条件为假时，必须继续等待。`java.lang.Object` 包中的`notify()`和`notifyAll()`方法分別是用来唤醒等待中的一个或多个线程的。这些方法必须由那些拥有等待线程的对象锁的线程来调用，而且这些方法在被其他线程调用时会抛出illegalMonitorStateException。`notifyAll()`方法会唤醒所有等待同一对象锁的线程，并允许等候条件成真的线程恢复执行。而且，如果那些等候条件成真的所有线程在进入等候状态前持有某一特定的锁的话，在接到通知时只有一个线程可以重新得到这个锁。其他线程将会继续等待。`notify(`)方法只唤醒一个线程，而并不保证哪一个线程会接到通知。并且，只有在“所有线程拥有一致的等候条件”、“所有线程在被唤醒后会进行相同的操作”、“在发出通知后，只需要一个线程恢复工作”都满足的情况下，才能调用`notify()`方法。   `java.util.concurrent.locks` 工具提供了 `Condition.signal()`和 `Condition.signalAll()`方法来唤醒在调用`Condition.await()`时受阻的线程。使用 `java.util.concurrent.locks.Lock` 对象时需要 Condition 对象。利用一个 Lock 对象来同步的代码会用到一个或多个和这个 Lock 对象相关的 Condition 对象，而不只是使用它的隐含锁。这些对象根据 Lock 对象制定的锁定策略来直接进行相互操作。因此，方法 `await()、signal()`和 `signalAll()`是用来代替方法 `wait()、notify()` 和 `notifyAll()`的。   \n3) 示例   \n    1、不符合规则的代码示例（`notify()`），该示例演示了一个由多个线程执行的复杂的多步骤过程。每一个线程执行由 time 字段决定的步骤。线程会等待 time 字段的指示，来确定是否执行对应线程的步骤。在 执行任务后，每一个线程先是增加 time,然后再通知负责下一个步骤的线程。   \n    ```java\n    public final class ProcessStep implements Runnable {\n        private static final Object lock = new Object();\n        private static int time = 0;\n        private final int step; // Perform operations when field time\n        // reaches this value\n    \n        public ProcessStep(int step) {\n            this.step = step;\n        }\n    \n        @Override\n        public void run() {\n            try {\n                synchronized (lock) {\n                    while (time != step) {\n                        lock.wait();\n                    }\n                    // Perform operations\n                    time++;\n                    lock.notify();\n                }\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt(); // Reset interrupted status\n            }\n        }\n    \n        public static void main(String[] args) {\n            for (int i = 4; i >= 0; i--) {\n                new Thread(new ProcessStep(i)).start();\n            }\n        }\n    }\n    ```  \n    本代码示例违反了活性属性。因为每一个线程在继续执行前要求的 step 数值是不一样的，所有线程有着不同的等候条件。`Object.notify()`方法一次只会唤醒一个线程。除非正好唤醒执行下一个步骤的线程，否则这个程序会发生死锁。   \n       \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案（`notifyAll())`中，每一个线程都在完成它自己的步骤后调用`notifyAll()`方法来通知等待中的线程。准备好的线程可以执行它的任务，而那些其他等待条件为假的线程（循环条件表 达式为 true)则会继续等待。   \n    本代码只修改了上述不符合规则代码示例中的`run()`方法：   \n    ```java\n    public final class ProcessStep implements Runnable {\n        private static final Object lock = new Object();\n        private static int time = 0;\n        private final int step; // Perform operations when field time\n                                // reaches this value\n    \n        public ProcessStep(int step) {\n            this.step = step;\n        }\n    \n        @Override\n        public void run() {\n            try {\n                synchronized (lock) {\n                    while (time != step) {\n                        lock.wait();\n                    }\n    \n                    // Perform operations\n    \n                    time++;\n                    lock.notifyAll(); // Use notifyAll() instead of notify()\n                }\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt(); // Reset interrupted status\n            }\n        }\n    \n    }\n    ```\n       \n    2、不符合规则的代码示例（Condition 接口），该示例是和使用`notify()`的例子相类似，本段代码使用的是 Condition 接口来进行等待和通知操作。   \n    ```java\n    public class ProcessStep implements Runnable {\n        private static final Lock lock = new ReentrantLock();\n        private static final Condition condition = lock.newCondition();\n        private static int time = 0;\n        private final int step; // Perform operations when field time\n                                // reaches this value\n    \n        public ProcessStep(int step) {\n            this.step = step;\n        }\n    \n        @Override\n        public void run() {\n            lock.lock();\n            try {\n                while (time != step) {\n                    condition.await();\n                }\n    \n                // Perform operations\n    \n                time++;\n                condition.signal();\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt(); // Reset interrupted status\n            } finally {\n                lock.unlock();\n            }\n        }\n    \n        public static void main(String[] args) {\n            for (int i = 4; i >= 0; i--) {\n                new Thread(new ProcessStep(i)).start();\n            }\n        }\n    }\n    ```   \n    和 `Object.notify()` —样，`signal()`方法会唤醒任意一个线程。   \n       \n    对应的符合规则的方案（`signalAll()`)通过使用 `signalAll()`方法来通知所有等待中的线程。在 `await()`返回前，当前线程会重新获取和条件相关的锁。线程在返回时，肯定是拥有这个锁的。准备就绪的线程可以执行其任务，而那些等条件为假的线程则会继续等待。   \n    本代码只修改了上述不符合规则的代码示例中的`run()`方法：   \n    ```java\n    public class ProcessStep implements Runnable {\n        private static final Lock lock = new ReentrantLock();\n        private static final Condition condition = lock.newCondition();\n        private static int time = 0;\n        private final int step; // Perform operations when field time\n                                // reaches this value\n    \n        public ProcessStep(int step) {\n            this.step = step;\n        }\n    \n        @Override\n        public void run() {\n            lock.lock();\n            try {\n                while (time != step) {\n                    condition.await();\n                }\n    \n                // Perform operations\n    \n                time++;\n                condition.signalAll();\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt(); // Reset interrupted status\n            } finally {\n                lock.unlock();\n            }\n        }\n    \n    }\n    ```   \n       \n    另一个符合规则的解决方案是赋予每个线程一个自己的条件。所有的线程都可以访问所有的Condition 对象。   \n    ```java\n    // Declare class as final because its constructor throws an exception\n    public final class ProcessStep implements Runnable {\n        private static final Lock lock = new ReentrantLock();\n        private static int time = 0;\n        private final int step; // Perform operations when field time\n                                // reaches this value\n        private static final int MAX_STEPS = 5;\n        private static final Condition[] conditions = new Condition[MAX_STEPS];\n    \n        public ProcessStep(int step) {\n            if (step <= MAX_STEPS) {\n                this.step = step;\n                conditions[step] = lock.newCondition();\n            } else {\n                throw new IllegalArgumentException(\"Too many threads\");\n            }\n        }\n    \n        @Override\n        public void run() {\n            lock.lock();\n            try {\n                while (time != step) {\n                    conditions[step].await();\n                }\n    \n                // Perform operations\n    \n                time++;\n                if (step + 1 < conditions.length) {\n                    conditions[step + 1].signal();\n                }\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt(); // Reset interrupted status\n            } finally {\n                lock.unlock();\n            }\n        }\n    \n        public static void main(String[] args) {\n            for (int i = MAX_STEPS - 1; i >= 0; i--) {\n                ProcessStep ps = new ProcessStep(i);\n                new Thread(ps).start();\n            }\n        }\n    }\n    ```  \n    虽然使用了`signal()`方法，但是只有等候条件对应于特定 Condition 变量的线程才会被唤醒。"
