  - id: '02000010160059'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.2 面对对象程序安全
      - type: DetailClassChin
        value: C.6.10 定义了 equlas（）方法的类必须定义hashCode（）方法
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n覆写了 `Object.equals()`方法的类必须同时覆写 `Object.hashCode()`方法。   \n2) 原理   \n`java.lang.Object`类要求当两个对象用`equals()`方法进行比较并得到等同的结果时，对这两个对象调用 `hashCode()`方法时必须产生一样的整数结果。   \n`equals()`方法用于判定两个对象实例逻辑上的等同性。因此，对于所有等同的对象，` hashCode()`方法必须返回相同的数值。没能遵守这一合约是一个常见的产生错误的原因。   "
    Description_En: ''
    Advice: "\n3) 示例   \n这个不符合规则的代码示例用 HashMap 将信用卡号和字符串联系在一起，随后尝试取得一个信用卡的卡号字符串。预期的数值是`4111111111111111`，但实际获得的数值是null。   \n```java\n    public final class CreditCard {\n        private final int number;\n\n        public CreditCard(int number) {\n            this.number = (short) number;\n        }\n\n        public boolean equals(Object o) {\n            if (o == this) {\n                return true;\n            }\n            if (!(o instanceof CreditCard)) {\n                return false;\n            }\n            CreditCard cc = (CreditCard) o;\n            return cc.number == number;\n        }\n        public static void main(String[] args) {\n            Map<CreditCard, String> m = new HashMap<CreditCard, String>();\n            m.put(new CreditCard(100), \"4111111111111111\");\n            System.out.println(m.get(new CreditCard(100)));\n        }\n    }\n``` \n造成这一错误行为的原因是 CreditCrad 类覆写了`equlas()`方法，但没有覆写`hashCode()`方法。 因此，默认的`hashCode()`方法对不同的对象返回一个不同的数值，即便这些对象在逻辑上是等同的；这些不同的数值导致了査看不同的散列桶，这阻碍了`get()`方法找到预期的数值。   \n   \n"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: '581:Object Model Violation: Just One of Equals and Hashcode Defined'
      - type: CERT
        value: MET09-J:Classes that define an equals() method must also define a hashCode() method
      - type: SJ/T 11683-2017
        value: 6.5.8 类定义了equals方法但是没有定义hashCode方法
    Obsolete: not
    Default: yes
