    Description: "1) 规定   \n程序必须不能持有锁的时候执行阻塞操作   \n2) 原理   \n当执行耗时的或者阻塞的操作时，持有锁会严重影响系统的性能并且会导致资源不足。此 外，如果无限期阻塞相互关联的线程，会发生死锁。阻塞操作包括网络、文件和控制台 I/O 和对象序列化。将一个线程延时同样会形成阻塞操作。因此，程序必须不能持有锁的时候执行阻塞操作。   \n当 Java 虚拟机与文件系统进行交互时，如果这些操作基于不可靠的网络、文件 I/O 会导致严重性能问题。在这样的情况下，要避免在持有锁时进行基于网络的文件 I/O 操作。   \n3) 示例   \n    1、不符合规则的代码示例（延迟一个线程），该示例定义了一个方法来接受一个time参数。   \n    ```java\n    public synchronized void doSomething(long time)  throws InterruptedException {   \n        // . . .    \n        Thread.sleep(time);   \n    }\n    ```   \n    因为方法是同步的，当挂起线程时，其他线程也不能使用这个类的同步方法。将继续持有当前的对象监视器，因为 `Thread.sleep()`方法缺少同步语义。   \n    对应符合规则的解决方案（内置锁）是：定义一个 `doSomething()`方法，它使用了一个 timeout参数而不是一个time数值。使用 `Object.wait()`方法而不是 `Thread.sleep()`方法会设置一个 timeout 期限，从而由一个通知唤醒线程。   \n    ```java\n    public synchronized void doSomething(long timeout) throws InterruptedException {\n        // ...\n        while (<condition does not hold>) {\n            wait(timeout); // Immediately releases the current monitor\n    ```\n    当前对象的监视器在进入等待的状态时，会被立即释放。在 timeout 期限到达时，线程在获得当前对象的监视器之后会继续执行。   \n    2、不符合规则的代码示例（网络 I/O )，该示例定义了一个`sendPage()`方法，该方法会从服务器发送一个 Page 对象到客户端。当多个线程请求并发访问时，同步这个方法来保护 pageBuff 队列。   \n    ```java\n    // Class Page is defined separately.\n    // It stores and returns the Page name via getName()\n    Page[] pageBuff = new Page[MAX_PAGE_SIZE];\n    \n    public synchronized boolean sendPage(Socket socket, String pageName) throws IOException {\n        // Get the output stream to write the Page to\n        ObjectOutputStream out = new ObjectOutputStream(socket.getOutputStream());\n    \n        // Find the Page requested by the client\n        // (this operation requires synchronization)\n        Page targetPage = null;\n        for (Page p : pageBuff) {\n            if (p.getName().compareTo(pageName) == 0) {\n                targetPage = p;\n            }\n        }\n    \n        // Requested Page does not exist\n        if (targetPage == null) {\n            return false;\n        }\n    \n        // Send the Page to the client\n        // (does not require any synchronization)\n        out.writeObject(targetPage);\n    \n        out.flush();\n        out.close();\n        return true;\n    }\n    ```   \n    在同步`sendPage()`方法中调用`writeObject()`会导致延时，并且在高延时的网络或者当网络条件本身存在丢包现象时，会产生类似死锁的条件。   \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：   \n    将进程分成以下几个步骤：   \n    1）基于需要同步的数据结构执行动作。   \n    1） 创建被发送对象的复制。   \n    3）在一个分离的不同步方法中执行网络调用。   \n    本方案中，不同步的`sendPage()`方法调用同步的`sentPage()`方法来 在 pageBuff 队列中取得请求的 Page。在取得 Page 之后，`sendPage()`方法会调用不同步的 `deliverPage()`方法来将 Page 提交到客户端。   \n    ```java\n    // No synchronization\n    public boolean sendPage(Socket socket, String pageName) {\n        Page targetPage = getPage(pageName);\n    \n        if (targetPage == null) {\n            return false;\n        }\n        return deliverPage(socket, targetPage);\n    }\n    \n    // Requires synchronization\n    private synchronized Page getPage(String pageName) {\n        Page targetPage = null;\n    \n        for (Page p : pageBuff) {\n            if (p.getName().equals(pageName)) {\n                targetPage = p;\n            }\n        }\n        return targetPage;\n    }\n    \n    // Return false if an error occurs, true if successful\n    public boolean deliverPage(Socket socket, Page page) {\n        ObjectOutputStream out = null;\n        boolean result = true;\n        try {\n            // Get the output stream to write the Page to\n            out = new ObjectOutputStream(socket.getOutputStream());\n    \n            // Send the page to the client\n            out.writeObject(page);\n            out.flush();\n        } catch (IOException io) {\n            result = false;\n        } finally {\n            if (out != null) {\n                try {\n                    out.close();\n                } catch (IOException e) {\n                    result = false;\n                }\n            }\n        }\n        return result;\n    }\n    ``` \n4) 特例   \n1、向调用者提供正确终止机制的类可以违反本规则。   \n2、要求多个锁的方法可以在持有若干锁的同时，等待剩余的锁。"
    Advice_En: ''
