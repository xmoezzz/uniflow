        value: C.1.5 限制传递给ZipInputStream 的文件大小
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n应检查`java.util.ZipInputStream`的输入，以防止消耗过多的系统资源。   \n2) 原理   \n当资源使用大大多于输入数据所使用的资源的时候，就会出现拒绝服务问题。当需要解压一个小文件，比如zip、gif 或者gzip编码的HTTP内容，会消耗过多的资源时，并且在压缩率极高的情况下，zip算法的实现本身就会导致zip炸弹（zip bomb）的出现。   \nzip 算法能产生很高的压缩比率。在zip文件中的任何数据，如果其解压后的文件大小超出了一个特定的限制，那么就不应该将它们解压。而这个限制实际上取决于平台的能力。   \n3) 示例   \n下面是一个不符合规则的代码示例，它不能检查解压一个文件时所消耗的资源。它会允许操作完成，或者直至本地资源耗尽为止。   \n    ```java\n    static final int BUFFER = 512;\n    // ...\n    // external data source: filename\n    BufferedOutputStream dest = null;\n    FileInputStream fis = new FileInputStream(filename);\n    ZipInputStream zis = new ZipInputStream(new BufferedInputStream(fis));\n    ZipEntry entry;\n    while ((entry = zis.getNextEntry()) != null) {\n        System.out.println(\"Extracting: \" + entry);\n        int count;\n        byte data[] = new byte[BUFFER];\n        // write the files to the disk\n        FileOutputStream fos = new FileOutputStream(entry.getName());\n        dest = new BufferedOutputStream(fos, BUFFER);\n        while ((count = zis.read(data, 0, BUFFER)) != -1) {\n            dest.write(data, 0, count);\n        }\n        dest.flush();\n        dest.close();\n    }\n    zis.close();\n    ```"
    Description_En: ''
    Advice: "在这个符合规则的方案中，while 循环中的代码会通过使用`ZipEntry.getSize()`方法在解压之前，得到zip文档中需解压文件的大小。如果该解压文件过大，比如说超过100MB，那么抛出异常。   \n    ```java\n    static final int TOOBIG = 0x6400000; // 100MB\n    // ...\n    // write the files to the disk, but only if file is not insanely big\n    if (entry.getSize() > TOOBIG) {\n        throw new IllegalStateException(\"File to be unzipped is huge.\");\n    }\n    if (entry.getSize() == -1) {\n        throw new IllegalStateException(\"File to be unzipped might be huge.\");\n    }\n    \n    dest = new BufferedOutputStream(fos, BUFFER);\n    while ((count = zis.read(data, 0, BUFFER)) != -1) {\n        dest.write(data, 0, count);\n    }\n    ```"
    Advice_En: ''
    References:
