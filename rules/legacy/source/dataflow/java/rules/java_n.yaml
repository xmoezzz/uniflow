  - id: '02000010160021'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.2 面对对象程序安全
      - type: DetailClassChin
        value: C.3.4 不要使用相等操作符比较两个基础数据类型的值
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n不要使用相等操作符比较两个基础数据类型的值。   \n2) 原理   \n    不能直接使用`==`或`!=`操作符比较两个基础数据类型的值，这些操作符比较的是对象引用而不是对象的值。   \n    自动封装基础数据类型的数值需要使用对应的封装器。在自动封装时，这些基础结构数据被内存化：   \n    如果封装的 p 的数值是 true、false、一个字节、一个在\\u0000～\\u007f 范围的 char 数据，或者是一个位于-128～127 的 int 或 short 数据，对 p 的任意两次封装的结果是 rl 和 r2，那么 rl==r2。   \n    \n    | 基础数据类型 | 封装类型 | 完全内存化|\n    | :------: | :------: | :------: |\n    | boolean. byte | Boolean. Byte |是|\n    | char. short. int | Char. Short. Integer |否|\n    使用`==`和`!=`操作符比较两个完全内存化的封装过的基础数据类型的值是允许的。   \n    使用`==`和`!=`操作符比较那些没有完全内存化的封装过的基础结构数据的值，只在这些值在规定的范围内是允许的。   \n    在其他情况下，使用`==`和`!=`操作比较那些封装过的基础数据类型的数值是不允许的。   \n3) 示例   \n    1.这个不符合规则的代码示例：定义的`compare()`方法接收两个封装过的基础数据类型的参数，使用==操作符比较这两个封装过的基础数据类型。这实际上是对封装对象的引用进行比较，而不是对对象的值进行比较。   \n    ```java\n    static Comparator<Integer> cmp=new Comparator<Integer> () {   \n        public int compare(Integer i,Integer j) {   \n      return i <j ? -1 : ( i== j ? 0 : 1 );   \n        }   \n    };\n    ```  \n    "
    Description_En: ''
    Advice: "对应的符合规则的代码示例：使用比较操作符`<`、`>`、`<=`或`>=`比较两个封装过的基础数据类型，这些操作符会自动封装基础数据类型数据。   \n    ```java\n    public int compare(Integer i,Integer j) {   \n        return i <j ? -1 : ( i > j ? 0 : 1 );   \n    } \n    ```\n4) 特例   \n在特殊情况下，如果程序只在单一实现中运行，依赖于该特定实现的内存化数值范围，使用相等操作符比较两个基础数据类型的值是允许的。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 754:Improper Check for Unusual or Exceptional Conditions
      - type: CWE
        value: 398:Indicator of Poor Code Quality
      - type: CERT
        value: EXP03-J:Do not use the equality operators when comparing values of boxed primitives
