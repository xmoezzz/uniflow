  - id: '02000010160055'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.2 面对对象程序安全
      - type: DetailClassChin
        value: C.6.6 确保构造函数不会调用可覆写的方法
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n构造函数只能调用 final或 private的方法，即不可覆写的方法。   \n2) 原理   \n和 C++不同，在创建类的新实例时，Java编程语言没有为方法派生指定变更的规则。如果在初始化的对象的子类中覆写了被调用的方法，则将会使用这些覆写方法，即使新实例还没有完全初始化。   \n在创建对象时调用可覆写的方法可能造成使用未初始化的数据，进而导致执行异常或是预期外的结果。在构造函数中调用可覆写的方法也会在对象创建完成前泄漏 this 引用，这使得其他线程可能访问到未初始化或不一致的数据。因此，构造函数只能调用 final或 private 的方法。   \n3) 示例   \n    这个不符合规则的代码示例中，方法`doLogic()`使用了未初始化的数据。   \n    ```java\n    class Subclass extends Superclass {\n        private String color = null;\n    \n        public Subclass() {\n            super();\n            color = \"Red\";\n        }\n    \n        public void doLogic() {\n            System.out.println(\"This is subclass! The color is :\" + color); // . . .\n            public class Overridable {\n                public static void main(String[] args) {\n                    Superclass be = new Superclass();\n                    // Prints \"This is superclass!\"\n                    Superclass sc = new Subclass();\n                    // Prints \"This is subclass! The color is :null\"\n                }\n            }\n        }\n    }\n    ```\n       \n    "
    Description_En: ''
    Advice: "对应的符合规定的解决方案是：将方法`doLogic()`声明为 final，从而确保`doLogic()`不会被覆写。   \n    ```java\n    class Superclass {\n        public Superclass() {\n            doLogic();\n        }\n    \n        public final void doLogic() {\n            System.out.println(\"This is superclass!\");\n        }\n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CERT
        value: MET05-J:Ensure that constructors do not call overridable methods
    Obsolete: not
    Default: not
    WhiteList: not
    Security: not
