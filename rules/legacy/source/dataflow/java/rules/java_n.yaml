  - id: '02000010160068'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.4 错误处理安全
      - type: DetailClassChin
        value: C.7.6 不要在finally程序段中遗漏可检查异常
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n在 finally 程序段中捕捉并处理可检查异常。   \n2) 原理   \n在 finally 程序段中调用的方法可能会抛出异常。没能捕捉和处理这样的异常会造成整个 try 程序段的非正常终止。这导致了在 try 程序段中抛出异常的丢失，从而阻碍了任何可能的恢复方法去处理这些问题。而且，由于异常改变了程序流程，因此可能不会执行 finally 程序段中在异常抛出后的任何表达式或语句。   \n3) 示例   \n    如下不符合规则的代码示例在 finally 程序段中关闭 reader 对象。程序员错误地假设 finally 程序段中的语句不会抛出异常，因此没能适当地处理可能发生的异常。   \n    ```java\n    public class Operation {\n        public static void doOperation(String some_file) {\n            // ... code to check or set character encoding ...\n            try {\n                BufferedReader reader = new BufferedReader(new FileReader(some_file));\n                try {\n                    // Do operations\n                } finally {\n                    reader.close();\n                    // ... Other cleanup code ...\n                }\n            } catch (IOException x) {\n                // Forward to handler\n            }\n        }\n    }\n    ```   \n       \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：将 `close()`放在 finally 程序段中一个独立的 try-catch 程序段里，从而可以处理潜在的 IOException 并防止它的传递。   \n    ```java\n    public class Operation {\n        public static void doOperation(String some_file) {\n            // ... code to check or set character encoding\n            try {\n                BufferedReader reader = new BufferedReader(new FileReader(some_file));\n                try {\n                    // Do operations\n                } finally {\n                    try {\n                        reader.close();\n                    } catch (IOException ie) {\n                        // Forward to handler\n                    }\n                    // ... Other clean-up code ...\n                }\n            } catch (IOException x) {\n                // Forward to handler\n            }\n        }\n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 398:Indicator of Poor Code Quality
      - type: CERT
