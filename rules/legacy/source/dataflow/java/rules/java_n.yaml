    Description: "1) 规定   \njava.util.Random 类不能用在安全关键应用或存在敏感数据的场合。   \n2) 原理   \n伪随机数生成器（Pseudorandom Number Generator, PRNG）使用确定的数据算法来生 成具有良好统计特性的数字序列，PRNG 通常起始于一个种子数字。算法使用这个种子生成输出数值和一个新种子，新种子用来生成下一个数值，然后依次类推。   \nJava API 提供 `java.util.Random` 类来实现 PRNG，这个 PRNG 是可移植和可重复的。如果`java.util.Random `类的两个实例使用相同的种子，会在所有 Java 实现中生成相同的数值序列。    \n种子有可能泄漏。`java.util.Random` 不能用在安全关键应用或存在敏感数据的场合。在这些场合应该使用更安全的随机数生成器，比如 `java.security.SecureRandom` 类。   \n3) 示例   \n    1.这个不符合规则的代码示例使用了 `java.util.Random` 类，一个指定的种子值生成一个相同的序列，这个数值序列是可被预测的。   \n    ```java\n    import java.util.Random;   \n    // . . .  *   \n    Random number = new Random(123L);   \n    //...   \n    for (int i = 0; i < 20; i++) {   \n        // Generate another random integer in the range [0, 20] int n = number.nextlnt(21);   \n        System.out.printIn(n);   \n    }\n    ```"
    Description_En: ''
    Advice: "这个符合规则的代码示例使用 `java.security.SecureRandom `类来生成高质量的随机数。\n    ```java\n    import java.security.SecureRandom;   \n    import java.security.NoSuchAlgorithmException;   \n    // . . .    \n    public static void main (String args(1){ \n        try {   \n            SecureRandom number = SecureRandom.getlnstance(\"SHA1PRNG\"); // Generate 20 integers 0..20 \n            for (int i =   0; i < 20; i++) {   \n                System.out.println(number.nextlnt(21));   \n            }   \n        } catch (NoSuchAlgorithmException nsae) {   \n            // Forward to handler\n    ```"
    Advice_En: ''
