      - type: DetailClassChin
        value: C.13.2 使用合适的访问权限创建文件
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n必须使用能避免越权访问的权限来创建文件。   \n2) 原理   \n多用户系统中的文件通常为一个特定的用户所有。文件的所有者会指定系统中的用户可以访问这些文件的内容。   \n这些文件系统使用一个特权和权限系统来保护文件的访问。当创建一个文件时，文件的访问权限决定了谁能访问和操作这个文件。当一个程序使用不充分的限制性的访问权限创建文件时，攻击者可以在程序修改权限之前读取或修改文件。   \n3) 示例   \n    在 FileOutputStream 和 FileWriter 的构造方法中，不允许开发者直接指定文件的访问权限。在下面这个不符合规则的代码示例中，任何创建文件的访问权限都是由具体实现决定的，这可能会允许来授权的访问。   \n    ```java\n    Writer out = new FileWriter(\"file\");\n    ```   \n    Java SE 7 新的 I/O 类库提供了管理文件访问权限的类。另外，很多创建文件的方法和构造函数接受一个参数，从而允许程序来指定初始的文件权限。   \n    方法 `Files.newByteChannel()`允许使用指定的权限创建文件。这个方法和平台无关，但是实际的权限和平台有关。"
    Description_En: ''
    Advice: "对应的符合规则的方案为 POSIX 平台定义了足够的权限。   \n    ```java\n    Path file = new File(\"file\").toPath();   \n       \n    // Throw exception rather than overwrite existing file    \n    Set<OpenOption> options = new HashSet<OpenOption>();   \n    options.add(StandardOpenOption.CREATE_NEW);    \n    options.add(StandardOpenOption.APPEND);   \n    // File permissions should be such that only user may read/write file    \n    Set<PosixFilePermission> perms =PosixFilePermissions.fromString(\"rw-------\");   \n    FileAttribute<Set<PosixFilePermission>> attr =PosixFilePermissions.asFileAttribute(perms);   \n    try (SeekableByteChannel sbc =Files.newByteChannel(file, options, attr)) {   \n      //write data   \n    }\n    ``` \n4) 特例   \n**特例 1**：当在一个安全和对非受信用户不可读的目录中创建文件的时候，可以使用默认 的访问权限创建。例如整个文件系统是可信的，或者仅受信用户可访问。   \n**特例 2**：那些不含有特权信息的文件不需要使用指定的访问权限创建。"
    Advice_En: ''
