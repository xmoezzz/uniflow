        value: C.7.2 不能允许异常泄露敏感信息
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n在异常传递的过程中，必须对敏感信息进行过滤，防止敏感信息泄露。   \n2) 原理   \n在异常传递的过程中，如果不对敏感信息进行过滤，常会导致信息泄露，这将有助于攻击者实现对系统的攻击。一个攻击者可以通过精心设计的输入参数来得到应用程序的内部数据结构或机制。异常的文本和异常的类型都可以泄漏信息。   \n这条规则同时适用于服务器端和客户端应用。攻击者不单只可以从易受攻击的网络服务器收集敏感信息，也可以从使用这些网络服务器的用户网络浏览器那里得到敏感信息。   \n所有异常都能提供信息，这会帮助攻击者完成对系统的拒绝服务（Dos）攻击。因此，程序员必须过滤能传递出可信任边界的异常信息和异常类型。   "
    Description_En: ''
    Advice: "\n3) 示例   \n  \n**例 1** 如下不符合规则的代码示例中，程序需要读取一个用户提供的文件，但是文件系统的内容和布局是敏感的。这个程序接受一个文件名作为参数，却没能防止潜在的异常会将敏感信息展现给用户。   \n```java\nclass ExceptionExample {   \n  public static void main(String[] args) throws FileNotFoundException {   \n    // Linux stores a user's home directory path in   \n    // the environment variable $HOME, Windows in %APPDATA%   \n    FilelnputStream fis =  new FilelnputStream(System.getenv(\"APPDATA\") + args[0]);   \n  }   \n}\n```   \n\n**例 2** 如下不符合规则的代码示例将异常记入日志，并在重新抛出前将其封装在一个更普通的异常中。   \n```java\ntry {   \n    FileInputStream fis =  new FilelnputStream(System.getenv(\"APPDATA\") + args[0]；   \n} catch (FileNotFoundException e) {   \n    // Log the exception   \n    throw new IOException(\"Unable to retrieve file\", e);   \n}\n```   \n\n**例 3** 如下不符合规则的代码示例将异常记入日志，抛出一个自定义的异常，并没有将FileNotFoundException 异常封装在其中。   \n```java\nclass SecuritylOException extends IOException {/* ... */};    \ntry {   \n    FilelnputStream fis =   new FilelnputStream(System.getenv(\"APPDATA\") + args[0]);   \n} catch (FileNotFoundException e) {   \n    // Log the exception   \n    throw new SecurityIOException();   \n}\n```   \n   \n对应于上述三个不符合规则的方案可以采用下述符合规则的方案，该方案实现了一个安全策略，用户只能打开 `c:\\homepath` 中的文件，并且不允许用户发现这个目录之外的文件。当文件不能打开或不在正确的目录内时，返回一个简洁的错误信息。`c:\\homepath` 目录外文件的任何信息都被屏蔽了。   \n```java\nclass ExceptionExample {   \n    public static void main(String[] args) {   \n        File file = null;    \n        try {   \n            file = new File(System.getenv(\"APPDATA\") + args[0]) .getCanonicalFile ();    \n            if (!file.getPath().startsWith(\"c:Whomepath\")) {   \n                System.out.printIn(\"Invalid file\"); return;   \n            }   \n        } catch (IOException x) {   \n            System.out.printIn(\"Invalid file\");    \n            return;   \n        }   \n        try {   \n            FilelnputStream fis = new FilelnputStream(file);    \n        } catch (FileNotFoundException x) {   \n            System.out.printIn(\"Invalid file\"); return;   \n        }   \n    }   \n}\n```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 600:Uncaught Exception in Servlet
      - type: CWE
        value: 431:Missing Handler
      - type: CWE
        value: 248:Uncaught Exception
      - type: CWE
        value: 209:Information Exposure Through an Error Message
      - type: OWASP TOP 10
        value: 2007:A6 Information Leakage and Improper Error Handling
      - type: CWE/SANS TOP 25
        value: 2010:Insecure Interaction - CWE ID 209
      - type: CWE/SANS TOP 25
        value: 2009:Insecure Interaction - CWE ID 209
