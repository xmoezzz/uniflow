      - type: DetailClassChin
        value: C.6.3 不要使用弃用的或过时的类和方法
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n不要在新代码中使用弃用的或过时的类和方法。同时必须避免在多线程应用中使用具有特殊限制的类和方法。   \n2) 原理   \nJava SE 6文档提供了一个完整的弃用 API的列表。Java还提供了`@deprecated`注释来表示弃用的成员、方法和类。 不应该使用过时的字段、方法和类。Java没有提供注释来说明过时。然而，一些类和方法是被注明为过时的。此外，一些类和方法强调了使用它们时，具有特殊的限制。例如，抽象类`java.text.Format`的所有子类是非线程安全的。必须避免在多线程应用中使用这些类。"
    Description_En: ''
    Advice: "\n3) 示例   \n    不能使用以下的方法和类：\n     \n    | 类或者方法 | 替换 | 规则|\n    | :------: | :------: | :------: |\n    | java.lang.Character.isJaveLetter() | java.lang.Character.isJavaIdentifierStart() |  |\n    | java.lang.Character.isJaveLetterOrDigit() | java.lang.Character.isJavaIdentifierPart() |  |\n    | java.lang.Character.isSpace() | java.lang.Character.isWhitespace() |  |\n    | java.lang.Class.newlnstance() | java.lang.reflect.Constructor.newInstance() | ERR06-J |\n    | java.util.Date （多个方法） | java.util.Calendar |  |\n    | java.util.Dictionary  | java.util.Map<K,V>  |  |\n    | java.util.Proerties.save() | java.util.Properties.store() |  |\n    | java.lang.Thread.run() | java.lang.Thread.start() |  |\n    | java.lang.Thread.stop() | java.lang.Thread.interrupt() |  |\n    | java.lang.ThreadGroup （多个方法） | java.util.concurrent.Executor |  |\n    Java 虚拟机 Profiler Interface (JVM PI)和 JVM Debug Interface (JVM DI)也是被弃用的，它们已经被 JVM Tool Interface (JVM TI)所替代。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 477:Use of Obsolete Functions
      - type: CERT
        value: MET02-J:Do not use deprecated or obsolete classes or methods
