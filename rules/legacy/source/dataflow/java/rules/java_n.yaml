    Description: "1) 规定   \n不要使用空的无限循环。   \n2) 原理   \n一个空的无限循环会消耗大量的 CPU 计算资源，而不起任何作用。优化编译器和即时系统 (JIT)允许去除这样的循环。   \n3) 示例   \n    1.这个不符合规则的代码示例实现了一个闲置任务，这个任务会连续地执行一个循环，却在这个循环中不执行任何指令。   \n    ```java\n    public int nop () {   \n        while (true) {\n            \n        }   \n    }\n    ```   \n       \n    "
    Description_En: ''
    Advice: "相应的符合规则的代码示例：通过在 while 循环中调用 `Thread.sleep()`方法来避免这个无限循环。   \n    ```java\n    public final int DURATION=10000; // in milliseconds   \n    public void nop() throws InterruptedException { \n        while (true) { 4   \n            // Useful operations Thread.sleep(DURATION);   \n        }   \n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 835:Loop with Unreachable Exit Condition ('Infinite Loop')
      - type: CERT
        value: MSC01-J:Do not use an empty infinite loop
