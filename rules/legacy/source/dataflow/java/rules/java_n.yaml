        value: C.13.5 在不需要时关闭资源
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n输出流在使用后应当及时关闭。   \n2) 原理   \nJava 调用垃圾回收器来释放没有引用且没有被释放的内存。然而，垃圾回收器不能释放那些非内存资源，例如打开的文件描述符和数据库连接。因此，如果不能释放这样的资源会导致资源耗尽攻击。   \n3) 示例   \n  \n    **例 1** 这个不符合规则的代码示例打开并使用一个文件，但没有显示关闭这个文件。   \n    ```java\n    public int processFile(String fileName)    \n                  throws IOException, FileNotFoundException {    \n        FilelnputStream stream = new FilelnputStream(fileName);   \n        BufferedReader bufRead =new BufferedReader(new InputStreamReader(stream));   \n        String line;   \n        while ((line = bufRead.readLine() )!= null) {   \n            sendLine(line);   \n        }   \n        return 1;   \n    }\n    ```   \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：释放所有获取的资源，而不管是否会抛出任何异常。尽管对 bufRead的解引用会导致异常，但 FilelnputStream 对象还是按照需要关闭。   \n    ```java\n    try {   \n        final FilelnputStream stream = new FilelnputStream(fileName);   \n        try {   \n            final BufferedReader bufRead =new BufferedReader(new InputStreamReader(stream));    \n            String line;   \n            while ((line = bufRead.readLine()) != null) {   \n                sendLine(line);   \n            }   \n            } finally {   \n                if (stream != null) {    \n                    try {   \n                        stream.close();   \n                    } catch (IOException e) {   \n                        // forward to handler   \n                    }   \n                }   \n            }   \n        } catch (IOException e) {    \n            // forward to handler   \n        }\n    ```   \n      \n    **例 2** 在使用数据库连接的情况下，资源池耗尽的问题会更严重。许多数据库服务器仅允许限量连接，这取决于配置和许可证的情况。不能释放数据库连接会导致可用连接快速耗尽。在执行 SQL 语句或者在处理相关的结果时，这个不符合规则代码示例没有关闭连接。   \n    ```java\n    public void getResults(String sqlQuery) {    \n        try {   \n            Connection conn = getConnection();   \n            Statement stmt = conn.createStatement();   \n            ResultSet rs = stmt.executeQuery(sqlQuery);    \n            processResults(rs);    \n            stmt.close();   \n            conn.close ();   \n        } catch (SQLException e) { /* forward to handler */ \n        }   \n    }\n    ```   \n    对应的符合规则的解决方案是：使用 try-with-resource，这个方法是在 Java SE 7 中引入的，用来保证资源按照要求释放。   \n    ```java\n    try (Connection conn = getConnection();Statement stmt = conn.createStatement();   \n        ResultSet rs = stmt.executeQuery(sqlQuery) ) {   \n        processResults(rs);   \n    } catch (SQLException e) {   \n      // forward to handler   \n    }\n    ```   \n      \n    **例 3**这个不符合规则的代码示例想要通过在 finally代码块中加入清理代码来解决数据库连接造成的资源耗尽问题。然而，`rs`、`stmt`、或者`conn`可以是 null,从而在 finally 代码块中抛出 NullPointerException   \n    异常。   \n    ```java\n    Statement stmt = null;   \n    ResultSet rs = null;   \n    Connection conn = getConnection();   \n    try {   \n          stmt = conn.createStatement();    \n          rs = stmt.executeQuery(sqlQuery);   \n          processResults(rs);   \n    } catch(SQLException e) {   \n        // forward to handler    \n    } finally {    \n          rs.close ();    \n          stmt.close ();    \n          conn.close ();   \n    }\n    ```   \n    对应的符合规则的解决方案是：保证资源按照要求释放。   \n    ```java\n    Statement stmt = null;   \n    ResultSet rs = null;   \n    Connection conn = getConnection();    \n    try {   \n          stmt = conn.createStatement();   \n          rs = stmt.executeQuery(sqlQuery);    \n          processResults(rs);   \n    } catch (SQLException e) {   \n        // forward to handler    \n    } finally {    \n        try {   \n            if (rs != null) {\n                rs.close();\n            }   \n        } catch (SQLException e) {   \n            // forward to handler    \n        } finally {    \n            try {   \n            if (stmt != null) {\n                stmt.close();\n            }   \n            } catch (SQLException e) {   \n                // forward to handler    \n            } finally {    \n                try {   \n                    if (conn != null) {\n                        conn.close();\n                    }    \n                } catch (SQLException e) {   \n                // forward to handler   \n                }   \n            }   \n        }   \n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 775:Missing Release of File Descriptor or Handle after Effective Lifetime
      - type: CWE
        value: 772:Missing Release of Resource after Effective Lifetime
      - type: CWE
        value: 459:Incomplete Cleanup
      - type: CWE
        value: 404:Improper Resource Shutdown or Release
      - type: CERT
        value: FIO04-J:Close resources when they are no longer needed
      - type: OWASP TOP 10
        value: 2004:A9 Application Denial of Service
      - type: CWE/SANS TOP 25
        value: 2019:CWE ID 772
      - type: CWE/SANS TOP 25
        value: 2009:Risky Resource Management - CWE ID 404
      - type: SJ/T 11683-2017
        value: 6.6.1 资源泄漏
