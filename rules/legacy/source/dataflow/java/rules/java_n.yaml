  - id: '02000010160071'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.4 错误处理安全
      - type: DetailClassChin
        value: C.7.9 不要捕捉NullPointerException或任何它的基类
    Categories_En:
      Category: []
    BugServerity: 5
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n程序不能捕捉 java.lang.NullPointerException 以及任何它的基类。   \n2) 原理   \n一个运行期间抛出的 NullPointerException 异常表明存在一个对空引用的解引用，这是必须在应用代码中解决的。通过捕捉 NullPointerException 来处理这样的问题，而不对根本的原因进行处理是不合适的。   \n类似，程序不能捕捉 RuntimeException、Exception 或 Throwable。   \n3) 示例   \n    **例 1** 如下不符合规则的代码示例定义了`isName()`方法，这个方法接受一个 String 参数并在字符串是有效名字时返回 true。一个有效名字是由空格隔开的两个大写开头的词组成的。这个方法捕捉了NullPointerException 并返回 false,而不是去检査给出的字符串是否是空引用。   \n    ```java\n    boolean isName(String s) {\n        try {\n            String names[] = s.split(\"\");\n    \n            if (names.length != 2) {\n                return false;\n            }\n            return (isCapitalized(names[0]) && isCapitalized(names[1]));\n        } catch (NullPointerException e) {\n            return false;\n        }\n    }\n    ```   \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：明确检测  String 参数是否为空引用，而不是捕捉NullPointerException。\n    ```java    \n    boolean isName(String s) {\n        if (s == null) {\n            return false;\n        }\n        String names[] = s.split(\"\");\n        if (names.length != 2) {\n            return false;\n        }\n        return (isCapitalized(names[0]) && isCapitalized(names[1]));\n    }\n    ```   \n      \n    **例 2**如下不符合规则的代码示例尝试通过捕捉 ArithmeticException 来解决问题。然而，代码仍然捕捉 Exception，从而同时捕捉了预期外的可检査异常和运行期异常。   \n    ```java\n    try (   \n        division (200, 5);   \n        division(200, 0); // Divide by zero    \n    } catch (ArithmeticException ae) {    \n        throw new DivideByZeroException();   \n    } catch (Exception e) {   \n        System.out.println(\"Exception occurred :\" + e.getMessage());   \n    }\n    ```   \n       \n    对应的符合规则的解决方案是：只捕捉具体的预期内的异常(ArithmeticException和 IOException）, 并允许其他异常在调用栈中向上传递。   \n    ```java\n    import java.io.IOException;\n    \n    public class DivideException {\n        public static void main(String[] args) {    \n        try {   \n          division(200, 5);   \n          division(200, 0); // Divide by zero    \n        } catch (ArithmeticException ae) {   \n          // DivideByZeroException extends Exception so is checked    \n          throw new DivideByZeroException();   \n        } catch (IOException ex) {   \n          ExceptionReporter.report(ex);   \n          }\n    \n        public static void division(int totalSum,int totalNumber) throws ArithmeticException, IOException {\n            int average = totalSum / totalNumber;\n            // Additional operations that may throw IOException...\n            System.out.println(\"Average: \" + average);\n        }\n    }\n    ```\n   \n4) 特例   \n**特例 1**：—个 catch 程序段是可以捕捉所有的异常并进行处理的，随后会再重新抛出。例如，在调用栈离开可信任区域前过滤异常中的敏感信息。   \n**特例 2**：当处理任务的线程如线程池中的工作线程或 Swing 事件分派线程通过如 Runable 接口的抽象调用不可信任的代码时，它们是允许捕捉 RuntimeException 的。    \n**特例 3**：需要大量容错能力或要求降低性能运行的系统是允许在适当的抽象层捕捉并 记录类似于Throwable 的普通异常的。"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 395:Use of NullPointerException Catch to Detect NULL Pointer Dereference
      - type: CERT
        value: ERR08-J:Do not catch NullPointerException or any of its ancestors
      - type: OWASP TOP 10
        value: 2007:A6 Information Leakage and Improper Error Handling
      - type: OWASP TOP 10
        value: 2004:A7 Improper Error Handling
      - type: SJ/T 11683-2017
        value: 6.4.3 捕捉运行时异常
