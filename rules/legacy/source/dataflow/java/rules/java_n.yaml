  - id: '02000010160087'
    language: Java
    Type: YD/T 3464-2019
    Categories:
      Category:
      - type: ClassChin
        value: 污点规范
      - type: SubClassChin
        value: 6.3 并发程序安全
      - type: DetailClassChin
        value: C.9.9 在异常条件时，保证释放已经持有的锁
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n在发生异常条件的情况下，程序必须释放当前持有的锁。   \n2) 原理   \n一个异常条件会阻碍释放锁，从而导致死锁。   \n根据 Java API的描述: 一个ReentnmtLock是由一个成功地执行了锁定但没有执行解锁操作的线程所拥有的，如果没有其他的线程持有锁，一个调用 Lock 的线程会成功的获得锁并返回。   \n因此，一个在任何线程中没有被释放的锁会阻止其他线程得到这个锁。在发生异常条件的情况下，程序必须释放当前持有的锁。在异常条件下（例如线程的非正常终结），被方法块和代码块同步使用的类对象的内置锁会自动释放。   \n3) 示例   \n    1、不符合规则的代码示例（可检查异常），该示例使用 ReentrantLock 来保护资源，当对打开的文件进行操作而发生异常时，却不能释放持有的锁。当抛出一个异常时，控制权会移交给 catch 代码块，并且 `unlock()`方法的调用不会成功。   \n    ```java\n    public final class Client {\n        public void doSomething(File file) {\n            final Lock lock = new ReentrantLock();\n            InputStream in = null;\n            try {\n                lock.lock();\n                in = new FileInputStream(file);\n                // Perform operations on the open file\n                lock.unlock();\n            } catch (FileNotFoundException x) {\n                // Handle exception\n            } finally {\n                if (in != null) {\n                    try {\n                        in.close();\n                    } catch (IOException x) {\n                        // Handle exception\n                    }\n                }\n    ```  \n       \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案（finally 代码块）是：在成功地执行锁定操作之后，将可能抛出异常的操作封装在 try 代码块中。这个锁在执行 try 代码块之前获得，这可以保证当执行 finally 代码块时，可以持有锁。在 finally 代码块中调用 `Lock.unlock()`方法，可以保证不管是否发生一个异常，总会释放锁。   \n    ```java\n    public final class Client {\n        public void doSomething(File file) {\n            final Lock lock = new ReentrantLock();\n            InputStream in = null;\n            try {\n                lock.lock();\n                in = new FileInputStream(file);\n                // Perform operations on the open file\n                lock.unlock();\n            } catch (FileNotFoundException x) {\n                // Handle exception\n            } finally {\n                lock.unlock();\n                if (in != null) {\n                    try {\n                        in.close();\n                    } catch (IOException x) {\n                        // Handle exception\n                    }\n                }\n            }\n    ```    \n       \n    另一个符合规则的解决方案是：围绕执行惯用法（`execute-aroimd idiom)`提供一个通用的机制来完成资源的分配并且进行清理操作，这样一个客户可以专注于那些必需的功能上。该惯用法减少了客户代码中的碎片，并且为管理资源提供了一个安全机制。   \n    本示例中，客户的`doSomething()`方法仅提供了必需的功能，是通过实现 LockAction 接口的`doSomethingWithFile()`方法来实现的，并且这个实现不需要管理锁的获取和释放， 也不需要管理文件的打开或关闭操作。这个 ReentrantLockAction 类封装了所有的资源管理动作。   \n    ```java\n        public interface LockAction {\n            void doSomethingWithFile(InputStream in);\n        }\n    \n        public final class ReentrantLockAction {\n            private static final Lock lock = new ReentrantLock();\n    \n            public static void doSomething(File file, LockAction action) {\n                InputStream in = null;\n                lock.lock();\n                try {\n                    in = new FileInputStream(file);\n                    action.doSomethingWithFile(in);\n                } catch (FileNotFoundException fnf) {\n                    // Forward to handler\n                } finally {\n                    lock.unlock();\n    \n                    if (in != null) {\n                        try {\n                            in.close();\n                        } catch (IOException e) {\n                            // Forward to handler\n                        }\n                    }\n                }\n            }\n        }\n    \n        public final class Client {\n            public void doSomething(File file) {\n                ReentrantLockAction.doSomething(file, new LockAction() {\n                    public void doSomethingWithFile(InputStream in) {\n                        // Perform operations on the open file\n                    }\n                });\n    ```   \n       \n    2、不符合规则的代码示例（未经检查的异常），该示例使用了一个 ReentrantLock 来保护一个`java.util.Date`实例。   \n    ```java\n    final class DateHandler {\n    \n        private final Date date = new Date();\n    \n        private final Lock lock = new ReentrantLock();\n    \n        // str could be null\n        public void doSomething(String str) {\n            lock.lock();\n            String dateString = date.toString();\n            if (str.equals(dateString)) {\n                // ...\n            }\n            // ...\n    \n            lock.unlock();\n        }\n    }\n    ```   \n    发生一个执行期异常，因为 `doSomething()`方法不能检査 str 是否是一个空引用，从而阻止了锁的释放。   \n       \n    对应符合规则的解决方案（finally 代码块）是：封装所有的操作，这些操作会在 try 代码块中抛出异常，并且释放那些在关联代码块中的锁。因此，甚至在一个执行期异常事件中，也会释放锁。   \n    ```java\n    final class DateHandler {\n    \n        private final Date date = new Date();\n    \n        private final Lock lock = new ReentrantLock();\n    \n        // str could be null\n        public void doSomething(String str) {\n            lock.lock();\n            try {\n                String dateString = date.toString();\n                if (str != null && str.equals(dateString)) {\n                    // ...\n                }\n                // ...\n    \n            } finally {\n                lock.unlock();\n            }\n        }\n    }\n    ```   \n    `doSomething()`方法同样避免抛出一个 NullPointerException 异常，可以通过保证这个字符串不包含一个空引用来实现。"
