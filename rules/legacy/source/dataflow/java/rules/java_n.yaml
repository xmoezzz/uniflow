        value: C.1.4 不要记录未经净化的用户输入
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n   \n不要将未经净化的用户输入写入日志，以防止向受信边界之外泄露敏感数据或违反本地的安全规则。   \n2) 原理：   \n当日志条目包含未经净化的用户输入时会引发记录注入漏洞。恶意用户会插入伪造的日志数据，从而让系统管理员以为是系统行为。例如，用户在将冗长的日志记录拆分成两份时，日志中使用的回车和换行符可能会被误解。记录注入攻击可以通过对任何非受信的发送到日志的输入进行净化和验证来阻止。   \n将未经净化的用户输入写入日志同样会导致向受信边界之外泄露敏感数据，或者在存储敏感数据的时候，违反了本地的安全规则。   \n3) 示例   \n    从这个不符合规则的代码示例中，可以看到在接收到非法请求的时候，会记录用户的用户名。这时没有执行任何输入净化。   \n    ```java\n    if (loginSuccessful) {   \n        logger.severe(\"User login succeeded for: \" + username);   \n    } else {   \n        logger.severe(\"User login failed for: \" + username);   \n    }\n    ```   \n    如果没有净化，那么可能会出现日志注入攻击。   \n    "
    Description_En: ''
    Advice: "对应的符合规定的方案在登录之前会净化用户名输入，从而防止注入攻击。\n    ```java\n    if (!Pattern.matches(\"[A-Za-z0-9_]+\", username)) {\n        // Unsanitized username\n        logger.severe(\"User login failed for unauthorized user\");\n    } else if (loginSuccessful) {\n        logger.severe(\"User login succeeded for: \" + username);\n    } else {\n        logger.severe(\"User login failed for: \" + username);\n    }\n    ```"
    Advice_En: ''
    References:
