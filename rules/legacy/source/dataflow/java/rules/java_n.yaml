      - type: DetailClassChin
        value: C.9.2 不要基于那些可能被重用的对象进行同步
    Categories_En:
      Category: []
    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n程序不要基于那些会被重用的对象进行同步。   \n2) 原理   \n错误地使用那些同步的基础数据类型是并发问题的一个常见来源。基于那些可能被重用的对象进行同步，会导致死锁和不确定的行为。因此，程序不要基于那些会被重用的对象进行同步。   "
    Description_En: ''
    Advice: "\n3) 示例   \n    1、不符合规则的代码示例（布尔型的锁对象），该示例基于一个布尔型的锁对象实现同步。   \n    ```java\n    private final Boolean initialized = Boolean.FALSE;   \n    public void doSomething() {   \n        synchronized (initialized) {   \n            // ...   \n        }   \n    }\n    ```   \n    Boolean 类型不太适合作为锁来使用，因为它只允许两个值：true 和 false。包含相同数值的 Boolean数据，并且在 Java 虚拟机中共享一个 Boolean 类实例。如果在其他任何代码中，不经意地使用了具有这个 Boolean 类型进行同步，这个锁实例会被重用，并且系统会失去响应或者产生死锁。   \n       \n    2、不符合规则的代码示例（封装过的基础数据类型），该示例使用封包的 Integer 对象实现锁操作。   \n    ```java\n    int lock = 0;   \n    private final Integer Lock = lock; // Boxed primitive Lock is shared   \n    public void doSomething() {   \n        synchronized (Lock) {\n            // . . .    \n        }   \n    }\n    ```   \n    封装过的数据类型会使用整形范围内的同一个实例，因此，它们会遇到与 Boolean 常数同样的重用问题。当将这个数据表示成一个字节时，会重用封装器对象。当使用一个和经过封包的 Interger 封装器对象联系在一起的内置锁时，会产生不安全性。   \n       \n    对应上述情形的符合规则的解决方案（整形）是：基于一个没有封包的整型来使用锁，这是使用私有锁对象技巧的一种变形。在 `doSomething()`方法中，使用 Integer 实例的内置锁 Lock 进行同步。   \n    ```java\n    int lock = 0;   \n    private final Integer Lock = new Integer(lock);   \n    public void doSomething() {   \n        synchronized (Lock) {   \n            // ...\n        }\n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CERT
        value: LCK01-J:Do not synchronize on objects than may be reused
