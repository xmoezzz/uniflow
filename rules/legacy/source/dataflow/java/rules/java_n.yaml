      - type: DetailClassChin
        value: C.12.1 不要使用非线程安全方法来覆写线程安全方法
    Categories_En:
      Category: []
    BugServerity: 1
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n程序禁止使用非并发安全的方法来覆写线程安全方法。   \n2) 原理   \n当一个依赖于基类提供线程安全的客户无意中对子类的实例进行操作时，如果使用对并发不安全的方法来覆写线程安全方法，那会导致不恰当的同步。比如，如果子类提供了对并发操作不安全的实现，那么可能会违反一个被覆写的同步方法的合约。这样的覆写很容易造成难以诊断的错误。   \n如果被设计成可继承的类，那么它们所用的锁策略应该要详细记录。随后这些信息可以用于决定适合子类的锁策略。   \n3) 示例   \n    **例 1** 这个不符合规则的代码示例在 Derived 类中使用一个非同步方法覆写了 Base 类中的同步方法   \n    ```java\n    class Base {\n        public synchronized void doSomething() {\n            // ...\n        }\n    }\n    \n    class Derived extends Base {\n        @Override\n        public void doSomething() {\n            // ...\n        }\n    }\n    ```  \n    Base 类中的 `doSomething()`方法可以安全地被多个线程使用，但这并不适用于 Deiced 子类的实例。   \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：同步子类中的 `doSomething()`方法。   \n    ```java\n    class Base {\n        public synchronized void doSomething() {\n            // ...\n        }\n    }\n    \n    class Derived extends Base {\n        @Override\n        public synchronized void doSomething() {\n            // ...\n        }\n    }\n    ```    \n    **例 2** 这个不符合规则的代码示例在 Base 类中定义的 `doSomething()`方法使用了一个私有的 final锁对象。   \n    ```java\n    class Base {\n        private final Object lock = new Object();\n    \n        public void doSomething() {\n            synchronized (lock) {\n                // ...\n            }\n        }\n    }\n    \n    class Derived extends Base {\n        Logger logger = // Initialize  \n    \n        @Override\n        public void doSomething() {\n            try {\n                super.doSomething();\n            } finally {\n                logger.log(Level.FINE, \"Did something\");\n            }\n        }\n    }\n    ``` \n    多个线程有可能会造成记入日志的条目有着和任务执行不一样的顺序。因此， Derived 类的`doSomething()`方法是非线程安全的，不能安全地被多个线程调用。   \n    对应的符合规则的解决方案是：使用自己的私有 fianl 锁对象来同步子类的 `doSomething()`方法。   \n    ```java\n    class Base {\n        private final Object lock = new Object();\n    \n        public void doSomething() {\n            synchronized (lock) {\n                // ...\n            }\n        }\n    }\n    \n    class Derived extends Base {\n        private final Object lock = new Object();\n    \n        @Override\n        public void doSomething() {\n            synchronized (lock) {\n                try {\n                    super.doSomething();\n                } finally {\n                    logger.log(Level.FINE, \"Did something\");\n                }\n            }\n        }\n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CERT
        value: TSM00-J:Do not override thread-safe methods with methods that are not thread-safe
