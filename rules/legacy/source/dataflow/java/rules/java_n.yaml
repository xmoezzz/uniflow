    BugServerity: 3
    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n程序不应使用实例锁来保护静态共享数据   \n2) 原理   \n程序不应使用实例锁来保护静态共享数据，原因在于实例锁在两个或者多个实例的情况下是无效的。因此，如果不使用一个静态的锁对象，会导致共享状态在并发进入时是不被保护的。与非受信代码交互的类的锁对象必须同样是私有和 final 的。   \n3) 示例   \n    1、不符合规则的代码示例（静态数据的非静态锁对象），该示例想要通过使用一个非静态的锁对象来保护静态`counter`字段的进入。当启动两个 Runnable 任务时，它们创建了两个锁对象的实例，并且分别基于每一个实例进行锁定。   \n    ```java\n    public final class CountBoxes implements Runnable {\n        private static volatile int counter;\n        // . . .\n        private final Object lock = new Object();\n    \n        @Override\n        public void run() {\n            synchronized (lock) {\n                counter++;\n                // . . .\n            }\n        }\n    \n        public static void main(String[] args) {\n            for (int i = 0; i < 2; i++) {\n                new Thread(new CountBoxes()).start();\n            }\n    ```   \n    代码不能防止线程得到一个不一致的`counter`的数值，因为 volatile 字段的递增操作不是原子性的。   \n       \n    2、不符合规则的代码示例（基于静态数据的方法同步），该示例使用方法同步来保护静态类字段`counter`的访问。   \n    ```java\n    public final class CountBoxes implements Runnable {\n        private static volatile int counter;\n    \n        // . . .\n        public synchronized void run() {\n            counter++;\n            // . . .\n        }\n        // . . .\n    }\n    ```  \n    本示例中，方法同步使用了内置锁，这个内置锁是与每一个类实例相关联的，而不是与 类本身相关联的内置锁。因此，使用不同的 Runnable 实例创建出来的线程，可能会观察到不一致的`counter`数值。   \n       \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：通过基于静态对象实现的锁来保证递增操作的原子性。   \n    ```java\n    public class CountBoxes implements Runnable {\n        private static int counter;\n        // . . .\n        private static final Object lock = new Object();\n    \n        public void run() {\n            synchronized (lock) {\n                counter++;\n                // . . .\n            }\n        }\n    ```  \n    当使用同步的时候，没有必要声明`counter`变量是 volatile 的。"
