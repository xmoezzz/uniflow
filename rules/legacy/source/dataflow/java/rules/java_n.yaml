      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \n不能和 NaN 进行直接比较，防止无序特性产生意外结果。   \n2) 原理   \n因为 NaN (Not-a-Number,非数值）是无序的，所以当一个或两个操作数是 NaN 时，数值 比较符 `<`、`<=`、`>=`和 `>=`会返回 false。当任意一个操作数是 NaN,相等运算符`==`会返回 false,当任意一个操作数是NaN，不等运算符`!=`会返回 true。因为无序的特性常常导致意外结果，所以不能和 NaN 进行直接比较。   \n3) 示例   \n    如下不符合规则的代码示例尝试和 NaN 进行直接比较。根据 NaN 的语义，所有和 NaN 的比较会返回 false (除`!=`运算符返回 true 之外）。因此，代码中的比较只会返回 false,并且不会输出`“result is NaN”`。   \n    ```java\n    public class NaNComparison {   \n        public static void main(String[] args) {    \n            double x = 0.0;   \n            double result = Math.cos(1/x); // returns NaN if input is infinity    \n            if (result == Double.NaN) { // comparison is always false!   \n                System.out.printIn(\"result is NaN\");   \n            }   \n        }   \n    }\n    ```  \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案是：使用方法 `Double.isNaN()`来检测表达式是否是一个 NaN 数值。   \n    ```java\n    public class NaNComparison {   \n        public static void main(String[] args) {    \n            double x = 0.0;   \n            double result = Math.cos(1/x); // returns NaN when input is infinity    \n            if (Double.isNaN(result)) {   \n                System.out.println(\"result is NaN\");   \n            }   \n        }   \n    }\n    ```"
    Advice_En: ''
    References:
      Reference:
      - type: CWE
        value: 486:Comparison of Classes by Name
      - type: CERT
        value: NUM07-J:Do not attempt comparisons with NaN
