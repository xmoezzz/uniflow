        value: 754:Improper Check for Unusual or Exceptional Conditions
      - type: CWE
        value: 252:Unchecked Return Value
      - type: CERT
        value: EXP00-J:Do not ignore values returned by methods
      - type: OWASP TOP 10
        value: 2007:A6 Information Leakage and Improper Error Handling
      - type: OWASP TOP 10
        value: 2004:A7 Improper Error Handling
      - type: CWE/SANS TOP 25
        value: 2010:Risky Resource Management - CWE ID 754
