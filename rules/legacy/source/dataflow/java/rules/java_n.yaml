        value: 数据处理:信息通过错误消息泄露
      - type: PCI DSS
        value: 1.1:Requirement 6.5.7
      - type: PCI DSS
        value: 1.2:Requirement 6.5.6
      - type: PCI DSS
        value: 1.2.1:Requirement 6.5.6
