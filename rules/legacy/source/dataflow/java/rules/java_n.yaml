    DynamicDescription: |-
      <p th:if="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的+'`'+${funcName}+'`'+方法中的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
      <p th:unless="${funcNameisEmpty}" th:text="在+'`'+${fileName}+'`'+的第+'`'+${line}+'`'+行违反+'`'+${categoryName}+'`'+规范。" th:remove="tag"></p>
    Description: "1) 规定   \nJava 程序必须要对执行文件 I/O 方法的返回值进行检查。   \n2) 原理   \nJava 的文件操作方法通常使用返回值而不是抛出异常来指示其错误。许多方法在失败时不能抛出异常，所以不可能获得有用的错误信息。比如说，如果一个文件的删除失败了，程序会得到一个“删除失败”信息，但并不知道，是不是因为文件不存在, 是用户没有权限，还是其他的问题而造成的。因此，忽略文件操作返回值的程序常常不能发现文件操作的失败。   \n3) 示例   \n    这个不符合规则的代码示例想要删除一个特定的文件，却没有给出操作成功的指示。只有当程序没有足够的权限来删除文件时，`File.delete()`才抛出 SecurityException 异常。程序不会抛出其他异常，所以删除操作可能会失败而不被察觉。   \n    ```java\n    File file = new File(args[0]);    \n    file.delete();\n    ```   \n    "
    Description_En: ''
    Advice: "对应的符合规则的方案检査 delete()方法的返回值。   \n    ```java\n    File file = new File(args[0]); if (!file.delete()) {   \n    System.out.println(\"Deletion failed\");\n    ```"
