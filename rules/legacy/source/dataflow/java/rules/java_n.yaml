    Description: "1) 规定   \n非受信的输入应该在使用前进行净化，从而防止发生正则表达式注入   \n2) 原理   \n正则表达式在匹配文本字符串时被广泛使用。在 Java 中，必须注意不能误用强大的正则表达式功能。攻击者也许会通过提供一个恶意输入对初始的正则表达式进行修改，比如使其不符合程序规定的正则表达的要求。这种攻击方式称为正则注入（regex injection），它可以影响程序控制流、导致信息泄露，并引起绝服务漏洞。   \n当用户必须指定正则表达式作为输入时，必须注意需要保证初始的正则表达式没有被无限制修改。在用户输入字符串提交给正则解析之前，进行白名单字符处理（比如字母和数字）是一个很好的输入净化策略。开发人员必须仅仅提供最有限的正则表达式功能给用户，从而减少被误用的可能。   \n3) 示例   \n    这个不符合规则的代码示例将日志文件周期性地载入内存，它通过将关键词作为参数传给`suggestSearches()` 方法来获得关键词搜索建议。   \n    ```java\n    public class Keywords {\n        private static ScheduledExecutorService scheduler = Executors.newSingleThreadScheduledExecutor();\n        private static CharBuffer log;\n        private static final Object lock = new Object();\n        // Map log file into memory, and periodically reload\n        static {\n            try {\n                FileChannel channel = new FileInputStream(\"path\").getChannel();\n                // Get the file’s size and map it into memory\n                int size = (int) channel.size();\n                final MappedByteBuffer mappedBuffer = channel.map(FileChannel.MapMode.READ_ONLY, 0, size);\n                Charset charset = Charset.forName(\"ISO-8859-15\");\n                final CharsetDecoder decoder = charset.newDecoder();\n                log = decoder.decode(mappedBuffer); // Read file into char buffer\n                Runnable periodicLogRead = new Runnable() {\n                    @Override\n                    public void run() {\n                        synchronized (lock) {\n                            try {\n                                log = decoder.decode(mappedBuffer);\n                            } catch (CharacterCodingException e) {\n                                // Forward to handler\n                            }\n                        }\n                    }\n                };\n                scheduler.scheduleAtFixedRate(periodicLogRead, 0, 5, TimeUnit.SECONDS);\n            } catch (Throwable t) {\n                // Forward to handler\n            }\n        }\n    }\n    \n    public static Set<String> suggestSearches(String search) {\n        synchronized (lock) {\n            Set<String> searches = new HashSet<String>();\n            // Construct regex dynamically from user string\n            String regex = \"(.*? +public\\\\[\\\\d+\\\\] +.*\" + search + \".*)\";\n            Pattern keywordPattern = Pattern.compile(regex);\n            Matcher logMatcher = keywordPattern.matcher(log);\n            while (logMatcher.find()) {\n                String found = logMatcher.group(1);\n                searches.add(found);\n            }\n            return searches;\n        }\n    }\n    ```  \n    这段代码允许受信用户在公共日志信息中搜索`“error”`关键词。然而，这样会导致前面提到的通过正则注入进行的恶意攻击。   \n    这个"
    Description_En: ''
    Advice: "对应的符合规定的方案过滤搜索字符串中的非字母数字的字符（除了空格和单引号外），这种方案可以阻止正则表达式注入。   \n    ```java\n    public class Keywords {\n        // ...\n        public static Set<String> suggestSearches(String search) {\n            synchronized (lock) {\n                Set<String> searches = new HashSet<String>();\n                StringBuilder sb = new StringBuilder(search.length());\n                for (int i = 0; i < search.length(); ++i) {\n                    char ch = search.charAt(i);\n                    if (Character.isLetterOrDigit(ch) || ch == ' ' || ch == '\\\\') {\n                        sb.append(ch);\n                    }\n                }\n                search = sb.toString();\n                // Construct regex dynamically from user string\n                String regex = \"(.*? +public\\\\[\\\\d+\\\\] +.*\" + search + \".*)\";\n                // ...\n            }\n        }\n    }\n    ```  \n    另一个减少这种漏洞的方法是，在匹配前过滤敏感信息。这样的方案要求每一次日志文件定期更新时都要进行过滤，从而会产生额外的复杂性和性能损失。如果日志格式变化了，但类的设计没有反映这些变化，那么敏感数据依然可能被暴露。"
    Advice_En: ''
