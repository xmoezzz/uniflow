    Description: "1) 规定   \n程序必须确保在启动任何线程之前完成类的初始化。   \n2) 原理   \n在类初始化时启动和使用后台线程，会造成类的初始化循环和死锁。例如，负责类初始化的 main线程可能会阻塞并等待后台线程，而后台线程也会等待 main 线程完成类的初始化。这种问题可能会发生在，例如，在初始化类的过程中后台线程建立数据库连接时。    \n3) 示例   \n    如下不符合规则的代码示例中，作为类初始化的一部分，静态的初始化方法启动了一个后台线程。这个后台线程尝试建立一个数据库连接，但是它应该等待 ConnectionFactory 类中所有成员，包括dbConnection,都完成初始化。   \n    ```java\n    public final class ConnectionFactory {\n        private static Connection dbConnection;\n        // Other fields ...\n    \n        static {\n            Thread dbInitializerThread = new Thread(new Runnable() {\n                @Override\n                public void run() {\n                    // Initialize the database connection\n                    try {\n                        dbConnection = DriverManager.getConnection(\"connection string\");\n                    } catch (SQLException e) {\n                        dbConnection = null;\n                    }\n                }\n            });\n    \n            // Other initialization, for example, start other threads\n    \n            dbInitializerThread.start();\n            try {\n                dbInitializerThread.join();\n            } catch (InterruptedException ie) {\n                throw new AssertionError(ie);\n            }\n        }\n    \n        public static Connection getConnection() {\n            if (dbConnection == null) {\n                throw new IllegalStateException(\"Error initializing connection\");\n            }\n            return dbConnection;\n        }\n    \n        public static void main(String[] args) {\n            // ...\n            Connection connection = getConnection();\n        }\n    }\n    ```   \n       \n    "
    Description_En: ''
    Advice: "对应的符合规则的解决方案在 main 线程初始化了所有的成员，而不是从静态的初始化方法中生成一个后台线程。   \n    ```java\n    public final class ConnectionFactory {\n        private static Connection dbConnection;\n        // Other fields ...\n    \n        static {\n            // Initialize a database connection\n            try {\n                dbConnection = DriverManager.getConnection(\"connection string\");\n            } catch (SQLException e) {\n                dbConnection = null;\n            }\n            // Other initialization (do not start any threads)\n        }\n    \n        // ...\n    }\n    ```"
    Advice_En: ''
