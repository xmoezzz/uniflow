id: org.springframework.security.spring-security-crypto
language: Java
message: pkg:maven/org.springframework.security/spring-security-crypto
metadata:
  purl: pkg:maven/org.springframework.security/spring-security-crypto
rule:
  inside:
    kind: import_declaration
  kind: scoped_identifier
  regex: ^(org\.springframework\.security\.crypto\.factory|org\.springframework\.security\.crypto\.scrypt|org\.springframework\.security\.crypto\.codec|org\.springframework\.security\.crypto\.encrypt|org\.springframework\.security\.crypto\.argon2|org\.springframework\.security\.crypto\.password|org\.springframework\.security\.crypto\.bcrypt|org\.springframework\.security\.crypto\.keygen|org\.springframework\.security\.crypto\.util)\.
