id: tomcat.catalina
language: Java
message: pkg:maven/tomcat/catalina
metadata:
  purl: pkg:maven/tomcat/catalina
rule:
  inside:
    kind: import_declaration
  kind: scoped_identifier
  regex: ^(org\.apache\.catalina\.authenticator|org\.apache\.catalina\.realm|org\.apache\.catalina|org\.apache\.catalina\.mbeans|org\.apache\.catalina\.deploy|org\.apache\.catalina\.security|org\.apache\.catalina\.core|org\.apache\.catalina\.startup|org\.apache\.catalina\.users|org\.apache\.catalina\.valves|org\.apache\.catalina\.session|org\.apache\.catalina\.connector|org\.apache\.catalina\.util|org\.apache\.catalina\.loader)\.
