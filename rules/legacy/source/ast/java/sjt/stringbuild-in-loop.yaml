id: stringbuild-in-loop
message: '0802000010130027'
language: Java

utils:
  is-type-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_variable_declaration
        - has:
            field: type
            regex: ^String$
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              field: name
              pattern:
                selector: identifier
                context: '$VAR'
      - kind: formal_parameters
        has:
          kind: formal_parameter
          all:
            - has:
                field: type
                regex: ^String$
            - has:
                field: name
                pattern:
                  selector: identifier
                  context: '$VAR'
  is-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_variable_declaration
        - not:
            has:
              field: type
              regex: ^String$
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              field: name
              pattern:
                selector: identifier
                context: '$VAR'
      - kind: formal_parameters
        has:
          kind: formal_parameter
          all:
            - not:
                has:
                  field: type
                  regex: ^String$
            - has:
                field: name
                pattern:
                  selector: identifier
                  context: '$VAR'
          
  recursion-find-object-decl:
    inside:
      all:
        - not:
            any:
              - kind: program
              - kind: for_statement
              - kind: enhanced_for_statement
              - kind: while_statement
        - any:
          - has:
              matches: is-type-object-decl
          - all:
            - not:
                has:
                  matches: is-object-decl
            - matches: recursion-find-object-decl

rule:
  kind: assignment_expression
  any:
  - pattern: $VAR = $VAR + $$$
  - pattern: $VAR = $$$ + $VAR
  - pattern: $VAR = $$$ + $VAR + $$$
  all:
  - inside:
      stopBy:
        any:
          - kind: lambda_expression
          - kind: class_declaration
          - kind: method_declaration
      any:
        - kind: for_statement
        - kind: enhanced_for_statement
        - kind: while_statement
      precedes:
        matches: recursion-find-object-decl
  - not:
      matches: recursion-find-object-decl