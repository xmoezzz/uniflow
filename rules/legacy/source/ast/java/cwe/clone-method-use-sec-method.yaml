id: clone-method-use-sec-method
message: '0202000010110065'
language: Java
utils:
  is-type-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_variable_declaration
        - has:
            field: type
            regex: ^(.*\.)?SecurityManager$|^(.*\.)?AccessController$
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              field: name
              pattern:
                selector: identifier
                context: '$VAR'
      - kind: formal_parameters
        has:
          kind: formal_parameter
          all:
            - has:
                field: type
                regex: ^(.*\.)?SecurityManager$|^(.*\.)?AccessController$
            - has:
                field: name
                pattern:
                  selector: identifier
                  context: '$VAR'
  is-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_variable_declaration
        - not:
            has:
              field: type
              regex: ^(.*\.)?SecurityManager$|^(.*\.)?AccessController$
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              field: name
              pattern:
                selector: identifier
                context: '$VAR'
      - kind: formal_parameters
        has:
          kind: formal_parameter
          all:
            - not:
                has:
                  field: type
                  regex: ^(.*\.)?SecurityManager$|^(.*\.)?AccessController$
            - has:
                field: name
                pattern:
                  selector: identifier
                  context: '$VAR'
  recursion-find-object-decl:
    inside:
      all:
        - not:
            kind: program
        - any:
          - has:
              matches: is-type-object-decl
          - all:
            - not:
                has:
                  matches: is-object-decl
            - matches: recursion-find-object-decl
  recursion-call-3:
    has:
      kind: block
      has:
        stopBy: end
        kind: method_invocation
        any:
          - all:
            - has:
                field: name
                regex: ^check.*
            - has:
                field: object
                pattern: $VAR
                matches: recursion-find-object-decl
                          
  recursion-call-2:
    has:
      kind: block
      has:
        stopBy: end
        kind: method_invocation
        any:
          - all:
            - has:
                field: name
                regex: ^check.*
            - has:
                field: object
                pattern: $VAR
                matches: recursion-find-object-decl
          - all:
            - any:
                - has:
                    field: object
                    regex: this
                - not:
                    has:
                      field: object
                      kind: this
            - has:
                field: name
                pattern: $FUNC_NAME_3
            - inside:
                stopBy: end
                kind: class_declaration
                all:
                  - has:
                      field: name
                      pattern: $CLASS
                  - has:
                      field: body
                      has:
                        kind: method_declaration
                        all:
                          - has:
                              field: name
                              pattern: $FUNC_NAME_3
                          - matches: recursion-call-3
  recursion-call-1:
    has:
      kind: block
      has:
        stopBy: end
        kind: method_invocation
        any:
          - all:
            - has:
                field: name
                regex: ^check.*
            - has:
                field: object
                pattern: $VAR
                matches: recursion-find-object-decl
          - all:
            - any:
                - has:
                    field: object
                    regex: this
                - not:
                    has:
                      field: object
                      kind: this
            - has:
                field: name
                pattern: $FUNC_NAME_2
            - inside:
                stopBy: end
                kind: class_declaration
                all:
                  - has:
                      field: name
                      pattern: $CLASS
                  - has:
                      field: body
                      has:
                        kind: method_declaration
                        all:
                          - has:
                              field: name
                              pattern: $FUNC_NAME_2
                          - matches: recursion-call-2
  recursion-call-ctor:
    has:
      kind: constructor_body
      has:
        stopBy: end
        kind: method_invocation
        any:
          - all:
            - has:
                field: name
                regex: ^check.*
            - has:
                field: object
                pattern: $VAR
                matches: recursion-find-object-decl
          - all:
            - any:
                - has:
                    field: object
                    regex: this
                - not:
                    has:
                      field: object
                      kind: this
            - has:
                field: name
                pattern: $FUNC_NAME_1
            - inside:
                stopBy: end
                kind: class_declaration
                all:
                  - has:
                      field: name
                      pattern: $CLASS
                  - has:
                      field: body
                      has:
                        kind: method_declaration
                        all:
                          - has:
                              field: name
                              pattern: $FUNC_NAME_1
                          - matches: recursion-call-1
  recursion-call-check-3:
    has:
      kind: block
      has:
        stopBy: end
        kind: method_invocation
        any:
          - all:
            - has:
                field: name
                regex: ^check.*
            - has:
                field: object
                pattern: $VAR
                matches: recursion-find-object-decl
                          
  recursion-call-check-2:
    has:
      kind: block
      has:
        stopBy: end
        kind: method_invocation
        any:
          - all:
            - has:
                field: name
                regex: ^check.*
            - has:
                field: object
                pattern: $VAR
                matches: recursion-find-object-decl
          - all:
            - any:
                - has:
                    field: object
                    regex: this
                - not:
                    has:
                      field: object
                      kind: this
            - has:
                field: name
                pattern: $FUNC_NAME_CHECK_3
            - inside:
                stopBy: end
                kind: class_declaration
                all:
                  - has:
                      field: name
                      pattern: $CLASS
                  - has:
                      field: body
                      has:
                        kind: method_declaration
                        all:
                          - has:
                              field: name
                              pattern: $FUNC_NAME_CHECK_3
                          - matches: recursion-call-check-3
  recursion-call-check-1:
    has:
      kind: block
      has:
        stopBy: end
        kind: method_invocation
        any:
          - all:
            - has:
                field: name
                regex: ^check.*
            - has:
                field: object
                pattern: $VAR
                matches: recursion-find-object-decl
          - all:
            - any:
                - has:
                    field: object
                    regex: this
                - not:
                    has:
                      field: object
                      kind: this
            - has:
                field: name
                pattern: $FUNC_NAME_CHECK_2
            - inside:
                stopBy: end
                kind: class_declaration
                all:
                  - has:
                      field: name
                      pattern: $CLASS
                  - has:
                      field: body
                      has:
                        kind: method_declaration
                        all:
                          - has:
                              field: name
                              pattern: $FUNC_NAME_CHECK_2
                          - matches: recursion-call-check-2
  recursion-call-check:
    has:
      kind: block
      has:
        stopBy: end
        kind: method_invocation
        any:
          - all:
            - has:
                field: name
                regex: ^check.*
            - has:
                field: object
                pattern: $VAR
                matches: recursion-find-object-decl
          - all:
            - any:
                - has:
                    field: object
                    regex: this
                - not:
                    has:
                      field: object
                      kind: this
            - has:
                field: name
                pattern: $FUNC_NAME_CHECK_1
            - inside:
                stopBy: end
                kind: class_declaration
                all:
                  - has:
                      field: name
                      pattern: $CLASS
                  - has:
                      field: body
                      has:
                        kind: method_declaration
                        all:
                          - has:
                              field: name
                              pattern: $FUNC_NAME_CHECK_1
                          - matches: recursion-call-check-1
rule:
  kind: method_declaration
  all:
    - has:
        field: name
        pattern: clone
    - inside:
        stopBy: 
          kind: class_declaration
        kind: class_declaration
        all:
          - has:
              kind: super_interfaces
              has:
                stopBy: end
                kind: type_identifier
                regex: ^Cloneable$
          - has:
              field: name
              pattern: $CLASS
          - has:
              kind: class_body
              has:
                kind: constructor_declaration
                matches: recursion-call-ctor
    - not:
        matches: recursion-call-check
