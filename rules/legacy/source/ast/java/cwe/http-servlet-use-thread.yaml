id: http-servlet-use-thread
message: '0202000010110003'
language: Java
rule:
  kind: object_creation_expression
  pattern: new Thread($$$)
  inside:
    stopBy:
      kind: method_declaration
    kind: method_declaration
    has:
      field: parameters
      has:
        kind: formal_parameter
        has:
          field: type
          regex: ^(.*\.)?HttpServletRequest$|^(.*\.)?HttpServletResponse$
