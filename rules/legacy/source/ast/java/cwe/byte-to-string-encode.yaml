id: byte-to-string-encode
message: '0202000010130032'
language: Java
utils:
  is-type-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_variable_declaration
        - has:
            field: type
            any:
              - pattern: 'byte[]'
              - pattern: '$_.byte[]'
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              field: name
              pattern:
                selector: identifier
                context: '$VAR'
      - kind: formal_parameters
        has:
          kind: formal_parameter
          all:
            - has:
                field: type
                any:
                  - pattern: 'byte[]'
                  - pattern: '$_.byte[]'
            - has:
                field: name
                pattern:
                  selector: identifier
                  context: '$VAR'
  is-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_variable_declaration
        - not:
            has:
              field: type              
              any:
                - pattern: 'byte[]'
                - pattern: '$_.byte[]'
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              field: name
              pattern:
                selector: identifier
                context: '$VAR'
      - kind: formal_parameters
        has:
          kind: formal_parameter
          all:
            - not:
                has:
                  field: type
                  any:
                    - pattern: 'byte[]'
                    - pattern: '$_.byte[]'
            - has:
                field: name
                pattern:
                  selector: identifier
                  context: '$VAR'
          
  recursion-find-object-decl:
    inside:
      all:
        - not:
            kind: program
        - any:
          - has:
              matches: is-type-object-decl
          - all:
            - not:
                has:
                  matches: is-object-decl
            - matches: recursion-find-object-decl
rule:
  any:
    - pattern: new String($VAR)
    - pattern: new $_.String($VAR)
  has:
    field: arguments
    has:
      kind: identifier
  matches: recursion-find-object-decl