id: unused-variable
message: '0202000010130015'
language: Java

utils:
  is-type-object-decl:
    any:
      - all:
        - any:
            - kind: local_variable_declaration
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              field: name
              pattern:
                selector: identifier
                context: '$VAR'
      - kind: formal_parameters
        has:
          kind: formal_parameter
          all:
            - has:
                field: name
                pattern:
                  selector: identifier
                  context: '$VAR'
  is-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_variable_declaration
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              field: name
              pattern:
                selector: identifier
                context: '$VAR'
      - kind: formal_parameters
        has:
          kind: formal_parameter
          all:
            - has:
                field: name
                pattern:
                  selector: identifier
                  context: '$VAR'
          
  recursion-find-object-decl:
    inside:
      all:
        - not:
            kind: class_body
        - any:
          - has:
              matches: is-type-object-decl
          - all:
            - not:
                has:
                  matches: is-object-decl
            - matches: recursion-find-object-decl

  has_use_var:
    any:
    - has:
        stopBy:
          any:
          - kind: lambda_expression
          - kind: class_declaration
          - kind: method_declaration
        kind: identifier
        pattern: $VAR
    - precedes:
        matches: has_use_var

rule:
  kind: assignment_expression
  pattern: $VAR = $_
  all:
  - matches: recursion-find-object-decl
  - inside:
      kind: expression_statement
      not:
        precedes:
          matches: has_use_var