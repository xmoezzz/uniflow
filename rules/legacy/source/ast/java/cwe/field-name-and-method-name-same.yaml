id: field-name-and-method-name-same
message: '0202000010130011'
language: Java
rule:
  all:
    - kind: field_declaration
    - has:
        kind: variable_declarator
        has:
          field: name
          pattern: $NAME
    - inside:
        stopBy:
          kind: class_declaration
        kind: class_declaration
        has:
          field: body
          has:
            kind: method_declaration
            has:
              field: name
              pattern: $NAME