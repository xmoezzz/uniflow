id: null-password
message: '0102000010130152'
language: Java
rule:
  any:
    - kind: return_statement
      pattern: return $VAR;
      follows:
        stopBy:
          not:
            any:
            - kind: line_comment
            - kind: block_comment
        kind: expression_statement
        pattern: $VAR = null;
    - kind: return_statement
      pattern: return $VAR;
      follows:
        stopBy:
          not:
            any:
            - kind: line_comment
            - kind: block_comment
        pattern: $TYPE $VAR = null;