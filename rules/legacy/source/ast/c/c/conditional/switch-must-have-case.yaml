id: switch-must-have-case
message: '0601000010140028,0701000010130034'
language: C
rule:
  all:
    - kind: switch_statement
    - not:
        has: # have at lease one case that is not `default`
          stopBy:
            kind: switch_statement
          kind: case_statement
          not:
            regex: "^default"

