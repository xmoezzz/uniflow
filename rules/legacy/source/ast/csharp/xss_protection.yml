# YAML Rule is more powerful!
# https://ast-grep.github.io/guide/rule-config.html#rule
id: xss_protection
message: '0503000012000063'
language: cs
utils:
  is-type-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_declaration_statement
        - has:
            kind: variable_declaration
            stopBy: end
            all:
              - has:
                  field: type
                  regex: ^(.*\.)?HttpResponse$
              - has:
                  kind: variable_declarator
                  stopBy: end
                  has: 
                    kind: identifier
                    pattern: $VAR
      - kind: parameter_list
        has:
          kind: parameter
          all:
            - has:
                field: type
                regex: ^(.*\.)?HttpResponse$
            - has:
                field: name
                pattern: '$VAR'
  is-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_declaration_statement
        - not:
            has:
              field: type
              regex: ^(.*\.)?HttpResponse$
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              kind: variable_declarator
              pattern: $VAR
              stopBy: end
      - kind: parameter_list
        has:
          kind: parameter
          all:
            - not:
                has:
                  field: type
                  regex: ^(.*\.)?HttpResponse$
            - has:
                field: name
                pattern: '$VAR'

  recursion-find-object-decl:
    inside:
      all:
        - not:
            kind: compilation_unit
        - any:
          - has:
              matches: is-type-object-decl
          - all:
            - not:
                has:
                  matches: is-object-decl
            - matches: recursion-find-object-decl
  check-response:
    regex: ^Response$
rule:
  kind: invocation_expression
  all:
  - any:
    - pattern: $_.AddHeader("X-XSS-Protection", $FLAG)
    - pattern: $_.AppendHeader("X-XSS-Protection", $FLAG)
    - pattern: $_.Headers.Remove("X-XSS-Protection") 
  - has:
      kind: member_access_expression
      stopBy: end
      has:
        filed: expression
        pattern: $VAR
        any:
          - inside:
              matches: recursion-find-object-decl
          - matches: check-response
constraints:
  FLAG:
    kind: argument
    regex: ([^(^1$)])