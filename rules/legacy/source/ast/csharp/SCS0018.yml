# YAML Rule is more powerful!
# https://ast-grep.github.io/guide/rule-config.html#rule
id: SCS0018
message: '0503000010050008'
language: cs
utils:
  wellknown-taint-source:
    any:
      - pattern: Response.$$$
  is-type-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_declaration_statement
            - kind: using_statement
        - has:
            kind: variable_declaration
            stopBy: end
            all:
              - has:
                  field: type
                  regex: ^(.*\.)?string$
              - has:
                  kind: variable_declarator
                  stopBy: end
                  all:
                  - has: 
                      kind: identifier
                      pattern: $VAR
                  - has:
                      #kind: equals_value_clause
                      has: 
                        stopBy: end
                        kind: member_access_expression
                        matches: wellknown-taint-source
                    
      - kind: parameter_list
        has:
          kind: parameter
          all:
            - has:
                field: type
                regex: ^(.*\.)?string$
            - has:
                field: name
                pattern: $VAR

  is-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_declaration_statement
        - not:
            has:
              field: type
              regex: ^(.*\.)?string$
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              kind: variable_declarator
              pattern: $VAR
              stopBy: end
      - kind: parameter_list
        has:
          kind: parameter
          all:
            - not:
                has:
                  field: type
                  regex: ^(.*\.)?string$
            - has:
                field: name
                pattern: $VAR

  recursion-find-object-decl:
    inside:
      all:
        - not:
            kind: compilation_unit
        - any:
          - has:
              matches: is-type-object-decl
          - all:
            - not:
                has:
                  matches: is-object-decl
            - matches: recursion-find-object-decl
rule:
  kind: invocation_expression
  any:
    - all:
      - any:
        - pattern: $_.GetFileInfo($ARG)
        - pattern: $_.$WEBCLIENTCALL($_, $ARG)
      - has:
          kind: member_access_expression
          has:
            filed: expression
            pattern: $VAR1

    - any:
      - pattern: File.Create($ARG)
      - pattern: Request.$REQUESTCALL($ARG)

constraints:
  ARG:
    has:
      stopBy: end
      kind: identifier
      pattern: $VAR
      matches: recursion-find-object-decl
  REQUESTCALL:
    regex: TransmitFile|MapPath|WriteFile
  WEBCLIENTCALL:
    regex: DownloadFile|DownloadFileAsync|DownloadFileTaskAsync