# YAML Rule is more powerful!
# https://ast-grep.github.io/guide/rule-config.html#rule
id: input_validation_and_representation_log_forging
message: '0503000010050003'
language: cs
utils:
  wellknown-taint-source:
    any:
      - pattern: Response.$$$
      - pattern: Request.$$$
  is-type-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_declaration_statement
            - kind: using_statement
        - has:
            kind: variable_declaration
            stopBy: end
            all:
              - has:
                  field: type
                  regex: ^(.*\.)?string$
              - has:
                  kind: variable_declarator
                  stopBy: end
                  all:
                  - has: 
                      kind: identifier
                      pattern: $VAR
                  - has:
                      #kind: equals_value_clause
                      has: 
                        stopBy: end
                        kind: member_access_expression
                        matches: wellknown-taint-source
                    
      - kind: parameter_list
        has:
          kind: parameter
          all:
            - has:
                field: type
                regex: ^(.*\.)?string$
            - has:
                field: name
                pattern: $VAR

  is-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_declaration_statement
        - not:
            has:
              field: type
              regex: ^(.*\.)?string$
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              kind: variable_declarator
              pattern: $VAR
              stopBy: end
      - kind: parameter_list
        has:
          kind: parameter
          all:
            - not:
                has:
                  field: type
                  regex: ^(.*\.)?string$
            - has:
                field: name
                pattern: $VAR

  recursion-find-object-decl:
    inside:
      all:
        - not:
            kind: compilation_unit
        - any:
          - has:
              matches: is-type-object-decl
          - all:
            - not:
                has:
                  matches: is-object-decl
            - matches: recursion-find-object-decl
rule:
  kind: invocation_expression
  any:
    - all:
      - any:
        - pattern: $_.$LOGMETHOD($ARG)
        - pattern: $_.WriteEntry($ARG)
      - has:
          kind: member_access_expression
          has:
            filed: expression
            pattern: $VAR1
    - any:
      - pattern: Response.AppendToLog($ARG)

constraints:
  ARG:
    has:
      stopBy: end
      kind: identifier
      pattern: $VAR
      matches: recursion-find-object-decl
  LOGMETHOD:
    regex: (Begin)?(Append|WriteRestartArea|ReserveAndAppend)|(Debug|Error|Fatal|Info|Warn)(Format)?|(Log|Trace|Debug|Info|Warn|Error|Fatal)(Exception)?