# YAML Rule is more powerful!
# https://ast-grep.github.io/guide/rule-config.html#rule
id: security_features_header_checking_disabled
message: '0503000010110003'
language: cs
utils:
  is-type-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_declaration_statement
        - has:
            kind: variable_declaration
            stopBy: end
            all:
              - has:
                  field: type
                  regex: ^(.*\.)?HttpRuntimeSection$
              - has:
                  kind: variable_declarator
                  stopBy: end
                  has: 
                    kind: identifier
                    pattern: $VAR
      - kind: parameter_list
        has:
          kind: parameter
          all:
            - has:
                field: type
                regex: ^(.*\.)?HttpRuntimeSection$
            - has:
                field: name
                pattern: '$VAR'
  is-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_declaration_statement
        - not:
            has:
              field: type
              regex: ^(.*\.)?HttpRuntimeSection$
        - has:
            kind: variable_declaration
            stopBy: end
            has:
              kind: variable_declarator
              pattern: $VAR
              stopBy: end
      - kind: parameter_list
        has:
          kind: parameter
          all:
            - not:
                has:
                  field: type
                  regex: ^(.*\.)?HttpRuntimeSection$
            - has:
                field: name
                pattern: '$VAR'

  recursion-find-object-decl:
    inside:
      all:
        - not:
            kind: compilation_unit
        - any:
          - has:
              matches: is-type-object-decl
          - all:
            - not:
                has:
                  matches: is-object-decl
            - matches: recursion-find-object-decl
rule:
  kind: assignment_expression
  all:
  - pattern: $_.EnableHeaderChecking = false
  - has:
      kind: member_access_expression
      has:
        filed: expression
        pattern: $VAR
        inside:
          matches: recursion-find-object-decl