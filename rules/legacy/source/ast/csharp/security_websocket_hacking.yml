# YAML Rule is more powerful!
# https://ast-grep.github.io/guide/rule-config.html#rule
id: security_websocket_hacking
message: '0503000012000008'
language: cs
utils:
  is-type-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_declaration_statement
            - kind: using_statement
        - has:
            kind: variable_declaration
            stopBy: end
            all:
              - has:
                  field: type
                  regex: ^(.*\.)?AspNetWebSocketOptions$
              - has:
                  kind: variable_declarator
                  stopBy: end
                  all:
                  - has: 
                      kind: identifier
                      pattern: $VAR
                    
      - kind: parameter_list
        has:
          kind: parameter
          all:
            - has:
                field: type
                regex: ^(.*\.)?AspNetWebSocketOptions$
            - has:
                field: name
                pattern: $VAR

  is-object-decl:
    any:
      - all:
        - any:
            - kind: field_declaration
            - kind: local_declaration_statement
        - not:
            has:
              field: type
              regex: ^(.*\.)?AspNetWebSocketOptions$
        - has:
            kind: variable_declarator
            stopBy: end
            has:
              kind: variable_declarator
              pattern: $VAR
              stopBy: end
      - kind: parameter_list
        has:
          kind: parameter
          all:
            - not:
                has:
                  field: type
                  regex: ^(.*\.)?AspNetWebSocketOptions$
            - has:
                field: name
                pattern: $VAR

  recursion-find-object-decl:
    inside:
      all:
        - not:
           has:
            stopBy: end
            pattern: $VAR.RequireSameOrigin = true
        - not:
            kind: compilation_unit
        - any:
          - has:
              matches: is-type-object-decl
          - all:
            - not:
                has:
                  matches: is-object-decl
            - matches: recursion-find-object-decl
rule:
  kind: invocation_expression
  any:
    - all:
      - any:
        - pattern: $_.AcceptWebSocketRequest($_, $ARG)
      - has:
          kind: member_access_expression
          has:
            filed: expression
            pattern: $VAR1

constraints:
  ARG:
    has:
      stopBy: end
      kind: identifier
      pattern: $VAR
      matches: recursion-find-object-decl