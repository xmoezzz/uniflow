- { id: LEGACY-RUBY-SEMGREP-TAINT-dynamic-finders, language: ruby, matcher: { method_regex: '^find_by_(token|guid|password|api_key|activation|code|private|reset)$', arg_count_min: 1 }, inputs: [args_from0], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-number-to-currency, language: ruby, matcher: { exact: number_to_currency, arg_count_min: 2 }, inputs: ['named:unit'], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-quote-table-name, language: ruby, matcher: { exact: quote_table_name, arg_count_min: 1 }, inputs: [arg0], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-ruby-pg-sqli, language: ruby, matcher: { method_regex: '^(exec|exec_params)$', arg_count_min: 1 }, inputs: [arg0], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-avoid-link-to, language: ruby, matcher: { exact: link_to, arg_count_min: 1 }, inputs: [arg0], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-avoid-redirect, language: ruby, matcher: { exact: redirect_to, arg_count_min: 1 }, inputs: [arg0], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-avoid-render-dynamic-path, language: ruby, matcher: { exact: render, arg_count_min: 1 }, inputs: [args_from0], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-check-redirect-to, language: ruby, matcher: { exact: redirect_to, arg_count_min: 1 }, inputs: [arg0], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-check-regex-dos-MODEL-new, language: ruby, matcher: { regex: '(^|[.])Regexp[.]new$', arg_count_min: 1 }, inputs: [arg0], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-check-regex-dos-MODEL-compose, language: ruby, matcher: { exact: __uniflow.compose.string, arg_count: 2 }, inputs: [arg0], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-check-render-local-file-include, language: ruby, matcher: { exact: render, arg_count_min: 1 }, inputs: [args_from0], kind: semgrep.ruby.web-input }
- { id: LEGACY-RUBY-SEMGREP-TAINT-check-send-file, language: ruby, matcher: { exact: send_file, arg_count_min: 1 }, inputs: [arg0], kind: semgrep.ruby.web-input }
