call_conditions:
- rule_id: LEGACY-RUBY-SEMGREP-TAINT-SOURCE-integer-division
  condition:
    op: all
    args:
    - { op: value_matches, args: { port: arg0, regex: '^-?[0-9]+$' } }
    - { op: value_matches, args: { port: arg1, exact: '0' } }
- rule_id: LEGACY-RUBY-SEMGREP-TAINT-divide-by-zero
  condition: { op: value_matches, args: { port: arg1, exact: '0' } }
- rule_id: LEGACY-RUBY-SEMGREP-TAINT-aws-tainted-sql-string
  condition: { op: value_matches, args: { port: arg1, regex: '(?i)(select|delete|insert|create|update|alter|drop|[<>=])' } }
- rule_id: LEGACY-RUBY-SEMGREP-TAINT-raw-html-format
  condition: { op: value_matches, args: { port: arg1, regex: '<[A-Za-z][^>]*>' } }
- rule_id: LEGACY-RUBY-SEMGREP-TAINT-rails-tainted-sql-string-MODEL-compose
  condition: { op: value_matches, args: { port: arg1, regex: '(?i)(select|delete|insert|create|update|alter|drop|[<>=])' } }
