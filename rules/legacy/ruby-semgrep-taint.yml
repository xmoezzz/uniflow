sanitizers:
- { id: LEGACY-RUBY-SEMGREP-TAINT-SANITIZER-mysql-escape, language: ruby, matcher: { method_name: escape, arg_count_min: 1 }, inputs: [arg0], outputs: [return], kind: semgrep.ruby.aws-event }
- { id: LEGACY-RUBY-SEMGREP-TAINT-SANITIZER-html, language: ruby, matcher: { regex: '(^|[.])(h|sanitize|strip_tags)$', arg_count_min: 1 }, inputs: [arg0], outputs: [return], kind: semgrep.ruby.web-input }
