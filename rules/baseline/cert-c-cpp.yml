id: cert-c-cpp
title: CERT C and C++ security baseline
rules:
- id: ANZU-ASSIGNMENT-IN-CONDITION
  title: Assignment in condition expression
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_expression: assignment_in_condition
  standards: [LEGACY-MSG-2401000010120097, LEGACY-MSG-0601000010140036, LEGACY-MSG-0701000010130041, LEGACY-MSG-0101000010110213, LEGACY-MSG-0101000010110369, LEGACY-MSG-0901000010110369, LEGACY-MSG-0101000010110448, LEGACY-MSG-2801000010180003]
  message: Assignment in condition expression.
  translations:
    zh-CN: { title: 条件表达式中进行了赋值, message: 条件表达式中进行了赋值。 }
    en: { title: Assignment in condition expression, message: Assignment in condition expression. }
    zh-TW: { title: 條件運算式中進行了賦值, message: 條件運算式中進行了賦值。 }
- id: ANZU-FALSE-STATIC-ASSERT
  title: False constant expression in static assertion
  languages: [c]
  severity: warning
  confidence: high
  matcher:
    c_expression: false_static_assert
  standards: [LEGACY-MSG-0101000010110153]
  message: Test the value of constant expressions using static assertions.
  translations:
    zh-CN: { title: 静态断言中的常量表达式为假, message: 使用静态断言测试常数表达式的值。 }
    en: { title: False constant expression in static assertion, message: Test the value of constant expressions using static assertions. }
    zh-TW: { title: 靜態斷言中的常數運算式為假, message: 使用靜態斷言測試常數運算式的值。 }
- id: ANZU-SINGLE-DECLARATION
  title: Multiple variable declarations in one statement
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: multiple_local_variables
  standards: [LEGACY-MSG-0101000010110154, LEGACY-MSG-0101000010110436]
  message: Disallow multiple declarations in a single statement.
  translations:
    zh-CN: { title: 单个语句中包含多个变量声明, message: 不允许在单个语句中写多个声明。 }
    en: { title: Multiple variable declarations in one statement, message: Disallow multiple declarations in a single statement. }
    zh-TW: { title: 單一陳述式中包含多個變數宣告, message: 不允許在單一陳述式中撰寫多個宣告。 }
- id: ANZU-POINTER-TYPEDEF
  title: Typedef applied to a pointer type
  languages: [c]
  severity: warning
  confidence: high
  matcher:
    c_declaration: pointer_typedef
  standards: [LEGACY-MSG-0101000010110155]
  message: Typedef is applied to a pointer type.
  translations:
    zh-CN: { title: Typedef 应用于指针类型, message: Typedef 应用于指针类型。 }
    en: { title: Typedef applied to a pointer type, message: Typedef is applied to a pointer type. }
    zh-TW: { title: Typedef 套用於指標型別, message: Typedef 套用於指標型別。 }
- id: ANZU-TRIPLE-POINTER
  title: Pointer nesting exceeds two levels
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: triple_pointer_variable
  standards: [LEGACY-MSG-0601000010140031, LEGACY-MSG-0701000010130018]
  message: Prohibit pointers to pointers beyond two levels.
  translations:
    zh-CN: { title: 指针嵌套超过两层, message: 禁止嵌套指针超过两层。 }
    en: { title: Pointer nesting exceeds two levels, message: Prohibit pointers to pointers beyond two levels. }
    zh-TW: { title: 指標巢狀超過兩層, message: 禁止巢狀指標超過兩層。 }
- id: ANZU-INCOMPLETE-STRUCT-DECLARATION
  title: Incomplete structure declaration
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: incomplete_struct_declaration
  standards: [LEGACY-MSG-0601000010140014]
  message: Structures must be completely declared.
  translations:
    zh-CN: { title: 结构体声明不完整, message: 结构体必须完整声明。 }
    en: { title: Incomplete structure declaration, message: Structures must be completely declared. }
    zh-TW: { title: 結構宣告不完整, message: 結構必須完整宣告。 }
- id: ANZU-DELETE-THIS
  title: Deleting this object
  languages: [cpp]
  severity: warning
  confidence: high
  matcher:
    c_expression: delete_this
  standards: [LEGACY-MSG-0101000010110395]
  message: Avoid deleting 'this'.
  translations:
    zh-CN: { title: 避免释放 this, message: 避免释放 ‘this’。 }
    en: { title: Deleting this object, message: Avoid deleting 'this'. }
    zh-TW: { title: 避免釋放 this, message: 避免釋放 ‘this’。 }
- id: ANZU-NO-VFORK
  title: vfork is prohibited
  languages: [c]
  severity: warning
  confidence: high
  matcher:
    c_expression: vfork_call
  standards: [LEGACY-MSG-0101000010110293]
  message: Do not use vfork().
  translations:
    zh-CN: { title: 禁止使用 vfork, message: 不要使用 vfork()。 }
    en: { title: vfork is prohibited, message: Do not use vfork(). }
    zh-TW: { title: 禁止使用 vfork, message: 不要使用 vfork()。 }
- id: ANZU-EXPLICIT-CHAR-SIGNEDNESS
  title: Plain char variable has implementation-defined signedness
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: plain_char_variable
  standards: [LEGACY-MSG-0601000010140010]
  message: Character type must be explicitly marked as signed or unsigned.
  translations:
    zh-CN: { title: 字符类型需显式标明符号性, message: 字符类型必须显式标记为 signed 或者 unsigned。 }
    en: { title: Plain char variable has implementation-defined signedness, message: Character type must be explicitly marked as signed or unsigned. }
    zh-TW: { title: 字元型別需明確標示符號性, message: 字元型別必須明確標示為 signed 或 unsigned。 }
- id: ANZU-NO-LOGICAL-NOT-ON-CONSTANT
  title: Logical not applied to a constant expression
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_expression: logical_not_constant
  standards: [LEGACY-MSG-0601000010140044]
  message: Applying logical not operation on a constant value is not allowed.
  translations:
    zh-CN: { title: 对常量表达式使用逻辑非, message: 不允许将逻辑非操作应用于常量值。 }
    en: { title: Logical not applied to a constant expression, message: Applying logical not operation on a constant value is not allowed. }
    zh-TW: { title: 對常數運算式使用邏輯非, message: 不允許將邏輯非運算套用於常數值。 }
- id: ANZU-EXPLICIT-VOID-PARAMETER-LIST
  title: Empty function parameter list must use void
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: empty_function_parameters
  standards: [LEGACY-MSG-0701000010130014, LEGACY-MSG-0101000010110164]
  message: An empty function parameter list must explicitly specify void.
  translations:
    zh-CN: { title: 空参数列表必须显式使用 void, message: 函数的空参数列表需要显式指定 void 参数类型。 }
    en: { title: Empty function parameter list must use void, message: An empty function parameter list must explicitly specify void. }
    zh-TW: { title: 空參數列表必須明確使用 void, message: 函式的空參數列表需要明確指定 void 參數型別。 }
- id: ANZU-INCOMPLETE-ARRAY-VARIABLE
  title: Array variable has no explicit bound
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: incomplete_array_variable
  standards: [LEGACY-MSG-0701000010130011, LEGACY-MSG-0101000010110144, LEGACY-MSG-0101000010110410]
  message: Array is not specified with a size.
  translations:
    zh-CN: { title: 数组变量未指定大小, message: 数组没有指定大小。 }
    en: { title: Array variable has no explicit bound, message: Array is not specified with a size. }
    zh-TW: { title: 陣列變數未指定大小, message: 陣列未指定大小。 }
- id: ANZU-NO-PARAMETER-NAMES-IN-PROTOTYPE
  title: Named parameter in function prototype
  languages: [c]
  severity: warning
  confidence: high
  matcher:
    c_declaration: named_prototype_parameter
  standards: [LEGACY-MSG-0101000010110323]
  message: Avoid naming parameters in function prototypes.
  translations:
    zh-CN: { title: 函数原型中不应命名参数, message: 避免在函数原型中给参数命名。 }
    en: { title: Named parameter in function prototype, message: Avoid naming parameters in function prototypes. }
    zh-TW: { title: 函式原型中不應命名參數, message: 避免在函式原型中為參數命名。 }
- id: ANZU-NO-TYPEDEF-OF-TYPEDEF
  title: Typedef type redefined by another typedef
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: typedef_of_typedef
  standards: [LEGACY-MSG-0701000010130004, LEGACY-MSG-0601000010140011]
  message: A typedef-defined type must not be redefined.
  translations:
    zh-CN: { title: 不应再次 typedef 已定义类型, message: 不得重新定义 typedef 已经定义的类型。 }
    en: { title: Typedef type redefined by another typedef, message: A typedef-defined type must not be redefined. }
    zh-TW: { title: 不應再次 typedef 已定義型別, message: 不得重新定義 typedef 已經定義的型別。 }
- id: ANZU-LIMIT-FUNCTION-PARAMETERS
  title: Function has more than twenty parameters
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: too_many_function_parameters
  standards: [LEGACY-MSG-0601000010140017]
  message: Function parameter count exceeds the recommended maximum of 20.
  translations:
    zh-CN: { title: 函数参数超过二十个, message: 函数参数数量超过建议的最大值 20。 }
    en: { title: Function has more than twenty parameters, message: Function parameter count exceeds the recommended maximum of 20. }
    zh-TW: { title: 函式參數超過二十個, message: 函式參數數量超過建議的最大值 20。 }
- id: ANZU-FUNCTION-POINTER-RETURN
  title: Function returns a function pointer
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: function_pointer_return
  standards: [LEGACY-MSG-0601000010140032]
  message: Function declared as pointer type.
  translations:
    zh-CN: { title: 函数返回函数指针, message: 函数被声明为指针类型。 }
    en: { title: Function returns a function pointer, message: Function declared as pointer type. }
    zh-TW: { title: 函式傳回函式指標, message: 函式被宣告為指標型別。 }
- id: ANZU-NARROW-STRING-ASCII
  title: Non-ASCII character in a narrow string literal
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_expression: non_ascii_narrow_string
  standards: [LEGACY-MSG-0101000010110477, LEGACY-MSG-0901000010110477, LEGACY-MSG-0101000010110276, LEGACY-MSG-0901000010110276]
  message: Non-ASCII character detected in a non-wide string literal.
  translations:
    zh-CN: { title: 窄字符串中包含非 ASCII 字符, message: 在非宽字符串文本中检测到非 ASCII 字符。 }
    en: { title: Non-ASCII character in a narrow string literal, message: Non-ASCII character detected in a non-wide string literal. }
    zh-TW: { title: 窄字串中包含非 ASCII 字元, message: 在非寬字串常值中偵測到非 ASCII 字元。 }
- id: ANZU-SIZED-CHAR-ARRAY-STRING-INIT
  title: Explicit bound on character array initialized by a string
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: sized_char_array_string_initializer
  standards: [LEGACY-MSG-0101000010110310, LEGACY-MSG-0101000010110428]
  message: Do not specify the bound of a character array initialized with a string literal.
  translations:
    zh-CN: { title: 字符数组字符串初始化时指定了边界, message: 不要指定用字符串字面量初始化的字符数组的边界。 }
    en: { title: Explicit bound on character array initialized by a string, message: Do not specify the bound of a character array initialized with a string literal. }
    zh-TW: { title: 字元陣列以字串初始化時指定了界限, message: 不要指定以字串常值初始化的字元陣列界限。 }
- id: ANZU-WINDOWS-LOAD-ABSOLUTE-PATH
  title: Relative path passed to process or library loader
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    callee: '(^|::)(CreateProcess(A|W)?|LoadLibrary(A|W)?)$'
    min_args: 1
    string_arg_not_patterns:
      0: '^(?:/|[A-Za-z]:[\\/]|\\\\)'
  standards: [LEGACY-MSG-0101000010110308, LEGACY-MSG-0101000010110484]
  message: Use an absolute path when creating a process or loading a library.
  translations:
    zh-CN: { title: 进程或库加载使用了相对路径, message: 创建进程或加载库时应使用绝对路径。 }
    en: { title: Relative path passed to process or library loader, message: Use an absolute path when creating a process or loading a library. }
    zh-TW: { title: 程序或程式庫載入使用了相對路徑, message: 建立程序或載入程式庫時應使用絕對路徑。 }
- id: ANZU-ASSERT-ALWAYS-TRUE
  title: Assertion is always true
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_expression: constant_true_assert
  standards: [LEGACY-MSG-0101000010110153, LEGACY-MSG-0101000010110434]
  message: Assertion will always be true.
  translations:
    zh-CN: { title: 断言恒为真, message: 断言总是为 true。 }
    en: { title: Assertion is always true, message: Assertion will always be true. }
    zh-TW: { title: 斷言恆為真, message: 斷言總是為 true。 }
- id: ANZU-ASSERT-ALWAYS-FALSE
  title: Assertion is always false
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_expression: constant_false_assert
  standards: [LEGACY-MSG-0101000010110153, LEGACY-MSG-0101000010110434]
  message: Assertion will always be false.
  translations:
    zh-CN: { title: 断言恒为假, message: 断言总是为 false。 }
    en: { title: Assertion is always false, message: Assertion will always be false. }
    zh-TW: { title: 斷言恆為假, message: 斷言總是為 false。 }
- id: ANZU-NO-PROCEDURE-PARAMETERS
  title: Function pointer used as a parameter
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: function_pointer_parameter
  standards: [LEGACY-MSG-0601000010140016]
  message: Avoid defining procedures as parameters, as it can make control flow unclear.
  translations:
    zh-CN: { title: 避免将过程作为参数, message: 避免将过程定义为参数，这会使控制流不清晰。 }
    en: { title: Function pointer used as a parameter, message: Avoid defining procedures as parameters, as it can make control flow unclear. }
    zh-TW: { title: 避免將程序作為參數, message: 避免將程序定義為參數，這會使控制流程不清楚。 }
- id: ANZU-CPP-NO-AMBIGUOUS-L-O-VARIABLE
  title: Ambiguous single-letter variable name
  languages: [cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: ambiguous_cpp_variable
  standards: [LEGACY-MSG-0601000010140064, LEGACY-MSG-0701000010130097]
  message: Variable names should not mix uppercase 'O' and digit '0', '1' and lowercase 'l'.
  translations:
    zh-CN: { title: 易混淆的单字符变量名, message: 变量名中不能混用大写字母 ‘O’ 和数字 ‘0’，小写字母 ‘l’ 和数字 ‘1’。 }
    en: { title: Ambiguous single-letter variable name, message: "Variable names should not mix uppercase 'O' and digit '0', '1' and lowercase 'l'." }
    zh-TW: { title: 易混淆的單字元變數名稱, message: 變數名稱中不能混用大寫字母 ‘O’ 和數字 ‘0’，小寫字母 ‘l’ 和數字 ‘1’。 }
- id: UF-C-STR-GETS
  title: Use of removed gets function
  languages:
  - c
  - cpp
  severity: error
  confidence: high
  pattern: \bgets\s*\(
  matcher:
    callee: (^|::)gets$
    min_args: 1
    max_args: 1
  cwe:
  - CWE-242
  standards:
  - CERT-C-MSC24-C
  - CERT-CPP
  message: Replace gets with a length-bounded input API.
- id: UF-C-STR-STRCPY
  title: Unbounded string copy
  languages:
  - c
  - cpp
  severity: warning
  confidence: high
  pattern: \bstrcpy\s*\(
  matcher:
    callee: (^|::)strcpy$
    min_args: 2
    max_args: 2
  cwe:
  - CWE-120
  standards:
  - CERT-C-STR31-C
  - CERT-CPP
  message: Verify destination capacity or use an explicitly bounded operation.
- id: UF-C-STR-STRCAT
  title: Unbounded string concatenation
  languages:
  - c
  - cpp
  severity: warning
  confidence: high
  pattern: \bstrcat\s*\(
  matcher:
    callee: (^|::)strcat$
    min_args: 2
    max_args: 2
  cwe:
  - CWE-120
  standards:
  - CERT-C-STR31-C
  - CERT-CPP
  message: Verify complete destination capacity before concatenation.
- id: UF-C-FIO-SPRINTF
  title: Unbounded formatted output
  languages:
  - c
  - cpp
  severity: warning
  confidence: high
  pattern: \b(?:sprintf|vsprintf)\s*\(
  matcher:
    callee: (^|::)(sprintf|vsprintf)$
    min_args: 2
  cwe:
  - CWE-120
  standards:
  - CERT-C-STR31-C
  message: Prefer a bounded formatting API and verify truncation handling.
- id: UF-C-FIO-SCANF-S
  title: Unbounded percent-s conversion
  languages:
  - c
  - cpp
  severity: warning
  confidence: medium
  pattern: ''
  matcher:
    c_expression: scanf_unbounded_string
  cwe:
  - CWE-120
  standards:
  - CERT-C-STR31-C
  - LEGACY-MSG-0201000010120064
  - LEGACY-MSG-0301000010120064
  message: Add an explicit field width for percent-s conversions.
  translations:
    zh-CN: { title: scanf 的字符串转换没有宽度限制, message: 为 scanf 的百分号 s 转换添加明确的字段宽度。 }
    en: { title: Unbounded percent-s conversion, message: Add an explicit field width for percent-s conversions. }
    zh-TW: { title: scanf 的字串轉換沒有寬度限制, message: 為 scanf 的百分號 s 轉換新增明確的欄位寬度。 }
- id: UF-C-TMP-INSECURE
  title: Insecure temporary-file name generation
  languages:
  - c
  - cpp
  severity: error
  confidence: high
  pattern: \b(?:mktemp|tmpnam|tempnam)\s*\(
  matcher:
    callee: (^|::)(mktemp|tmpnam|tempnam)$
  cwe:
  - CWE-377
  standards:
  - CERT-C-FIO21-C
  - CERT-CPP
  message: Create temporary files atomically with restrictive permissions.
- id: UF-C-ENV-SYSTEM
  title: Command processor invocation
  languages:
  - c
  - cpp
  severity: warning
  confidence: high
  pattern: \b(?:system|popen)\s*\(
  matcher:
    callee: (^|::)(system|popen)$
    min_args: 1
  cwe:
  - CWE-78
  standards:
  - CERT-C-ENV33-C
  - CERT-CPP
  message: Avoid invoking a command processor with externally influenced text.
- id: UF-C-ENV-SHELL-C
  title: Explicit shell command execution
  languages:
  - c
  - cpp
  severity: error
  confidence: high
  pattern: \bexeclp?\s*\(\s*"/bin/(?:ba)?sh"[^;\n]*"-c"
  cwe:
  - CWE-78
  standards:
  - CERT-C-ENV33-C
  message: Do not pass externally influenced command text to a shell.
- id: UF-C-RAND-WEAK
  title: Predictable pseudo-random generator
  languages:
  - c
  - cpp
  severity: warning
  confidence: high
  pattern: \b(?:rand|random|drand48|std::rand|std::mersenne_twister[^\s(]*)\s*\(
  matcher:
    callee: '(^|::)(rand|random|drand48)$|^std::mersenne_twister'
  cwe:
  - CWE-338
  standards:
  - CERT-C-MSC30-C
  - CERT-CPP
  message: Do not use predictable PRNG output for security decisions.
  translations:
    zh-CN:
      title: 可预测的伪随机数生成器
      message: 该函数具有潜在可预测性，不应用于生成安全敏感的伪随机数。
    en:
      title: Predictable pseudo-random generator
      message: Do not use predictable PRNG output for security decisions.
    zh-TW:
      title: 可預測的偽隨機數產生器
      message: 該函式具有潛在可預測性，不應用於產生安全敏感的偽隨機數。
- id: ANZU-ASSIGNMENT-IN-LOGICAL-OP
  title: Assignment operator used directly with a logical operator
  languages: [c, cpp]
  severity: warning
  confidence: high
  pattern: ''
  matcher:
    assignment_operand_in_logical: true
  cwe: [CWE-481]
  standards: [anzu.AssignmentInLogicalOpChecker]
  message: Do not use an assignment expression as a direct operand of && or ||.
  translations:
    zh-CN:
      title: 赋值操作符与逻辑操作符混用
      message: 不要将赋值表达式直接作为 && 或 || 的操作数。
    en:
      title: Assignment operator used directly with a logical operator
      message: Do not use an assignment expression as a direct operand of && or ||.
    zh-TW:
      title: 賦值運算子與邏輯運算子混用
      message: 不要將賦值運算式直接作為 && 或 || 的運算元。
- id: ANZU-DISABLE-GOTO
  title: Goto statement is prohibited
  languages: [c, cpp]
  severity: warning
  confidence: high
  pattern: ''
  matcher:
    code_pattern: '\bgoto\b'
    exclude_preprocessor: true
  cwe: [CWE-483]
  standards: [anzu.DisableGotoChecker, '0601000010140035']
  message: The use of goto statements is prohibited.
  translations:
    zh-CN:
      title: 禁止使用 goto 语句
      message: 禁止使用 goto 语句。
    en:
      title: Goto statement is prohibited
      message: The use of goto statements is prohibited.
    zh-TW:
