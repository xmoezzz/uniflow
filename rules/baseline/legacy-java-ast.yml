    zh-TW:
      title: C.10.4 始終在迴圈中呼叫wait()和await()方法
      message: "1) 規定   \t\t  \n程式必須在`wait()`方法返回後檢查等候條件。不管是在呼叫`wait()`之前還是之後，while 迴圈都是檢查等候條件的最好方式。   \n2) 原理   \n`Object.wait()`方法會暫時地放棄所擁有的鎖，以讓其他執行緒有機會可得到鎖並繼續執行。`Object.wait()`方法通常在同步程式碼塊及方法中被呼叫。等待的執行緒只有在它接到通知後才會恢復執行，這通常是其他執行緒呼叫 `notify()`或 `notifyAll()`方法的結果。`wait()`方法必須在檢查等候條件是否為真的迴圈中進行呼叫。    \n在使用 wait/notify 機制時，需要同時考慮安全性和靈活性問題。安全性屬性要求所有的物件在多執行緒環境中要維持狀態的一致性。靈活性屬性要求每一個操作或方法呼叫在完成前不會被中斷。   \n為確保活性屬性，程式在呼叫 `wait()`方法之前必須對 while 迴圈的條件進行檢測。這個提前的測試檢查了是否會有另一個執行緒已經滿足了等候條件併發出了一個通知。在通知已經發出後呼叫 `wait()`方法會導致無限期的阻塞。   \n為保證安全性，程式必須在 `wait()`方法返回之後對 while 迴圈的條件進行檢測。雖然 `wait()`的目的是不限時地攔阻執行緒直至收到通知，還是必須將它放在 while 迴圈中來避免以下的漏洞：   \n• 中間的執行緒——在通知發出和收到通知的執行緒恢復執行的間隙中，第三個執行緒可能會獲取共享物件的鎖。這個執行緒可能會改變物件的狀態，使其不一致。這就是 TOCTOU 競爭冒險。   \n• 惡意通知——在等候條件為假時可能會收到一個隨機或惡意的通知。這樣的通知會取消 `wait()`的作用。   \n• 誤送的通知——收到 `notifyAll()`訊號後沒有指定執行緒的執行順序。因此，一個無關的線 程可能可以開始執行並發現已經滿足 T 它的等候條件。這造成了這個執行緒恢復執行，但 實際上它是應該處於睡眠狀態的。   \n• 虛假喚醒——某些 Java 虛擬機器實現容易收到虛假喚醒的影響，這會導致等待中的執行緒在沒有通知時也會被喚醒。   \n基於上述原因，程式必須在 `wait()`方法返回後檢查等候條件。不管是在呼叫 `wait()`之前還是之後，while 迴圈都是檢查等候條件的最好方式。   \n3) 示例   \n    如下不符合規則的程式碼示例，該示例在傳統的 if 程式段中呼叫`wait()`方法，沒有檢査接到通知後的後置條件。如果通知是意外或惡意的，執行緒將會過早地被喚醒。   \n    ```java\n    synchronized (object) {\n        if (<condition does not hold>) {\n            object.wait();\n        }\n        // Proceed when condition holds\n    }\n    ```\n    \n\n對應的符合規則的解決方案是通過在 while 迴圈中呼叫`wait()`方法，從而在`wait()`呼叫的前後都對條件進行檢査。   \n    ```java\n    synchronized (object) {\n        while (<condition does not hold>) {\n            object.wait();\n        }\n        // Proceed when condition holds\n    }\n    ```   \n    `java.util.concurrent.locks.Condition.await()`方法的呼叫也必須放置在類似的迴圈中。"
  cwe: []
