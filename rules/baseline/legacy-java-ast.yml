      message: "在使用SimpleDateFormat格式化和解析日期时，Y表示Week Year，意味着是当天所在的周属于的年份，一周从周日开始，周六结束，只要本周跨年，那么这周就算入下一年。。  \n  \n**例如**：下列代码中使用YYYY格式化日期，获取的值为2017/12/31。\n```java  \nDate date = new SimpleDateFormat(\"yyyy/MM/dd\").parse(\"2017/12/31\");  \nString result = new SimpleDateFormat(\"YYYY/MM/dd\").format(date);\n```\n\n确认代码逻辑，是否使用YYYY来格式化日期。  \n  \n**例如**：下列代码中使用yyyy格式化日期，获取的值为2017/12/31。\n```java  \nDate date = new SimpleDateFormat(\"yyyy/MM/dd\").parse(\"2017/12/31\");  \nString result = new SimpleDateFormat(\"yyyy/MM/dd\").format(date);\n```"
