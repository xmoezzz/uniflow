      message: Return a valid clone or String value instead of null.
    zh-TW:
      title: 【推薦】toString或clone方法不應該返回null
      message: "重寫`toString`或`clone`方法應該總是返回一個字串或者物件，程式設計師預設不會認為其為null。當返回null時，可能會引起空指標異常，影響程式執行。  \n  \n**例1**：下面程式碼示例中，重寫了`toString`方法，有可能返回為null。 \n```java \npublic String toString () {  \n    if (this.collection.isEmpty()) {  \n        return null;   \n    }  \n\t...   \n}\n```  \n**例2**：下面程式碼示例中，重寫了`clone`方法，有可能返回為null。\n```java  \nprotected Object clone() throws CloneNotSupportedException {  \n    Object object = super.clone();  \n    if (this.collection.isEmpty()) {  \n        return null;   \n    }  \n    ...  \n}\n```\n\n正確的重寫`toString`或`clone`方法，避免空指標異常和程式邏輯出錯。  \n  \n**例1**：下面程式碼示例中，重寫了`toString`方法，不會返回null。\n```java  \npublic String toString () {  \n    if (this.collection.isEmpty()) {  \n        return \"\";   \n    }  \n    ...   \n}\n```  \n\n**例2**：下面程式碼示例中，重寫了`clone`方法，不會返回null。\n```java  \nprotected Object clone() throws CloneNotSupportedException {  \n    Object object = super.clone();  \n\tif (this.collection.isEmpty()) {  \n        return object;   \n    }  \n    ...  \n}\n```"
