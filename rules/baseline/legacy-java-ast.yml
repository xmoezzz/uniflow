  message: Review the null assignment immediately preceding the return of the same value.
  translations:
    zh-CN:
      title: null加密密匙
      message: |-
        当程序中使用null加密密匙时，所有项目开发人员都可以查看该密匙，甚至如果攻击者可以获取到程序class文件，可以通过反编译得到密匙，null加密密匙会大大降低系统安全性。

        **例如**：下列代码使用null加密密钥执行AES加密。
        ```java
        ...
        SecretKeySpec key = new SecretKeySpec(null, "AES");
        Cipher encryptCipher = Cipher.getInstance("AES");
        encryptCipher.init(Cipher.ENCRYPT_MODE, key);
        ...
        ```

        程序应采用不小于8个字节的随机生成的字符串作为密匙。

        **例如**：以下代码使用KeyGenerator来生成密匙。
        ```java
        ...
        KeyGenerator keyGen = KeyGenerator.getInstance("AES");
        keyGen.init(128, new SecureRandom(password.getBytes()));
        SecretKey secretKey = kgen.generateKey();
        byte[] keyBytes = secretKey.getEncoded();
        SecretKeySpec key = new SecretKeySpec(keyBytes, "AES");
        Cipher encryptCipher = Cipher.getInstance("AES");
        encryptCipher.init(Cipher.ENCRYPT_MODE, key);
        ...
        ```
