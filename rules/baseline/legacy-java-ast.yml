  - LEGACY-MSG-0902000010160059
  - SJ/T 11683-2017:6.5.8 类定义了equals方法但是没有定义hashCode方法
  - YD/T 3464-2019:02000010160059
  - YD/T 3464-2019:0902000010160059
  - ast:0102000010140709
  - ast:02000010070016
  - ast:02000010140709
