      message: "未经身份验证的LDAP连接可能因为没有访问控制导致LDAP注入。  \n  \n**例如**：下面代码示例中将Context.SECURITY_AUTHENTICATION设为`\"none\"`，将禁用LDAP身份验证。\n```java\nHashtable<String, String> env = new Hashtable<String, String>();  \nenv.put(Context.INITIAL_CONTEXT_FACTORY, \"com.sun.jndi.ldap.LdapCtxFactory\");  \nenv.put(Context.PROVIDER_URL, \"ldap://localhost:389/o=JNDITutorial\");  \nenv.put(Context.SECURITY_AUTHENTICATION, \"none\");   \nDirContext ctx = new InitialDirContext(env);\n```\n\n身份验证和访问控制是防止LDAP注入的最后一道防线，不应该禁用它们。  \n  \n**例如**：下面代码示例中将Context.SECURITY_AUTHENTICATION设为`\"simple\"`，将启用LDAP身份验证。\n```java\nHashtable<String, String> env = new Hashtable<String, String>();  \nenv.put(Context.INITIAL_CONTEXT_FACTORY, \"com.sun.jndi.ldap.LdapCtxFactory\");  \nenv.put(Context.PROVIDER_URL, \"ldap://localhost:389/o=JNDITutorial\");  \nenv.put(Context.SECURITY_AUTHENTICATION, \"simple\");  \nenv.put(Context.SECURITY_PRINCIPAL, \"cn=S. User, ou=NewHires, o=JNDITutorial\");  \nenv.put(Context.SECURITY_CREDENTIALS, getLDAPPassword());  \nDirContext ctx = new InitialDirContext(env);\n```"
