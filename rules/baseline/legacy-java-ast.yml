        > * Because inner classes associated with outer instances do not have zero-argument constructors (constructors of such inner classes implicitly accept the enclosing instance as a prepended parameter), they cannot implement `Externalizable`. The `Externalizable` interface requires the implementing object to manually save and restore its state using the `writeExternal()` and `readExternal()` methods.

        Consequently, programs must not serialize inner classes.

        Because none of these issues apply to static member classes, serialization of static member classes is permitted.

        **Noncompliant Code Example**

        In this noncompliant code example, the fields contained within the outer class are serialized when the inner class is serialized:

        ```java
        public class OuterSer implements Serializable {
          private int rank;
          class InnerSer implements Serializable {
            protected String name;
            // ...
          }
        }
        ```

        **Compliant Solution**

        The `InnerSer` class of this compliant solution deliberately fails to implement the `Serializable` interface:

        ```java
        public class OuterSer implements Serializable {
          private int rank;
          class InnerSer {
            protected String name;
            // ...
          }
        }
        ```

        **Compliant Solution**

        If an inner and outer class must both be `Serializable`, the inner class can be declared `static` to prevent a serialized inner class from also serializing its outer class.

        ```java
        public class OuterSer implements Serializable {
          private int rank;
          static class InnerSer implements Serializable {
            protected String name;
            // ...
          }
        }
        ```
    zh-TW:
      title: C.14.6 不要序列化內部類例項
      message: "1) 規定   \n程式不能對內部類進行序列化，但對靜態成員類的序列化是允許的。   \n2) 原理   \n一個內部類是一個沒有顯式或隱式宣告為靜態的巢狀類。對內部類的序列化易出錯（包括本地和匿名類）。根據序列化規範的說明:   \n當內部類宣告在非靜態環境中，並隱含對外部類例項非 transient的引用時，序列化這樣的內部類，會導致將它的外部類例項也進行序列化。   \n通過 Java編譯器產生的來實現內部類的合成數據成員是與實現相關的，並且會隨著編譯器的不同而不同，而這些資料成員的不同會破壞相容性，並且會導致與預設的 serialVersionlHD數值相沖突。賦予本地和匿名內部類的名稱同樣也是與實現相關的，並且在不同的編輯器之間它們是不同的。   \n因為除了編譯期的常量資料成員，內部類不能宣告靜態資料成員，所以它們不能使用serialPersistentFields機制來設計可序列化的資料成員。   \n因為與外部類相關聯的內部類不能存在零引數的構造方法（這樣的內部類的構造 方法隱含的接受外包例項作為引數），所以它們不能實現 Externalizable 介面。而   Externalizableinterface 介面要求實現的物件需要通過用 `writeExternal()`和   \n`readExternal()` 方法來對它的狀態進行手動儲存或者恢復。   \n3) 示例   \n    一個不符合規則的程式碼示例，該示例中，當內部類被序列化時，包含在外部類的欄位也會被序列化。   \n    ```java\n    public class OuterSer implements Serializable {\n        private int rank;\n    \n        class InnerSer implements Serializable {\n            protected String name;\n            // . . .\n        }\n    }\n    ```   \n    \n\n對應的符合規定的解決方案一是：OuterSer類特意不實現 Serializable 介面。   \n    ```java\n    public class OuterSer implements Serializable {\n        private int rank;\n    \n        class InnerSer {\n            protected String name;\n            // . . .\n        }\n    }\n    ```   \n    解決方案二是：內部類可以被宣告為靜態從而防止被序列化。一個靜態的內部類也可以實現Serializable。\n    ```java   \n    public class OuterSer implements Serializable {\n        private int rank;\n    \n        static class InnerSer implements Serializable {\n            protected String name;\n            // . . .\n        }\n    }\n    ```"
