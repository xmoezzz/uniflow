        ```java
        url.equals(otherUrl);
        ```
        **例2**：当Map和Set中存取URL时，会默认调用URL的`equals`和`hashCode`方法。下列代码中，在Set中存放URL。
        ```java
        Set<URL> set= new HashSet<>();
        map.add(url);
        ```

        使用URI替换URL进行处理。

        **例1**：下列代码中,使用URI的`equals`来判断是否为同一个URI。
        ```java
        uri.equals(otherUri);
        ```
        **例2**：下列代码中,在Set中存放URI。
        ```java
        Set<URI> map = new HashSet<>();
        map.add(uri);
        ```
