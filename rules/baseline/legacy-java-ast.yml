  message: Return Optional.empty and test Optional presence instead of using null.
  translations:
    zh-CN:
      title: 【强制】Optional不应该可能为null
      message: "Optional在某种意义上是Java8提供的为了解决null安全问题的一个API，而将Optional与null进行比较，或者返回的Optional可能为null都是不准确的做法。  \n  \n**例如**：下列代码中使用`getOptional`返回值可能为null，而且与null进行了对比。 \n```java\npublic void doSomething () {  \n    Optional<String> optional = getOptional();  \n    if (optional != null) {    \n        ...  \n    }  \n}  \npublic Optional<String> getOptional() {  \n    ...  \n    return null;   \n}\n```\n\n准确的使用Optional可以提高代码简洁性，并且可以避免空指针异常的出现。  \n  \n**例如**：下列代码中使用getOptional返回值为`Optional.empty()`，通过`ifPresent`方法来判断值是否为空。 \n```java\npublic void doSomething () {  \n    Optional<String> optional = getOptional();  \n    optional.ifPresent(...);  \n}  \npublic Optional<String> getOptional() {  \n    ...  \n    return Optional.empty();   \n}\n```"
    en:
      title: Null used with Optional
      message: Return Optional.empty and test Optional presence instead of using null.
    zh-TW:
      title: 【強制】Optional不應該可能為null
      message: "Optional在某種意義上是Java8提供的為了解決null安全問題的一個API，而將Optional與null進行比較，或者返回的Optional可能為null都是不準確的做法。  \n  \n**例如**：下列程式碼中使用`getOptional`返回值可能為null，而且與null進行了對比。 \n```java\npublic void doSomething () {  \n    Optional<String> optional = getOptional();  \n    if (optional != null) {    \n        ...  \n    }  \n}  \npublic Optional<String> getOptional() {  \n    ...  \n    return null;   \n}\n```\n\n準確的使用Optional可以提高程式碼簡潔性，並且可以避免空指標異常的出現。  \n  \n**例如**：下列程式碼中使用getOptional返回值為`Optional.empty()`，通過`ifPresent`方法來判斷值是否為空。 \n```java\npublic void doSomething () {  \n    Optional<String> optional = getOptional();  \n    optional.ifPresent(...);  \n}  \npublic Optional<String> getOptional() {  \n    ...  \n    return Optional.empty();   \n}\n```"
