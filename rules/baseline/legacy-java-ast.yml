  standards:
  - CWE:561:Dead Code
  - ISO/IEC TR 24772:2013:Programming Language Vulnerabilities Unused Variable [YZS]
  - LEGACY-MSG-02000010130006
  - LEGACY-MSG-0202000010130006
  - ast:02000010130006
  - ast:0202000010130006
  - bug:02000010130006
  message: Remove the unused field or reference it from the declaring class.
  translations:
    zh-CN:
      title: 未使用的字段
      message: |-
        未使用的变量在程序中没有起到任何作用，是程序中的死代码或者是被注释掉的调试代码。这些死代码会增加代码的阅读、理解和维护难度。

        **例如**：如下代码中MyClass类中的字段`userName`从未使用过
        ```java
        public class MyClass {
            private String userName="admin";
            public static void main(String[] args) {
