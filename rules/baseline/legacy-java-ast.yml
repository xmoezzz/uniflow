        由于每个线程有不同的wait条件，假如存在满足条件的线程，但是因为`notify()`方法只能唤醒一个线程，若被唤醒的线程不满足条件，则必须继续等待，程序有可能因此将会发生死锁。

        使用`notifyAll()`方法代替`notify()`方法。

        **例如**：下列代码片段中，调用`notifyAll()`方法代替了`notify()`方法，将会唤醒所有线程，满足条件的线程将会执行它的任务，不满足条件的线程将会继续等待。
        ```java
        public final class ProcessStep implements Runnable {
            private static final Object lock = new Object();
            private static int time = 0;
            private final int step; // Perform operations when field time
                                    // reaches this value
            public ProcessStep(int step) {
                this.step = step;
            }
            @Override public void run() {
                try {
                    synchronized (lock) {
                        while (time != step) {
                            lock.wait();
                        }
                        // Perform operations
                        time++;
                        lock.notifyAll(); // Use notifyAll() instead of notify()
                    }
                } catch (InterruptedException ie) {
                    Thread.currentThread().interrupt(); // Reset interrupted status
                }
            }
        }
        ```
    en:
      title: Call to notify()
      message: |-
        Threads that invoke `Object.wait()` expect to wake up and resume execution when their condition predicate becomes true. To be compliant with THI03-J. Always invoke wait() and await() methods inside a loop, waiting threads must test their condition predicates upon receiving notifications and must resume waiting if the predicates are false.

        The `notify()` and `notifyAll()` methods of package `java.lang.Object` are used to wake up a waiting thread or threads, respectively. These methods must be invoked from a thread that holds the same object lock as the waiting thread(s); these methods throw an `IllegalMonitorStateException` when invoked from any other thread. The `notifyAll()` method wakes up all threads waiting on an object lock and allows threads whose condition predicate is true to resume execution. Furthermore, if all the threads whose condition predicate evaluates to true previously held a specific lock before going into the wait state, only one of them will reacquire the lock upon being notified. Presumably, the other threads will resume waiting. The `notify()` method wakes up only one thread, with no guarantee regarding which specific thread is notified. The chosen thread is permitted to resume waiting if its condition predicate is unsatisfied; this often defeats the purpose of the notification.

        Consequently, invoking the `notify()` method is permitted only when *all* of the following conditions are met:

        * All waiting threads have identical condition predicates.
        * All threads perform the same set of operations after waking up. That is, any one thread can be selected to wake up and resume for a single invocation of `notify()`.
        * Only one thread is required to wake upon the notification.

        These conditions are satisfied by threads that are identical and provide a stateless service or utility.

        The `java.util.concurrent.locks` utilities provide the `Condition.signal()` and `Condition.signalAll()` methods to awaken threads that are blocked on a `Condition.await()` call. `Condition` objects are required when using `java.util.concurrent.locks.Lock` objects. Although `Lock` objects allow the use of `Object.wait()`, `Object.notify()`, and `Object.notifyAll()` methods, their use is prohibited by LCK03-J. Do not synchronize on the intrinsic locks of high-level concurrency objects. Code that synchronizes using a `Lock` object uses one or more `Condition` objects associated with the `Lock` object rather than using its own intrinsic lock. These objects interact directly with the locking policy enforced by the `Lock` object. Consequently, the `await()`, `signal()`, and `signalAll()` methods are used in place of the `wait()`, `notify()`, and `notifyAll()` methods.

        The `signal()` method must not be used unless all of these conditions are met:

        * The `Condition` object is identical for each waiting thread.
        * All threads must perform the same set of operations after waking up, which means that any one thread can be selected to wake up and resume for a single invocation of `signal()`.
        * Only one thread is required to wake upon receiving the signal.

        or all of these conditions are met:

        * Each thread uses a unique `Condition` object.
        * Each `Condition` object is associated with the same `Lock` object.

        When used securely, the `signal()` method has better performance than `signalAll()`.

        When `notify()` or `signal()` is used to waken a waiting thread, and the thread is not prepared to resume execution, it often resumes waiting. Consequently, no thread wakens, which may cause the system to hang.

        **Noncompliant Code Example (`notify()`)**

        This noncompliant code example shows a complex, multistep process being undertaken by several threads. Each thread executes the step identified by the `time` field. Each thread waits for the `time` field to indicate that it is time to perform the corresponding thread's step. After performing the step, each thread first increments `time` and then notifies the thread that is responsible for the next step.

        ```java
        public final class ProcessStep implements Runnable {
          private static final Object lock = new Object();
          private static int time = 0;
          private final int step; // Do Perform operations when field time
                                  // reaches this value

          public ProcessStep(int step) {
            this.step = step;
          }

          @Override public void run() {
            try {
              synchronized (lock) {
                while (time != step) {
                  lock.wait();
                }

                // Perform operations

                time++;
                lock.notify();
              }
            } catch (InterruptedException ie) {
              Thread.currentThread().interrupt(); // Reset interrupted status
            }
          }

          public static void main(String[] args) {
            for (int i = 4; i >= 0; i--) {
              new Thread(new ProcessStep(i)).start();
            }
          }
        }
        ```

        This noncompliant code example violates the liveness property. Each thread has a different condition predicate because each requires `step` to have a different value before proceeding. The `Object.notify()` method wakes only one thread at a time. Unless it happens to wake the thread that is required to perform the next step, the program will deadlock.

        **Compliant Solution (`notifyAll()`)**

        In this compliant solution, each thread completes its step and then calls `notifyAll()` to notify the waiting threads. The thread that is ready can then perform its task while all the threads whose condition predicates are false (loop condition expression is true) promptly resume waiting.

        Only the `run()` method from the noncompliant code example is modified, as follows:

        ```java
        public final class ProcessStep implements Runnable {
          private static final Object lock = new Object();
          private static int time = 0;
          private final int step; // Perform operations when field time
                                  // reaches this value
          public ProcessStep(int step) {
            this.step = step;
          }

          @Override public void run() {
            try {
              synchronized (lock) {
                while (time != step) {
                  lock.wait();
                }

                // Perform operations

                time++;
                lock.notifyAll(); // Use notifyAll() instead of notify()
              }
            } catch (InterruptedException ie) {
              Thread.currentThread().interrupt(); // Reset interrupted status
            }
          }

        }
        ```
    zh-TW:
      title: C.10.3 通知所有等待中的執行緒而不是單一執行緒
      message: "1) 規定   \n只有在“所有執行緒擁有一致的等候條件”、“所有執行緒在被喚醒後會進行相同的操作”、“在發出通知後，只需要一個執行緒恢復工作”都滿足的情況下，才能呼叫 notify()方法。   \n2) 原理   \n呼叫 `Object.wait()`的執行緒期望在它們的等候條件成真時恢復繼續執行。等待中的執行緒在接到通知時，必須測試它們的等候條件，而且在等候條件為假時，必須繼續等待。`java.lang.Object` 包中的`notify()`和`notifyAll()`方法分別是用來喚醒等待中的一個或多個執行緒的。這些方法必須由那些擁有等待執行緒的物件鎖的執行緒來呼叫，而且這些方法在被其他執行緒呼叫時會丟擲illegalMonitorStateException。`notifyAll()`方法會喚醒所有等待同一物件鎖的執行緒，並允許等候條件成真的執行緒恢復執行。而且，如果那些等候條件成真的所有執行緒在進入等候狀態前持有某一特定的鎖的話，在接到通知時只有一個執行緒可以重新得到這個鎖。其他執行緒將會繼續等待。`notify(`)方法只喚醒一個執行緒，而並不保證哪一個執行緒會接到通知。並且，只有在“所有執行緒擁有一致的等候條件”、“所有執行緒在被喚醒後會進行相同的操作”、“在發出通知後，只需要一個執行緒恢復工作”都滿足的情況下，才能呼叫`notify()`方法。   `java.util.concurrent.locks` 工具提供了 `Condition.signal()`和 `Condition.signalAll()`方法來喚醒在呼叫`Condition.await()`時受阻的執行緒。使用 `java.util.concurrent.locks.Lock` 物件時需要 Condition 物件。利用一個 Lock 物件來同步的程式碼會用到一個或多個和這個 Lock 物件相關的 Condition 物件，而不只是使用它的隱含鎖。這些物件根據 Lock 物件制定的鎖定策略來直接進行相互操作。因此，方法 `await()、signal()`和 `signalAll()`是用來代替方法 `wait()、notify()` 和 `notifyAll()`的。   \n3) 示例   \n    1、不符合規則的程式碼示例（`notify()`），該示例演示了一個由多個執行緒執行的複雜的多步驟過程。每一個執行緒執行由 time 欄位決定的步驟。執行緒會等待 time 欄位的指示，來確定是否執行對應執行緒的步驟。在 執行任務後，每一個執行緒先是增加 time,然後再通知負責下一個步驟的執行緒。   \n    ```java\n    public final class ProcessStep implements Runnable {\n        private static final Object lock = new Object();\n        private static int time = 0;\n        private final int step; // Perform operations when field time\n        // reaches this value\n    \n        public ProcessStep(int step) {\n            this.step = step;\n        }\n    \n        @Override\n        public void run() {\n            try {\n                synchronized (lock) {\n                    while (time != step) {\n                        lock.wait();\n                    }\n                    // Perform operations\n                    time++;\n                    lock.notify();\n                }\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt(); // Reset interrupted status\n            }\n        }\n    \n        public static void main(String[] args) {\n            for (int i = 4; i >= 0; i--) {\n                new Thread(new ProcessStep(i)).start();\n            }\n        }\n    }\n    ```  \n    本程式碼示例違反了活性屬性。因為每一個執行緒在繼續執行前要求的 step 數值是不一樣的，所有執行緒有著不同的等候條件。`Object.notify()`方法一次只會喚醒一個執行緒。除非正好喚醒執行下一個步驟的執行緒，否則這個程式會發生死鎖。   \n       \n    \n\n對應的符合規則的解決方案（`notifyAll())`中，每一個執行緒都在完成它自己的步驟後呼叫`notifyAll()`方法來通知等待中的執行緒。準備好的執行緒可以執行它的任務，而那些其他等待條件為假的執行緒（迴圈條件表 達式為 true)則會繼續等待。   \n    本程式碼只修改了上述不符合規則程式碼示例中的`run()`方法：   \n    ```java\n    public final class ProcessStep implements Runnable {\n        private static final Object lock = new Object();\n        private static int time = 0;\n        private final int step; // Perform operations when field time\n                                // reaches this value\n    \n        public ProcessStep(int step) {\n            this.step = step;\n        }\n    \n        @Override\n        public void run() {\n            try {\n                synchronized (lock) {\n                    while (time != step) {\n                        lock.wait();\n                    }\n    \n                    // Perform operations\n    \n                    time++;\n                    lock.notifyAll(); // Use notifyAll() instead of notify()\n                }\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt(); // Reset interrupted status\n            }\n        }\n    \n    }\n    ```\n       \n    2、不符合規則的程式碼示例（Condition 介面），該示例是和使用`notify()`的例子相類似，本段程式碼使用的是 Condition 介面來進行等待和通知操作。   \n    ```java\n    public class ProcessStep implements Runnable {\n        private static final Lock lock = new ReentrantLock();\n        private static final Condition condition = lock.newCondition();\n        private static int time = 0;\n        private final int step; // Perform operations when field time\n                                // reaches this value\n    \n        public ProcessStep(int step) {\n            this.step = step;\n        }\n    \n        @Override\n        public void run() {\n            lock.lock();\n            try {\n                while (time != step) {\n                    condition.await();\n                }\n    \n                // Perform operations\n    \n                time++;\n                condition.signal();\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt(); // Reset interrupted status\n            } finally {\n                lock.unlock();\n            }\n        }\n    \n        public static void main(String[] args) {\n            for (int i = 4; i >= 0; i--) {\n                new Thread(new ProcessStep(i)).start();\n            }\n        }\n    }\n    ```   \n    和 `Object.notify()` —樣，`signal()`方法會喚醒任意一個執行緒。   \n       \n    對應的符合規則的方案（`signalAll()`)通過使用 `signalAll()`方法來通知所有等待中的執行緒。在 `await()`返回前，當前執行緒會重新獲取和條件相關的鎖。執行緒在返回時，肯定是擁有這個鎖的。準備就緒的執行緒可以執行其任務，而那些等條件為假的執行緒則會繼續等待。   \n    本程式碼只修改了上述不符合規則的程式碼示例中的`run()`方法：   \n    ```java\n    public class ProcessStep implements Runnable {\n        private static final Lock lock = new ReentrantLock();\n        private static final Condition condition = lock.newCondition();\n        private static int time = 0;\n        private final int step; // Perform operations when field time\n                                // reaches this value\n    \n        public ProcessStep(int step) {\n            this.step = step;\n        }\n    \n        @Override\n        public void run() {\n            lock.lock();\n            try {\n                while (time != step) {\n                    condition.await();\n                }\n    \n                // Perform operations\n    \n                time++;\n                condition.signalAll();\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt(); // Reset interrupted status\n            } finally {\n                lock.unlock();\n            }\n        }\n    \n    }\n    ```   \n       \n    另一個符合規則的解決方案是賦予每個執行緒一個自己的條件。所有的執行緒都可以訪問所有的Condition 物件。   \n    ```java\n    // Declare class as final because its constructor throws an exception\n    public final class ProcessStep implements Runnable {\n        private static final Lock lock = new ReentrantLock();\n        private static int time = 0;\n        private final int step; // Perform operations when field time\n                                // reaches this value\n        private static final int MAX_STEPS = 5;\n        private static final Condition[] conditions = new Condition[MAX_STEPS];\n    \n        public ProcessStep(int step) {\n            if (step <= MAX_STEPS) {\n                this.step = step;\n                conditions[step] = lock.newCondition();\n            } else {\n                throw new IllegalArgumentException(\"Too many threads\");\n            }\n        }\n    \n        @Override\n        public void run() {\n            lock.lock();\n            try {\n                while (time != step) {\n                    conditions[step].await();\n                }\n    \n                // Perform operations\n    \n                time++;\n                if (step + 1 < conditions.length) {\n                    conditions[step + 1].signal();\n                }\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt(); // Reset interrupted status\n            } finally {\n                lock.unlock();\n            }\n        }\n    \n        public static void main(String[] args) {\n            for (int i = MAX_STEPS - 1; i >= 0; i--) {\n                ProcessStep ps = new ProcessStep(i);\n                new Thread(ps).start();\n            }\n        }\n    }\n    ```  \n    雖然使用了`signal()`方法，但是隻有等候條件對應於特定 Condition 變數的執行緒才會被喚醒。"
