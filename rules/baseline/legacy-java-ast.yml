  message: Return a valid clone or String value instead of null.
  translations:
    zh-CN:
      title: 【推荐】toString或clone方法不应该返回null
      message: "重写`toString`或`clone`方法应该总是返回一个字符串或者对象，程序员默认不会认为其为null。当返回null时，可能会引起空指针异常，影响程序运行。  \n  \n**例1**：下面代码示例中，重写了`toString`方法，有可能返回为null。 \n```java \npublic String toString () {  \n    if (this.collection.isEmpty()) {  \n        return null;   \n    }  \n\t...   \n}\n```  \n**例2**：下面代码示例中，重写了`clone`方法，有可能返回为null。\n```java  \nprotected Object clone() throws CloneNotSupportedException {  \n    Object object = super.clone();  \n    if (this.collection.isEmpty()) {  \n        return null;   \n    }  \n    ...  \n}\n```\n\n正确的重写`toString`或`clone`方法，避免空指针异常和程序逻辑出错。  \n  \n**例1**：下面代码示例中，重写了`toString`方法，不会返回null。\n```java  \npublic String toString () {  \n    if (this.collection.isEmpty()) {  \n        return \"\";   \n    }  \n    ...   \n}\n```  \n\n**例2**：下面代码示例中，重写了`clone`方法，不会返回null。\n```java  \nprotected Object clone() throws CloneNotSupportedException {  \n    Object object = super.clone();  \n\tif (this.collection.isEmpty()) {  \n        return object;   \n    }  \n    ...  \n}\n```"
    en:
