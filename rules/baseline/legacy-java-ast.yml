  message: Confirm that the input byte order matches DataInputStream big-endian reads.
  translations:
    zh-CN:
      title: C.13.13 为小端数据的读写提供方法
      message: "1) 规定   \n与使用 JNI 的其他语言一起工作时，应正确地处理相关的字节顺序问题。   \n2) 原理   \n在 Java 中，数据是按照大端字节序进行存储的（同样被称为网络字节编组）。这意味着，线性地从最高位到最低位表示数据。在 JDK1.4 之前的版本中，要求提供对相反的字节顺序进行管理的方法的定义，同时需要维护这些相反的字节顺序与采用小端（little-endian)字节序编码的系统的兼容性。在同时包括了大端字节序和小端字节序主机的网络化的环境中，或者与使用 JNI 的其他语言一起工作时，正确地处理相关的字节顺序问题是很重要的。不能处理字节顺序问题，会导致不可预期的程序行为。   \n3) 示例   \n    由类 java.io.DatalnputStream 和 java.io.DataOutputStream 定义的数据读取的方法（`readByte()、readShort()、readlnt()、readLong()、readFloat()`和 `readDouble()`）和对应的写方法仅对大端字节序数据进行操作。使用这些方法与传统的语言如 C 或者 C++进行互操作是不安全的，这些语言不能保证字节顺序。这个不符合规则的代码示例展示了这样的一个差别：   \n    ```java\n    try {   \n        DatalnputStream dis = null;    \n        try {   \n            dis = new DatalnputStream(new FilelnputStream(\"data\"));   \n            //Little-endian data might be read as big-endian    \n            int serialNumber = dis.readlnt();   \n        } catch (IOException x) {   \n            //handle error   \n        } finally {   \n            if (dis != null) {   \n                try {   \n                    dis.close ();   \n                } catch (IOException e) {   \n                // handle error   \n                }   \n            }   \n        }\n    ```   \n    \n\n对应的符合规则的解决方案是：通过使用类 ByteBuffer 提供的方法来正确地从初始的输入数值中提取一个 int 值。它使用 ByteBuffer 来封装输入字节数组，设置字节顺序为小端字节序，并且提取出 int值，结果存储在 serialNumber 整数中。类 ByteBuffer 提供了类似的 get 和 put 方法来处理其他的数值类型。   \n    ```java\n    try (   \n        DatalnputStream dis = null;    \n        try {   \n            dis = new DatalnputStream( new FilelnputStream(\"data\"));    \n            byte[] buffer = new byte[4];   \n            int bytesRead = dis.read(buffer); // Bytes are read into buffer   \n            if (bytesRead != 4) {   \n                throw new IOException(\"Unexpected End of Stream\");   \n            }   \n            int serialNumber =ByteBuffer.wrap(buffer).order(ByteOrder.LITTLE_ENDIAN).getlnt();   \n        } finally {   \n            if (dis != null) {   \n                try {   \n                    dis.close ();   \n                } catch (IOException x) {   \n                    // handle error   \n                }   \n            }   \n        }   \n    } catch (IOException x) {   \n        //handle error   \n    }\n    ```"
    en:
      title: FIO12-J:Provide methods to read and write little-endian data
      message: |-
        In Java, data is stored in big-endian format (also called network order). That is, all data is represented sequentially starting from the most significant bit to the least significant. JDK versions prior to JDK 1.4 required definition of custom methods that manage reversing byte order to maintain compatibility with little-endian systems. Correct handling of byte order–related issues is critical when exchanging data in a networked environment that includes both big-endian and little-endian machines or when working with other languages using Java Native Interface (JNI). Failure to handle byte-ordering issues can cause unexpected program behavior.
          **Noncompliant Code Example**

        The read methods (`readByte()`, `readShort()`, `readInt()`, `readLong()`, `readFloat()`, and `readDouble()`) and the corresponding write methods defined by class `java.io.DataInputStream` and class `java.io.DataOutputStream` operate only on big-endian data. Use of these methods while interoperating with traditional languages, such as C and C++, is insecure because such languages lack any guarantees about endianness. This noncompliant code example shows such a discrepancy:

        ```java
        try {
          DataInputStream dis = null;
          try {
            dis = new DataInputStream(new FileInputStream("data"));
            // Little-endian data might be read as big-endian
            int serialNumber = dis.readInt();
          } catch (IOException x) {
            // Handle error
          } finally {
            if (dis != null) {
              try {
               dis.close();
              } catch (IOException e) {
              // Handle error
              }
            }
          }
        }
        ```

        **Compliant Solution (`ByteBuffer`)**
        This compliant solution uses methods provided by class `<a class="external-link" href="https://docs.oracle.com/javase/8/docs/api/java/nio/ByteBuffer.html" rel="nofollow">ByteBuffer</a>` [[API 2014] to correctly extract an `int` from the original input value. It wraps the input byte array with a `ByteBuffer`, sets the byte order to little-endian, and extracts the `int`. The result is stored in the integer `serialNumber`. Class `ByteBuffer` provides analogous get and put methods for other numeric types.
        ```java
        try {
          DataInputStream dis = null;
          try {
            dis = new DataInputStream( new FileInputStream("data"));
            byte[] buffer = new byte[4];
            int bytesRead = dis.read(buffer);  // Bytes are read into buffer
            if (bytesRead != 4) {
              throw new IOException("Unexpected End of Stream");
            }
            int serialNumber =
                ByteBuffer.wrap(buffer).order(ByteOrder.LITTLE_ENDIAN).getInt();
          } finally {
            if (dis != null) {
          try {
            dis.close();
          } catch (IOException x) {
            // Handle error
          }
            }
          }
        } catch (IOException x) {
          // Handle error
        }
        ```
        **Compliant Solution (Define Special-Purpose Methods)**

        An alternative compliant solution is to define read and write methods that support the necessary byte-swapping while reading from or writing to the file. In this example, the `readLittleEndianInteger()` method reads four bytes into a byte buffer and then pieces together the integer in the correct order. The `writeLittleEndianInteger()` method obtains bytes by repeatedly casting the integer so that the least significant byte is extracted on successive right shifts. `Long` values can be handled by defining a byte buffer of size 8.

        ```java
        // Read method
        public static int readLittleEndianInteger(InputStream ips)
                                                  throws IOException {
          byte[] buffer = new byte[4];
          int check = ips.read(buffer);

          if (check != 4) {
            throw new IOException("Unexpected End of Stream");
          }

          int result = (buffer[3] << 24) | (buffer[2] << 16) |
                       (buffer[1] << 8)  | buffer[0];
          return result;
        }

        // Write method
        public static void writeLittleEndianInteger(int i, OutputStream ops)
          throws IOException {
          byte[] buffer = new byte[4];
          buffer[0] = (byte) i;
          buffer[1] = (byte) (i >> 8);
          buffer[2] = (byte) (i >> 16);
          buffer[3] = (byte) (i >> 24);
          ops.write(buffer);
        }
        ```

        **Compliant Solution (`reverseBytes()`)**

        When programming for JDK 1.5 and later, use the `reverseBytes()` method defined in the classes `Character`, `Short`, `Integer`, and `Long` to reverse the order of the integral value's bytes. Note that classes `Float` and `Double` lack such a method.

        ```java
        public static int reverse(int i) {
          return Integer.reverseBytes(i);
        }
        ```
    zh-TW:
      title: DataInputStream multi-byte read
      message: Confirm that the input byte order matches DataInputStream big-endian reads.
