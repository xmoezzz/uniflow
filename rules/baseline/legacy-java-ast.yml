  message: Perform SecurityManager checks only from non-overridable methods.
  translations:
    zh-CN:
      title: 可以被重写的安全检查方法
      message: |-
        类中一些方法调用了执行安全检测的方法，如果没有用final声明，可能会被子类用重写的该方法的方式以绕过安全检测。

        **例如**：在下列代码中，`doSecurityCheck()`执行了安全检查，并且它可被其子类覆盖。
        ```java
        public class SecurityCheck {
            private String username;
            public SecurityCheck(String username) {
                doSecurityCheck();
                this.username = username;
            }
            protected void doSecurityCheck() {
                SecurityManager smanager = System.getSecurityManager();
                if (smanager != null) {
                    smanager.checkPermission(new SomePermission("Something"));
                }
            }
        }
        ```

        建议所有执行安全操作的方法都已在final类中声明，或者这些方法本身已声明为final类型。
    en:
      title: Overridable Method
      message: |-
        Nonfinal member methods that perform security checks can be compromised when a malicious subclass overrides the methods and omits the checks. Consequently, such methods must be declared private or final to prevent overriding.

        **Noncompliant Code Example**

        This noncompliant code example allows a subclass to override the `readSensitiveFile()` method and omit the required security check:

        ```java
        public void readSensitiveFile() {
          try {
            SecurityManager sm = System.getSecurityManager();
            if (sm != null) {  // Check for permission to read file
              sm.checkRead("/temp/tempFile");
            }
            // Access the file
          } catch (SecurityException se) {
            // Log exception
          }
        }
        ```

        **Compliant Solution**

        This compliant solution prevents overriding of the `readSensitiveFile()` method by declaring it final:

        ```java
        public final void readSensitiveFile() {
          try {
            SecurityManager sm = System.getSecurityManager();
            if (sm != null) {  // Check for permission to read file
              sm.checkRead("/temp/tempFile");
            }
            // Access the file
          } catch (SecurityException se) {
            // Log exception
          }
        }
        ```

        **Compliant Solution**

        This compliant solution prevents overriding of the `readSensitiveFile()` method by declaring it private:

        ```java
        private void readSensitiveFile() {
          try {
            SecurityManager sm = System.getSecurityManager();
            if (sm != null) {  // Check for permission to read file
              sm.checkRead("/temp/tempFile");
            }
            // Access the file
          } catch (SecurityException se) {
            // Log exception
          }
        }
        ```

        **Exceptions**

        MET03-J-EX0: Classes that are declared final are exempt from this rule because their member methods cannot be overridden.
    zh-TW:
      title: SecurityManager check occurs in an overridable method
      message: Perform SecurityManager checks only from non-overridable methods.
  cwe:
  - CWE-358
- id: LEGACY-JAVA-AST-clone-method-use-sec-method
  title: Clone omits constructor security checks
  languages:
  - java
  severity: error
  confidence: high
  matcher:
    java_style: clone_method_use_sec_method
  standards:
  - CWE:358:Improperly Implemented Security Check for Standard
  - LEGACY-MSG-02000010110065
  - LEGACY-MSG-0202000010110065
  - ast:02000010110065
  - ast:0202000010110065
  - bug:02000010110065
  message: Apply the constructor security check path when cloning this Cloneable class.
  translations:
    zh-CN:
      title: 缺少安全检查：clone()
      message: |-
        一个实现了Cloneable接口的类在克隆类时，并不会调用该类中的构造函数。因此，如果该类的构造函数中存在SecurityManager或AccessController检查，而在`clone()`方法中又没有进行相同的检查，克隆类时将会绕过此安全检查。

        **例如**：对于下列代码，构造函数中包含SecurityManager检查，而`clone()`方法中不包含该检查。
        ```java
        public class SecurityCheck implements Cloneable {
            private String name;
            public SecurityCheck(String name) {
                SecurityManager smanager= System.getSecurityManager();
                if (smanager!= null) {
                    smanager.checkPermission(new BadPermission("SecurityCheck"));
                }
                this.name = name;
            }
            public Object clone() throws CloneNotSupportedException {
                SecurityCheck sc= (SecurityCheck)super.clone();
                return null;
            }
        }
        ```

        如果在类实现了Cloneable接口，且该类的构造函数中存在SecurityManager或AccessController检查，那么该类的clone()方法中也必须存在相同的检查。

        **例如**：下列代码在构造函数与`clone()`方法中都使用`doSecurityCheck()`方法来执行SecurityManager检查。
        ```java
        public class SecurityCheck implements Cloneable {
            private String name;
            public SecurityCheck(String name) {
                doSecurityCheck();
                this.name = name;
            }
            public Object clone() throws CloneNotSupportedException {
                SecurityCheck sc= (SecurityCheck) super.clone();
                doSecurityCheck();
                return null;
            }
            private final void doSecurityCheck() {
                SecurityManager smanager= System.getSecurityManager();
                if (smanager!= null) {
                    smanager.checkPermission(new GoodPermission("SecurityCheck"));
                }
            }
        }
        ```
    en:
      title: Cloneable
      message: Apply the constructor security check path when cloning this Cloneable class.
    zh-TW:
      title: Clone omits constructor security checks
      message: Apply the constructor security check path when cloning this Cloneable class.
  cwe:
  - CWE-358
- id: LEGACY-JAVA-AST-readobject-call-final-method
  title: readObject calls an overridable method
  languages:
  - java
  severity: error
  confidence: high
  matcher:
    java_style: readobject_call_final_method
  standards:
  - CERT:SER09-J:Do not invoke overridable methods from the readObject() method
  - CWE:398:Indicator of Poor Code Quality
  - LEGACY-MSG-0102000010141506
  - LEGACY-MSG-02000010110087
  - LEGACY-MSG-02000010141506
  - LEGACY-MSG-0202000010110087
