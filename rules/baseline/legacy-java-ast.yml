  message: Use Double.isNaN because NaN is unequal to every value, including itself.
  translations:
    zh-CN:
      title: 与NaN进行比较
      message: |-
        所以它与任何值都不相等，包括它自己，故如果拿变量与NaN进行比较，得出的计算结果将始终为false（!=运算符是个例外：会得出true结果）

        **例如**：以下代码输出结果为false。
        ```java
        System.out.println(Double.NaN == Double.NaN);
        ```

        使用`Double.isNaN()`来检测表达式是否是一个NaN数值。
    en:
      title: Comparison with NaN
      message: |-
        According to The Java Language Specification (JLS), §4.2.3, "Floating-Point Types, Formats, and Values" [JLS 2015]:

        > `NaN` (not-a-number) is unordered, so the numerical comparison operators `<`, `<=`, `>`, and `>=` return `false` if either or both operands are `NaN`. The equality operator `==` returns `false` if either operand is `NaN`, and the inequality operator `!=` returns `true` if either operand is `NaN`.

        Because this unordered property is often unexpected, direct comparisons with `NaN` must not be performed. Problems can arise when programmers write code that compares floating-point values without considering the semantics of `NaN`. For example, input validation checks that fail to consider the possibility of a `NaN` value as input can produce unexpected results (see NUM08-J. Check floating-point inputs for exceptional values for additional information).

        **Noncompliant Code Example**

        This noncompliant code example attempts a direct comparison with `NaN`. In accordance with the semantics of `NaN`, all comparisons with `NaN` yield false (with the exception of the `!=` operator, which returns true). Consequently, this comparison always return `false`, and the `"result is NaN"` message is never printed.

        ```java
        public class NaNComparison {
          public static void main(String[] args) {
            double x = 0.0;
            double result = Math.cos(1/x); // Returns NaN if input is infinity
            if (result == Double.NaN) { // Comparison is always false!
              System.out.println("result is NaN");
            }
          }
        }
        ```

        **Compliant Solution**

        This compliant solution uses the method `Double.isNaN()` to check whether the expression corresponds to a `NaN` value:

        ```java
        public class NaNComparison {
          public static void main(String[] args) {
            double x = 0.0;
            double result = Math.cos(1/x); // Returns NaN when input is infinity
            if (Double.isNaN(result)) {
              System.out.println("result is NaN");
            }
          }
        }
        ```
    zh-TW:
      title: NaN compared with equality operator
      message: Use Double.isNaN because NaN is unequal to every value, including itself.
