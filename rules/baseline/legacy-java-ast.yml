      message: "1) 規定   \n程式不應呼叫 ThreadGroup 方法。   \n2) 原理   \nJava 中每一個執行緒在建立時都賦予了一個執行緒組。這些執行緒組是由`java.lang.ThreadGroup`類來實現的。 ThreadGroup 類提供了對屬於同一個執行緒組的執行緒進行同時操作的便利方法。比如，`ThreadGroup.intemipt()`方法可以中斷執行緒組中的所有執行緒。通過將執行緒限制線上程組中可避免它們與其他執行緒組中的執行緒發生衝突，因此，執行緒組還可以用於分層安全機制。   \n雖然執行緒組有利於執行緒的組織，但因為 ThreadGroup 類中很多方法是不提倡使用的（例  如   \n`allowThreadSuspension()`、`resume()`、`stop()`和 `suspend()`），所以程式設計師很少能從執行緒組的使用中獲得好處。而且，因為沒有提供合適的功能，很多方法也是過時的。甚至一些 ThreadGroup 的方法不是執行緒安全的，同時，使用 ThreadGroupAPI 來終止執行緒也會有問題。因為不提倡使用`stop()`方法，程式需要使用替代的方法來停止執行緒。    \n一種方式是讓即將終止的執行緒等待其他執行緒的完成，並因此知道其他執行緒是否已停止執行。 然而，一個應用將不得不維持一個它所建立的執行緒的列表，因為簡單地檢查 ThreadGroup 可能會得到不會終止的執行庫執行緒並且對它們的等待不會返回。   \nExcutor 框架提供了好的 API 來管理邏輯上的執行緒組，並提供了安全終止執行緒和處理執行緒異常的功能。因此，程式不應該呼叫 ThreadGroup 方法。   \n3) 示例   \n    一個不符合規則的程式碼示例，該示例使用一個 NetworkHandler 類來維護一個控制執行緒。這個控制執行緒將新請求分配給一個工作執行緒。為說明本例子中的競態條件，程式碼中的控制執行緒在它的`run()`方法中，通過啟動 3 個執行緒來處理 3 個請求。所有的執行緒都屬於 Chief 執行緒組。   \n    ```java\n    final class HandleRequest implements Runnable {\n        public void run() {\n            // Do something\n        }\n    }\n    \n    public final class NetworkHandler implements Runnable {\n        private static ThreadGroup tg = new ThreadGroup(\"Chief\");\n    \n        @Override\n        public void run() {\n            new Thread(tg, new HandleRequest(), \"thread1\").start();\n            new Thread(tg, new HandleRequest(), \"thread2\").start();\n            new Thread(tg, new HandleRequest(), \"thread3\").start();\n        }\n    \n        public static void printActiveCount(int point) {\n            System.out.println(\"Active Threads in Thread Group \" + tg.getName() + \" at point(\" + point + \"):\" + \" \"\n                    + tg.activeCount());\n        }\n    \n        public static void printEnumeratedThreads(Thread[] ta, int len) {\n            System.out.println(\"Enumerating all threads...\");\n            for (int i = 0; i < len; i++) {\n                System.out.println(\"Thread \" + i + \" = \" + ta[i].getName());\n            }\n        }\n    \n        public static void main(String[] args) throws InterruptedException {\n            // Start thread controller\n            Thread thread = new Thread(tg, new NetworkHandler(), \"controller\");\n            thread.start();\n    \n            // Gets the active count (insecure)\n            Thread[] ta = new Thread[tg.activeCount()];\n    \n            printActiveCount(1); // P1\n            // Delay to demonstrate TOCTOU condition (race window)\n            Thread.sleep(1000);\n            // P2: the thread count changes as new threads are initiated\n            printActiveCount(2);\n            // Incorrectly uses the (now stale) thread count obtained at P1\n            int n = tg.enumerate(ta);\n            // Silently ignores newly initiated threads\n            printEnumeratedThreads(ta, n);\n            // (between P1 and P2)\n    \n            // This code destroys the thread group if it does\n            // not have any live threads\n            for (Thread thr : ta) {\n                thr.interrupt();\n                while (thr.isAlive())\n                    ;\n            }\n            tg.destroy();\n        }\n    }\n    ```   \n    這個實現中隱藏著一個 `time-of-check,time-of-use (TOCTOU)`漏洞，因為程式碼在獲取執行緒數並列舉它們時，並不能保證操作的原子性。如果一個或多個請求在呼叫 `activeCount()`之 後，並且是在 `main()`方法中呼叫 `enumerate()`之前發生，那麼執行緒組中執行緒的數目會增加，但是執行緒的列表 ta 中只包含之前數量的執行緒。即，只有兩個執行緒引用：main 和控制執行緒。因此，程式會因為沒有考慮到 Chief執行緒組中新加入的執行緒而出錯。   \n       \n    \n\n對應的符合規則的解決方案中，使用一個固定的執行緒池，而不是 ThreadGroup 來管理它的 3 個任務。介面 `java.util.concurrent.ExecutorService` 提供了管理執行緒池的方法。雖然這個介面沒有提供方法來 獲取活躍執行緒的數目或是進行執行緒列舉，但是邏輯上的分組可以有助於全域性化管理執行緒組的行為。例如，呼叫 `shutdownPool()`方法可以終止屬於同一執行緒組的所有執行緒。   \n    ```java\n    public final class NetworkHandler {\n        private final ExecutorService executor;\n    \n        NetworkHandler(int poolSize) {\n            this.executor = Executors.newFixedThreadPool(poolSize);\n        }\n    \n        public void startThreads() {\n            for (int i = 0; i < 3; i++) {\n                executor.execute(new HandleRequest());\n            }\n        }\n    \n        public void shutdownPool() {\n            executor.shutdown();\n        }\n    \n        public static void main(String[] args) {\n            NetworkHandler nh = new NetworkHandler(3);\n            nh.startThreads();\n            nh.shutdownPool();\n        }\n    }\n    ```"
  cwe: []
- id: LEGACY-JAVA-AST-integer-ctor-use-number
  title: Integer allocation for cached value
  languages:
  - java
  severity: warning
  confidence: high
  matcher:
    constructor_type: (^|\.)Integer$
    min_args: 1
    max_args: 1
    int_arg_min_values:
      0: -128
    int_arg_max_values:
      0: 127
  standards:
  - CWE:398:Indicator of Poor Code Quality
  - LEGACY-MSG-02000010110201
  - LEGACY-MSG-02000010150454
  - LEGACY-MSG-0202000010110201
  - LEGACY-MSG-0202000010150454
  - ast:02000010110201
  - ast:02000010150454
  - ast:0202000010110201
  - ast:0202000010150454
  - bug:02000010110201
  - std:02000010150454
  - std:0202000010150454
  message: Use Integer.valueOf for values covered by the standard cache range.
  translations:
    zh-CN:
      title: 使用Number构造函数
      message: |-
        Java默认会对整数-128到127之间进行缓存，程序中采用`new Integer(int expression)`等基本数据类型包装类构造函数来创建对象，而参数的值在-128到127之间，该方法产生的额外对象将占用更多空间、降低性能。

        **例如**：下面代码示例中：使用了`new Integer(int expression)`来创建对象。
        ```java
        Integer integer = new Integer(100);
        ```

        使用valueOf方法来代替构造方法。

        **例如**：下面代码示例中：使用了`Integer.valueOf(int expression)`来创建对象。
        ```java
        Integer integer = Integer.valueOf(100); //与Integer integer = 100相同
        ```
    en:
      title: Integer allocation for cached value
      message: Use Integer.valueOf for values covered by the standard cache range.
    zh-TW:
      title: Integer allocation for cached value
      message: Use Integer.valueOf for values covered by the standard cache range.
  cwe:
  - CWE-398
- id: LEGACY-JAVA-AST-call-wait-await-method
  title: wait or await call outside a loop
  languages:
  - java
  severity: error
  confidence: high
  matcher:
    callee: (^|\.)(wait|await)$
    max_args: 0
    outside_loop: true
  standards:
