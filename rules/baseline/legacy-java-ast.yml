  message: Do not disable HTTP session expiration with a negative timeout.
  translations:
    zh-CN:
      title: JavaEE程序：永远不会超时的Session设置
      message: |-
        在JAVA EE程序中，设置了一个永远都不会过期的会话不仅会给恶意攻击者提供更多的机会，并且这样做意味着session对象会永远存在web服务器的内存空间中，当会话量足够大时可能会导致拒绝服务攻击。

        **例如**： 下面代码为设置了会话永远不会过期。
        ```java
        HttpSession session = request.getSession(true);
        session.setMaxInactiveInterval(-1);
        ```

        将Session的失效时间设置为30分钟或更少，既能使用户在一段时间内与应用程序互动，又提供了一个限制窗口攻击的合理范围。

        **例如**：下面代码片段中，将Session失效时间设置为30分钟。
        ```java
        HttpSession sesssion = request.getSession(true);
        session.setMaxInactiveInterval(30*60);
        ```
    en:
      title: Insufficient Session Expiration
      message: Do not disable HTTP session expiration with a negative timeout.
    zh-TW:
      title: Infinite HTTP session timeout
      message: Do not disable HTTP session expiration with a negative timeout.
