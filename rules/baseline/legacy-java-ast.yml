      title: C.10.6 不要使用Thread.stop()來終止執行緒
      message: "1) 規定   \n程式不能呼叫`Thread.stop()`。   \n2) 原理   \n執行緒在可以正常退出時會維持類的不變性。但是，程式設計師在認為任務結束、要求被取消或程式必須快速關閉 Java 虛擬機器時，經常會非正常地終止執行緒。   某些執行緒 API 最初是用來幫助執行緒的暫停、恢復和終止的，但是因設計上先天缺陷而廢棄了。例如，`Thread.stop()`方法會導致執行緒立即丟擲一個 ThreadDeath 異常，這通常會停止執行緒。呼叫 `Thread.stop()`會造成一個執行緒釋放它獲得的所有的鎖，這有可能會暴露這些鎖保護的物件，而這些物件正處於一個不一致的狀態中。執行緒可以捕捉 ThreadDeath 異常，並使用 finally 程式段來嘗試修復處於不一致狀態的物件。可是，因為 ThreadDeath 可以線上程執行的任何時候被丟擲，所以需要小心地檢查所有同步的方法和程式段。而且，必須確保程式碼不受在 catch 或 finally 程式段執行時丟擲的ThreadDeath 異常的影響。因此，程式不能呼叫 `Thread.stop()`。   \n需注意的是，將 stopThread 許可權從 `java.lang.RuntimePermission`中去除可以避免使用 `Thread.stop()`方法來停止執行緒。自行開發的可信任的使用 `Thread.stop()`的程式碼可能會依賴於系統的能力來執行這樣的操作。此外，第三方開發的庫也有可能依賴於 `Thread.stop()`方法的使用。   \n3) 示例   \n    不符合規則的程式碼示例（廢棄的 `Thread.stop()`)，一個執行緒將偽隨機數值寫入一個vector中。在經過指定一段時間後，這個執行緒將被強迫停止。  \n    ```java\n    public final class Container implements Runnable {\n        private final Vector<Integer> vector = new Vector<Integer>(1000);\n    \n        public Vector<Integer> getVector() {\n            return vector;\n        }\n    \n        @Override\n        public synchronized void run() {\n            Random number = new Random(123L);\n            int i = vector.capacity();\n            while (i > 0) {\n                vector.add(number.nextInt(100));\n                i--;\n            }\n        }\n    \n        public static void main(String[] args) throws InterruptedException {\n            Thread thread = new Thread(new Container());\n            thread.start();\n            Thread.sleep(5000);\n            thread.stop();\n        }\n    }\n    ```  \n    因為 Vector 類是執行緒安全的，所以多個執行緒對共享例項進行的操作是不會讓其處於一個不一致的狀態的。比如，`Vector.size()`方法總是可以返回 vector 中元素的正確數目，即使在對 vector 進行併發操作之後。這是因為 vector 例項是使用自身的隱含鎖來防止在例項狀態暫時不一致時其他執行緒對例項的訪問。   \n    然而，`Thread.stop()`方法會造成執行緒停止正在進行的操作並丟擲一個 ThreadDeath 異常。所有獲得的鎖則會被釋放。如果執行緒是在加入一個新整數至 vector 時被停止，就有可能 訪問處於不一致狀態的 vector。例如，因為元素數目是在新增一個元素後增加的，所以這可能導致 `Vector.size()`返回錯誤的元素數目。   \n       \n    \n\n對應符合規則的解決方案是使用一個 volatile 標誌來請求執行緒終止。`shutdown()`訪問方法是用來設定這個標誌成 true 的。執行緒的 `run()`方法查詢 done 標記，並在標記被設定後終止執行緒。   \n    ```java\n    public final class Container implements Runnable {\n        private final Vector<Integer> vector = new Vector<Integer>(1000);\n        private volatile boolean done = false;\n    \n        public Vector<Integer> getVector() {\n            return vector;\n        }\n    \n        public void shutdown() {\n            done = true;\n        }\n    \n        @Override\n        public synchronized void run() {\n            Random number = new Random(123L);\n            int i = vector.capacity();\n            while (!done && i > 0) {\n                vector.add(number.nextInt(100));\n                i--;\n            }\n        }\n    \n        public static void main(String[] args) throws InterruptedException {\n            Container container = new Container();\n            Thread thread = new Thread(container);\n            thread.start();\n            Thread.sleep(5000);\n            container.shutdown();\n        }\n    }\n    ```   \n       \n    另一個符合規則的解決方案（可中斷的）中，`main()`呼叫 `Thread.interrupt()`方法來終止執行緒。呼叫`Thread.interrupt()`設定了一個內部的中斷狀態標誌。執行緒可以通過 `Thread.interrupted()`方法來查詢這個標記。該方法會在當前執行緒被中斷時返回 true,並會清除中斷狀態標誌。   \n    ```java\n    public final class Container implements Runnable {\n        private final Vector<Integer> vector = new Vector<Integer>(1000);\n    \n        public Vector<Integer> getVector() {\n            return vector;\n        }\n    \n        @Override\n        public synchronized void run() {\n            Random number = new Random(123L);\n            int i = vector.capacity();\n            while (!Thread.interrupted() && i > 0) {\n                vector.add(number.nextInt(100));\n                i--;\n            }\n        }\n    \n        public static void main(String[] args) throws InterruptedException {\n            Container c = new Container();\n            Thread thread = new Thread(c);\n            thread.start();\n            Thread.sleep(5000);\n            thread.interrupt();\n        }\n    }\n    ```  \n    一個執行緒可以使用中斷來完成取消和關閉之外的操作。因此，一個執行緒應該只能在它的中斷策略已知的情況下被中斷。"
