      message: "1) 規定   \njava.util.Random 類不能用在安全關鍵應用或存在敏感資料的場合。   \n2) 原理   \n偽隨機數生成器（Pseudorandom Number Generator, PRNG）使用確定的資料演算法來生 成具有良好統計特性的數字序列，PRNG 通常起始於一個種子數字。演算法使用這個種子生成輸出數值和一個新種子，新種子用來生成下一個數值，然後依次類推。   \nJava API 提供 `java.util.Random` 類來實現 PRNG，這個 PRNG 是可移植和可重複的。如果`java.util.Random `類的兩個例項使用相同的種子，會在所有 Java 實現中生成相同的數值序列。    \n種子有可能洩漏。`java.util.Random` 不能用在安全關鍵應用或存在敏感資料的場合。在這些場合應該使用更安全的隨機數生成器，比如 `java.security.SecureRandom` 類。   \n3) 示例   \n    1.這個不符合規則的程式碼示例使用了 `java.util.Random` 類，一個指定的種子值生成一個相同的序列，這個數值序列是可被預測的。   \n    ```java\n    import java.util.Random;   \n    // . . .  *   \n    Random number = new Random(123L);   \n    //...   \n    for (int i = 0; i < 20; i++) {   \n        // Generate another random integer in the range [0, 20] int n = number.nextlnt(21);   \n        System.out.printIn(n);   \n    }\n    ```\n\n這個符合規則的程式碼示例使用 `java.security.SecureRandom `類來生成高質量的隨機數。\n    ```java\n    import java.security.SecureRandom;   \n    import java.security.NoSuchAlgorithmException;   \n    // . . .    \n    public static void main (String args(1){ \n        try {   \n            SecureRandom number = SecureRandom.getlnstance(\"SHA1PRNG\"); // Generate 20 integers 0..20 \n            for (int i =   0; i < 20; i++) {   \n                System.out.println(number.nextlnt(21));   \n            }   \n        } catch (NoSuchAlgorithmException nsae) {   \n            // Forward to handler\n    ```"
