  message: Do not open raw sockets from servlet request or response handlers.
  translations:
    zh-CN:
      title: JavaEE程序：直接使用Socket
      message: |-
        在JAVA EE程序中直接使用Socket进行通信容易出错。只有在与比较陈旧的系统进行通信时，JAVA EE标准才允许使用Socket，因为那时没有较高级别的协议可用。自己编写通信协议将需要考虑许多安全上的问题，其中包括：输入信号与输出信号的比较、协议版本间的兼容性、通道安全、错误处理、网络限制、会话管理。因此，自定义的通信协议将面临诸多安全隐患。在自定义标准协议的应用过程中，也会碰到许多同样的问题。通常有很多可用的资源都可以解决与标准协议相关的各种安全问题，然而，攻击者同样也能获取这些资源。

        **例如**：下面代码片段中，在Servlet中直接使用Socket。
        ```java
        public void doGet(HttpServletRequest request, HttpServletResponse response) throws ServletException, IOException {
            // Perform servlet tasks
            ...
            // Open a socket to a remote server (bad).
            Socket sock = null;
            try {
                sock = new Socket(remoteHostname, 3000);
                // Do something with the socket.
                ...
            } catch (Exception e) {
                ...
            }
        }
        ```

        建议使用一些框架提供的方法代替直接使用Socket。
    en:
      title: Sockets
      message: Do not open raw sockets from servlet request or response handlers.
    zh-TW:
      title: Socket construction in servlet request handler
      message: Do not open raw sockets from servlet request or response handlers.
