  message: Ensure overridden next methods can throw NoSuchElementException when exhausted.
  translations:
    zh-CN:
      title: 【推荐】重写next方法应该抛出NoSuchElementException
      message: "当类实现Iterator接口时，需重写`next`方法，而`next`方法未抛出NoSuchElementException可能导致程序运行异常。  \n  \n**例如**：下面代码示例中，类Iter实现了Iterator接口，而`next`方法未抛出NoSuchElementException,当程序为判断是否`hasNext`时，有可能抛出数组越界异常。  \n```java\npublic class Users implements Iterable<User> {  \n    private User[] users = new User[10];  \n    ...  \n   @Override  \n    public Iterator<User> iterator() {  \n       return new Itr();  \n   }  \n   class Itr implements Iterator<User> {  \n       private int cursor;  \n       @Override  \n       public boolean hasNext() {  \n           return cursor != users.length;  \n       }  \n       @Override  \n       public User next() {  \n           return users[cursor++];  \n       }  \n       ...  \n   }  \n}\n```\n\n正确重写Iterator接口的next方法，当元素获取不到时，抛出NoSuchElementException。  \n  \n**例如**：下面代码示例中，正确重写Iterator接口的`next`方法。\n```java\npublic class Users implements Iterable<User> {\n    private User[] users = new User[10];...\n\n    @Override\n    public Iterator<User> iterator() {\n        return new Itr();\n    }\n\n    class Itr implements Iterator<User> {\n        private int cursor;\n\n        @Override\n        public boolean hasNext() {\n            return cursor != users.length;\n        }\n\n        @Override\n        public User next() {\n            if (cursor >= users.length)\n                throw new NoSuchElementException();\n            return users[cursor++];\n        }\n        ...\n    }\n}\n```"
    en:
      title: Iterator next method without NoSuchElementException path
      message: Ensure overridden next methods can throw NoSuchElementException when exhausted.
    zh-TW:
      title: 【推薦】重寫next方法應該丟擲NoSuchElementException
      message: "當類實現Iterator介面時，需重寫`next`方法，而`next`方法未丟擲NoSuchElementException可能導致程式執行異常。  \n  \n**例如**：下面程式碼示例中，類Iter實現了Iterator介面，而`next`方法未丟擲NoSuchElementException,當程式為判斷是否`hasNext`時，有可能丟擲陣列越界異常。  \n```java\npublic class Users implements Iterable<User> {  \n    private User[] users = new User[10];  \n    ...  \n   @Override  \n    public Iterator<User> iterator() {  \n       return new Itr();  \n   }  \n   class Itr implements Iterator<User> {  \n       private int cursor;  \n       @Override  \n       public boolean hasNext() {  \n           return cursor != users.length;  \n       }  \n       @Override  \n       public User next() {  \n           return users[cursor++];  \n       }  \n       ...  \n   }  \n}\n```\n\n正確重寫Iterator介面的next方法，當元素獲取不到時，丟擲NoSuchElementException。  \n  \n**例如**：下面程式碼示例中，正確重寫Iterator介面的`next`方法。\n```java\npublic class Users implements Iterable<User> {\n    private User[] users = new User[10];...\n\n    @Override\n    public Iterator<User> iterator() {\n        return new Itr();\n    }\n\n    class Itr implements Iterator<User> {\n        private int cursor;\n\n        @Override\n        public boolean hasNext() {\n            return cursor != users.length;\n        }\n\n        @Override\n        public User next() {\n            if (cursor >= users.length)\n                throw new NoSuchElementException();\n            return users[cursor++];\n        }\n        ...\n    }\n}\n```"
  cwe:
  - CWE-398
