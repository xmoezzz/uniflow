  message: Do not return from a finally block because it suppresses pending exceptions and return values.
  translations:
    zh-CN:
      title: finally代码块中的return语句
      message: |-
        finally语句块中的返回指令会导致try块中抛出的异常丢失。

        检查程序逻辑，删除finally语句块中的返回语句。
    en:
      title: Return Inside Finally
      message: |-
        Never use `return`, `break`, `continue`, or `throw` statements within a `finally` block. When program execution enters a `try` block that has a `finally` block, the `finally` block always executes regardless of whether the `try` block (or any associated `catch` blocks) executes to normal completion. Statements that cause the `finally` block to complete abruptly also cause the `try` block to complete abruptly and consequently suppress any exception thrown from the `try` or `catch` blocks. According to *The Java Language Specification*, §14.20.2, &#34;Execution of `try-finally` and `try-catch-finally`&#34; [JLS 2015]:

        > If execution of the `try` block completes abruptly for any other reason `R`, then the `finally` block is executed. Then there is a choice:
        >
        > * If the `finally` block completes normally, then the `try` statement completes abruptly for reason `R`.
        > * If the `finally` block completes abruptly for reason `S`, then the `try` statement completes abruptly for reason `S` (and reason `R` is discarded).

        **Noncompliant Code Example**

        In this noncompliant code example, the `finally` block completes abruptly because of a `return` statement in the block:

        ```java
        class TryFinally {
          private static boolean doLogic() {
            try {
              throw new IllegalStateException();
            } finally {
              System.out.println("logic done");
              return true;
            }
          }
        }
        ```

        The `IllegalStateException` is suppressed by the abrupt completion of the `finally` block caused by the `return` statement.

        **Compliant Solution**

        This compliant solution removes the `return` statement from the `finally` block:

        ```java
        class TryFinally {
          private static boolean doLogic() {
            try {
              throw new IllegalStateException();
            } finally {
              System.out.println("logic done");
            }
            // Any return statements must go here;
            // applicable only when exception is thrown conditionally
          }
        }
        ```

        **Exceptions**

        ERRO4-J-EX0: Control flow statements whose destination is within the `finally` block are perfectly acceptable. For example, the following code does not violate this rule because the `break` statement exits within the `while` loop but not within the `finally` block:

        ```java
        class TryFinally {
          private static boolean doLogic() {
            try {
              throw new IllegalStateException();
            } finally {
              int c;
              try {
                while ((c = input.read()) != -1) {
                  if (c > 128) {
                    break;
                  }
                }
              } catch (IOException x) {
                // Forward to handler
              }
              System.out.println("logic done");
            }
            // Any return statements must go here; applicable only when exception is thrown conditionally
          }
        }
        ```
    zh-TW:
      title: Return statement in finally block
      message: Do not return from a finally block because it suppresses pending exceptions and return values.
  cwe:
  - CWE-584
