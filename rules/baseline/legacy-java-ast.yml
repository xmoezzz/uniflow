  message: Use Arrays.hashCode for array content hashing.
  translations:
    zh-CN:
      title: 【强制】不要在数组上调用hashCode()
      message: "数组类中并没有对`hashCode`方法进行重写，在数组上调用`hashCode()`默认调用的是Object中的`hashCode`方法，返回的是内存地址哈希码。\n\n检查程序逻辑，如果需要获取数组的hash值，可以通过遍历数组中每个对象综合获取，或者使用Java工具类Arrays中的`hashCode`方法获取。  \n  \n**例1**：采用循环的方式获取其中的值形成字符串。  \n```java\nString[] params = getParams();  \nint hashcode = 0;  \nif (params == null)  \n    hashcode = 0;  \nhashcode= 1;  \nfor (String param: params )  \n    hashcode= 31 * hashcode+ (param== null ? 0 : param.hashCode());\n```  \n**例2**：直接使用Java工具类Arrays中的`toString`方法转化数组为字符串。  \n```java\nString[] params = getParams();  \nint hashcode = Arrays.hashCode(strings);\n```"
    en:
