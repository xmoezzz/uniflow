  - std:02000010150108
  - CERT:THI03-J:Always invoke wait() and await() methods inside a loop
  - LEGACY-MSG-0102000010090008
  - LEGACY-MSG-0102000010141103
  - LEGACY-MSG-02000010090008
  - LEGACY-MSG-02000010141103
  - LEGACY-MSG-02000010160094
  - LEGACY-MSG-02000010170043
  - LEGACY-MSG-0302000010170043
  - LEGACY-MSG-0902000010160094
  - YD/T 3464-2019:02000010160094
  - YD/T 3464-2019:0902000010160094
  - ast:0102000010090008
  - ast:0102000010141103
  - ast:02000010090008
