  - std:0202000010150429
  message: JDBC parameter indexes are one-based.
  translations:
    zh-CN:
      title: 使用无效的索引
      message: |-
        PreparedStatement中通过索引设置参数值的方法与ResultSet中通过索引获取指定列的方法，其索引都是从1开始编号的，当索引为0或者索引大于占位符数目或列数目时都会抛出SQLException异常。

        **例如**：下列代码中使用了无效的参数索引和列索引。
        ```java
        PreparedStatement ps = connection.prepareStatement("select *  from users where name = ? and age < ?");
        ps.setString(0, name);  //索引都是从1开始编号的
        ps.setInt(3, age);  //索引大小超过占位符总数
        ResultSet rs = ps.executeQuery();
        while (rs.next()) {
            long id = rs.getLong(0);  //索引都是从1开始编号的
        // ...
        }
        ...
        ```

        使用有效的正确索引来设置参数值和获取列值。

        **例如**：下列代码中使用了正确的参数索引和列索引。
        ```java
        PreparedStatement ps = connection.prepareStatement("select *  from users where name = ? and age < ?");
        ps.setString(1, name);
        ps.setInt(2, age);

        ResultSet rs = ps.executeQuery();
        while (rs.next()) {
            long id = rs.getLong(1);
            // ...
        }
        ```
    en:
      title: JDBC parameter index starts at zero
      message: JDBC parameter indexes are one-based.
    zh-TW:
      title: JDBC parameter index starts at zero
      message: JDBC parameter indexes are one-based.
  cwe:
  - CWE-193
