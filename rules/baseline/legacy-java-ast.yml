  message: Use Arrays.equals for array content comparison.
  translations:
    zh-CN:
      title: 误用Object.equals()比较两个数组
      message: |-
        数组不会重写父类Object的`equals()`方法，Object中`equals()`方法比较的是数组引用也就是数据的内存地址而不是数组中的内容，当需要比较两数组中的内容是否一致时不要使用`Object.equals()`方法。

        **例如**：下面代码片段中，不正确的使用`Object.equals()`方法比较两个数组。
        ```java
        public void arrayEqualBad(){
            int[] arra1 = new int[20];
            int[] arra2 = new int[20];
            arra1.equals(arra2);
         }
        ```

        应使用`java.util.Arrays.equals()`方法比较两个数组的内容。

        **例如**：下面代码片段中，使用`java.util.Arrays.equals()`方法比较两个数组。
        ```java
        public void arrayEqualsGood(){
            int[] arra1 = new int[20];
            int[] arra2 = new int[20];
            Arrays.equals(arra1, arra2);
        }
        ```
    en:
      title: Invalid Call to Object.equals()
      message: |-
        In Java, arrays are objects and support object methods such as `Object.equals()`. However, arrays do not support any methods besides those provided by `Object`. Consequently, using `Object.equals()` on any array compares only array *references*, not their *contents*. Programmers who wish to compare the contents of two arrays must use the static two-argument `Arrays.equals()` method. This method considers two arrays equivalent if both arrays contain the same number of elements, and all corresponding pairs of elements in the two arrays are equivalent, according to `Object.equals()`. In other words, two arrays are equal if they contain equivalent elements in the same order. To test for reference equality, use the reference equality operators, `==<span> </span>`and `!=`.

        Because the effect of using `Object.equals()` to compare two arrays is often misconstrued as content equality, and because a better alternative exists in the use of reference equality operators, the use of the `Object.equals()` method to compare two arrays is disallowed.

        **Noncompliant Code Example**

        This noncompliant code example uses the `Object.equals()` method to compare two arrays:

        ```java
        int[] arr1 = new int[20]; // Initialized to 0
        int[] arr2 = new int[20]; // Initialized to 0
        System.out.println(arr1.equals(arr2)); // Prints false
        ```

        **Compliant Solution**

        This compliant solution compares the content of two arrays using the two-argument `Arrays.equals()` method:

        ```java
        int[] arr1 = new int[20]; // Initialized to 0
        int[] arr2 = new int[20]; // Initialized to 0
        System.out.println(Arrays.equals(arr1, arr2)); // Prints true
        ```
    zh-TW:
      title: C.3.3 使用引數的Arrays,equals()方法比較兩個陣列的內容
      message: "1) 規定   \n應使用引數的 `Arrays.equals()`方法比較兩個陣列的內容。   \n2) 原理   \n陣列不會重寫 `Object.equals()`方法，而 equals()方法比較的是陣列引用而不是陣列的內容值。應使用引數的 `Arrays.equals()`方法比較兩個陣列的內容。   \n若要測試引用是否相等，應使用引用相等運算子：`==`和`!=`，而不是使用陣列的`equals()`方法，否則會導致不可預期的後果。   \n3) 示例   \n    1.這個不符合規則的程式碼示例錯誤的使用了 `Object．equals()`方法比較兩個陣列。   \n    ```java\n    public void arrayEqualsExample(){   \n        int[] arr1=new int[20];//initialized to 0   \n        int[] arr2=new int[20];//initialized to 0   \n        arr1.equals(arr2);//false   \n    }\n    ```   \n    \n\n相應的符合規則的程式碼示例：使用引數的 `Arrays.equals()`方法比較兩個陣列。   \n    ```java\n    public void arrayEqualsExample(){   \n        int[] arr1=new int[20];//initialized to 0   \n        int[] arr2=new int[20];//initialized to 0   \n        Arrays.equals(arr1,arr2);//true   \n    }\n    ```"
  cwe:
  - CWE-398
  - CWE-754
