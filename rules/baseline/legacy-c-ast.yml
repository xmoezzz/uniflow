      message: Non-void function has no return.
    zh-TW:
      title: 非 void 函式缺少 return
      message: 非 void 函式缺少 return。
- id: LEGACY-C-AST-non-void-fn-must-return-value
  title: Non-void function returns without a value
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
