id: legacy-c-ast
title: Migrated legacy C and C++ AST rules
rules:
- id: LEGACY-C-AST-nullptr-zero
  title: Pointer initialized with integer zero
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: null_pointer_zero
  standards: ['0701000010130028']
  message: Pointer initialized with integer zero.
  translations:
    zh-CN:
      title: 指针不应使用整数零初始化
      message: 指针不应使用整数零初始化。
    en:
      title: Pointer initialized with integer zero
      message: Pointer initialized with integer zero.
    zh-TW:
      title: 指標不應使用整數零初始化
      message: 指標不應使用整數零初始化。
- id: LEGACY-C-AST-no-assignment-outside-statement
  title: Assignment outside expression statement
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_expression: assignment_outside_statement
  standards: ['0601000010140036', '0601000010140048', '2401000010120097']
  message: Assignment outside expression statement.
  translations:
    zh-CN:
      title: 赋值表达式不应出现在独立语句之外
      message: 赋值表达式不应出现在独立语句之外。
    en:
      title: Assignment outside expression statement
      message: Assignment outside expression statement.
    zh-TW:
      title: 賦值運算式不應出現在獨立陳述式之外
      message: 賦值運算式不應出現在獨立陳述式之外。
- id: LEGACY-C-AST-no-unary-in-expressions
  title: Update operator in a larger expression
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_expression: update_in_expression
  standards: ['0701000010130043', '0601000010140067']
  message: Update operator in a larger expression.
  translations:
    zh-CN:
      title: 复杂表达式中不应使用自增或自减
      message: 复杂表达式中不应使用自增或自减。
    en:
      title: Update operator in a larger expression
      message: Update operator in a larger expression.
    zh-TW:
      title: 複雜運算式中不應使用遞增或遞減
      message: 複雜運算式中不應使用遞增或遞減。
- id: LEGACY-C-AST-no-side-effect-in-sizeof
  title: Side effect inside sizeof
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_expression: side_effect_in_sizeof
  standards: ['0601000010140053', '0701000010130051']
  message: Side effect inside sizeof.
  translations:
    zh-CN:
      title: sizeof 中不应包含副作用
      message: sizeof 中不应包含副作用。
    en:
      title: Side effect inside sizeof
      message: Side effect inside sizeof.
    zh-TW:
      title: sizeof 中不應包含副作用
      message: sizeof 中不應包含副作用。
