- id: LEGACY-C-AST-void-fn-must-not-return-value
  title: Void function returns a value
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: void_return_value
  standards: ['0601000010140073']
  message: Void function returns a value.
  translations:
    zh-CN:
      title: void 函数不应返回值
      message: void 函数不应返回值。
    en:
