      message: Review this macro definition against the coding standard.
    zh-TW:
      title: 禁止用物件巨集代替基本型別
      message: 禁止用物件巨集代替基本型別，請檢查巨集定義。
- id: LEGACY-C-AST-no-semicolon-after-macro
  title: Trailing semicolon in macro replacement
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_macro: trailing_semicolon
  standards: ['0101000010110303']
  message: Trailing semicolon in macro replacement matches the legacy preprocessor rule.
  translations:
    zh-CN:
      title: 宏替换文本不应以分号结尾
      message: 宏替换文本不应以分号结尾，请检查宏定义。
    en:
      title: Trailing semicolon in macro replacement
      message: Review this macro definition against the coding standard.
    zh-TW:
      title: 巨集替換文字不應以分號結尾
      message: 巨集替換文字不應以分號結尾，請檢查巨集定義。
- id: LEGACY-C-AST-if-else-braces
  title: If and else bodies require braces
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { c_style: if_else_braces }
  standards: [LEGACY-MSG-0701000010130016, LEGACY-MSG-0601000010140019]
  message: If and else bodies require braces.
- id: LEGACY-C-AST-loop-body-braces
  title: Loop body requires braces
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { c_style: loop_body_braces }
  standards: [LEGACY-MSG-0701000010130015, LEGACY-MSG-0601000010140018]
  message: Loop body requires braces.
- id: LEGACY-C-AST-if-else-if-must-have-else
  title: Else-if chain needs final else
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { c_style: else_if_needs_else }
  standards: [LEGACY-MSG-0601000010140024, LEGACY-MSG-0701000010130030]
  message: Else-if chain needs final else.
- id: LEGACY-C-AST-no-empty-switch
  title: Switch requires a label
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { c_style: empty_switch }
  standards: [LEGACY-MSG-0701000010130032, LEGACY-MSG-0601000010140027]
  message: Switch requires a label.
- id: LEGACY-C-AST-switch-must-have-case
  title: Switch requires a non-default case
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { c_style: switch_needs_case }
  standards: [LEGACY-MSG-0601000010140028, LEGACY-MSG-0701000010130034]
  message: Switch requires a non-default case.
- id: LEGACY-C-AST-no-empty-statement
  title: Empty statement prohibited
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { c_style: empty_statement }
  standards: [LEGACY-MSG-0601000010140070]
  message: Empty statement prohibited.
- id: LEGACY-C-AST-no-semicolon-after-for-if-while
  title: Control statement has an empty body
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { c_style: empty_control_body }
  standards: [LEGACY-MSG-2401000010120092]
  message: Control statement has an empty body.
- id: LEGACY-C-AST-no-break-in-loops
  title: Break in a loop is prohibited
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { c_style: break_in_loop }
  standards: [LEGACY-MSG-0601000010140079]
  message: Break in a loop is prohibited.
- id: LEGACY-C-AST-no-constant-in-loop-condition
  title: Numeric constant in restricted loop condition
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { c_style: constant_loop_condition }
  standards: [LEGACY-MSG-0601000010140080]
  message: Numeric constant in restricted loop condition.
- id: LEGACY-C-AST-no-gets
  title: gets call prohibited
  languages: [c, cpp]
  severity: error
  confidence: high
  matcher: { callee: '(^|::)gets$', min_args: 1, max_args: 1 }
  standards: [LEGACY-C-AST-no-gets]
  message: Use a bounded input API instead of gets.
- id: LEGACY-C-AST-no-exit-abort
  title: Process termination call prohibited
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { callee: '(^|::)(exit|abort)$' }
  standards: [LEGACY-C-AST-no-exit-abort]
  message: Propagate an error instead of terminating the process from library code.
- id: LEGACY-C-AST-no-setjmp-longjmp
  title: Non-local jump prohibited
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { callee: '(^|::)(setjmp|longjmp)$' }
  standards: [LEGACY-C-AST-no-setjmp-longjmp]
  message: Use structured control flow instead of setjmp or longjmp.
- id: LEGACY-C-AST-no-goto
  title: goto statement prohibited
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { code_pattern: '\bgoto\b', exclude_preprocessor: true }
  standards: [LEGACY-C-AST-no-goto]
  message: Use structured control flow instead of goto.
- id: LEGACY-C-AST-no-continue
  title: continue statement prohibited
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { code_pattern: '\bcontinue\s*;', exclude_preprocessor: true }
  standards: [LEGACY-C-AST-no-continue]
  message: Restructure the loop so continue is unnecessary.
- id: LEGACY-C-AST-no-register-storage-class
  title: register storage class prohibited
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { code_pattern: '\bregister\b', exclude_preprocessor: true }
  standards: [LEGACY-C-AST-no-register-storage-class]
  message: Remove the obsolete register storage-class specifier.
- id: LEGACY-C-AST-no-long-long
  title: long long type prohibited
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { code_pattern: '\blong\s+long\b', exclude_preprocessor: true }
  standards: [LEGACY-C-AST-no-long-long]
  message: Use the project-approved fixed-width integer type.
- id: LEGACY-C-AST-number-literal-suffix-must-be-upper-case
  title: Lowercase integer literal suffix
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher: { code_pattern: '\b(?:0[xX][0-9A-Fa-f]+|[0-9]+)[uUlL]*[ul]\b', exclude_preprocessor: true }
