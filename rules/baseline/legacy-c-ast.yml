      message: Void function returns a value.
    zh-TW:
      title: void 函式不應傳回值
      message: void 函式不應傳回值。
- id: LEGACY-C-AST-non-void-fn-must-return
  title: Non-void function has no return
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
