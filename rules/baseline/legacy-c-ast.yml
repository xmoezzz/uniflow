    zh-TW:
      title: 函式內不應使用 extern 宣告
      message: 函式內不應使用 extern 宣告。
- id: LEGACY-C-AST-no-init-in-extern-declaration
  title: Initialized extern declaration
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: initialized_extern
  standards: ['0701000010130012']
  message: Initialized extern declaration.
  translations:
    zh-CN:
      title: extern 声明不应包含初始化
      message: extern 声明不应包含初始化。
    en:
      title: Initialized extern declaration
      message: Initialized extern declaration.
    zh-TW:
      title: extern 宣告不應包含初始化
      message: extern 宣告不應包含初始化。
- id: LEGACY-C-AST-function-like-macros-must-have-braces
  title: Function macro replacement parentheses
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_macro: function_replacement_parentheses
  standards: ['0601000010140008', '0101000010110299', '0901000010110299']
  message: Function macro replacement parentheses matches the legacy preprocessor rule.
  translations:
    zh-CN:
      title: 函数宏替换文本的括号检查
      message: 函数宏替换文本的括号检查，请检查宏定义。
    en:
      title: Function macro replacement parentheses
      message: Review this macro definition against the coding standard.
    zh-TW:
      title: 函式巨集替換文字的括號檢查
      message: 函式巨集替換文字的括號檢查，請檢查巨集定義。
- id: LEGACY-C-AST-no-redefine-keyword
  title: Keyword macro redefinition
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_macro: redefined_keyword
  standards: ['0701000010130000', '0701000010130005', '0601000010140006']
  message: Keyword macro redefinition matches the legacy preprocessor rule.
  translations:
    zh-CN:
      title: 禁止用对象宏重新定义关键字
      message: 禁止用对象宏重新定义关键字，请检查宏定义。
    en:
      title: Keyword macro redefinition
      message: Review this macro definition against the coding standard.
    zh-TW:
      title: 禁止用物件巨集重新定義關鍵字
      message: 禁止用物件巨集重新定義關鍵字，請檢查巨集定義。
