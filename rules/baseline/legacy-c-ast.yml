- id: LEGACY-C-AST-no-extern-declaration-in-function
  title: Extern declaration inside function
  languages: [c, cpp]
  severity: warning
  confidence: high
  matcher:
    c_declaration: local_extern
  standards: ['0701000010130010']
  message: Extern declaration inside function.
  translations:
    zh-CN:
      title: 函数内不应使用 extern 声明
      message: 函数内不应使用 extern 声明。
