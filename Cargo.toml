[workspace]
members = [
  "crates/hir",
  "crates/ir",
  "crates/parser_core",
  "crates/platform",
  "crates/lang_c",
  "crates/lang_cpp",
  "crates/lang_java",
  "crates/lang_java_bytecode",
  "crates/jni_bridge",
  "crates/archive_extract",
  "crates/system_graph",
  "crates/lang_python",
  "crates/lang_javascript",
  "crates/lang_go",
  "crates/lang_rust",
  "crates/lang_ruby",
  "crates/lang_dotnet_bytecode",
  "crates/lang_python_bytecode",
  "crates/lang_wasm_bytecode",
  "crates/lang_frontends",
  "crates/reasoning_oracle",
  "crates/frontend",
  "crates/lowering",
  "crates/models",
  "crates/rules",
  "crates/rule_crypto",
  "crates/value_flow",
  "crates/taint",
  "crates/report",
  "crates/cache",
  "crates/baseline",
  "crates/checker_api",
  "crates/checker_host",
  "crates/uniflow_core",
  "crates/sca_core",
  "crates/filetype",
  "crates/deps_npm",
  "crates/deps_cargo",
  "crates/deps_python",
  "crates/deps_go",
  "crates/deps_php",
  "crates/deps_dotnet",
  "crates/deps_ruby",
  "crates/deps_maven",
  "crates/deps_gradle",
  "crates/deps_dart",
  "crates/deps_cocoapods",
  "crates/deps_conan",
  "crates/deps_cran",
  "crates/deps_chef",
  "crates/deps_elm",
  "crates/deps_fortran",
  "crates/deps_haxelib",
  "crates/deps_opam",
  "crates/deps_swift",
  "crates/license_scan",
  "crates/vuln_db",
  "crates/malware_heuristics",
  "crates/sca_orchestrator",
  "crates/autofix",
  "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97"
version = "1.0.0"
license = "MPL-2.0"
authors = ["UniFlow Contributors"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
thiserror = "2.0"
regex = "1.11"
regex-syntax = "0.8"
zhhz = "0.8.2"
sxd-document = "0.3"
sxd-xpath = "0.4"
indexmap = { version = "2.7", features = ["serde"] }
sha2 = "0.10"
aes = "0.8"
indicatif = "0.17"
rayon = "1.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
oxc_allocator = "0.149"
oxc_ast = "0.149"
oxc_parser = "0.149"
oxc_span = "0.149"
oxc_syntax = "0.149"
gosyn = "0.2.15"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
lib-ruby-parser = "4"
dotnetdll = "0.3"
walrus = "0.27"
py-marshal = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
polars = { version = "0.55.2", features = ["full"] }
rust_xlsxwriter = "0.99.1"

# Rule packs deliberately contain a large amount of executable matcher code.
# Test binaries do not need DWARF data, and emitting it for every incremental
# one-case run was the dominant source of compiler memory pressure.
[profile.test]
debug = 0
