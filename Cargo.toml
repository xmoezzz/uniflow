[workspace]
members = [
  "crates/hir",
  "crates/ir",
  "crates/parser_core",
  "crates/platform",
  "crates/lang_c",
  "crates/lang_cpp",
  "crates/lang_java",
  "crates/lang_python",
  "crates/lang_frontends",
  "crates/frontend",
  "crates/lowering",
  "crates/models",
  "crates/rules",
  "crates/value_flow",
  "crates/taint",
  "crates/report",
  "crates/cache",
  "crates/baseline",
  "crates/checker_api",
  "crates/checker_host",
  "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97"
version = "1.0.0"
license = "MPL-2.0"
authors = ["UniFlow Contributors"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
regex = "1.11"
regex-syntax = "0.8"
zhhz = "0.8.2"
sxd-document = "0.3"
sxd-xpath = "0.4"
indexmap = { version = "2.7", features = ["serde"] }
sha2 = "0.10"
aes = "0.8"
indicatif = "0.17"
